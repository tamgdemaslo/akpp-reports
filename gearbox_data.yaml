      - {"question":"Какой ключ нужен для верхней заливной пробки?","answer":"Нужен ключ 12-spline 8 mm (12-гранник). Torx сюда не подходит и может сорвать грани.","url":"https://www.upownersclub.co.uk/threads/gearbox-oil-change-guide-with-part-numbers-sticky.7165/"}
