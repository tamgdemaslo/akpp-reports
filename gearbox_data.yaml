      - question: "Что делать, если после или до сервиса коробка показывает F, уходит в neutral или странно переключает передачи?"
        answer: "Сначала исключить уровень ATF и состояние масла, но сразу держать в голове электронную плату FTC/гидроблок. Для 722.7 такие симптомы часто выходят за рамки обычного масляного сервиса."
        url: "https://www.actronics.co.uk/acinsights/tcu-mercedes-benz-siemens-ftc-722-7"
