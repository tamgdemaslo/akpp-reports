      - Точный литраж важнее «струйки», но контроль по температуре исключает ошибку в 0,3–0,4 л.  
      - После крупных течей всегда промывайте коробку двумя литрами свежей жидкости, затем выполняйте полноценную замену.
    description: |
      **DSG-6 DQ250 (02E)** — 6-ступенчатая преселективная коробка VAG с двумя «мокрыми» сцеплениями (DSG/S-tronic). Ставилась на множество поперечных платформ VW/Audi/Skoda/Seat (например: Golf/Passat/Tiguan/Octavia/Superb/A3 и др.).
      
      При стандартном сервисе **фильтр меняется**: он выполнен отдельным картриджем в корпусе с крышкой (сверху в моторном отсеке), поддон не снимается. Уровень выставляется **строго при 35–45 °C** на работающем двигателе (через внутреннюю трубку уровня и перелив).
    weak_points: |
      **1. Ошибки по давлению/перегреву из-за неверного уровня.** У DQ250 критично выставление уровня по температуре: перелив вспенивает жидкость, недолив даёт просадки давления и перегрев мехатроника.
      
      **2. Утечки из корпуса фильтра и крышки.** Частая причина — дубеющий O-Ring, перетяжка крышки или грязь на посадке; после замены фильтра всегда ставьте новый O-Ring и соблюдайте момент.
      
      **3. Износ/загрязнение гидроблока (мехатроника).** При агрессивной эксплуатации и редкой замене масла продукты износа быстрее загрязняют соленоиды → рывки/пинки, ошибки.
      
      **4. Вибрации при старте и пробуксовка.** Обычно связаны с износом пакетов сцепления и/или некорректными адаптациями после работ.
    faq:
      - question: "Меняется ли фильтр при обычной замене масла DQ250?"
        answer: "Да. На DQ250 фильтр — отдельный картридж в корпусе с крышкой (в моторном отсеке). При обслуживании меняют фильтр 02E305051C и уплотнительное кольцо N91084501; поддон снимать не нужно."
        url: https://vw-plus.com/komplekt-dsg-6-dq250-maslo-filtr-prokladka-g052182a2-02e305051c-n91084501-n0438092
      - question: "Какое масло: G 052 182 A2 или G 052 529 A2?"
        answer: "Оба номера встречаются как оригинальная DSG-жидкость VAG для DQ250; в продаже часто указывают G052529A2 как поздний артикул/замену. Для заказа безопаснее проверять по VIN/ETKA, но по сервисной практике эти жидкости взаимозаменяемы (важнее оригинальность и отсутствие подделки)."
        url: https://oemvag.ru/analogs/maslo-transmissionnoe-g052182a2/
      - question: "Почему важно ловить 35–45 °C при выставлении уровня?"
        answer: "Уровень выставляется по переливу при заданной температуре: при холодном масле получите перелив, при горячем — недолив. Оба варианта приводят к вспениванию/просадкам давления и жалобам на переключения."
        url: https://www.drive2.ru/l/10366313/
