    procedure: |
      1. Подтвердите по VIN, что перед вами именно AQ260 (Aisin TF-60SN/09G) и подготовьте ATF G 052 025 A2 и расходники по каталогу для данного автомобиля.
      2. Небольшой поездкой прогрейте коробку, затем установите автомобиль на подъёмник/яму строго горизонтально, переведите селектор в «P» и дайте коробке немного остыть до безопасной температуры.
      3. Снимите нижнюю защиту, обеспечьте доступ к поддону и сливной/контрольной пробке. До слива убедитесь, что пробка откручивается и что есть техническая возможность заливки и контроля уровня.
      4. Подставьте ёмкость не менее 8–10 л и аккуратно выверните наружную сливную/контрольную пробку. Дождитесь выхода основной струи масла.
      5. Если конструкция предусматривает внутреннюю переливную трубку, аккуратно выкрутите её и дайте стечь оставшемуся маслу из картера (при частичной замене суммарно обычно выходит около 5 л).
      6. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон и перенесите его на верстак, не проливая остатки масла.
      7. Снимите масляный фильтр АКПП, убедитесь, что старое уплотнение не осталось в посадочном гнезде. Оцените количество стружки и шлама на магнитах — это важный диагностический признак состояния AQ260.
      8. Тщательно промойте поддон и магниты очистителем, удалите весь шлам и металлическую пыль, проверьте поддон на деформации и коррозию; при сомнительном состоянии замените поддон.
      9. Установите новый фильтр с новым уплотнением, затем поставьте новую прокладку поддона (или нанесите рекомендованный герметик, если конструкция без прокладки).
      10. Соберите поддон, затягивая болты крест-накрест в несколько приёмов с моментами из ремонтного мануала для конкретной ревизии TF-60SN/09G.
      11. Установите переливную трубку (если предусмотрена) и новую шайбу/уплотнение на сливную/контрольную пробку, заверните пробку от руки для последующей регулировки уровня.
      12. Через адаптер и насос залейте первую порцию ATF G 052 025 A2 объёмом порядка 5 л (ориентируясь на фактический слив и состояние коробки).
      13. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям P–R–N–D с паузой 2–3 секунды в каждом, затем верните селектор в «P».
      14. С помощью сканера доведите температуру ATF до 35–45 °C. На работающем двигателе и при горизонтальном положении авто аккуратно выверните контрольную пробку и оцените поток из переливной трубки/отверстия.
      15. Если масла почти нет, дозаливайте ATF малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до капель.
      16. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем переключений и температур.
      17. На коробках с сильно потемневшим маслом и жалобами на толчки/задержки используйте ступенчатую схему (повторный частичный слив/долив через 2–4 тыс. км), чтобы мягче обновить весь объём ATF.
    mistakes:
      - Относиться к AQ260 как к «обслуживаемой по жизни» и не менять масло до появления серьёзных толчков и ошибок.
      - Заливать ATF без допуска к G 052 025 A2, ориентируясь только на принадлежность к Aisin TF-60SN.
      - Ограничиваться сливом через пробку без снятия поддона, чистки магнитов и замены фильтра.
      - Выставлять уровень ATF «на глаз», без контроля температуры и без использования переливной трубки/контрольного отверстия.
      - Подбирать фильтр и прокладку только по обозначению AQ260/TF-60SN без учёта VIN и конкретной модификации (09G/09K/09M).
    nuances: "AQ260 — более нагруженная версия Aisin TF-60SN/09G из семейства AQ-6 (выше по моменту, чем AQ160), рассчитанная на двигатели до 2,5 л и момент до 260 Н·м. Полная ёмкость коробки около 7 л, штатный допуск ATF — G 052 025 A2, ресурс при нормальном обслуживании оценивается примерно в 250 тыс. км. Основные практические проблемы описаны аналогично AQ250: перегревы, старение масла, засорение гидроблока, износ блокировки гидротрансформатора. Важно понимать, что множество модификаций TF-60SN (09G/09K/09M, AQ160/250/260) используют разные фильтры и поддоны, поэтому расходники и моменты затяжки всегда нужно сверять по VIN и сервисной документации, а не только по коду коробки."
    description: "VAG AQ260 — 6-ступенчатая поперечная АКПП Aisin TF-60SN (индекс 09G), рассчитанная на двигатели до ~2,5 л и крутящий момент до 260 Н·м. По конструкции это классический гидроавтомат с нижним поддоном и сервисным фильтром, полной ёмкостью порядка 7 л и штатной жидкостью ATF G 052 025 A2. Коробка ставится на широкий круг моделей VAG, в том числе с моторами семейства EA855 и массовые модели 2009–2019 годов. Для мастерской AQ260 важно рассматривать как требующую регулярного обслуживания коробку: слив/снятие поддона, замена фильтра, чистка магнитов и выставление уровня по температуре — обязательные элементы сервиса, иначе типичные «болячки» TF-60SN проявляются гораздо раньше паспортного ресурса."
    weak_points: |
      1. Перегрев и ускоренное старение ATF.
      Работа в пробках, высокая температура окружающей среды и редкие замены масла приводят к быстрому старению ATF G 052 025 A2, что ускоряет износ фрикционов и соленоидов.
      
      2. Засорение гидроблока и соленоидов.
      Как и другие TF-60SN, AQ260 чувствителен к загрязнению маслом: шлам и мелкая стружка забивают гидроблок, вызывают толчки, задержки переключений и ошибки по давлению.
      
      3. Износ блокировки гидротрансформатора.
      Блокировка ГТД при эксплуатации на старом масле начинает пробуксовывать, появляются вибрации и рывки; на этом этапе одной заменой масла проблему уже не решить.
      
      4. Проблемы с дифференциалом и втулками.
      На больших пробегах и при перегревах возможен износ втулок, насоса и элементов дифференциала, что ведёт к шумам и дальнейшим поломкам.
      
      5. Чувствительность к уровню и подбору расходников.
      Неправильный уровень ATF (особенно недолив) быстро даёт пинки и перегрев, а установка неподходящего фильтра/прокладки (по неверно подобранному комплекту) может привести к масляному голоданию или утечкам.
