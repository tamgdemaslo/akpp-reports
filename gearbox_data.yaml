    procedure: |
      1. Подтвердите, что перед вами именно АКПП 722.4 (W4A 020/W4A 040): 4‑ступенчатая коробка, эволюция 722.3, часто ставилась на поздние W201/W124/W202 и ряд внедорожников.
      2. Прогрейте коробку до рабочей температуры, поставьте машину строго в горизонталь, снимите защиту.
      3. Слейте масло из поддона через сливную пробку в мерную тару, запомните объём.
      4. Снимите резиновую заглушку в кожухе колокола, проверните коленвал, пока в окне не появится сливная пробка гидротрансформатора, и аккуратно слейте масло из ГТД (обычно тот же шестигранник 5 мм, момент затяжки при сборке около 14 Н·м с новой шайбой).
      5. Отверните болты поддона, снимите поддон, тщательно промойте его и магниты, оцените количество и характер стружки.
      6. Снимите старый фильтр, сравните исполнение с новым фильтром из выбранного кита под VIN, чтобы исключить путаницу по поколению.
      7. Установите новый фильтр и новую прокладку поддона, совместимую именно с 722.4 (отличается от 722.3 по форме).
      8. Затяните болты поддона крест‑накрест с моментом порядка 14 Н·м, не перетягивая, чтобы не повести отбортовку поддона.
      9. Установите сливные пробки поддона и ГТД с новыми шайбами, затянутыми ориентировочно на 14 Н·м.
      10. Через трубку щупа или штатную заливную точку залейте свежую ATF в объёме не меньше слитого (обычно 5,5–6,2 л) с небольшим запасом под последующую корректировку.
      11. Запустите двигатель, держа тормоз, и один‑два раза спокойно пройдите селектором все диапазоны P–R–N–D с паузами по 3–5 секунд, затем вернитесь в «P».
      12. При температуре масла около 30–50 °C проверьте уровень по щупу в соответствии с мануалом; при необходимости скорректируйте доливом/сливом до нужной отметки.
      13. После короткого тест‑драйва повторно проверьте уровень и убедитесь в отсутствии подтёков по поддону, сливным пробкам и стыкам радиатора АКПП.
    mistakes:
      - Лить случайное универсальное ATF без допусков MB 236.6/236.7 (Dexron IID/III).
      - Игнорировать слив из гидротрансформатора и рассчитывать на «полную» замену только за счёт поддона.
      - Перетягивать болты поддона и сливные пробки, деформируя поддон или срывая резьбу.
      - Не менять фильтр и прокладку поддона, ограничиваясь только заменой масла.
      - Не фиксировать исходные жалобы и состояние масла/магнитов до обслуживания.
    nuances: |
      722.4 конструктивно близка к 722.3, но имеет свои отличия по поддону, фильтру и диапазонам передаточных чисел – кроссы фильтров и прокладок часто объединяют 722.3/722.4, а фактический номер лучше сверять по VIN.
      Обязательным плюсом 722.4 является наличие сливной пробки на гидротрансформаторе, что позволяет при нормальном ТО обновить большую часть объёма ATF без аппарата.
      По маслу коробка исторически работала на Dexron IID/III, но в современных рекомендациях закреплены внутренние допуски MB 236.6/236.7; под конкретную машину безопаснее подбирать жидкость по этим допускам.
      С возрастом машин с 722.4 типичными становятся проблемы по вакуумному модулятору, регулировкам троса кик‑дауна, износу ГТД и гидроблока – обычную замену масла не стоит обещать как «ремонт» всех этих проблем, но правильная процедура и уровень заметно снижают риск новых жалоб.
