    description: |
      **Mercedes AMG-SpeedShift-MCT-9** — это уже не просто “725.0 в AMG”, а 9-ступенчатая AMG-коробка, где базовая сервисная логика идёт по семейству `725`, но стартовая архитектура и поведение коробки заметно отличаются от обычной `9G-Tronic`.

      Для мастера по замене масла здесь главный практический вывод такой: расходники и pan assembly вы берёте по ветке `725`, но ожидания от сервиса должны быть как у AMG-коробки с мокрым стартовым пакетом, а не как у спокойной гражданской коробки с гидротрансформатором.

      Хорошая новость в том, что фильтр для обычного ТО меняется, потому что он интегрирован в service pan assembly. Плохая — публичных точных AMG-специфичных данных по `MCT-9` заметно меньше, и поэтому без `VIN` здесь очень легко ошибиться в ревизии поддона и сопутствующих деталях.

      На практике `MCT-9` лучше воспринимать как коробку, где масло и pan assembly действительно важны, но где shudder, hesitation и горячие жалобы после ТО нельзя автоматически считать “признаком плохого нового масла” или “не тем объёмом”. Часть симптомов может уходить дальше — в адаптации и исполнительную часть.
    weak_points: |
      **1. Неправильный уровень после pan-drop на MCT-9 быстро даёт спорные жалобы.**
      Для AMG-коробки с мокрым стартовым пакетом underfill особенно опасен: сначала появляются неприятные ощущения в работе, а потом сервис начинает искать проблему не там.

      **2. Shudder и hesitation на прогретой коробке не всегда лечатся ATF.**
      По немногочисленным открытым owner-обсуждениям именно эти жалобы чаще всего требуют аккуратной диагностики, а не только свежего масла.

      **3. Ошибка по service pan — главная практическая ошибка мастера.**
      У MCT-9 нужно мыслить через service pan assembly семейства 725, а не через «отдельный фильтр и отдельно прокладку». Неверный комплект здесь быстро превращается в простой машины на подъёмнике.

      **4. По MCT-9 открытых данных меньше, чем по обычной 725.0.**
      Для мастера это сам по себе риск: нельзя работать “по похожей карточке”, если нет подтверждения по VIN и номеру коробки.
