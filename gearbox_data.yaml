    procedure: |
      1. Подтвердите по VIN, что установлена DSG DL382 (0CK/0CL/0CJ) и определите исполнение (обычная или DL382+), затем подготовьте жидкости G 055 529 A2 и G 055 549 A2 и расходники по каталогу.
      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту, обеспечьте доступ к сливным/заливным пробкам обоих контуров и зоне фильтра.
      3. Начните с контура ATF G 055 529 A2 (мехатроника/сцепления): подставьте ёмкость, аккуратно открутите сливную/контрольную пробку и дайте стечь основной порции масла (~3,5–3,8 л). При наличии переливной трубки аккуратно выкрутите её и дождитесь полного прекращения активного слива.
      4. При необходимости (по мануалу) демонтируйте крышку фильтра, аккуратно извлеките фильтр и уплотнения, убедившись, что старые кольца не остались в посадочных гнёздах. Оцените состояние масла (цвет, запах) и наличие шлама/стружки.
      5. Установите новый фильтр и новые уплотнения, соберите крышку фильтра с соблюдением моментов затяжки из мануала DL382.
      6. Аналогично слейте масло из механического контура G 055 549 A2 (MTF/редуктор) через его сливную/контрольную пробку; при необходимости снимите переливную вставку и дождитесь полного слива (~3,8–4,5 л).
      7. Тщательно промойте поддон (если предусмотрен) и магниты обоих контуров очистителем, удалите шлам и металлическую пыль; при деформации/коррозии поддон лучше заменить.
      8. Установите новые прокладки/уплотнения на крышки/поддоны и соберите корпуса DSG, затягивая болты крест-накрест с моментами из официального мануала.
      9. Установите переливные трубки (если есть) и новые шайбы/уплотнения на сливные/контрольные пробки обоих контуров, завернув пробки от руки для последующей регулировки уровня.
      10. Через адаптер и насос залейте расчётный объём ATF G 055 529 A2 в соответствующий контур (ориентируясь на слитый объём и техдокументацию), затем залейте расчётный объём MTF G 055 549 A2 в механический контур.
      11. Запустите двигатель, удерживая тормоз, и несколько раз плавно переведите селектор по всем положениям, предусмотренным для базовой прокачки (P–R–N–D/S), с паузой 2–3 секунды в каждом, затем верните селектор в «P».
      12. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C поочерёдно проверьте уровень в каждом контуре: на работающем двигателе и при горизонтальном положении авто аккуратно открутите контрольную пробку, оцените поток из переливного отверстия.
      13. Если уровень недостаточен (масло почти не вытекает), дозаливайте соответствующую жидкость малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C. При избыточном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      14. После выставления уровней окончательно затяните пробки с новыми шайбами по моментам из мануала, установите защиту и выполните дорожный тест с контролем работы коробки и температур.
      15. При наличии жалоб до сервиса (рывки, ошибки по мехатронике, перегревы) используйте данные о загрязнении масла и стружке для решения, нужна ли дополнительная диагностика, адаптации или ремонт, так как одна замена масла не всегда устраняет накопленные проблемы.
    mistakes:
      - Считать DL382 «обслуживаемой по жизни» и не менять оба контура масла до появления серьёзных толчков и ошибок.
      - Заливать ATF/MTF без допусков G 055 529 A2 и G 055 549 A2, ориентируясь только на тип коробки DSG.
      - Игнорировать второй (механический) контур масла и менять только ATF для мехатроники.
      - Выставлять уровень ATF/MTF без контроля температуры и без использования переливного/контрольного отверстия.
      - Подбирать фильтр и уплотнения только по коду DL382/0CK, а не по VIN и конкретной модификации (0CL/0CJ, DL382+).
    nuances: "DL382 — продольная мокрая DSG7 для A4/A5/A6/Q5 и родственных моделей, с двумя раздельными контурами масла и несколькими исполнениями (0CK/0CL/0CJ, DL382+). Штатно используется ATF G 055 529 A2 для гидравлической части и MTF G 055 549 A2 для механики. По akppcenter и motulteam, большинство проблем DL382 связаны с перегревом, загрязнением масла и неполным обслуживанием (меняют только один контур), а не с принципиальной «слабостью» конструкции."
    description: "VAG DL382 (0CK/0CL/0CJ) — 7-ступенчатая мокрая S tronic для продольных моторов до 3,0 л, пришедшая на смену DL501 на части моделей Audi. Коробка строится по схеме двухмассивной DSG с мокрыми сцеплениями и двумя независимыми контурами масла: ATF G 055 529 A2 для мехатроники и пакетов сцеплений, и MTF G 055 549 A2 для механической части. Полная заправка по обоим контурам ~7–8 л, регламент замены — каждые 60 тыс. км для ATF и 90–100 тыс. км для MTF (на практике часто обслуживают оба контура разом через 60 тыс.). При грамотном сервисе ресурс оценивается около 300 тыс. км, но при редких заменах и перегревах типичны жалобы на рывки, ошибки мехатроники и износ сцеплений."
    weak_points: |
      1. Перегрев и старение ATF.
      DL382 сильно зависит от чистоты и уровня ATF G 055 529 A2; перегревы и редкие замены приводят к ускоренному износу мокрых сцеплений и гидроблока.
      
      2. Игнорирование механического контура.
      На практике часто меняют только ATF, оставляя механическое масло G 055 549 A2 без обслуживания, что ускоряет износ шестерён, дифференциала и подшипников.
      
      3. Засорение гидроблока и электропомпы.
      По go4trans и akppcenter типичны отказы электрической помпы и соленоидов к 150 тыс. км при грязном масле; возникают толчки и ошибки по давлению.
      
      4. Износ сцеплений.
      Мокрые пакеты сцеплений при городской эксплуатации и редких заменах масла начинают буксовать и вызывать рывки; на этом этапе одной заменой масел часто уже не обойтись.
      
      5. Сложность подбора расходников и процедур.
      Несколько исполнений (0CK/0CL/0CJ, DL382+) используют отличающиеся фильтры, прокладки и моменты затяжки; слепой подбор по коду DL382 без VIN приводит к ошибкам в заказе и обслуживании.
