      oem_bolt_2: ""
      oem_bolt_2_price: 0
      oem_bolt_2_info: ""
    procedure: |
      1. Подтвердите, что коробка именно 722.8 Autotronic (WFC280), а не 722.7/другая модификация.
      2. Прогрейте трансмиссию, установите авто строго горизонтально, подключите диагностику для контроля температуры масла CVT.
      3. Очистите зону поддона/пробок от грязи перед вскрытием.
      4. Слейте масло через сливную пробку в мерную тару, зафиксируйте объём.
      5. Снимите поддон, очистите магниты и поддон от шлама.
      6. Замените фильтр вариатора и прокладку поддона.
      7. Установите поддон, затяните крепёж равномерно с умеренным моментом (без перетяжки).
      8. Установите сливную пробку с новым уплотнением.
      9. Залейте свежую CVT-жидкость MB 236.20 (ATF 28) объёмом, близким к слитому.
      10. Запустите двигатель, пройдите селектор по всем режимам с паузой 2-3 секунды.
      11. При целевой температуре 40-50 °C выставьте уровень по сервисной процедуре.
      12. Сделайте тест-драйв, затем повторно проверьте уровень и отсутствие течей.
    mistakes:
      - Заливать не-CVT жидкость или жидкость без допуска MB 236.20.
      - Проводить замену без контроля температуры масла.
      - Оставлять старый фильтр при обновлении жидкости.
      - Игнорировать состояние теплообменника и перегревы CVT.
      - Подбирать запчасти «на глаз» без VIN для 722.80x.
    nuances: "722.8 очень чувствительна к чистоте масла: загрязнение быстро отражается на давлении, работе гидроблока и ресурсе ремня/конусов. В открытых каталогах встречаются разные комбинации OEM по фильтрам и прокладкам в зависимости от серийного номера коробки, поэтому для точного заказа нужен EPC/VIN. При корректном масле MB 236.20, регулярном интервале и правильной процедуре уровня коробка работает заметно стабильнее."
    description: |
      Mercedes 722.8 (Autotronic, WFC280) — бесступенчатая трансмиссия CVT с электронным управлением, применяемая на A‑Class W169 и B‑Class W245. Конструктивно использует вариаторный механизм с металлическим ремнём и гидравлическим управлением передаточным отношением.
      
      Для обслуживания ключевые пункты: правильная CVT‑жидкость MB 236.20 (ATF 28), чистый фильтр, корректная температура при выставлении уровня и внимательный контроль продуктов износа в поддоне. В отличие от «классической» АКПП, вариатор 722.8 гораздо хуже переносит грязное масло и перегревы.
      
      Поэтому практический сервис строится вокруг регулярной замены масла и фильтра, а подбор OEM делается строго по VIN из-за разных ревизий 722.80x.
    weak_points: |
      1. Чувствительность к старому маслу и загрязнению.
      Грязная жидкость ускоряет износ ремня/конусов и ухудшает работу гидросистемы.
      
      2. Перегрев и состояние теплообменника.
      Засорённый теплообменник и повышенная температура ухудшают давление и ресурс CVT.
      
      3. Износ подшипников и гидроблока.
      При редком сервисе появляются шумы, рывки, задержки и ошибки по давлению.
      
      4. Ошибки после некорректного уровня.
      Неправильная температура или процедура выставления уровня часто дают нестабильную работу вариатора.
    faq:
      - {"question":"Какое масло нужно в 722.8?","answer":"Только CVT-жидкость с допуском MB 236.20 (ATF 28).","url":"https://mbmanuals.com/transmissions/mb7228trans.htm"}
      - {"question":"Сколько масла в вариаторе 722.8?","answer":"Полный объём обычно около 6,9-7,0 л; при стандартном сервисе сливается заметно меньше (около 3,5-4,5 л).","url":"https://kakoemaslo.ru/akpp-mod/maslo-v-variator-722-8/"}
      - {"question":"Через сколько менять масло и фильтр в 722.8?","answer":"Практический интервал 60 000 км или 4 года; при тяжёлых условиях лучше сокращать до 40 000-50 000 км.","url":"https://liberum-auto.ru/stoimost-uslug-i-oplata/zamena-masla-v-variatore-722.8.html"}
      - {"question":"Нужно ли менять фильтр вместе с маслом?","answer":"Да. Для 722.8 это обязательная часть сервиса, иначе быстро падает ресурс гидросистемы.","url":"https://mbmanuals.com/transmissions/mb7228trans.htm"}
      - {"question":"Почему важен подбор OEM по VIN?","answer":"У 722.80x есть ревизии и отличия по сервисным деталям. Без VIN высокий риск купить несовместимые фильтр/прокладку.","url":"https://cobratransmission.com/722-8-Transmission-Filter"}
      - {"question":"Какие типичные симптомы проблем 722.8?","answer":"Рывки, шумы, ошибки по давлению, ухудшение разгона и перегрев — чаще всего на фоне старого масла или неверного уровня.","url":"https://go4trans.com/transmission/722.8/"}
