      oem_bolt_2_info: ""
    procedure: |
      1. Подтвердите по VIN/шильду, что установлена AQ300 (09S), и подготовьте ATF G 053 001 A2.
      2. Прогрейте коробку поездкой, затем поставьте авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару. Обычно выходит около 3,5 л.
      4. Установите пробку с новым уплотнением и затяните моментом по мануалу ревизии.
      5. Через заливное отверстие залейте объем, равный слитому, плюс 0,1–0,2 л на корректировку уровня.
      6. Запустите двигатель, удерживая тормоз, переведите селектор по всем положениям с паузой 2–3 с.
      7. Сканером контролируйте температуру ATF. При 35–45 °C откройте контрольную пробку: правильный уровень — тонкая струйка, переходящая в капли.
      8. Если не течет — долейте малыми порциями; если течет сильно — дождитесь перехода в капли и закройте пробку.
      9. При сильном загрязнении масла повторите частичную замену вторым циклом через 300–1000 км.
      10. Выполните тест-драйв 10–15 км и проверьте отсутствие течей и корректность переключений.
    mistakes:
      - Использование ATF без допуска AW-2 / G 053 001 A2.
      - Проверка уровня без контроля температуры ATF.
      - Ориентир только на «сколько залили», без контроля по контрольной пробке.
      - Редкая замена масла при забитом теплообменнике и перегревах.
      - Попадание грязи в заливной канал при обслуживании.
    nuances: "AQ300 (09S) — версия Aisin TG-80LS для переднеприводных моделей VAG. Коробка чувствительна к температуре и чистоте масла: при забитом теплообменнике растет температура, быстрее изнашиваются тефлоновые кольца, падает давление, появляются рывки. Неочевидный практический момент: при обычном сливе обновляется только часть объема, поэтому для реального обновления ATF часто делают 2 частичных замены или аппаратный метод на чистом стенде."
    description: "VAG AQ300 (09S) — 8-ступенчатый гидроавтомат Aisin для переднеприводных моделей с двигателями до 2.0 л и моментом до 350 Н·м. Ставится на VW Taos/Jetta/Golf 8, Skoda Karoq/Octavia A8 и ряд Audi A3. Коробка в целом надежная, но ресурс сильно зависит от теплового режима и своевременной замены жидкости AW-2 (G 053 001 A2)."
    weak_points: |
      1. Забивание теплообменника к 80–120 тыс. км -> перегрев АКПП.
      2. Перегрев ускоряет износ тефлоновых колец -> падение давления в гидросистеме.
      3. На фоне низкого давления быстрее горят фрикционы пакетов.
      4. Продукты износа загрязняют гидроблок -> толчки и задержки переключений.
      5. Длительная езда на старой жидкости сокращает ресурс соленоидов и насосной части.
