    nuances: |
      У Mercedes 7G-DCT / 724.0 поддон не нижний, а фронтальный вертикальный, но это редкое исключение: по WIS оба фильтра всё равно сервисные и меняются при обычном ТО без снятия КПП.
      Для мастера ключевой риск здесь не столько сама разборка, сколько точность уровня: по заводской публикации даже ошибка порядка 50 мл уже заметно влияет на переключения.
      Коробка использует специальную DCT fluid MB 236.21, а не обычную ATF от 722.6/722.9.
      После сервиса при жалобах на shift quality нередко приходится делать adaptation/teach-in через XENTRY, поэтому лучше заранее предупреждать клиента, что масло и фильтры не всегда закрывают вопрос без диагностики.
    description: |
      **Mercedes 7G-DCT / Getrag 724.0** — это коробка, которую мастер по замене масла должен воспринимать не как «ещё один автомат Mercedes», а как чувствительный преселективный робот со своей отдельной сервисной логикой.

      Важный нюанс: поддон у неё не снизу, а спереди, вертикальный. Но в отличие от многих коробок с боковым доступом, здесь по заводской процедуре на обычном ТО меняются сразу **два** фильтра: основной нижний в поддоне и маленький верхний картридж в отдельном корпусе.

      Главная практическая сложность не в самой разборке, а в уровне масла. `7G-DCT` очень чувствительна к температуре и объёму, и обслуживать её «по количеству слитого» нельзя. Нужны точная температура, правильный щуп и желательно XENTRY для purge/adaptation-процедур.

      Для сервиса это коробка, где качественная замена масла реально помогает, но только если мастер не забывает про второй фильтр, не льёт неподходящую жидкость и не обещает решить одной заменой уже существующие проблемы мехатроники, насоса или исполнительной части.
    weak_points: |
      **1. Уровень масла здесь критичен сильнее, чем на многих обычных АКПП.**
      По заводной публикации для 724.0 даже небольшое отклонение по уровню уже способно менять качество переключений. Для мастера это главный риск возврата после ТО.

      **2. Верхний малый фильтр часто забывают.**
      На практике часть сервисов ограничивается тем, что видит первым, то есть фронтальным поддоном. Но по WIS у 7G-DCT меняются оба фильтра, и пропуск верхнего картриджа делает обслуживание неполным.

      **3. Жалобы типа `Reversing not possible`, limp mode и перегрев не равны автоматически «старому маслу».**
      По профильным обсуждениям такие симптомы часто уводят уже в мехатронику, исполнительные механизмы или вспомогательный масляный насос. Для мастера это значит: симптомы фиксировать до ТО и не продавать замену масла как гарантированный ремонт.

      **4. После сервиса коробке может потребоваться adaptation.**
      Если после правильной замены масла и фильтров остаются рывки или ошибки adaptation, нужно идти в XENTRY и дальше разбираться уже не только с жидкостью, но и с обучением/неисправностями.
    faq:
      - question: "Меняется ли фильтр на Mercedes 7G-DCT при обычном ТО?"
        answer: "Да. Это редкое исключение: хотя поддон у 724.0 фронтальный, а не нижний, по WIS оба фильтра сервисные и меняются без снятия КПП."
        url: "https://automotivetechinfo.com/wp-content/uploads/2018/03/7G-DCT-724.0-Care-and-Maintenance.pdf"
      - question: "Сколько фильтров у 7G-DCT и какие OEM искать?"
        answer: "У 724.0 два фильтра. По открытым OEM-источникам основной нижний фильтр подтверждается как 246 377 24 00, а по верхнему малому картриджу безопаснее ориентироваться на 246 377 23 00 с примечанием о более раннем номере 246 377 04 95."
        url: "https://www.mercedesbenzstarparts.com/oem-parts/mercedes-benz-oil-filter-2463772400"
      - question: "Какую жидкость брать для Mercedes 7G-DCT?"
        answer: "Жидкость должна иметь допуск MB 236.21. В заводской публикации StarTuned указан оригинальный номер A001 989 85 03 09."
        url: "https://automotivetechinfo.com/wp-content/uploads/2018/03/7G-DCT-724.0-Care-and-Maintenance.pdf"
      - question: "Что мастеру первым делом проверить, если после ТО остались рывки или коробка ведёт себя странно?"
        answer: "Сначала точный уровень на правильной температуре, затем выполнение purge/adaptation через XENTRY и только после этого уже мехатронику, насос и исполнительную часть. Для 7G-DCT это типовая последовательность."
        url: "https://forums.mbclub.co.uk/threads/287c00-adaptation-was-not-completed-successfully-after-7g-dct-724-fluid-change-service.302731/"
    procedure_id: "MERCEDES_7GDCT"
