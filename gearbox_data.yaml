      - {"question":"При какой температуре выставлять уровень ATF?","answer":"Как и для других 6HP, уровень выставляется через контрольное/переливное отверстие при температуре ATF около 35–45 °C на работающем двигателе и горизонтальном автомобиле, с ориентиром на стабильную струйку/частые капли.","url":"https://gearboxlist.com/volkswagen/al950/"}
