      \ BMW 24 11 7 612 742  \n• шайба алюминиевая 18 x 22 мм BMW 07 11 9 963 252\
      \  \n• болт поддона М6 x 28 Al BMW 24 11 7 612 758 (комплект 24 шт)  \n• ATF\
      \ ZF LifeguardFluid 8 S671 090 312\n"
    fluid: ZF LifeguardFluid 8 (допуск ZF TE-ML 11)
    fill_range: 35–45 °C (BMW ISTA) / 38 ± 2 °C (ZF TI)
    drain_volume: 4,5 л (по ZF TI) / 5,0 л (по BMW ISTA)
    dry_capacity: 8,9 л (по BMW ISTA) / 9,1 л (по ZF TI)
    service_interval: 80 000–120 000 км либо 8 лет (рекомендация ZF; у BMW — «lifetime»)
    tools:
    - насос/шприц для ATF с переходником М18 × 1,5
    - Torx T40 (пробки)
    - внешняя E10 (болты поддона)
    - динамометрический ключ 5–60 Н·м
    - пирометр или OBD-сканер для контроля ATF T°
    - диагностический сканер для сброса адаптаций (опц.)
    parts_list:
    - 5 л ATF ZF Lifeguard 8
    - поддон-фильтр 24 11 8 612 901 (вкл. 24 болта)
    - пробка 24 11 7 612 742
    - шайба 07 11 9 963 252
    pan_bolts: 8 Н·м
    drain_torque: 8 Н·м (по ZF) / 8 Н·м (по BMW)
    fill_torque: 30 Н·м (по ZF) / 35 Н·м (по BMW)
    procedure: '1. Прогреть АКПП до ≈40 °C; установить авто горизонтально, заглушить
      двигатель.

      2. Выкрутить заливную пробку T40, затем сливную — слить 4–5 л ATF.

      3. Отвернуть 24 болта E10, снять пластиковый поддон-фильтр; собрать остатки
      масла.

      4. Очистить привалочную поверхность картера.

      5. Установить новый поддон-фильтр, затянуть болты крест-накрест 8 Н·м.

      6. Вкрутить новую сливную пробку с шайбой вручную.

      7. Нагнетатетлем через заливное отверстие залить 4,8-5 л свежего ATF.

      8. Запустить двигатель; удерживая тормоз, пройти селектором P-R-N-D-S-D-N-R-P
      (по 5–10 с).

      9. При 30–40 °C открыть заливное; доливать, пока жидкость не стечёт ровной струёй.

      10. Затянуть пробку указанным моментом, очистить корпус от масла.

      11. Совершить короткий тест-драйв, проверить уровень и отсутствие течей.

      12. При необходимости сбросить адаптации блока EGS.

      '
    mistakes:
    - Повторное использование одноразовых алюминиевых болтов поддона.
    - Проверка уровня вне диапазона 30–40 °C — перелив/недолив.
    - Перетяжка пластикового поддона > 8 Н·м вызывает деформацию и течь.
    - Неочищенные магниты оставляют стружку, ускоряя износ гидроблока.
    - Отсутствие прогонки селектора после заливки — кавитация и жёсткие переключения.
    nuances:
    - Для Jeep/Chrysler 8HP45 используется металлический поддон с другими моментами.
    - На BMW кроссоверах с полным приводом траверса раздаточной коробки можем мешать
      доступу к болтам поодона, рекомендуется использовать трансмисионную стойку для
      вывешивания АКПП с пооследющуим снятием траверсы.
    - С 2018 г. у BMW актуален поддон 24 11 8 612 901; старые номера сняты с поставки.
    - Контроль уровня выполняют только при работающем двигателе и режиме «P».
    - Недолив ведёт к перегреву, перелив — к вспениванию; точность критична.
    - При снятии поддона дополнительно выливается ≈0,5 л ATF.
    price_block: "ATF ZF Lifeguard 8 — ~2000 рублей / л ×5 л = 10000 рублей.  \nПоддон-фильтр\
      \ 24 11 8 612 901 — 10000 рублей   \nИтого: ≈20000 рублей.\n"
    docs: "1. BMW ISTA Workshop Manual F30 «24 00 520 Replace ATF GA8HP45Z», 11/2022,\
