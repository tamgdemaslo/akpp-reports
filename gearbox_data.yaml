      - {"question":"Через какой пробег менять масло и фильтр в 01N?","answer":"По справочным данным и практике – каждые 70 000 км, при тяжёлых режимах (город, прицеп, горы) лучше 50–60 тыс. км. Вместе с ATF меняют фильтр и прокладку поддона.","url":"https://otoba.ru/transmissii/vag/01n.html"}
