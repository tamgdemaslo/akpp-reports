      - {"question":"Сколько масла выходит при частичной замене?","answer":"Обычно около 3,5 л, полный объем коробки около 7,0 л.","url":"https://otoba.ru/transmissii/vag/aq300.html"}
      - {"question":"При какой температуре выставлять уровень?","answer":"Уровень корректируют по контрольной пробке при 35–45 °C с контролем сканером.","url":"https://www.motulteam.ru/skoda-octavia-a8-aisin-09s-aq300"}
      - {"question":"Почему после замены масла остаются толчки?","answer":"Часто причина в перегреве и загрязненном гидроблоке: одна частичная замена обновляет только часть объема. Нужна повторная замена и проверка системы охлаждения.","url":"https://otoba.ru/transmissii/vag/aq300.html"}
