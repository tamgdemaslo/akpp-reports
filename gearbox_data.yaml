      2. Прогрейте АКПП поездкой и выставьте авто строго горизонтально.
      3. Слейте ATF через сливную пробку и замерьте объем.
      4. Снимите поддон, очистите магниты и отложения.
      5. Замените фильтр 35330-60050, прокладку 35168-60010 и кольцо 90301-31014.
      6. Соберите поддон по схеме затяжки из мануала.
      7. Залейте стартовый объем ATF WS.
