    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 7G-DCT / 724.0. Эта коробка очень чувствительна к уровню масла и не прощает «приблизительного» обслуживания.

      1. До начала работ прогрейте двигатель и коробку до рабочей температуры; по заводной публикации перед началом процедуры температура двигателя должна быть не ниже 80 °C.
      2. Сверху снимите корпус верхнего малого фильтра и освободите верхние винты фронтального поддона.
      3. Снизу снимите защиту, открутите сливную пробку и точно измерьте объём слитой жидкости.
      4. После слива снимите фронтальный вертикальный поддон: у 724.0 меняются оба фильтра, нижний и верхний.
      5. Очистите поддон, магнит и посадочные поверхности без агрессивного распыла в саму коробку.
      6. Установите новый нижний strainer, новый верхний картридж, новую прокладку поддона и новую шайбу сливной пробки.
      7. Соберите поддон с моментом 8 Н·м, а сливную пробку затяните 30 Н·м.
      8. Залейте стартовый объём свежей DCT fluid MB 236.21, обычно около 4 л, затем выполните purge/rev-up по XENTRY.
      9. Уровень выставляйте только специальным щупом и только при точной температуре 40 °C или 70 °C по процедуре WIS; для этой коробки даже небольшая ошибка по уровню уже меняет качество переключений.
      10. После сборки и тест-драйва повторно проверьте уровень, герметичность, наличие ошибок и поведение заднего хода.
    mistakes:
      - "Поменять только нижний фильтр и забыть про верхний малый картридж."
      - "Обслуживать 7G-DCT как обычный гидроавтомат Mercedes."
      - "Выставлять уровень без XENTRY и без точной температуры 40/70 °C."
