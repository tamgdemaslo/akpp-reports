    fluid: CVTF по допуску VW G 052 516 A2 (Motul Multi CVTF, Fuchs 4400, Ravenol CVTF …)
    fill_range: 35–45 °C (уровень выставляется на работающем двигателе)
    drain_volume: 6,0 – 6,5 л (слив + внешний фильтр)
    dry_capacity: 8,5 – 9,0 л
    service_interval: каждые 60 000 км или 5 лет (40 000 км — тяж. цикл)
    tools:
      - подъёмник / ровная яма
      - Torx T25 (защита)
      - шестигранник 8 мм ИЛИ Torx T45 (наружная пробка – по ревизии)
      - шестигранник 5 мм (контрольный стакан уровня)
      - Torx E8 или головка 10 мм (3 болта фильтра)
      - адаптер-заправка M22 × 1,5 → шланг Ø10 мм
      - динамометрический ключ 2 – 60 Н·м
