      **2. Valve body и регуляция давления.**
      По профильным обсуждениям для 01P очень типичны износ main/boost regulator valves, падение давления и жалобы на жёсткие или медленные переключения. Обычная замена масла это не всегда лечит.

      **3. TCC / P0740 и похожие жалобы часто уже были до сервиса.**
