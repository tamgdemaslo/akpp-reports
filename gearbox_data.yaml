      - Проверка уровня без контроля температуры CVT.
      - Редкая замена масла и фильтра при городской эксплуатации.
      - Игнорирование перегрева и состояния радиаторов/теплообменника.
      - Буксировка автомобиля с заглушенным мотором (риск задиров конусов).
    nuances: "VL380 (0AN) — усиленный Multitronic для дизельных моторов до 380 Н·м. Коробка очень чувствительна к чистоте масла и перегреву: грязная жидкость ускоряет износ цепи, фрикционов и соленоидов. Неочевидный момент обслуживания — вместе с CVT-жидкостью по регламенту обновляют масло переднего дифференциала. Для ресурса критичны чистые радиаторы и исправные трубки охлаждения."
    description: "VAG VL380 (0AN) — усиленная версия вариатора Multitronic семейства 01J для переднеприводных Audi A4/A6 с продольным расположением двигателя и повышенным моментом. Коробка обеспечивает комфортную работу, но требует строгой дисциплины обслуживания: только G 052 180 A2, регулярная замена масла/фильтра и контроль температуры. При аккуратной эксплуатации ресурс достигает 250–300 тыс. км."
    weak_points: |
      1. Растяжение цепи, особенно при активной езде (часто до 150 тыс. км).
      2. Износ пакета фрикционов и загрязнение гидроблока продуктами износа.
      3. Перегрев и отказ TCM/датчиков (блок чувствителен к горячему маслу).
      4. Износ подшипника ведомого конуса с характерным гулом.
      5. Слабые трубки охлаждения, риск повреждения при перегреве и буксировке.
