      - {"question":"Какой OEM прокладки поддона у A5S560Z?","answer":"Прокладка поддона: 24 11 1 421 140.","url":"https://www.bimmerworld.com/Driveline-Shifter/Transmissions-Accessories/Auto-Transmission-Oil-Pan-Gasket-ZF-24111421140.html"}
