    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes AMG-SpeedShift-MCT-7. Эту коробку нельзя обслуживать как обычную 722.9 с гидротрансформатором.

      1. До заказа расходников определите номер коробки и тип жидкости: red 236.14 или blue 236.15.
      2. Слейте ATF из поддона и точно измерьте объём; для обычного pan-drop сервиса на MCT обычно получается около 4,5-5,5 л.
      3. У MCT нет гидротрансформатора, поэтому отдельный torque-converter drain step для нормальной MCT-версии не нужен.
      4. Снимите поддон и замените фильтр, прокладку и одноразовые болты так же аккуратно, как на 722.9.
      5. Если коробка поздняя и работает на blue fluid, проверьте, что в комплекте правильная ревизия standpipe.
      6. Залейте ATF только нужного допуска для этой коробки; смешивать red и blue ветки нельзя.
      7. Прогрейте коробку, пройдите все диапазоны и доведите уровень по сервисной процедуре.
      8. После тест-драйва повторно проверьте герметичность, адаптационное поведение коробки и работу стартового мокрого пакета на трогании.
    mistakes:
      - "Обслуживать MCT-7 как обычную 722.9 и искать слив из гидротрансформатора там, где его нет."
      - "Смешать red 236.14 и blue 236.15."
      - "Заказать расходники по общему слову MCT без проверки номера коробки."
      - "Обещать, что пробуксовка или flare на 4-7 передачах уйдут одной заменой масла."
      - "Недолить коробку: MCT очень чувствительна к underfill."
    nuances: |
      AMG-SpeedShift-MCT-7 конструктивно близка к 722.9, но вместо гидротрансформатора использует мокрый стартовый пакет.
      Для мастера это значит: сервис по поддону и фильтру похож на 722.9, а логика полного слива — уже нет.
      По профильным обсуждениям обычный pan-drop сервис даёт примерно 4,5-5,5 л, тогда как полный объём около 7,1 л.
      Главные практические риски здесь — перепутать ветку жидкости, недолить коробку и пытаться объяснить уже существующую пробуксовку или flare «просто старым маслом».
    description: |
      **Mercedes AMG-SpeedShift-MCT-7** — это не просто “AMG-версия 7G”, а коробка на базе `722.9`, у которой вместо гидротрансформатора стоит мокрый стартовый пакет.

      Для мастера по замене масла это важно сразу по двум причинам. Во-первых, по поддону, фильтру и части расходников коробка действительно идёт по логике семейства `722.9`. Во-вторых, по ощущению в работе и по сервисным рискам это уже другая история: нет обычного torque-converter drain step, меньше сервисный слив, другой старт с места и более жёсткая чувствительность к правильной жидкости и уровню.

      На практике `MCT-7` нужно обслуживать аккуратно и без импровизации. Сначала определить ветку жидкости, потом взять правильный filter kit, потом выставить уровень без спешки. Если коробка уже даёт flare, буксует на 4-7 передачах или странно работает на горячую, одной заменой масла это может не вылечиться.

      Для сервиса это коробка, где особенно важно не продавать “простую замену масла” как универсальный ремонт: свежий ATF нужен, но мокрый стартовый пакет, гидроблок и адаптации могут уже требовать отдельной диагностики.
    weak_points: |
      **1. Underfill для MCT-7 особенно опасен.**
      По профильным обсуждениям даже заметный недолив быстро отражается на переключениях и может давать жалобы, которые потом ошибочно принимают за “смерть коробки”.

      **2. Flare и пробуксовка на 4-7 передачах часто выходят за рамки обычного масляного сервиса.**
      Если коробка уже уходит в рост оборотов под нагрузкой, мастеру важно зафиксировать это до работ и не обещать чудес от одной замены ATF.

      **3. Ошибка по жидкости для MCT-7 критична.**
      Для этой коробки особенно опасно смешать red 236.14 и blue 236.15 или выбрать ветку по догадке, а не по номеру коробки.

      **4. Сервисная путаница между MCT и обычной 7G/722.9 встречается постоянно.**
      Для мастера это практический риск: если обслуживать MCT-7 по карте от обычной коробки с гидротрансформатором, можно ошибиться и по объёму, и по ожиданиям от результата.
    faq:
      - question: "Меняется ли фильтр на Mercedes AMG-SpeedShift-MCT-7 при обычном ТО?"
        answer: "Да. По сервисной логике MCT-7 идёт по семейству 722.9, поэтому фильтр и прокладка поддона при обычном ТО меняются."
        url: "https://mbworld.org/forums/c63-amg-w204/570101-mct-transmission-service-fluid-filter-question.html"
      - question: "Нужно ли на MCT-7 сливать гидротрансформатор?"
        answer: "Для нормальной converter-less MCT-версии нет. У коробки мокрый стартовый пакет вместо гидротрансформатора, и это одна из главных сервисных разниц относительно обычной 7G."
        url: "https://forums.mbclub.co.uk/threads/atf-for-mct-gearbox.250305/"
      - question: "Какую жидкость брать для MCT-7?"
        answer: "Только после проверки номера коробки и исходной ветки жидкости. Ранние версии идут по MB 236.14 (red), поздние 722.930/722.931 — по MB 236.15 (blue). Смешивать их нельзя."
        url: "https://forums.mbclub.co.uk/threads/atf-for-mct-gearbox.250305/"
      - question: "Какой OEM фильтра безопаснее указывать по MCT-7?"
        answer: "Безопаснее указывать ветку, а не один номер на всё семейство: ранний filter kit 220 270 00 98 и поздний 222 277 20 00. Для конкретной машины выбор нужно делать по номеру коробки, дате выпуска и типу жидкости."
        url: "https://forums.mbclub.co.uk/threads/mb-722-931-gearbox-oil-type-is-it-236-14-or-236-15.307345/"
    procedure_id: "MERCEDES_AMGSPEEDSHIFTMCT7"
