         • Аккуратно открутите болты поддона, снимите поддон, дайте маслу полностью стечь.  
         • Очистите поддон и магниты, оцените наличие стружки: крупная стружка/осколки — обсуждайте с клиентом риски и целесообразность дальнейшей эксплуатации.  
         • Замените фильтр АКПП и прокладку поддона (подбор по VIN и типу поддона).

      4. Сборка:
         • Установите поддон с новой прокладкой/герметиком, затяните болты крест-накрест с моментом по мануалу (перетяжку исключить).  
         • Установите новую шайбу сливной пробки (если есть) и затяните пробку с нужным моментом.

      5. Заливка и прокачка:
         • Через трубку щупа или заливное отверстие залейте объём слитого масла + небольшой запас (0,3–0,5 л в зависимости от конструкции).  
         • Запустите двигатель, удерживая педаль тормоза, последовательно переведите селектор по всем положениям (P–R–N–D–2–1 или аналогично), задерживаясь 2–3 с в каждом.  
         • Дайте коробке прогреться до рабочей температуры ATF, ориентируясь на диапазон 70–90 °C.

      6. Финальная проверка уровня:
         • При горячей коробке, на работающем двигателе и селекторе в P/N проверьте уровень по щупу или по сервисной процедуре (если используется сливное/контрольное отверстие).  
         • При недостаточном уровне доливайте ATF малыми порциями, каждый раз повторяя цикл переключений селектора.  
         • При избытке — аккуратно слейте лишнее через щуп или сливное отверстие до выхода уровня в допустимый диапазон.

      7. Завершение:
         • Очистите картер от следов масла, установите защиту, выполните тест-драйв с разгонами и торможениями.  
         • При необходимости повторно проверьте уровень ATF и отсутствие подтёков.
    mistakes:
      - Игнорирование подбора ATF и фильтра по VIN → риск несовместимости жидкости и отличий по конструкции поддона.
      - Работа без контроля температуры ATF при проверке уровня → недолив/перелив.
      - Перетяжка болтов поддона и пробок выше значений в мануале → срыв резьбы, течи.
      - Повторное использование одноразовых уплотнительных колец и шайб.
    nuances:
      - Конструкция поддона и наличие щупа/контрольного отверстия различаются по годам и моделям; всегда сверяйтесь с мануалом и VIN.
      - Для ресурса полезна серия частичных замен вместо одной «агрессивной» аппаратной.
      - При большом количестве стружки и симптомах (пинки, пробуксовки) разумно обсудить с клиентом капитальный ремонт, а не только замену ATF.

