    procedure: |
      1. Подтвердите модификацию 6HP28 по VIN и табличке коробки.
      2. До слива проверьте, что заливная пробка откручивается.
      3. Слейте ATF, снимите поддон-фильтр, очистите магниты и привалочную плоскость.
      4. Установите новый поддон-фильтр и новые болты по комплекту, затягивая крест-накрест 10 Н·м.
      5. Установите сливную пробку с новой шайбой.
      6. Заправьте первичный объем ATF, запустите двигатель и пройдите селектором все диапазоны.
      7. Выставьте уровень в температурном окне 30-45°C на работающем двигателе.
      8. Долейте до нормы, закройте пробки, выполните тест-драйв.
      9. Перепроверьте уровень и течи, особенно зону втулки разъема мехатроника.
    mistakes:
      - Использовать ATF не класса Lifeguard 6.
      - Устанавливать неподходящую ревизию поддона-фильтра.
      - Игнорировать замену шайб пробок.
      - Проверять уровень без контроля температуры.
      - Перетягивать пластиковый поддон.
      - Оставлять течь по втулке мехатроника без ремонта.
    nuances: |
      6HP28 часто обслуживается теми же принципами, что 6HP26: интегрированный поддон-фильтр и температурная установка уровня.
      По OEM в рынке много кроссов, поэтому безопасно привязывать номер поддона к VIN/ревизии.
      Если есть подтекание в районе разъема мехатроника, втулку лучше менять одновременно с обслуживанием.
    description: |
      ZF 6HP28 - усиленная версия семейства 6HP, применяемая на мощных и часто полноприводных платформах. По конструкции и сервису близка к 6HP26, но обычно работает с более высоким моментом.
      
      Надежность коробки сильно зависит от качества ATF, теплового режима и корректного уровня. Своевременная замена поддона-фильтра и контроль течей мехатроника - ключевые условия ресурса.
      
      Для точного подбора расходников по этой модели обязательно учитывать ревизию поддона и платформу автомобиля.
    weak_points: |
      1) Течи по втулке разъема мехатроника.
      2) Износ гидроблока/соленоидов при старой ATF.
      3) Перегрев и ускоренный износ блокировки ГТД.
      4) Риски коробления пластикового поддона при неправильной затяжке.
      5) Ошибки по уровню после некорректной термопроцедуры.
