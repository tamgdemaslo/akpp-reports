    procedure: |
      1. Подтвердите по VIN/шильду, что установлена AQ451 (09H), и подготовьте ATF Hyundai SP-IV.
      2. Прогрейте коробку поездкой и установите авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару: обычно около 4,5 л.
      4. При расширенном ТО снимите поддон, очистите магниты, замените уплотнения/фильтр по каталогу 09H.
      5. Установите сливную пробку с новым уплотнением и затяните моментом по мануалу ревизии.
      6. Через заливное отверстие залейте объем, равный слитому, затем прокачайте селектор по всем режимам с паузой 2–3 с.
      7. Контролируйте температуру ATF сканером. При 35–45 °C откройте контрольную пробку: тонкая струйка с переходом в капли — корректный уровень.
      8. Если не течет — долейте малыми порциями; если течет сильно — дождитесь перехода в капли и закройте пробку.
      9. При загрязнении масла выполните повторный частичный цикл через 300–1000 км.
      10. Выполните тест-драйв 10–15 км и проверьте герметичность и корректность переключений.
    mistakes:
      - Заливка ATF без спецификации SP-IV.
      - Проверка уровня без контроля температуры ATF.
      - Ориентир только на литраж без контроля по контрольной пробке.
      - Редкая замена масла на коробке с высокой нагрузкой.
      - Игнорирование сервисных бюллетеней/обновлений ПО TCM.
    nuances: "AQ451 (09H) — новая коробка Hyundai Transys для Atlas/Tayron/Tiguan американского рынка, поэтому статистика поломок ограничена. Важный неочевидный момент: по данным NHTSA была отзывная кампания с заменой коробки в сборе из-за дефекта запрессовки шарика, перекрывавшего маслоканал. Для сервиса это означает обязательную проверку открытых кампаний по VIN перед любыми ремонтными работами. Обычный слив обновляет только часть объема, поэтому для более полного обновления ATF полезен второй частичный цикл."
    description: "VAG AQ451 (09H) — 8-ступенчатый гидроавтомат Hyundai Transys для передне- и полноприводных моделей с 2.0 TSI, пришедший на смену Aisin-решениям на части рынка США. Коробка рассчитана до 450 Н·м и пока имеет ограниченную сервисную статистику из-за новизны. Ключ к ресурсу — корректная жидкость SP-IV, контроль температуры/уровня при обслуживании и своевременное выполнение отзывных и программных обновлений."
    weak_points: |
      1. Небольшая статистика из-за новизны коробки.
      2. Известна отзывная кампания по дефекту запрессовки шарика и перекрытию маслоканала.
      3. На части машин встречаются толчки, часто корректируются прошивкой TCM.
      4. Перегрев и старая ATF ускоряют износ гидросистемы и соленоидов.
      5. Низкая доступность доноров и деталей на вторичном рынке пока осложняет ремонт.
    faq:
      - {"question":"Какое масло лить в AQ451 (09H)?","answer":"Для AQ451 указывается Hyundai ATF SP-IV.","url":"https://otoba.ru/transmissii/vag/aq451.html"}
      - {"question":"Сколько масла выходит при частичной замене?","answer":"Обычно около 4,5 л; со снятием поддона может выйти до 6,0 л.","url":"https://otoba.ru/transmissii/vag/aq451.html"}
      - {"question":"Какой полный объем масла в AQ451?","answer":"Полный объем смазки около 7,4 л.","url":"https://otoba.ru/transmissii/vag/aq451.html"}
      - {"question":"Почему не указаны точные OEM фильтра и прокладки?","answer":"Для новой AQ451/09H в открытых источниках пока нет стабильного подтвержденного набора OEM для всех ревизий. Безопаснее подбор по VIN и коду коробки.","url":"https://otoba.ru/transmissii/vag/aq451.html"}
