    procedure: |
      1. Подтвердите, что это 09A (Jatco JF506E), выставьте автомобиль строго горизонтально.
      2. Прогрейте АКПП до рабочей температуры.
      3. Снимите красную заглушку и чёрный колпачок с верхней заливной трубки — убедитесь, что заливка доступна до слива.
      4. Слейте ATF через сливную пробку 24 mm — обычно выходит ~3 л. Установите новую пробку с новым уплотнением.
      5. Залейте ~3 л ATF G 052 990 A2 через верхнюю заливную трубку (воронка + шланг под капотом).
      6. Запустите двигатель, пройдите селектором все позиции (R, D, N, 3, 2) по ~10 секунд каждую.
      7. Контролируйте температуру ATF по VCDS (блок 004). При ~40 °C откройте check plug: лёгкая капля/струйка означает корректный уровень.
      8. Если масла нет — доливайте через заливную трубку малыми порциями, пока из check plug не пойдёт стабильная капля.
      9. Закройте check plug и заливную пробку. По опыту форумов строгие 2,5 л по Bentley часто дают гул, 3 + 0,25–0,5 л обычно комфортнее, при условии правильного уровня по температуре.
    mistakes:
      - Заливать G 052 162 A2 или универсальную ATF вместо G 052 990 A2.
      - Проверять уровень на заглушённом двигателе или без прохода селектором по всем диапазонам.
      - Жёстко заливать только 2,5 л по мануалу, игнорируя фактический уровень и жалобы на гул.
      - Обещать клиенту замену фильтра при обычном ТО — фильтр доступен только при снятии и разборке КПП.
      - Ожидать, что один drain-and-fill устранит старые проблемы соленоидов и изношенного valve body.
    nuances: "У 09A боковой поддон, нижнего поддона нет — фильтр при обычном ТО не меняется, доступ только при снятии коробки. Сервис без снятия — это drain-and-fill с частичной заменой (~50% объёма); для обновления большей части ATF нужны несколько циклов или ремонт с разборкой. По форумам VWVortex и профильным статьям строгие 2,5 л по Bentley часто дают гул, поэтому разумнее ориентироваться на фактический уровень при ~40 °C, обычно это 3–3,5 л."
    description: "VAG 09A — это 5-ступенчатая АКПП Jatco JF506E для поперечной компоновки (Golf IV, Jetta/Bora, некоторые A3 и др.). Ключевая особенность для сервиса: боковой поддон и внутренний фильтр, до которого не добраться без снятия и разборки коробки, поэтому при обычном ТО выполняется только drain-and-fill через сливную пробку и верхнюю заливную трубку. Жидкость — только ATF G 052 990 A2, не G 052 162. Уровень выставляется при ~40 °C на работающем двигателе через check plug; практика форумов показывает, что 3–3,5 л с контролем уровня работают лучше, чем жёсткие 2,5 л по мануалу."
    weak_points: |
      1. Соленоиды и valve body.
      JF506E/09A известна проблемами соленоидов (в т.ч. N92) и клапанной плиты: задержки переключений на холодную, пробуксовки, коды по давлению. Замена масла это не лечит; при жалобах после корректной замены проверяют соленоиды и гидроблок.
      
      2. Недолив и гул после сервиса.
      Строгое следование объёму 2,5 л из мануала без проверки уровня по температуре приводит к недоливу и гулу. Форумная практика — ориентироваться на уровень при ~40 °C, обычно это 3–3,5 л.
      
      3. Недоступный фильтр.
      Клиенты часто ожидают замену фильтра, но при обычном ТО это невозможно — фильтр внутри коробки и требует снятия/разборки.
      
      4. Ошибка по допуску ATF.
      09A требует G 052 990 A2; использование «универсальных» жидкостей или G 052 162 (от других VAG АКПП) ускоряет износ и усугубляет проблемы.
      
      5. Частичная замена.
      Один drain-and-fill меняет примерно половину объёма; для серьёзного обновления ATF нужен либо повторный сервис, либо ремонт с полной разборкой.
