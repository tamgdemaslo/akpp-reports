      2. Слив:  
        • Поставьте ёмкость ≥8 л, выкрутите М14 пробку (HEX 14) — сольётся ≈0,5 л.  
        • Тем же шестигранником 8 мм выверните пластиковый «сноркель» — выйдут ещё 4,5–5 л.  
