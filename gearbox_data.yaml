    procedure: |
      1. Подтвердите по VIN, что это именно AL950 / ZF 6HP32X (обычно Phaeton V10 TDI или Audi Q7 V12 TDI), и подготовьте ATF G 055 005 A2 и расходники по каталогу.
      2. Небольшим пробегом прогрейте коробку, затем установите автомобиль на подъёмник/яму строго горизонтально, переведите селектор в «P» и дайте коробке немного остыть до безопасной температуры для работы под днищем.
      3. Снимите нижнюю защиту, обеспечьте доступ к поддону и сливной/контрольной пробке. До слива убедитесь, что заливка/контроль уровня технически доступны (нет сорванных пробок).
      4. Подставьте ёмкость не менее 10–12 л и аккуратно выверните наружную пробку. Дождитесь основного слива ATF.
      5. Если конструкция предусматривает внутреннюю переливную трубку, аккуратно выкрутите её и дайте стечь оставшемуся маслу из картера (в сумме частичный слив обычно ~6,5 л).
      6. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон и перенесите его на верстак, не проливая остатки масла.
      7. Снимите масляный фильтр АКПП, убедитесь, что старое уплотнение фильтра вышло вместе с ним. Оцените количество стружки и шлама на магнитах и в районе фильтра — это ключевой диагностический этап для 6HP32X.
      8. Тщательно промойте поддон и магниты очистителем, удалите весь шлам и металлическую пыль, проверьте поддон на деформации и коррозию; при сомнительном состоянии замените поддон.
      9. Установите новый фильтр с новым уплотнением, затем поставьте новую прокладку поддона (или нанесите рекомендованный ZF герметик, если конструкция без отдельной прокладки).
      10. Соберите поддон, затягивая болты крест-накрест в несколько приёмов с моментами из ремонтного мануала ZF для 6HP32X.
      11. Установите переливную трубку (если есть) и новую шайбу/уплотнение на сливную/контрольную пробку, закрутите пробку от руки, оставив возможность для дальнейшей регулировки уровня.
      12. Через адаптер и насос залейте первую порцию ATF G 055 005 A2 объёмом около 6,5 л (ориентируясь на фактический слив и состояние коробки).
      13. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям P–R–N–D с паузой 2–3 секунды в каждом, затем верните в «P».
      14. С помощью сканера контролируйте температуру ATF; при достижении 35–45 °C поднимите автомобиль, открутите контрольную пробку и оцените поток из переливной трубки/отверстия.
      15. Если масло почти не вытекает, дозаливайте ATF малыми порциями и повторяйте проверку, пока при 35–45 °C не получите тонкую струйку, переходящую в частые капли; при избыточном потоке дождитесь, пока перелив прекратится и останутся только капли.
      16. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем переключений и температур.
      17. На сильно изношенных коробках с чёрным маслом применяйте ступенчатую схему (повторный частичный слив/долив через 2–4 тыс. км), чтобы мягче обновить весь объём ATF.
    mistakes:
      - Считать AL950 «необслуживаемой» и не менять масло до появления выраженных толчков и вибраций.
      - Использовать ATF без прямого допуска к G 055 005 A2, ориентируясь только на число ступеней или марку ZF.
      - Ограничиваться сливом через пробку без снятия поддона, чистки магнитов и замены фильтра.
      - Выставлять уровень ATF без контроля температуры и процедуры через переливную трубку/контрольное отверстие.
      - Повторно использовать уплотнения сливной пробки и старые болты поддона, если мануал требует их замены.
    nuances: "AL950 (ZF 6HP32X) — самая «тяжёлая» из VAG 6-ступенчатых коробок, рассчитанная на до 1000 Н·м и работающая на очень нагруженных дизельных моторах (V10 TDI, V12 TDI). По данным gearboxlist, базовая рекомендация — ATF G 055 005 A2, полная ёмкость около 12 л и частичный слив 6,5 л. Типичные практические проблемы: быстрый износ втулок, вибрации и удары из-за изношенных фрикционов и блокировки гидротрансформатора, утечки масла по разъёмам и поддону, засорение гидроблока. Для сервиса принципиально важно не путать эту коробку с другими AL-сериями (AL750, AL1000) и подбирать фильтр/прокладку только по VIN и каталогу ZF."
    description: "VAG AL950 — 6-ступенчатая продольная АКПП ZF 6HP32X, рассчитанная на крутящий момент до 1000 Н·м и установленная на ограниченный круг «флагманов» вроде VW Phaeton V10 TDI и Audi Q7 V12 TDI. По конструкции это развитое семейство 6HP с нижним поддоном и сервисным фильтром, полной ёмкостью около 12 л и регламентным обслуживанием через каждые 60 тыс. км. Для реального сервиса мастеру важно понимать, что это очень нагруженная коробка с высокой тепловой нагрузкой и чувствительностью к чистоте масла: игнорирование регламентных замен и неправильный уровень ATF быстро приводят к износу гидротрансформатора, фрикционов и гидроблока."
    weak_points: |
      1. Высокая тепловая нагрузка и старение ATF.
      Работа с тяжёлыми дизельными моторами и большими массами авто делает AL950 очень чувствительной к перегреву и состоянию масла. При редких заменах ATF G 055 005 A2 быстро темнеет, теряет свойства и ускоряет износ фрикционов.
      
      2. Износ втулок и блокировки гидротрансформатора.
      По описаниям проблем 6HP32X типичны вибрации и удары при частичной блокировке ГТД из-за износа втулок и фрикционов; одна только замена масла это уже не лечит.
      
      3. Засорение гидроблока и соленоидов.
      Как и другие ZF 6HP, AL950 чувствительна к шламу и мелкой стружке в масле: соленоиды и каналы гидроблока загрязняются, появляются задержки переключений и ошибки по давлению.
      
      4. Утечки по разъёмам и поддону.
      На возрастных авто часто появляются подтёки масла по электрическим разъёмам и прокладке поддона; при игнорировании уровень падает, а коробка начинает работать с масляным голоданием.
      
      5. Сложность подбора расходников без VIN.
      AL950 ставилась на штучные модели, и набор фильтр/поддон/болты зависит от конкретного исполнения. Попытка унифицировать OEM только по коду AL950 повышает риск заказать неправильные детали.
