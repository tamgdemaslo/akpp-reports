      3. Ослабьте пробку уровня (AF40-6 Torx T40 или AF21 17 мм), не выкручивая полностью.  
      4. Подставьте мерный таз, выкрутите наружную пробку (24 мм) со старой шайбой, дождитесь капель.  
      5. Запишите объём слитого ATF. Установите новую шайбу и затяните наружную пробку.  
      6. Залейте в уровень объём слитого + 0,3 л через верхний штуцер (воронка или насос).  
      7. Запустите двигатель, прижатый тормоз, последовательно переведите селектор P → R → N → D → M → D → N → R → P (2–3 с в каждом).  
      8. Дождитесь 40 – 50 °C, выверните пробку уровня: выход струёй → каплями (~1 капля/с).  
      9. Если не течёт – доливайте по 0,2 л до появления капель. Если льётся слишком обильно – дождитесь капель.  
      10. Затяните пробку уровня указанным моментом, протрите и обезжирьте корпус.  
      11. Тест-драйв 8–10 км при 60–80 км/ч до ATF 80 – 90 °C. Вернитесь – проверьте протечки и уровень при 50 °C.
    mistakes:
      - Перелив → вспенивание ATF, падение давления, износ фрикционов  
      - Недолив → подсос воздуха, проскакивание пакетов  
      - Несвоевременная проверка откручиваемости уровня → сорванный Torx/шестигранник
    nuances:
      - Фильтр встроен, меняется только при съёме гидроблока  
      - JWS 3309 разрешён для всех до ≈ 2009 г.; AW-1 – для поздних модификаций  
      - Методика одинакова для обоих коробок, различаются только моменты и объёмы  
