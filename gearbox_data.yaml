    nuances: "DL501 (0B5) — первая продольная мокрая DSG7 для мощных моторов Audi (A4/A5/A6/A7/Q5, включая S-модели), рассчитанная на крутящий момент до ~600 Н·м и работающую с двумя разными жидкостями. На практике многие проблемы DL501 (жёсткие включения, ошибки по мехатронике, износ сцеплений) связаны с перегревами, редкими заменами и неполным обслуживанием (меняют только один контур), а также с ранними ревизиями мехатроники. Корректный сервис включает замену обоих фильтров, обеих жидкостей и выставление уровней по температуре."
    description: "VAG DL501 / 0B5 — 7-ступенчатая S tronic с мокрыми сцеплениями для продольных моторов Audi (A4, A5, A6, A7, Q5 и др.), рассчитанная на момент до ~600 Н·м и ресурс порядка 300 тыс. км при нормальном обслуживании. Коробка имеет два независимых контура масла: DSG-жидкость G 052 529 A2 для мехатроники и пакетов сцеплений и трансмиссионное масло G 052 532 A2 для механической части и дифференциала. По данным gearboxlist — объёмы 6,7 + 4,5 л и регламент замены каждые 60 тыс. км с обязательной заменой фильтров. Для мастерской важно понимать, что успешный ремонт и продление ресурса DL501 напрямую зависят от дисциплины по маслам и корректного выставления уровня."
    weak_points: |
      1. Перегрев и старение DSG-жидкости.
      По многочисленным отчётам владельцев и сервисов, перегрев и редкая замена G 052 529 A2 ведут к ускоренному износу мокрых сцеплений и гидроблока.
      
      2. Засорение мехатроники.
      Мехатроника DL501 чувствительна к шламу и продуктам износа; при грязном масле часто возникают толчки, ошибки по давлению и необходимость ремонта/замены платы.
      
      3. Износ сцеплений.
      При городской эксплуатации и агрессивном стиле вождения сцепления изнашиваются быстрее, особенно на ранних ревизиях коробки; на этом этапе одна замена масла уже не решает проблему.
      
      4. Игнорирование механического контура.
      Часть сервисов ограничивается только заменой DSG-жидкости, оставляя масло G 052 532 A2 без внимания, что ускоряет износ шестерён и дифференциала.
      
      5. Сложность обслуживания и подбор расходников.
      Несколько ревизий DL501 используют отличающиеся фильтры, прокладки и моменты затяжки; слепой подбор по коду 0B5 без VIN ведёт к ошибкам в заказе и сборке.
