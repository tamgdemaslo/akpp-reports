    procedure: |
      1. Подтвердите по VIN, что установлена именно АКПП AL750 (6-ступенчатый автомат Touareg/Q7/Cayenne), и подготовьте ATF с допуском G 055 025 A2 и расходники по каталогу под конкретный VIN.
      2. Лёгкой поездкой прогрейте коробку, затем установите автомобиль строго горизонтально на подъёмник/яму, зафиксируйте селектор в «P» и дайте коробке немного остыть до безопасной температуры для работы.
      3. Снимите нижнюю защиту, обеспечьте доступ к поддону АКПП и сливной/контрольной пробке. Перед сливом убедитесь, что заливка/контроль уровня доступны (наружная пробка и внутренняя переливная трубка не сорваны).
      4. Подставьте ёмкость не менее 10–12 л и аккуратно выверните наружную сливную/контрольную пробку. Дождитесь выхода основной струи масла.
      5. Если конструкция предусматривает внутреннюю переливную трубку, аккуратно выкрутите её и дайте стечь оставшемуся маслу из картера (обычно суммарно 5,5–6 л при стандартной частичной замене).
      6. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон, удерживая его горизонтально, чтобы не пролить остатки масла, и перенесите на верстак.
      7. Снимите масляный фильтр АКПП, убедитесь, что старое уплотнительное кольцо не осталось в посадочном гнезде. Оцените количество стружки и шлама на магнитах и в районе фильтра — это важный диагностический признак состояния AL750.
      8. Тщательно промойте поддон и магниты очистителем, удалите весь шлам и металлическую пыль, проверьте поддон на деформации и коррозию; при сомнительном состоянии поддон лучше заменить.
      9. Установите новый фильтр, соблюдая ориентацию и посадку уплотнения, затем установите новую прокладку поддона (или нанесите рекомендованный герметик, если конструкция без отдельной прокладки).
      10. Соберите поддон, затягивая болты в несколько приёмов крест-накрест с моментами из ремонтного мануала (для конкретной ревизии AL750).
      11. Установите переливную трубку (если предусмотрена) и новую шайбу/уплотнение на сливную/контрольную пробку. Закрутите пробку от руки, оставив возможность для последующей регулировки уровня.
      12. Через адаптер/насос залейте в коробку первую порцию ATF G 055 025 A2 объёмом порядка 5,5–6 л (ориентируясь на фактический слив и модификацию коробки).
      13. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям P–R–N–D с паузой 2–3 секунды в каждом, затем верните селектор в «P».
      14. Под контролем сканера доведите температуру ATF до диапазона 35–45 °C. На работающем двигателе и при горизонтальном положении авто аккуратно выверните контрольную пробку: при правильном уровне в указанном диапазоне из отверстия должна идти тонкая струйка, переходящая в частые капли.
      15. Если масло почти не вытекает, через адаптер дозаливайте ATF малыми порциями и повторяйте проверку до появления стабильной струйки/частых капель при 35–45 °C; при избыточном потоке дождитесь, пока перелив прекратится и останутся только частые капли.
      16. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем переключений и температур.
      17. Для машин с большим пробегом и сильно потемневшим маслом имеет смысл использовать ступенчатую схему: повторный частичный слив/долив через 2–4 тыс. км для более мягкого обновления всего объёма ATF.
    mistakes:
      - Считать AL750 необслуживаемой коробкой и ездить на заводском масле до появления серьёзных толчков и ошибок по гидроблоку.
      - Заливать универсальное ATF или масла без явного допуска к G 055 025 A2, ориентируясь только на количество ступеней или марку автомобиля.
      - Ограничиваться только сливом через пробку без снятия поддона, чистки магнитов и замены фильтра.
      - Выставлять уровень ATF «на глаз», без контроля температуры и без процедуры через переливную трубку/контрольное отверстие.
      - Повторно использовать уплотнения сливной пробки и старые болты поддона, если по мануалу они считаются одноразовыми.
    nuances: "AL750 — тяжёлый 6-ступенчатый автомат для полноприводных кроссоверов VAG (Touareg/Q7/Cayenne) с двумя исполнениями по моменту (базовое и усиленное). Оба варианта используют один и тот же допуск ATF G 055 025 A2, но отличаются полной ёмкостью (примерно 9,6 против 12,0 л). Основные практические проблемы в профильных обзорах связаны не с «слабым железом», а с перегревами, загрязнением масла и неправильной процедурой сервиса. Для мастера важно не пытаться подобрать расходники только по коду AL750: фильтр, прокладка поддона, пробки и шайбы корректно подбираются по VIN. Уровень масла выставляется по температуре через контрольное отверстие с переливной трубкой, как у других современных автоматов VAG."
    description: "АКПП VAG AL750 — это 6-ступенчатый продольный автомат (семейство Aisin/TR-60SN), который ставили на первые Touareg, Audi Q7 и Porsche Cayenne 2002–2010 годов. Есть базовая модификация под двигатели до ~550 Н·м и усиленная под мощные V8/V10/W12 (до ~850 Н·м); по данным gearboxlist обе версии используют один и тот же допуск ATF G 055 025 A2, но отличаются полной ёмкостью. Для сервиса важно помнить: это коробка с нижним поддоном и сервисным фильтром, которая нуждается в регулярной замене масла каждые 60 тыс. км, с выставлением уровня по температуре через переливную трубку. Типичные «болезни» из открытых источников — утечки через разъёмы, быстрый износ соленоидов до 2005 года и последствия перегревов при тяжёлой эксплуатации."
    weak_points: |
      1. Перегрев и старение масла.
      Тяжёлые кроссоверы, прицепы, буксировка и езда по бездорожью сильно нагружают AL750. При редких заменах ATF G 055 025 A2 масло быстро деградирует, что ведёт к износу гидроблока и фрикционов.
      
      2. Износ соленоидов и гидроблока (ранние годы).
      По обзорам AL750 и отзывам сервисов до 2005 года коробки чаще страдали от ускоренного износа соленоидов: появляются толчки, задержки переключений, ошибки по давлению. Чистое масло и температура тут критичны.
      
      3. Утечки по разъёмам и прокладкам.
      На возрастных машинах типично «потеть» коробка через электрические разъёмы и прокладку поддона. Если при ТО это игнорировать, масло уходит, а проблемы по КПП списываются на «возраст».
      
      4. Чувствительность к неправильному уровню.
      Как и другие автоматы с переливной трубкой, AL750 плохо переносит недолив и перелив: недолив даёт пробуксовки и перегрев, перелив — вспенивание и нестабильную работу. Уровень нужно строго выставлять при 35–45 °C.
      
      5. Сложность подбора расходников без VIN.
      Разные модификации и годы выпуска используют отличающиеся фильтры, поддоны и крепёж. Попытка «унифицировать» OEM без привязки к VIN часто заканчивается неправильным заказом деталей.
