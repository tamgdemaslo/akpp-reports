    procedure: |
      1. Подтвердите по VIN, что установлена именно DSG7 DQ200 (0AM или 0CW), и подготовьте нужный объём G 052 512 A2 и G 004 000 M2, а также адаптеры VAS 6262A/6262/4/6262/6 или их аналоги.
      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту и элементы, закрывающие доступ к сливным/заливным отвёрстиям механики и мехатроника.
      3. Механический контур (G 052 512 A2): подставьте ёмкость и выкрутите соответствующую сливную пробку; слейте всё масло механической части (ориентировочно 1,7–1,9 л). После слива временно заверните пробку с новым уплотнением.
      4. Через заливное/вентиляционное отверстие механического контура (по vwts часто под воздушным фильтром/АКБ) с использованием адаптера и мерной тары залейте строго объём, предусмотренный документацией (как правило, около 1,7–1,9 л G 052 512 A2). Уровень задаётся количеством — не переливом.
      5. Гидравлический контур мехатроника (G 004 000 M2): подставьте отдельную ёмкость и выкрутите сливную пробку гидроблока (по мануалу 0AM/0CW), дождитесь полного слива (~0,9–1,0 л).
      6. Через верхнее заливное/вентиляционное отверстие мехатроника (с применением адаптера VAS) аккуратно залейте точно отмеренный объём G 004 000 M2 (по документации, обычно ~0,9–1,0 л). Здесь также важен именно объём, а не ориентир по переливу.
      7. Проверьте, что обе пробки затянуты с новыми уплотнениями по моментам из мануала (0AM/0CW), установите снятые элементы (АКБ, воздухофильтр, защиту) на место.
      8. Выполните короткий тест-драйв с плавными режимами, проверьте отсутствие течей и посторонних звуков. При необходимости проведите адаптацию сцеплений и мехатроника через диагностический сканер по процедурe DQ200.
      9. При сильно загрязнённой жидкости или наличии жалоб до сервиса (рывки, ошибки по гидроблоку, букс на горячую) оцените целесообразность дополнительных работ: адаптаций, ремонта мехатроника или замены сцеплений, так как одна замена жидкостей не всегда устраняет накопленные проблемы.
    mistakes:
      - Считать DQ200 необслуживаемой и не менять жидкости до явных отказов мехатроники или сцеплений.
      - Путать типы жидкостей: лить ATF/DSG-жидкость вместо G 052 512 A2 или G 004 000 M2, либо смешивать контуры.
      - Выставлять уровень «по переливу», как у классических АКПП, а не по чётко отмеренному объёму.
      - Использовать неподходящие адаптеры/шланги и заливать не тот объём, ориентируясь «на глаз».
      - Ожидать, что одна замена масла устранит проблемы, связанные с уже изношенными сцеплениями, вилками выбора и гидроблоком.
    nuances: "DQ200 — сухая преселективная DSG7 с двумя сухими сцеплениями, поэтому масло не омывает пакет сцеплений, как в мокрых DSG. Сервис заключается в обновлении масла механической части и гидравлики мехатроника строго по объёму; классической проверки уровня по переливу нет. По профильным материалам ключевые проблемы связаны не столько с маслом, сколько с перегревом, износом сцеплений и отказами мехатроника, но своевременная замена жидкостей снижает риск ускоренного износа и отказов гидравлики."
    description: "VAG DQ200 (0AM/0CW) — 7-ступенчатая DSG с двумя сухими сцеплениями для поперечных моторов до 2,0 л и момента до ~250 Н·м. В отличие от мокрых DSG, здесь два независимых контура: механическое трансмиссионное масло G 052 512 A2 (около 1,7–1,9 л) и гидравлическая жидкость мехатроника G 004 000 M2 (около 0,9–1,0 л). Сцепления работают всухую, поэтому корректный объём и качество жидкостей важны прежде всего для ресурса шестерён и гидроблока. Практика сервисов и владельцев показывает, что несмотря на формальные заявления об «обслуживаемости по жизни», разумно менять оба контура каждые 60–80 тыс. км."
    weak_points: |
      1. Мехатроник и гидроблок.
      Судя по многим отчётам, слабое место DQ200 — блок мехатроника: отказы электромагнитов и гидравлики, ошибки по давлению, рывки и пропадание передач. Грязная жидкость G 004 000 M2 усугубляет ситуацию.
      
      2. Сухие сцепления.
      Сцепления работают в сухой среде и подвержены перегревам на пробках и горках; при активной эксплуатации ресурс сцеплений снижается, а вибрации и рывки не устраняются одной заменой масел.
      
      3. Чувствительность к точному объёму масла.
      Оба контура не имеют классического контроля уровня по переливу, поэтому ошибка в объёме (недолив/перелив) напрямую влияет на работу коробки.
      
      4. Перегрев и трафик.
      Городские пробки и частые старты/остановки нагружают сцепления и мехатроник; перегрев ускоряет износ и провоцирует ошибки.
      
      5. Ограниченность ремонтопригодности.
      Часть проблем (например, трещины в плате, износ вилок) требует серьёзного ремонта или замены узлов; простая замена жидкостей здесь не является «панацеей», но важна как профилактика.
    faq:
      - {"question":"Какие жидкости использовать в DSG7 DQ200?","answer":"Для механической части используется G 052 512 A2 (1,7–1,9 л), для гидравлики мехатроника — G 004 000 M2 (0,9–1,0 л). Универсальные ATF и масла для АКПП сюда не подходят.","url":"https://gearboxlist.com/volkswagen/dq200/"}
      - {"question":"Сколько масла готовить на замену в DQ200?","answer":"Для полной замены по обоим контурам достаточно иметь 2–3 л G 052 512 A2 и 2 л G 004 000 M2, чтобы перекрыть диапазон 1,7–1,9 + 0,9–1,0 л и иметь небольшой запас.","url":"https://vwts.ru/articles/trans/zamena-masla-0cw-dsg7-dq200.html"}
      - {"question":"Через сколько километров менять масло в DQ200?","answer":"Официально коробка часто заявлялась как необслуживаемая, но профильные сервисы рекомендуют менять масла в обоих контурах каждые 60–80 тыс. км.","url":"https://vag-dsg.ru/dsg7-0am-0cw-dq200-zamena-masla"}
      - {"question":"Есть ли фильтр, который меняют при обычном ТО?","answer":"При регламентной замене жидкостей фильтр обычно не трогают: фильтрующие элементы находятся внутри мехатроника и обслуживаются при его ремонте. Универсальные OEM фильтра без привязки к VIN указывать не корректно.","url":"https://only-vag.ru/poleznye-stati/remont-i-problemy-dq200-dsg-polnoe-rukovodstvo-dlya-dolgosrochnoj-ekspluatatsii"}
      - {"question":"Нужно ли делать адаптацию после замены масла в DQ200?","answer":"Строго не обязательно, но при наличии жалоб (рывки, толчки, задержки) после корректной замены жидкостей имеет смысл выполнить адаптацию сцеплений и мехатроника по процедурам VAG.","url":"https://only-vag.ru/poleznye-stati/remont-i-problemy-dq200-dsg-polnoe-rukovodstvo-dlya-dolgosrochnoj-ekspluatatsii"}
    procedure_id: "VAG_DQ200"
