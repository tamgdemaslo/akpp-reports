    drain_volume: 7,5 – 9,0 л (поддон снят, стэндпайп выкручен)
    dry_capacity: 10,4 – 12,8 л  (зависит от длины охлаждающих магистралей)
    service_interval: 80 000 км или 5 лет (60 000 км — прицеп, офф-роуд, чип-тюнинг)
    tools:
      - подъёмник / ровная яма
      - Torx T25 (защита моторного отсека)
      - головка 10 мм (22 болта поддона)
      - Torx E8 (болт фильтра)
      - шестигранник 5 мм (внутр. стэндпайп)
      - 17 мм шестигранник ИЛИ квадрат 8 мм (наружная пробка – зависит от ревизии поддона)
      - адаптер-штуцер M24 × 1,5 → шланг/помпа для заливки
      - динамометрический ключ 2–60 Н·м
      - сканер VCDS / OBD11 (датчик ATF-T, блок «02/42»)
      - тара ≥ 12 л для отработки, мерная канистра
    parts_list:
      - ATF G055540A2 6 л
      - прокладка поддона 0C8 321 371
      - шайба сливной пробки 0C8 321 181
      - фильтр 0C8 325 435
    pan_bolts: 22 × М6 × 22, класс 8.8
    drain_torque: 16 Н·м (наружная пробка)
    fill_torque: |
      8 Н·м  — болты поддона  
      2 Н·м  — внутр. стэндпайп («оверфлоу»)  
      10 Н·м — болт фильтра
    procedure: |
      1. Прогреть коробку лёгкой поездкой до 35–40 °C (VCDS → ATF TEMP); поставить автомобиль строго горизонтально, селектор «P», ДВС заглушить. Снять защиту двигателя (T25).
      2. Слив. Поставить ёмкость ≥ 10 л. Выкрутить наружную пробку (17 мм/кв. 8) — сольётся ≈0,5 л. Вкрутить в отверстие шестигранник 5 мм и выкрутить внутр. трубку-стэндпайп — выльется ещё 7–8 л.
      3. Демонтировать 22 болта поддона (10 мм), осторожно снять поддон. Отмыть поддон и два магнита до «чистой салфетки».
      4. Замена фильтра. Открутить один болт Torx E8, снять фильтр; смазав новый O-Ring ATF, установить фильтр 0C8 325 435, затянуть болт 10 Н·м.
      5. Сборка. Новую прокладку 0C8 321 371 уложить насухо, болты поддона крест-накрест 8 Н·м. Новая шайба на наружной пробке, но пока пробку не ставить.
      6. Первая заливка. Вкрутить стэндпайп от руки + ¼ оборота (≈2 Н·м). Через адаптер М24 × 1,5 залить ровно столько ATF, сколько было слито (обычно 5,5 л).
      7. Прокачка. Запустить двигатель, удерживая тормоз; пройти селектором P → R → N → D → S → D → N → R → P, задерживаясь по 3–4 с. Проверить ATF-T — целимся в 35–45 °C.
      8. Регулировка уровня. На работающем моторе открутить наружную пробку: излишек потечёт тонкой струйкой. Когда поток станет частыми каплями — уровень верный. Затянуть стэндпайп 2 Н·м, наружную пробку 16 Н·м.
      9. Очистить картер, установить защиту. Проехать 15 км без кик-дауна; ATF-T должна быть < 90 °C, переключения плавные, ошибок в блоке нет.
    mistakes:
      - Использование JWS-3309 / Dexron VI вместо G055540A2 (WS) ведёт к перегреву и пробуксовке пакетов.
      - Перелив: пенообразование снижает давление и ускоряет износ фрикционов.
      - Повторное использование алюминиевой шайбы 0C8 321 181 вызывает «потение» поддона.
      - Перетяжка болтов поддона > 10 Н·м деформирует стальной фланец и даёт течь.
    nuances:
      - После 2014 г. фильтр пластиковый с фетровым элементом < 20 µm; ставить его вместо раннего стального допускается, но не наоборот.
      - Прокладка многоразовая, однако Aisin рекомендует менять при каждом вскрытии из-за «усталости» резины.
      - Полный аппаратный обмен требует 11–12 л ATF и выполняется только при температурах < 40 °C, иначе клапан термостата закрыт.
      - Внешний теплообменник на 3,6 V6 и 4,2 TDI забивается грязью — промывать радиатор раз в год.
    price_block: |
