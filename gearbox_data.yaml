      7–9 Н·м.

      7. Закрутите сливную пробку 35 Н·м.

      8. Через щуп залейте ровно слитый объём NS-3 (4,0–4,5 л).

      9. Запустите двигатель; удерживая тормоз, переключите P-R-N-D-L-D-N-R-P, задерживаясь
      по 5 с.

