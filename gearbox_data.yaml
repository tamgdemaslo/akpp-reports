      - {"question":"Какую ATF безопасно указывать для АКПП 09A?","answer":"Только VW G 052 990 A2. Жидкость G 052 162 A2 и универсальные ATF для 09A не подходят.","url":"https://www.vwvortex.com/threads/atf-g-052-990-a2-for-09a.4373012/"}
      - {"question":"Сколько масла готовить на одну процедуру drain-and-fill?","answer":"Обычно сливается около 3 л. Иметь 3,5–4 л G 052 990 A2, чтобы выставить уровень по температуре. По опыту форумов набор 3–3,5 л работает лучше, чем фиксированные 2,5 л по мануалу.","url":"https://www.vwvortex.com/threads/diy-drain-refill-on-09a-tiptronic-transmission.3748902/"}
      - {"question":"При какой температуре выставлять уровень ATF на 09A?","answer":"При ~40 °C по VCDS (блок 004) на работающем двигателе. Перед проверкой обязательно пройти селектором все диапазоны (R, D, N, 3, 2). Лёгкая капля из check plug означает корректный уровень.","url":"https://www.vwvortex.com/threads/diy-drain-refill-on-09a-tiptronic-transmission.3748902/"}
      - {"question":"После замены масла появился гул — что проверять?","answer":"Сначала уровень и фактический объём, ориентируясь на ~40 °C и лёгкую каплю из check plug. Недолив после «книжных» 2,5 л — частая причина гула; если уровень корректен, дальше уже диагностируют соленоиды и гидроблок.","url":"https://www.vwvortex.com/threads/did-solenoid-change-on-09a-now-a-new-set-of-problems.8105201/"}
