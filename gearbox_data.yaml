      7. При сервисе final drive — 75W90 G 052 145 A2 отдельно.
    mistakes:
      - Заливать Dexron/Mercon или универсальную ATF.
      - Проверять уровень на заглушённом двигателе или вне 35–45 °C.
      - Забыть уплотнение 01V 325 443 на фильтре.
      - Спутать final drive и ATF-контур.
    nuances:
      - У 01V нижний поддон, фильтр меняется при ТО.
      - Заливка через deflector cap; не смещать крышку заливной трубки.
      - Final drive — отдельная зона с 75W90.
    description: |
      **VAG 01V** — 5-ступенчатая АКПП ZF 5HP19 (поперечная): Passat, A4, A6, A8, Allroad, S4 (1996–2006).

      Для мастера: **нижний поддон, фильтр сервисный, уровень при 35–45 °C на работающем двигателе**. Заливка через deflector cap. Final drive обслуживается отдельно 75W90.
    weak_points: |
      **1. Соленоиды и valve body.** Часты неисправности соленоидов, коды P2716, P1814/P1815. Проверять разъёмы на коррозию, TCM на влагу.

      **2. Протечка гидротрансформатора.** Износ seal вала TC и втулки насоса; замена масла не устраняет.

      **3. Ошибка по уровню.** Недолив даёт пинки и пробуксовку.

      **4. Путаница final drive и ATF.** Final drive — 75W90, не ATF.
    faq:
      - question: "Меняется ли фильтр при обычном ТО на 01V?"
        answer: "Да. У 01V нижний поддон, фильтр меняется. OEM — 01V 325 429, O-ring 01V 325 443."
        url: "https://www.passatworld.com/threads/automatic-transmission-filter-fluid-change.291200/"
      - question: "Какую ATF безопасно указывать?"
        answer: "Только VW G 052 162 A2."
        url: "https://www.vwvortex.com/threads/checking-changing-transmission-fluid-in-a-01m-101n-101v-tranny-and-final-drive.2989712/"
      - question: "Сколько ATF готовить?"
        answer: "При снятии поддона сливается 5–6 л. Иметь 6–7 л."
        url: "https://www.passatworld.com/threads/automatic-transmission-filter-fluid-change.291200/"
      - question: "При какой температуре выставлять уровень?"
        answer: "При 35–45 °C, работающий двигатель, горизонтально. VCDS блок 004."
        url: "https://www.vwvortex.com/threads/checking-changing-transmission-fluid-in-a-01m-101n-101v-tranny-and-final-drive.2989712/"
      - question: "Нужно ли отдельно обслуживать final drive?"
        answer: "Да. Final drive — 75W90 G 052 145 A2, не ATF."
        url: "https://www.vwvortex.com/threads/checking-changing-transmission-fluid-in-a-01m-101n-101v-tranny-and-final-drive.2989712/"
      - question: "После сервиса остаются пинки — что проверять?"
        answer: "Сначала уровень и процедуру, затем фильтр и уплотнения. Потом — соленоиды и valve body."
        url: "https://www.vwvortex.com/threads/the-01v-zf-trans-thread.4596265/"
