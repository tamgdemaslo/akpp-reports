    procedure: |
      1. Подтвердите по VIN/наклейке, что установлена AL551 (0BK), и подготовьте ATF G 060 162 A2, поддон-фильтр и крепеж по каталогу.
      2. Прогрейте коробку короткой поездкой, затем установите авто строго горизонтально на подъемнике.
      3. При заглушенном двигателе открутите сливную пробку поддона и слейте масло в тару не менее 10 л. Зафиксируйте объем слива.
      4. Демонтируйте поддон с интегрированным фильтром, очистите прилегающую плоскость корпуса и магниты от шлама.
      5. Установите новый поддон-фильтр с новым крепежом. Болты тяните крест-накрест моментом около 10 Н·м (уточнить по мануалу ревизии).
      6. Через заливную/контрольную пробку подайте свежую ATF до появления вытекающей струйки.
      7. Запустите двигатель, удерживая тормоз, переведите селектор по всем положениям P-R-N-D и обратно с паузами 2–3 секунды.
      8. Контролируйте температуру ATF сканером. В диапазоне 30–50 °C откройте контрольное отверстие: при правильном уровне идет тонкая струйка, затем капли.
      9. Если не течет — долейте. Если течет сильно — дождитесь перехода в капли. После этого затяните пробки штатным моментом.
      10. Сотрите ошибки, выполните тест-драйв 10–15 км и повторно проверьте герметичность поддона и разъема.
    mistakes:
      - Заливка ATF без допуска G 060 162 A2 / Lifeguard 8.
      - Проверка уровня без контроля температуры ATF.
      - Повторное использование старых болтов поддона.
      - Перетяжка пластикового поддона и деформация фланца.
      - Игнорирование шлама на магнитах и продуктов износа ГДТ.
    nuances: "AL551 (0BK) конструктивно относится к семейству ZF 8HP55A. Главный сервисный нюанс: фильтр интегрирован в поддон, отдельно штатно не меняется. На больших пробегах частая цепочка: износ блокировки ГДТ -> загрязнение гидроблока -> толчки, поэтому чистота масла и интервал замены критичны. По OEM крепежа и пробок встречаются отличия по ревизиям, поэтому для этих позиций корректно использовать подбор по VIN."
    description: "VAG AL551 (0BK) — 8-ступенчатый гидроавтомат для полноприводных моделей Audi, разновидность ZF 8HP55A. Коробка рассчитана на высокий момент и при нормальном обслуживании имеет ресурс около 300 тыс. км. Для ресурса критичны регулярная замена ATF G 060 162 A2, корректная выставка уровня по температуре и замена поддона с интегрированным фильтром."
    weak_points: |
      1. Износ фрикциона блокировки ГДТ на активной езде -> вибрации и пыль в масле.
      2. Загрязнение соленоидов гидроблока продуктами износа -> толчки и задержки переключений.
      3. Вибрации от изношенного ГДТ ускоряют износ подшипника маслонасоса.
      4. Частые резкие старты снижают ресурс поршней и барабанов.
      5. Течи по поддону, втулкам и резиновым уплотнениям с возрастом.
