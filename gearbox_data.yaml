      У Mercedes 722.8 нижний поддон, значит фильтр при стандартном ТО меняется.
      Но это вариатор Autotronic, а не обычная АКПП, поэтому для него критичны и чистота масла, и точный уровень, и корректный вариаторный допуск.
      По открытым источникам у 722.8 есть ранняя и поздняя ревизии прокладки поддона, что для мастера создаёт реальный риск ошибки при заказе.
      Практически большая часть тяжёлых проблем этой коробки начинается не с прокладки или фильтра, а с низкого уровня, грязного масла, перегрева, подшипников и электронной части VGS/датчиков.
    description: |
      **Mercedes 722.8 / Autotronic** — это редкий для Mercedes вариатор, и для мастера по замене масла он должен сразу mentally отделяться от классических `722.6/722.9/725.0`.

      Хорошая новость: у коробки нижний поддон и сервисный фильтр, то есть фильтр на обычном ТО меняется. Плохая — сама коробка очень не любит грязное масло, ошибки по уровню и работу “по памяти”, а ещё имеет ревизии прокладки, которые легко перепутать при заказе.

      Для сервиса это вариатор, где аккуратная замена масла действительно важна, но где нужно очень честно разговаривать с клиентом: если коробка уже гудит, перегревается, ругается по датчикам скорости или ведёт себя как будто пробуксовывает, одной заменой масла это часто не лечится.

      На практике `722.8` стоит воспринимать как коробку, где результат ТО напрямую зависит от дисциплины мастера: правильная CVT fluid `MB 236.20`, новый фильтр, правильная прокладка по ревизии и точный уровень на 80 °C.
    weak_points: |
      **1. 722.8 очень боится низкого уровня и грязного масла.**
      По профильным источникам именно масляное голодание и загрязнение быстро добивают подшипники и гидроэлектронную часть. Для мастера это главный пункт самоконтроля после сервиса.

      **2. Подшипники и гул — одна из типовых тяжёлых историй этой коробки.**
      Если вариатор уже шумит, замена масла не должна продаваться как «ремонт». Для сервиса это важный момент фиксации исходных симптомов до работ.

      **3. Электронная часть VGS/датчики скорости у 722.8 чувствительны к продуктам износа и перегреву.**
      По профильным материалам ошибки по speed sensor и TCU для этой коробки типичны. Если такие симптомы уже есть, мастеру лучше сразу предупреждать клиента, что масло и фильтр могут не решить проблему полностью.

