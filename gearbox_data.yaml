    procedure: |
      1. Прогрейте АКПП короткой поездкой и поставьте автомобиль строго горизонтально.
      2. Снимите защиту, очистите поддон и область пробок от грязи.
      3. Открутите сливную пробку поддона и слейте масло в мерную тару. Для 5HP18 встречаются два варианта пробок поддона (M10x1 и M30x1.5) - это важно для правильного момента затяжки.
      4. После прекращения основного слива снимите поддон, промойте его и магниты.
      5. Демонтируйте фильтр и проверьте, чтобы старое уплотнение не осталось в корпусе.
      6. Установите новый фильтр 24 34 1 422 513, закрепите крепеж фильтра номинальным моментом (в мануале 8 Н·м).
      7. Установите новую прокладку поддона 24 11 1 219 127 и поставьте поддон на место.
      8. Затяните болты поддона крест-накрест моментом около 6 Н·м.
      9. Поставьте пробку(и) с новыми шайбами: для M10x1 ориентир 15 Н·м, для M30x1.5 в мануале указан высокий момент до 100 Н·м (применять только для соответствующей пробки/гайки).
      10. Залейте стартовый объем свежей ATF LT 71141 (обычно 4.5-5.5 л), запустите двигатель и последовательно переведите селектор через все диапазоны с паузой 2-3 секунды.
      11. Доливайте ATF до корректного уровня по температурной процедуре вашего автомобиля (обычно контроль при 30-50°C с последующей проверкой на горячую).
      12. Сделайте тест-драйв, затем повторно проверьте уровень и отсутствие течей по поддону/пробкам.
    mistakes:
      - Использовать ATF без прямой спецификации LT 71141/Lifeguard 5.
      - Путать пробки M10x1 и M30x1.5 и затягивать их одинаковым моментом.
      - Перетягивать болты поддона (у 5HP18 момент низкий, около 6 Н·м).
      - Оставлять старую прокладку/старые шайбы после снятия поддона.
      - Проверять уровень без контроля температуры ATF.
      - Не очищать магниты и поддон, пропуская ранние признаки износа.
    nuances: |
      Ключевая особенность 5HP18 при сервисе - разные исполнения поддона и пробок: в заводском мануале одновременно встречаются M10x1 и M30x1.5, поэтому момент затяжки нужно выбирать строго под фактический элемент.
      Для практического обслуживания полезно сразу фиксировать объем реального слива: у живой коробки это дает точную отправную точку при первичной заливке.
      По слабым местам коробки в профильных источниках чаще всего повторяются втулка барабана F, износ по пакету F/G и последствия езды с низким уровнем/грязной жидкостью.
      Если есть сомнения в конкретной детали по OEM, безопаснее проверять по VIN и схеме конкретного автомобиля (E36/E34/E39/E38), потому что у A5S310Z есть ревизионные различия по поддону и мелкому крепежу.
    description: |
      ZF 5HP18 (BMW A5S310Z) - ранняя 5-ступенчатая электронно-гидравлическая АКПП ZF для заднеприводных BMW 90-х годов. Коробка в целом ресурсная, но возраст и перегревы часто приводят к утечкам, износу втулок и проблемам пакета F.
      
      Сервисно коробка типичная: поддон, сменный внутренний фильтр, магниты и обязательный контроль уровня по температуре. На практике большинство проблем начинается после длительной эксплуатации на старой ATF или при езде с недоливом.
      
      Для мастерской карточки главное: использовать правильный класс жидкости LT 71141, не путать типы пробок поддона и соблюдать корректные моменты затяжки для конкретной ревизии.
    weak_points: |
      1) Втулка барабана F и утечка давления в узле F/G.
      2) Ускоренный износ блокировки ГТД при грязной ATF.
      3) EPC/соленоиды при работе на перегретом и загрязненном масле.
      4) Возрастные течи по прокладкам и сальникам.
      5) Ошибки по уровню ATF после некорректной процедуры выставления.
