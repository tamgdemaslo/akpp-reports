    - очиститель поддона и магнитов, безворсовые салфетки
    pan_bolts: нижний поддон снимается при штатном сервисе; сам фильтр доступен после снятия поддона и меняется вместе с обслуживанием ATF
    drain_torque: отдельную OEM-спецификацию по сливной пробке без VIN лучше не фиксировать; базовая сервисная процедура ориентирована на снятие нижнего поддона
    fill_torque: точный момент затяжки сервисной заливной/контрольной пробки лучше сверять по WSM конкретной ревизии, так как в открытых источниках встречаются расхождения
    procedure: |
      1. Прогрейте коробку короткой поездкой или 5–10 минутами работы, затем установите автомобиль строго горизонтально и снимите защиту.
      2. До начала слива убедитесь, что сервисное заливное/контрольное отверстие открывается без заеданий и коробку можно будет заправить обратно.
      3. Подставьте мерную ёмкость и снимите нижний поддон АКПП. Для 10R80 штатный сервис выполняется именно через нижний поддон, а не через боковой сервисный люк.
      4. Слейте масло, зафиксируйте объём, очистите поддон и магниты от шлама.
      5. Снимите старый фильтр, установите новый HL3Z-7A098-A, при монтаже смочите уплотнение свежим ATF.
      6. Установите новую прокладку HL3Z-7A191-B, соберите поддон и равномерно затяните крепёж по схеме производителя.
      7. Залейте первоначально примерно 5,7–6,0 л свежего Mercon ULV.
      8. Запустите двигатель, удерживая тормоз, и последовательно переведите селектор через все диапазоны с паузой 3–5 секунд в каждом положении, затем верните в «P».
      9. Доведите TFT до 96–101 °C и проверяйте уровень только в этом диапазоне: на 10R80 контроль выполняется по штатному индикатору уровня при работающем двигателе.
      10. При недоливе добавляйте ATF малыми порциями, пока уровень не окажется в рабочей зоне индикатора; перелив так же вреден, как и недолив.
      11. Очистите корпус, выполните тест-драйв, затем повторно проверьте отсутствие подтёков по поддону и зоне сервисной пробки.
    mistakes:
    - Использование любой ATF кроме Mercon ULV приводит к некорректной работе гидросистемы и ускоренному износу.
    - Проверка уровня вне диапазона 96–101 °C даёт ложный результат.
    - Попытка обслужить коробку как вариант с боковым поддоном приводит к пропуску замены фильтра.
    - Перелив опасен не меньше недолива: коробка чувствительна к вспениванию и ошибочному уровню.
    - Грязь на поддоне и магнитах после сервиса быстро портит результат даже при свежей жидкости.
    nuances:
    - У 10R80 нижний поддон, поэтому фильтр сервисный и меняется при обычном обслуживании со снятием поддона.
    - Текущий OEM фильтра — HL3Z-7A098-A; ранний номер L1MZ-7A098-A официально заменён на него.
    - Текущий OEM прокладки поддона — HL3Z-7A191-B; ранний номер HL3Z-7A191-A заменён на него.
    - По отдельным пробкам и шайбам в открытых каталогах есть риск путаницы между ревизиями поддона и смежными коробками, поэтому без VIN их лучше не фиксировать как единственно верный OEM.
