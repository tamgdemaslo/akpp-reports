    description: |
      **Mercedes 722.6 / 5G-Tronic / NAG1** — одна из самых массовых 5-ступенчатых АКПП Mercedes, и для сервиса по замене масла это уже совсем другая история, чем старые `722.3/722.4/722.5`.
      
      У неё всё ещё нижний поддон и сервисный фильтр, то есть фильтр на обычном ТО меняется. Но ключевая разница в том, что коробка электронная: помимо масла и механики мастеру нужно смотреть на conductor plate, speed sensors и особенно на 13-pin connector sleeve, через который ATF может уйти в проводку и довести коробку до limp mode.
      
      Практически `722.6` нельзя обслуживать по принципу «высосали масло сверху и поехали». Нормальный сервис — это снятие поддона, очистка магнита и дна, замена фильтра, проверка разъёма, точная заправка ATF по правильному допуску и обязательная выставка уровня по щупу при 80 °C.
      
      Для мастера это хорошая коробка при условии дисциплины: если не упускать connector sleeve, не путать pan-drop сервис с полной заменой и не отпускать машину без точного уровня, то многие спорные жалобы после ТО просто не возникают.
    weak_points: |
      **1. 13-pin connector sleeve — типовая сервисная точка риска.**
      По форумам это одна из самых частых проблем 722.6: втулка начинает течь, ATF попадает в разъём и может подняться по проводке к TCM. Для мастера по замене масла это не «дополнительная опция», а обязательная зона контроля.
      
      **2. Conductor plate и speed sensors часто подводят уже на большом пробеге.**
      По обсуждениям 722.6 коробка может начать flare, зависать, уходить в limp и выдавать ошибки не из-за свежего масла, а из-за усталой conductor plate. Поэтому перед сервисом важно фиксировать, были ли эти симптомы уже до работ.
      
      **3. Частичная замена без снятия поддона оставляет грязь и не решает сервисную задачу полностью.**
      На форумах мастера и владельцы отдельно подчёркивают: высасывание жидкости через трубку не убирает тяжёлую грязь со дна, не даёт заменить фильтр и не показывает состояние магнита.
      
      **4. 722.6 очень чувствительна к правильному уровню.**
      Ошибка по уровню после сервиса даёт flare, жёсткие переключения и ложные подозрения на внутреннюю поломку. Для мастера здесь важнее дисциплина процедуры, чем «примерно столько же залить, сколько слилось».
    faq:
      - question: "Меняется ли фильтр на Mercedes 722.6 при обычном ТО?"
        answer: "Да. У 722.6 нижний поддон, поэтому фильтр сервисный и при нормальном pan-drop обслуживании меняется обязательно."
        url: "https://www.benzworld.org/threads/722-6-transmission-filter.1617138/"
      - question: "Какой OEM фильтра и прокладки поддона безопаснее брать?"
        answer: "По открытым OEM-источникам стабильно подтверждаются фильтр 140 277 00 95 и прокладка поддона 140 271 00 80."
        url: "https://www.giantautopart.com/mercedesbenz/mercedes-benz-original-1402770095-1402710080-auto-transmission-filter-and-gasket-set-722-6"
      - question: "Нужно ли менять 13-pin connector sleeve при сервисе масла?"
        answer: "Очень желательно, особенно если коробка уже возрастная или поддон всё равно снят. Это дешёвая, но критичная позиция: через неё ATF может попасть в разъём и дальше в проводку/TCM."
        url: "https://www.benzworld.org/threads/722-6-trans-a-t-plug-adapter-conductor-plate-connector-transmission-leak.1294408/"
      - question: "Когда на 722.6 имеет смысл заранее обсуждать conductor plate?"
        answer: "На большом пробеге и особенно если уже были flare, hesitation, ошибки по скорости или limp mode. По форумам многие мастера считают разумным менять её профилактически при сервисе коробки после 120 тыс. миль, чтобы не вскрывать всё повторно."
        url: "https://www.benzworld.org/threads/722-6-conductor-plate-preventive-replacement.3113464/latest"
    procedure_id: "MERCEDES_722.6"
