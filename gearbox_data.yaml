    procedure: |
      1. Подтвердите, что это SQ150 (DS085): обычно Audi A2 или VW Lupo с роботом. Машина должна стоять строго горизонтально.
      2. Понимайте, что у коробки две раздельные полости: механическая (gear-oil) и гидропривод (hydraulics). Для каждой свои пробки и своя жидкость.
      3. Механическая часть (gear-oil): найдите сливную и заливную пробки по мануалу 085 DS. Слейте около 2,9 л масла G 052 726 A2, установите сливную пробку с новой шайбой (около 30 Н·м). Через заливное отверстие залейте 2,9–3,1 л свежего масла, пока оно не начнёт вытекать из контрольного отверстия.
      4. Запустите двигатель, включите передачу и дайте поработать несколько минут (по руководству), затем снова проверьте уровень через заливное/контрольное отверстие и при необходимости скорректируйте.
      5. Гидропривод (hydraulics): уровень и частичная замена выполняются через резервуар гидросистемы по процедуре ElsaWin/руководства 085 DS. Для полной замены и удаления воздуха используется заводской алгоритм; заливается около 1 л G 004 000 M2.
      6. Все моменты затяжки и размеры ключей для пробок уточняйте по официальному мануалу (vwts.ru/vw_transmission_085 или ElsaWin), так как они зависят от ревизии.
      7. После работ, связанных со сцеплением или гидравликой (особенно после замены сцепления), выполните адаптацию привода через VCDS (Basic Settings, блоки 61/63) для корректной работы робота.
    mistakes:
      - Путать две жидкости: заливать gear-oil вместо G 004 000 M2 в гидросистему или наоборот.
      - Игнорировать проверку уровня gear-oil после короткой работы с включённой передачей — уровень будет некорректным.
      - Ожидать, что замена масла устранит проблемы сцепления, гидроаккумулятора или датчиков.
      - Искать и менять «фильтр АКПП» — у SQ150 нет сервисного поддона и фильтра как у классического автомата.
      - Не делать адаптацию после замены сцепления, что ведёт к рывкам и ошибкам по включению передач.
    nuances: "SQ150 (DS085) — роботизированная коробка на базе МКПП MQ150/085 с одним сцеплением и гидравлическим управлением. В отличие от классической АКПП, у неё нет гидротрансформатора и поддона с фильтром; обслуживание по маслам сводится к работе с двумя раздельными контурами — механическим gear-oil (G 052 726 A2) и гидросистемой (G 004 000 M2). Коробка редкая (Audi A2, VW Lupo), поэтому точная процедура и точки слива/залива берутся из руководства 085 DS. Типичные проблемы связаны не с маслом, а с гидроаккумулятором, концевиками и необходимостью регулярной адаптации."
    description: "VAG SQ150 / DS085 — 5-ступенчатая роботизированная КПП на базе механической MQ150 (085), ставилась на Audi A2 и VW Lupo с моторами до ~1,4 л. По конструкции ближе к МКПП с автоматическим гидравлическим управлением сцеплением и выбором передач, чем к классической АКПП. Для мастера важно: нижнего поддона и сервисного фильтра нет; есть две разные жидкости — MTF G 052 726 A2 для механики и G 004 000 M2 для гидропривода. Сервис требует аккуратной работы с обеими полостями и понимания, что рывки и проблемы включения передач чаще связаны с гидроаккумулятором, концевиками и адаптацией, а не только с маслом."
    weak_points: |
      1. Гидроаккумулятор.
      По обзорам DS085 и форумам A2/Lupo, гидроаккумулятор часто теряет давление: появляются задержки включения передач, ошибки, падение давления за ночь. Замена узла обычно решает проблему.
      
      2. Необходимость регулярной адаптации.
      Система управления сцеплением и переключениями требует периодической адаптации (каждые ~30 тыс. км) и обязательно после замены сцепления. Без адаптации возможны рывки, грубые переключения и ошибки при трогании.
      
      3. Контакты и датчики.
      Окисление контактов датчиков и концевиков (особенно по задней передаче) — частая причина сбоев. Профилактика и чистка контактных групп входят в типовой ремонт.
      
      4. Потеря задней передачи.
      При пропаже задней нередко виноват концевик/limit switch; его замена часто восстанавливает работу без замены коробки целиком.
      
      5. Стоимость работ по сцеплению.
      Само сцепление ходит долго (до 200 тыс. км и более), но трудоёмкость и стоимость замены высокие. Важно правильно диагностировать износ сцепления и не обещать, что проблема уйдёт после одной замены жидкости.
    faq:
      - {"question":"Меняется ли фильтр при ТО на SQ150?","answer":"Нет. SQ150 — робот на базе МКПП MQ150, у неё нет сервисного поддона и фильтра как у классической АКПП. Внутренние сетки и фильтрующие элементы обслуживаются только при разборке агрегата.","url":"https://otoba.ru/transmissii/vag/sq150.html"}
      - {"question":"Почему в коробке SQ150 две разные жидкости?","answer":"Механическая часть коробки смазывается MTF G 052 726 A2, а гидропривод сцепления и селектора использует CHF G 004 000 M2. Это два отдельных контура, поэтому подбирать и заливать нужно именно свои жидкости.","url":"https://otoba.ru/transmissii/vag/sq150.html"}
      - {"question":"Сколько масла нужно готовить на сервис SQ150?","answer":"Для механической части нужно около 3 л G 052 726 A2 (2,9–3,1 л), для гидропривода — около 1 л G 004 000 M2. Итого стоит иметь не менее 4 л с небольшим запасом.","url":"https://otoba.ru/transmissii/vag/sq150.html"}
      - {"question":"Нужна ли адаптация после работ с коробкой SQ150?","answer":"После замены сцепления адаптация через VCDS обязательна. Рекомендуется также регулярная адаптация примерно каждые 30 000 км для поддержания плавной работы робота.","url":"https://vwts.ru/vw_transmission_085.html"}
      - {"question":"Пропала задняя передача — это коробка умерла?","answer":"Не обязательно. На DS085 часто виноват концевик задней передачи или проблемы с гидроаккумулятором/давлением. Перед решением о замене коробки стоит диагностировать эти узлы.","url":"https://vwts.ru/forum/234448.html"}
    procedure_id: "VAG_SQ150"
