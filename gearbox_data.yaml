    parts_list:
      - ATF нужной спецификации (часто MERCON V, проверять по VIN), 6–10 л для серии частичных замен
      - фильтр АКПП 5R55S/5R55N/5R55W (сервисный, под VIN и тип поддона)
      - прокладка поддона или герметик (по конструкции поддона)
      - уплотнение/шайба сливной пробки (если есть; одноразовая)
