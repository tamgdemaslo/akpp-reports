      oem_drain_plug_washer_info: "Медная уплотнительная шайба сливной пробки 722.9."
      oem_bolt_1: "004 990 35 12"
      oem_bolt_1_price: 0
      oem_bolt_1_info: "Одноразовый алюминиевый болт поддона 722.9; повторно использовать нельзя."
      oem_bolt_2: ""
      oem_bolt_2_price: 0
      oem_bolt_2_info: ""
    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.9. Для этой коробки до начала работ нужно определить, ранняя она или поздняя A89 / Plus.
      
      1. До заказа расходников проверьте VIN, дату выпуска коробки и цвет overflow tube: для 722.9 это определяет и filter kit, и тип ATF.
      2. Слейте ATF из поддона; на части коробок также можно слить гидротрансформатор, но это зависит от ревизии.
      3. Снимите нижний поддон: у 722.9 фильтр сервисный и при обычном ТО меняется.
      4. Очистите поддон и магниты, оцените количество шлама и пыли.
      5. Если коробка ранняя и ещё не переведена на upgraded deep pan / 3-layer filter, отдельно решите, оставляете ли старую конфигурацию или сразу переходите на обновлённый сервисный комплект.
      6. Установите новый filter kit, новую прокладку, новую шайбу пробки и новые одноразовые болты.
      7. При раннем upgrade обязательно ставьте правильную green standpipe; старая white tube с новым поддоном даст неверный уровень.
      8. Залейте ATF правильного допуска для вашей ревизии.
      9. Доведите температуру коробки до 45 °C и выставьте уровень строго по сервисной процедуре 722.9.
      10. После тест-драйва повторно проверьте герметичность и характер переключений на холодную и горячую.
    mistakes:
      - "Перепутать раннюю 722.9 и позднюю A89 / Plus и заказать не тот filter kit."
      - "Смешать red 236.14 и blue 236.15 без понимания, что именно стоит на машине."
      - "Оставить white standpipe после установки upgraded deep pan."
      - "Повторно использовать алюминиевые stretch bolts поддона."
      - "Пытаться выставить уровень 722.9 без точных 45 °C."
    nuances: |
      У Mercedes 722.9 нижний поддон, значит фильтр при стандартном ТО меняется.
      Но это семейство нельзя описывать одним «универсальным набором»: у ранней коробки и у поздней A89 / 7G-Tronic Plus разные сервисные логики по filter kit, overflow tube и ATF.
      Для ранних коробок известен upgrade-path на более глубокий поддон и 3-layer filter; для поздних такая логика уже заложена с завода.
      По сервисным и форумным источникам большая часть спорных жалоб после ТО на 722.9 связана не с «плохой коробкой», а с неверной ревизией расходников, неправильным уровнем, старой standpipe или уже уставшей conductor plate / valve body.
    description: |
      **Mercedes 722.9 / 7G-Tronic** — коробка, где сервис по маслу требует не просто аккуратности, а точной идентификации ревизии до того, как вы вообще откроете каталог расходников.
      
      Хорошая новость: у неё нижний поддон и сервисный фильтр, то есть фильтр на обычном ТО меняется. Плохая — под обозначением `722.9` живут как ранние коробки со старой сервисной конфигурацией, так и поздние `A89 / 7G-Tronic Plus`, у которых уже другой filter kit, другой overflow tube и другой ATF.
      
      Для мастера по замене масла это означает простую вещь: `722.9` нельзя обслуживать «по памяти». Сначала VIN, дата, ревизия и tube color. Потом только расходники, ATF и процедура уровня на 45 °C.
      
      На практике это коробка, где многие претензии после сервиса рождаются не из-за самой механики, а из-за перепутанных комплектов, неправильной жидкости, старой white tube в новом поддоне или изначально больной conductor plate / valve body, которую клиент принёс ещё до работ.
    weak_points: |
      **1. Valve body / conductor plate — одна из главных реальных проблем 722.9.**
      По профильным обсуждениям ранние коробки особенно часто страдают по электронной и клапанной части. Для мастера по маслу это значит: limp mode, flare, застревание в передаче и ошибки по датчикам нужно фиксировать до ТО, а не связывать автоматически со свежей ATF.
      
      **2. Перепутанные расходники между early и A89 — типовая сервисная ошибка.**
      Для 722.9 мастер может всё сделать аккуратно, но если filter kit или standpipe не от той ревизии, итог всё равно будет спорным. Это один из главных практических рисков именно для сервиса.
      
      **3. Неверный уровень после обслуживания очень быстро даёт жалобы на холодную и горячую.**
      На форумах много кейсов, где рывки и jerk после сервиса оказывались проблемой уровня, а не «нового фильтра» или «неудачной жидкости».
      
      **4. Ранние коробки выигрывают от upgraded pan/filter решения.**
      В сервисной практике ранняя однослойная фильтрация считается слабее позднего решения. Поэтому на старых коробках с грязным маслом и большим пробегом мастеру логично хотя бы обсудить upgrade-path с клиентом.
    faq:
      - question: "Меняется ли фильтр на Mercedes 722.9 при обычном ТО?"
        answer: "Да. У 722.9 нижний поддон, поэтому фильтр сервисный и при нормальном обслуживании меняется."
        url: "https://www.europaparts.com/automatic-transmission-filter-kit-2202700098.html"
      - question: "Почему по 722.9 нельзя дать один OEM фильтра на все машины?"
        answer: "Потому что у ранней 722.9 и у поздней A89 / Plus разные сервисные комплекты. По открытым OEM-источникам безопасно ориентироваться минимум на два варианта: 220 270 00 98 для ранней версии и 222 277 20 00 для поздней."
        url: "https://www.europaparts.com/automatic-transmission-filter-kit-722-9-late-2222772000.html"
      - question: "Что важнее всего проверить до заказа расходников?"
        answer: "VIN, дату выпуска коробки и цвет overflow tube. Именно это определяет, какой filter kit, какой standpipe и какая ATF нужны именно этой 722.9."
        url: "https://mbworld.org/forums/e-class-w212/890514-722-9-7g-tronic-7-speed-green-vs-white-tube-pipe.html"
      - question: "Когда мастеру стоит заранее обсуждать с клиентом valve body / conductor plate?"
        answer: "Если уже есть limp mode, flare, ошибки по датчикам скорости, зависание в одной передаче или резкие толчки до сервиса. Для 722.9 это типичная предыстория, и одной заменой ATF она не лечится."
        url: "https://mbworld.org/forums/e-class-w211/813418-722-9-transmission-fault-second-time-valve-body-conductor-plate-control-unit.html"
    procedure_id: "MERCEDES_722.9"
