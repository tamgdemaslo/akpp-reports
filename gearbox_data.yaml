      - фильтр 96022597 / SG1042
      - прокладка поддона (20 или 22 отверстия)
      - медное кольцо М18 (если меняется пробка)
    pan_bolts: 20 / 22 × M6 × 20 мм, класс 8.8
    drain_torque: 20 Н·м (Check/Fill M18×1,5)
    fill_torque: 10 – 11 Н·м (болты поддона)
    procedure: |
      1. Прогрейте АКПП до 30 – 50 °C в спокойной езде; поставьте авто горизонтально, селектор «P», ручник, снимите защиту.
      2. Слейте ATF: открутите пробку HEX 10 мм (≈0,5 л), далее 20/22 болта поддона – выйдут ещё 4–4,5 л.
      3. Очистите поддон и два магнита «до белой тряпки».
      4. Снимите старый фильтр — не забудьте вынуть старое резиновое кольцо из насоса; установите новый, смазав уплотнение.
      5. Поставьте новую прокладку без герметика; болты крест-накрест 10–11 Н·м.
      6. Новое кольцо на пробку; закрутите её 20 Н·м.
      7. Через отверстие Check/Fill залейте ровно слитый объём Dexron VI (≈4,8 л).
      8. Запустите двигатель; прижатый тормоз, переведите рычаг P-R-N-D-3-2-1-N-R-P (задержка 3 с) – выгнать воздух.
      9. При 30–50 °C выверните пробку: струйка → капли = уровень верный. При отсутствии слива доливайте по 0,2 л.
      10. Пробка 20 Н·м, очистка корпуса, тест-драйв 15 км; t ATF < 90 °C, ошибок нет.
    mistakes:
      - Проверка уровня при >50 °C даёт недолив 0,5 л.
      - Перелив → вспенивание, падение давления, быстрый износ ТКК.
      - Смешение Dex-III и Dex-VI без промывки – риск окрашивания фрикционов.
      - Перетяжка болтов >12 Н·м деформирует стальной поддон.
    nuances:
      - У коробок до 2003 г. поддон на 20 болтов, позже – 22; считайте перед заказом.
      - Dexron VI официально разрешён GM Service Bulletin от 2019 года, полностью совместим с ETL-7045E.
      - Антифриз в ATF (течь теплообменника) = обязательная разборка и промывка.
