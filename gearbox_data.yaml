      oem_bolt_2_info: "Позиции по переливной трубке/доп. пробкам подтверждать по VIN конкретной MCT-ревизии."
    procedure: |
      1. Подтвердите, что это именно AMG MCT-7 (а не обычная 722.9) по VIN/Xentry.
      2. Прогрейте коробку, установите авто строго горизонтально, подключите диагностику для контроля температуры.
      3. Снимите защиту, очистите зону поддона и пробок.
      4. Слейте ATF через сливную пробку в мерную тару.
      5. Снимите поддон, очистите магниты и оцените количество шлама.
      6. Замените фильтр, прокладку и крепёж поддона (новые болты).
      7. Установите пробку/шайбу, соберите поддон с моментом и доворотом по регламенту.
      8. Залейте свежую ATF MB 236.15 через нижний сервисный порт.
      9. На работающем двигателе пройдите селектор по всем режимам, затем выставьте уровень при 35-45 °C.
      10. Выполните тест-драйв, повторно проверьте уровень и герметичность.
      11. Для максимально чистого обновления на пробежных коробках допустим двухэтапный drain&fill.
    mistakes:
      - Путать MCT-7 с обычной 722.9 и брать расходники без VIN-проверки.
      - Заливать жидкость не MB 236.15.
      - Выставлять уровень без контроля температуры.
      - Повторно использовать алюминиевые болты поддона.
      - Игнорировать диагностику после сервиса при наличии пинков/ошибок.
    nuances: "Главный конструктивный нюанс MCT-7: вместо гидротрансформатора стоит мокрое стартовое сцепление, поэтому поведение и требования к жидкости более «спортивные». На практике MCT-7 обслуживается как поздняя ветка семейства 722.9 с ATF 236.15, но по OEM есть ревизионные отличия — фильтр/прокладка/пробки нужно подтверждать по VIN. На активно эксплуатируемых AMG лучше сокращать интервал и использовать мягкий двухэтапный drain&fill."
    description: |
      AMG-SpeedShift-MCT-7 — фирменная 7-ступенчатая трансмиссия Mercedes-AMG, созданная на базе 722.9, но с заменой гидротрансформатора на мокрое многодисковое стартовое сцепление. Такая схема даёт более быстрый отклик при переключениях и спортивный характер работы.
      
      Для сервиса это означает повышенную чувствительность к состоянию масла, температуре и точности уровня. Типовой подход: замена ATF и фильтра с контролем температуры через диагностику, затем корректная финальная выставка уровня. На машинах с жёсткой эксплуатацией регламент лучше делать чаще стандартного.
      
      По расходникам MCT-7 близка к поздним версиям 722.9, но без VIN нельзя гарантировать 100% совпадение каждой позиции, поэтому карточка фиксирует базовые OEM с обязательной VIN-проверкой.
    weak_points: |
      1. Перегрев и старение ATF.
      При активной езде быстро ухудшается качество жидкости, что влияет на переключения и ресурс сцепления.
      
      2. Загрязнение гидроблока/соленоидов.
      Редкий сервис ведёт к пинкам, задержкам и ошибкам по давлению.
      
      3. Износ стартового многодискового сцепления.
      При частых резких стартах и треке ускоряется износ пакета.
      
      4. Подтёки по уплотнениям и разъёму.
      Типовые проблемы семейства 722.9 сохраняются и для MCT-ветки.
    faq:
      - {"question":"Какое масло нужно для AMG MCT-7?","answer":"Для большинства MCT-7 (после 2010) используется MB 236.15. Перед сервисом лучше подтвердить допуск по VIN.","url":"https://forums.mbclub.co.uk/threads/atf-for-mct-gearbox.250305/"}
      - {"question":"Сколько масла сливается при сервисе MCT-7?","answer":"Обычно 5-7 л при стандартном обслуживании; полный объём зависит от ревизии и находится примерно в диапазоне 7,1-7,8 л.","url":"https://forums.mbclub.co.uk/threads/mct-fluid-quantity.284892/"}
      - {"question":"Есть ли гидротрансформатор у MCT-7?","answer":"Нет. В MCT-7 применяется мокрое стартовое сцепление вместо гидротрансформатора.","url":"https://www.autoevolution.com/news/mercedes-amg-s-mct-transmission-explained-in-layman-s-terms-112461.html"}
      - {"question":"Можно ли использовать расходники от обычной 722.9?","answer":"Часть позиций совпадает, но применять без VIN-проверки рискованно: у AMG MCT есть ревизионные отличия.","url":"https://mbworld.org/forums/w212-amg/718416-722-9-mct-transmission-oil-change-fluid-amount.html"}
      - {"question":"Нужен ли двухэтапный drain&fill?","answer":"Для пробежных коробок это часто лучший мягкий способ обновить масло без агрессивной промывки.","url":"https://mbworld.org/forums/c218/922406-7g-speedshift-mct-atf-flush-just-normal-oil-change.html"}
      - {"question":"Какой основной риск после сервиса?","answer":"Неверный уровень из-за контроля не в том температурном окне. Это сразу отражается на качестве переключений.","url":"https://mbworld.org/forums/c63-amg-w204/570101-mct-transmission-service-fluid-filter-question.html"}
