      3. Проверьте откручиваемость болта щупа (10 мм); прикипевший болт освободите заранее.  
      4. Подставьте мерный таз, выкрутите сливную пробку FS50-21-249 (8 мм), дождитесь капель.  
      5. Зафиксируйте объём слитого ATF (≈ 3,3 л). Установите новую шайбу 9956-41-400 и затяните пробку 35 Н·м.  
      6. Снимите болт щупа и извлеките щуп; через отверстие воронкой или насосом залейте объём слитого + 0,2 л. Установите щуп и вручную затяните болт.  
      7. Запустите двигатель, удерживая тормоз; последовательно переведите селектор P → R → N → D → M → D → N → R → P (2–3 с в каждом положении).  
      8. Дождитесь TFT 45 – 55 °C. Заглушите мотор, выньте щуп, протрите, вставьте щуп и оцените уровень между метками L и F.  
        - Если ниже L — доливайте по 0,1 л и повторяйте проверку.  
        - Если выше F — аккуратно слейте лишнее через щуп с тонким шлангом.  
        - Попав в диапазон, вставьте щуп и затяните болт 9 Н·м (середина допуска).  
      9. Протрите картер, установите защиту и опустите авто.  
      10. Тест-драйв: 10 км с разгонами 60 – 80 км/ч до TFT ≈ 80 °C; проверьте отсутствие подтёков и сохранение уровня.
    mistakes:
      - Проверка уровня < 45 °C → недолив (открыта термошторка)  
      - Проверка уровня > 55 °C → перелив (тепловое расширение)  
      - Недолив/перелив → вспенивание, падение давления, проскальзывание фрикционов  
      - Перетяжка пробок > 41 Н·м → повреждение резьбы
    nuances:
      - Фильтр встроен и меняется только при разборке гидроблока  
      - Уровень регулируется только при TFT 45 – 55 °C (оптимум 50 °C)  
      - Ранние модели контролируют уровень щупом, поздние — боковой пробкой
    price_block: |
      Цены уточняются по региону и дилеру
    docs: |
      • Mazda WSM FW6A-EL  
