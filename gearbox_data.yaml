gearboxes:
  MERCEDES_725.0:
    manufacturer: "Mercedes"
    gearbox: "725.0"
    summary: |
      Mercedes 725.0 (9G‑Tronic) обслуживают не по схеме «масло и отдельный фильтр», а через замену поддона в сборе с двумя встроенными фильтрами. Практически важны три вещи: подбор расходников по VIN, правильный допуск ATF именно для вашей сервисной карты и точная процедура выставления уровня по температуре.
    fluid: "ATF по сервисной карте Mercedes для 725.0"
    drain_volume: 6
    fluid_type: "ATF для 9G‑Tronic"
    fluid_spec: |
      По ранним учебным материалам по 725.0 встречается Shell ATF D97 / MB 236.16. В более поздней сервисной практике и в актуальных комплектах для 9G‑Tronic чаще фигурирует MB 236.17. Допуск и каталожный номер жидкости для обычного ТО обязательно сверять по VIN и сервисной карте конкретной машины.
    fill_range_celsius: "ориентир 35–45; точное окно проверки уровня сверять по WIS/Xentry"
    work_temp_celsius: "для обслуживания важна температура проверки уровня, а не условная «рабочая» температура"
    pan_torque_nm: 0
    drain_torque_nm: 0
    fill_torque_nm: 0
    dry_capacity: "около 9–10,5 л; зависит от модификации и объёма фактического слива"
    service_interval: "В ранних материалах Mercedes по 725.0 фигурирует 125 000 км / 5 лет. В тяжёлых режимах профильные сервисы обычно не тянут до верхней границы."
    tools:
      - "эстакада или подъёмник с надёжной фиксацией автомобиля"
      - "набор торцовых ключей для поддона и сливной пробки"
      - "динамометрический ключ"
      - "диагностический сканер с чтением температуры масла в АКПП"
      - "насос для заправки ATF"
      - "заправочная пробка 725 589 00 90 00 и трубка 725 589 00 09 00 либо их корректный аналог"
      - "мерная тара для контроля объёма слива"
      - "ёмкость не менее 10 л для отработанного масла"
      - "чистая ветошь без ворса"
    parts_list:
      - "ATF по сервисной карте конкретной машины; обычно берут 8–10 л с запасом"
      - "поддон АКПП в сборе со встроенными фильтрами"
      - "уплотнение сливной пробки, если оно предусмотрено отдельно"
      - "при наличии в сервисной карте — фильтр давления на переднем интегральном кронштейне"
    oem_json:
      oem_fluid_1: ""
      oem_fluid_1_price: 0
      oem_fluid_2: ""
      oem_fluid_2_price: 0
      oem_filter_internal: "A 725 270 37 07"
      oem_filter_internal_price: 0
      oem_filter_internal_info: "Самый часто встречающийся номер поддона 9G‑Tronic в открытой практике. Для 725.0 есть замены и различия по модификациям, поэтому финальный номер поддона обязательно проверять по VIN."
      oem_filter_external: ""
      oem_filter_external_price: 0
      oem_filter_external_info: "По части сервисных карт Mercedes дополнительно указывается фильтр давления на переднем интегральном кронштейне. Без VIN и сервисной карты единый номер безопасно не фиксировать."
      oem_gasket_1: ""
      oem_gasket_1_price: 0
      oem_gasket_1_info: "Если уплотнение сливной пробки идёт отдельно, подбирать его по VIN и ставить новым."
      oem_gasket_2: ""
      oem_gasket_2_price: 0
      oem_gasket_2_info: ""
      oem_o_ring_1: ""
      oem_o_ring_1_price: 0
