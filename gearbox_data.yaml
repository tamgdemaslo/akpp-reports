    procedure: |
      1. Сначала определите ревизию коробки. Для 722.9 это критично: ранняя original version обычно работает на MB 236.14, а поздняя 7G-Tronic Plus / код A89 - на MB 236.15.
      2. Если коробка A89, ориентиром в каталогах служат поздний фильтр 222 277 20 00, поддон 222 270 05 12 и зелёная переливная трубка 222 271 00 97. Для не-A89 обычно идут ранний фильтр 221 277 02 00 и трубка 251 271 00 97.
      3. Поставьте автомобиль строго в горизонталь, снимите защиты и прогрейте коробку до сервисного окна для проверки уровня.
      4. Слейте масло из поддона, снимите поддон, очистите магниты и оцените количество шлама.
      5. Замените фильтр и прокладку по своей ревизии. На 722.9 нельзя заказывать комплект вслепую только по названию коробки без проверки A89/не-A89.
      6. Поставьте 6 новых алюминиевых болтов 004 990 35 12 и затяните поддон по схеме 4 Н·м + доворот 180 градусов.
      7. Одновременно осмотрите адаптер-разъём платы 203 540 02 53. Если есть даже лёгкое запотевание, его лучше менять сразу, пока поддон снят.
      8. Если на конкретной машине есть слив из гидротрансформатора, проверните двигатель до появления пробки в смотровом окне и слейте ГТД. Наличие этой пробки у 722.9 зависит от ревизии, поэтому заранее не обещайте полный слив без осмотра.
      9. Новое масло в 722.9 подаётся снизу через сервисное отверстие/заливной адаптер, а не "сверху как удобно".
      10. После первичной заливки запустите двигатель, пройдите селектором все диапазоны и выставьте уровень на работающем моторе при 35-45 °C.
      11. При обычном сервисе без ГТД ориентируйтесь примерно на 5-6 литров свежей ATF; при сливе ГТД и более полном обновлении готовьте около 8-9 литров.
      12. Выполните тест-драйв и обязательно перепроверьте герметичность поддона, адаптер-разъёма и задней части коробки.
    mistakes:
      - "Смешивать MB 236.14 и MB 236.15 или заказывать масло без проверки A89."
      - "Покупать фильтр и трубку на 722.9 вслепую, не разделяя early и A89/Plus."
      - "Оставлять старый адаптер-разъём 203 540 02 53 на коробке с признаками течи."
      - "Повторно использовать алюминиевые болты поддона 004 990 35 12."
      - "Обещать полный слив через ГТД на любой 722.9 без фактической проверки наличия пробки."
    nuances: |
      Главный нюанс 722.9 - это не одна коробка в одном сервис-ките, а семейство с разными расходниками по ревизии.
      Для ранней 722.9 original version безопасная база - ATF MB 236.14, фильтр 221 277 02 00, ранняя переливная трубка 251 271 00 97. Для A89/Plus - MB 236.15, фильтр 222 277 20 00 и поздняя трубка 222 271 00 97.
      В каталогах поздняя синяя 236.15 часто уже ведёт к новому заменяющему OEM 000 989 69 05 11 AULW; старый номер 001 989 78 03 09 полезно знать как кросс.
      По сливу из гидротрансформатора у 722.9 нет универсального правила: на одних ревизиях слив есть, на других его нет. Поэтому в карточке это отражено как проверяемая по месту операция, а не как обязательный шаг для всех машин.
      Для 4Matic обязательно внимательно смотреть заднюю часть коробки/узел трансфера: поздние течи сзади на этих трансмиссиях не редкость.
    description: |
      **Mercedes 722.9 / 7G-Tronic** - это 7-ступенчатый продольный гидроавтомат семейства NAG2, который Mercedes ставил очень широко: от C- и E-класса до ML/GL, S-class и части AMG. На практике для сервиса он важен не только как массовая коробка, но и как коробка с заметной внутренней эволюцией по расходникам и ATF.

      Именно поэтому `722.9` нельзя описывать одной строкой вида "фильтр такой-то, масло такое-то". У этой коробки есть как минимум две сервисно важные ветки: ранняя `7G-Tronic` без кода `A89` и более поздняя `7G-Tronic Plus / A89`. У них различаются фильтры, переливные трубки и спецификация масла.

      Для ранней версии в открытых каталогах уверенно подтверждаются `MB 236.14`, фильтр `221 277 02 00`, прокладка `220 271 01 80` и ранняя переливная трубка `251 271 00 97`. Для поздней `A89/Plus` подтверждаются `MB 236.15`, фильтр `222 277 20 00`, прокладка `220 271 03 80` и поздняя трубка `222 271 00 97`.

      Отдельный практический плюс `722.9` - на части ревизий можно сделать более полный слив через гидротрансформатор. Но это нельзя обещать по умолчанию: наличие пробки ГТД нужно проверять на конкретной машине, а не в теории по названию коробки.
    weak_points: |
      **1. Плата/датчики скорости и мехатроник.** Для `722.9` это одна из самых известных проблем. Когда плата или интегрированные датчики начинают умирать, коробка уходит в аварийный режим, пинается, зависает на передачах или вообще теряет нормальное включение.

      **2. Течь через адаптер-разъём 203 540 02 53.** Это типичная и очень неприятная мелочь: масло идёт по разъёму, дальше может дойти до проводки и блока, а владелец долго ищет "странные" электрические симптомы. Для сервиса это обязательная точка осмотра.

      **3. Гидроблок и соленоиды страдают от грязной ATF.** Если затягивать с заменой масла или путать спецификации, гидроплита и соленоиды быстро отвечают толчками, жёсткими переключениями и ошибками по давлению.

      **4. Ранние коробки известны проблемами по гидротрансформатору и внутреннему железу.** В профильных материалах регулярно всплывают жалобы на ранние ревизии: износ ГТД, проблемы K1 и другие внутренние дефекты, которые одно ТО уже не лечит.
    faq:
      - question: "Как понять, какое масло нужно именно моей 722.9?"
        answer: "Главный ориентир - есть ли у машины код A89 и поздняя ревизия Plus. Для ранней 722.9 используют MB 236.14, а для A89/Plus - MB 236.15. Смешивать эти жидкости нельзя."
        url: "https://www.fcpeuro.com/blog/mercedes-benz-722.9-transmission-service-modifications"
      - question: "Какие базовые OEM по фильтру и прокладке брать для ранней 722.9?"
        answer: "Для ранней original version удобная база такая: фильтр 221 277 02 00 и прокладка 220 271 01 80. В кроссах по фильтру часто всплывают 221 277 01 95 и 221 277 00 95."
        url: "https://www.autohausaz.com/pn/2212770195"
      - question: "Что брать на позднюю 722.9 A89 / Plus?"
        answer: "Для A89/Plus нужен поздний фильтр 222 277 20 00, прокладка 220 271 03 80 и поздняя переливная трубка 222 271 00 97. В кроссах фильтра встречаются 221 277 01 00 и 222 277 28 00."
        url: "https://www.autohausaz.com/pn/2222772000"
      - question: "Нужно ли менять болты поддона на 722.9?"
        answer: "Да, это не та коробка, где стоит экономить на крепеже. Поддон держится на 6 алюминиевых болтах 004 990 35 12, и их лучше закладывать новыми на каждое снятие."
        url: "https://www.autohausaz.com/pn/0049903512"
      - question: "Есть ли у 722.9 слив из гидротрансформатора?"
        answer: "На части ревизий - да, на части - нет. Если слив есть, в расходниках обычно фигурирует пробка ГТД 001 990 11 17, но саму операцию нужно подтверждать по факту на конкретной коробке."
        url: "https://www.fcpeuro.com/products/mercedes-automatic-transmission-torque-converter-drain-plug-m8-genuine-mercedes-0019901117"
      - question: "Какой ещё расходник кроме фильтра часто забывают, а зря?"
        answer: "Адаптер-разъём платы 203 540 02 53. Это типовая точка течи на 722.9, и если его не проверить при сервисе, потом можно получить масло в разъёме и странные электрические жалобы."
        url: "https://www.autohausaz.com/pn/2035400053"
