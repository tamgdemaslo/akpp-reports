    description: |
      **VAG 01P** — это 4-ступенчатая АКПП семейства AG4/098, известная прежде всего по Eurovan / Transporter T4 с бензиновыми V6-применениями.

      Для мастера по замене масла важна не только сама коробка, а её реальная эксплуатация: тяжёлый автомобиль, высокая тепловая нагрузка и очень чувствительная реакция на состояние ATF. Сервисная логика здесь понятная: **нижний поддон, фильтр сервисный и меняется на обычном ТО, а уровень выставляется только по температуре и переливу**.

      По практическим обсуждениям владельцев Eurovan главные проблемы после сервиса обычно связаны не с самой заменой фильтра, а с тепловой историей коробки, неправильным уровнем или тем, что клиент уже приехал с уставшим valve body/TCC, а от обычной замены масла ждал «ремонта коробки».

      Для сайта и заказа безопаснее держаться подтверждённого OEM-набора из каталога Eurovan: фильтр `01M 325 429`, gasket фильтра `01M 325 443`, прокладка поддона `098 321 370`, ATF `G 052 162 A2`.
    weak_points: |
