      Ford owner/service references for 10-speed automatic transmission fluid check: Mercon ULV, hot check 96–101 °C
      FordPartsGiant: HL3Z-7A098-A supersedes L1MZ-7A098-A
      FordPartsGiant: HL3Z-7A191-A supersedes to HL3Z-7A191-B
