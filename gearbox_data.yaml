      oem_bolt_2: ""
      oem_bolt_2_price: 0
      oem_bolt_2_info: ""
    procedure: |
      1. Подтвердите, что коробка именно 8G-DCT (724.1), а не 7G-DCT (724.0), по VIN/Xentry.
      2. Прогрейте трансмиссию поездкой, установите авто строго горизонтально и подключите диагностику с чтением температуры DCT.
      3. Снимите защиту и очистите зону пробок/корпуса перед вскрытием.
      4. Слейте отработанную жидкость через сервисную пробку в мерную тару.
      5. Выполните замену сервисных фильтров 724.1 и уплотнений из комплекта по VIN.
      6. Установите новые уплотнения пробок/переливной системы.
      7. Залейте свежую DCT-жидкость MB 236.22 через сервисный порт.
      8. Запустите двигатель, последовательно переведите селектор по режимам с короткой задержкой в каждом.
      9. При рабочем окне температуры (обычно 35-45 °C) выставьте уровень по сервисной процедуре перелива.
      10. Выполните адаптацию/инициализацию (если предписано диагностикой) и тест-драйв.
      11. Проверьте отсутствие течей, повторно проконтролируйте уровень и температуру.
    mistakes:
      - Путать 724.1 (8G-DCT) с 724.0 (7G-DCT) и применять неправильный сервисный набор.
      - Использовать жидкость без допуска MB 236.22.
      - Выставлять уровень без контроля температуры DCT.
      - Игнорировать замену фильтров при обновлении жидкости.
      - Не выполнять диагностическую адаптацию после вмешательства, когда она требуется.
    nuances: "8G-DCT имеет несколько фильтрующих элементов и сервисных позиций, которые отличаются по ревизиям 724.1xx. Поэтому единый «универсальный» набор без VIN часто приводит к ошибочному подбору деталей. В дилерских и независимых сервисах встречается разночтение по регламенту, но практический безопасный ориентир — 60 000 км для масла и фильтра. Для ресурса мехатроника и мокрых сцеплений критичны точный допуск MB 236.22, чистота обслуживания и корректный уровень при контролируемой температуре."
    description: |
      Mercedes 8G-DCT (внутренний индекс 724.1) — 8-ступенчатая преселективная роботизированная коробка с двумя мокрыми сцеплениями, применяемая на моделях MFA2 (A/CLA/GLA/GLB/B-class с 2019 года). Коробка рассчитана на современные требования по экономичности и динамике, но чувствительна к качеству обслуживания.
      
      Ключевая особенность сервиса — корректный подбор деталей по VIN: у 724.1 есть разные ревизии и отличия по сервисным элементам. Масло используется только с допуском MB 236.22, полный объём около 8 литров, а типовой интервал обслуживания масла и фильтра — 60 000 км.
      
      При соблюдении допусков, температуры и процедуры выставления уровня 8G-DCT работает стабильно; при ошибках в подборе расходников и жидкости быстро появляются жалобы на переключения и работу мехатроника.
    weak_points: |
      1. Чувствительность к загрязнению жидкости.
      Продукты износа быстро влияют на мехатроник и качество переключений при затянутом интервале.
      
      2. Износ мокрых сцеплений при тяжёлом режиме.
      Частые пробки, активные старты и перегрев ускоряют износ фрикционов.
      
      3. Зависимость от калибровок ПО.
      Для 724.1 выпускались обновления прошивок; часть жалоб по рывкам решается программно.
      
      4. Ошибки из-за некорректного уровня.
      Неправильная температура и метод выставления уровня дают толчки, задержки включения и аварийные режимы.
    faq:
      - {"question":"Какой индекс у 8G-DCT у Mercedes?","answer":"8G-DCT имеет внутренний индекс 724.1. Это важно, чтобы не перепутать с 7G-DCT (724.0) при подборе расходников.","url":"https://gearboxlist.com/mercedes/8g-dct-724-1/"}
      - {"question":"Какое масло использовать в 8G-DCT?","answer":"Только жидкость с допуском MB 236.22. Другие допуски применять нельзя.","url":"https://gearboxlist.com/mercedes/8g-dct-724-1/"}
      - {"question":"Какой объём масла у 724.1?","answer":"Полная заправка около 8,0 л. При сервисной замене фактический объём зависит от метода и объёма слива.","url":"https://willandservicecentre.co.uk/mercedes-8g-dct-oil-change/"}
      - {"question":"Через сколько менять масло и фильтр в 8G-DCT?","answer":"Практический ориентир — 60 000 км для масла и фильтров, особенно для городской эксплуатации.","url":"https://gearboxlist.com/mercedes/8g-dct-724-1/"}
      - {"question":"Почему важен VIN для OEM по 8G-DCT?","answer":"У 724.1 есть разные ревизии и составы сервисного комплекта. Без VIN высок риск ошибочного подбора фильтров и уплотнений.","url":"https://mercedesgenuineparts.co.uk/products/genuine-mercedes-benz-724-1-automatic-gearbox-service-kit"}
      - {"question":"Нужна ли адаптация после сервиса?","answer":"После вмешательства в гидравлику/фильтры адаптация может потребоваться по диагностике. Ориентируйтесь на процедуры Xentry.","url":"https://willandservicecentre.co.uk/mercedes-8g-dct-oil-change/"}
    procedure_id: "MERCEDES_8GDCT"
