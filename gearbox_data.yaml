      oem_bolt_2_price: 0
      oem_bolt_2_info: ""
    procedure: |
      1. Идентифицируйте коробку: A350E и конкретный автомобиль (Lexus/Toyota), обязательно проверьте VIN и тип поддона.
      2. Прогрейте АКПП до рабочей температуры короткой поездкой.
      3. На подъемнике (строго горизонтально) открутите слив и слейте ATF, замерьте объем.
      4. Снимите поддон, очистите магниты и поддон от шлама, промойте безворсовой салфеткой.
      5. Замените фильтр-стрейнер (обычно 35330-30040) и прокладку поддона (обычно 35168-32010/35168-30010 по ревизии).
      6. Установите поддон, затяжку выполняйте крест-накрест моментом из мануала для вашего VIN.
      7. Залейте стартовый объем свежего T-IV примерно равный слитому.
      8. Запустите двигатель, удерживая тормоз, последовательно переведите селектор через все положения с паузой 2-3 секунды.
      9. Проверьте уровень: на версиях со щупом — по щупу в температурном окне; на версиях с переливом — по контрольной пробке в температурном окне по мануалу.
      10. Сделайте тест-драйв, проверьте отсутствие течей и финально скорректируйте уровень.
    mistakes:
      - Заливать Toyota WS вместо Type T-IV (JWS 3309).
      - Заказывать фильтр/прокладку только по коду A350E без проверки VIN и формы поддона.
      - Проверять уровень на холодной коробке.
      - Перетягивать болты поддона и деформировать плоскость.
      - Не чистить магниты и оставлять шлам в поддоне.
    nuances: "A350E относится к семейству Aisin A3x0, поэтому часть расходников кроссится с A340/A341, но номера деталей могут отличаться по рынку, году и VIN. Главный риск при сервисе — путаница с жидкостью: этой коробке нужен именно Type T-IV (JWS 3309). По конструкции на многих авто уровень контролируется щупом, но встречаются ревизии с контрольной пробкой/переливом; процедуру уровня нужно сверять с мануалом под конкретный VIN."
    description: "TOYOTA A350E — 5-ступенчатая гидромеханическая АКПП продольной компоновки для задне- и полноприводных Lexus/Toyota. Конструктивно близка к семейству A340/A341 и требует аккуратного выбора расходников по VIN. Для сервиса критично использовать ATF Type T-IV (JWS 3309), менять фильтр-стрейнер и прокладку поддона, а уровень выставлять строго в температурном окне."
    weak_points: |
      1. Износ гидроблока и соленоидов.
      На старых пробегах появляются задержки и толчки, особенно при грязной ATF и редком сервисе.

      2. Загрязнение поддона и фильтра.
      При длинных интервалах быстро растет количество шлама на магнитах, падает качество переключений.

      3. Износ блокировки ГДТ.
      Типичный сценарий для коробок семейства A3x0 при перегреве и работе на старой жидкости.

      4. Течи по поддону и уплотнениям.
      Часто связаны с повторным использованием старой прокладки/шайб и перетяжкой болтов.

      5. Ошибки после некорректной выставки уровня.
      Недолив или перелив сразу отражается на качестве переключений и температуре.
    faq:
