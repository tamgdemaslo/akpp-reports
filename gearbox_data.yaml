    procedure: |
      1. Подтвердите по VIN/наклейке, что установлена AL951 (0BL), и подготовьте ATF G 060 162 A2, поддон-фильтр и крепеж по каталогу.
      2. Прогрейте коробку короткой поездкой, затем установите авто строго горизонтально на подъемнике.
      3. При заглушенном двигателе открутите сливную пробку поддона и слейте масло в тару не менее 12 л. Зафиксируйте объем слива.
      4. Демонтируйте поддон с интегрированным фильтром, очистите прилегающую плоскость корпуса и магниты от шлама.
      5. Установите новый поддон-фильтр с новым крепежом. Болты тяните крест-накрест моментом около 10 Н·м (уточнить по мануалу ревизии).
      6. Через заливную/контрольную пробку подайте свежую ATF до появления вытекающей струйки.
      7. Запустите двигатель, удерживая тормоз, переведите селектор по всем положениям P-R-N-D и обратно с паузами 2–3 секунды.
      8. Контролируйте температуру ATF сканером. В диапазоне 30–50 °C откройте контрольное отверстие: при правильном уровне идет тонкая струйка, затем капли.
      9. Если не течет — долейте. Если течет сильно — дождитесь перехода в капли. После этого затяните пробки штатным моментом.
      10. Сотрите ошибки, выполните тест-драйв 10–15 км и повторно проверьте герметичность поддона и патрубков охлаждения.
    mistakes:
      - Заливка ATF без допуска G 060 162 A2 / Lifeguard 8.
      - Проверка уровня без контроля температуры ATF.
      - Повторное использование старых болтов поддона.
      - Перетяжка пластикового поддона и деформация фланца.
      - Игнорирование шлама на магнитах и продуктов износа ГДТ.
    nuances: "AL951 (0BL) конструктивно относится к семейству ZF 8HP90A и работает с очень высоким моментом. Главный сервисный нюанс: фильтр интегрирован в поддон, отдельно штатно не меняется. На мощных моторах при агрессивной езде быстрее изнашивается блокировка ГДТ, загрязняется гидроблок, появляются рывки и вибрации. Для 0BL по комплектам поддона и крепежу возможны отличия, поэтому подбор строго по VIN обязателен."
    description: "VAG AL951 (0BL) — 8-ступенчатый гидроавтомат для мощных Audi и Bentley, разновидность ZF 8HP90A. Коробка рассчитана на момент до 1000 Н·м и при нормальном обслуживании имеет ресурс около 300 тыс. км. Для ресурса критичны регулярная замена ATF G 060 162 A2, корректная выставка уровня по температуре и замена поддона с интегрированным фильтром."
    weak_points: |
      1. Износ фрикциона блокировки ГДТ при активной езде -> вибрации и пыль в масле.
      2. Продукты износа ГДТ забивают соленоиды гидроблока -> толчки и задержки переключений.
      3. От вибраций ускоряется износ подшипника маслонасоса.
      4. Резкие старты сокращают ресурс алюминиевых деталей механической части.
      5. Перегревы старят пластиковые и резиновые элементы, появляются течи.
