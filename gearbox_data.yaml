      oem_o_ring_2: ""
      oem_o_ring_2_price: 0
      oem_o_ring_2_info: ""
      oem_drain_plug: ""
      oem_drain_plug_price: 0
      oem_drain_plug_info: "Номер сливной пробки лучше не фиксировать без VIN: он зависит от ревизии поддона и комплекта."
      oem_drain_plug_washer: ""
      oem_drain_plug_washer_price: 0
      oem_drain_plug_washer_info: ""
