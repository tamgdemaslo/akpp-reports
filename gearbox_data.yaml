      5. Снимите фильтр и проверьте, что старое резиновое уплотнение не осталось в корпусе.
      6. При снятом поддоне внимательно осмотрите 13-pin connector sleeve на следы потливости и при малейших сомнениях меняйте её профилактически.
      7. На большом пробеге и при повторных жалобах отдельно обсуждайте conductor plate: если она выйдет из строя вскоре после сервиса, придётся снова вскрывать коробку.
      8. Установите новый фильтр, новую прокладку и соберите поддон с малым моментом затяжки.
      9. Залейте базовый объём ATF, пройдите селектором все диапазоны и доведите температуру коробки до режима контроля уровня.
