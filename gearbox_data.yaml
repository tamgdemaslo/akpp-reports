    procedure: |
      1. Подтвердите по VIN, что установлена именно DQ400e/0DD (гибридная DSG6) и выполните все предварительные процедуры по безопасности гибрида: отключение/блокировка высоковольтной системы согласно мануалу производителя.
      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту, обеспечьте доступ к сливной/контрольной пробке и зоне фильтра (часто с разбором кожухов подкапотного пространства).
      3. Подставьте ёмкость не менее 8–10 л и аккуратно выверните сливную/контрольную пробку DSG, дайте стечь основной порции DSG-жидкости (ориентировочно до 5 л).
      4. При необходимости снимите переливную трубку/вставку и дождитесь полного прекращения активного слива.
      5. Разберите область фильтра по инструкции 0DD (расположение и доступ могут отличаться по моделям): снимите крышку фильтра, аккуратно извлеките старый фильтр и уплотнения, убедитесь, что никакие старые кольца не остались в посадочных гнёздах.
      6. Оцените цвет и запах слитого масла, наличие стружки и шлама в поддоне/на магнитах и в районе фильтра — это важная диагностическая информация по состоянию DQ400e.
      7. Установите новый фильтр и новые уплотнительные кольца согласно схеме; соберите крышку/корпус фильтра с соблюдением моментов затяжки из мануала.
      8. Установите переливную трубку (если предусмотрена) и новую шайбу/уплотнение на сливную/контрольную пробку, завернув пробку от руки для последующей регулировки уровня.
      9. Через адаптер и насос залейте первую порцию DSG-жидкости G 052 182 A2 (ориентировочно до 5 л) через заливное/контрольное отверстие или штатную заливную точку согласно документации 0DD.
      10. Запустите двигатель (соблюдая все требования к запуску гибридной системы), удерживая педаль тормоза; несколько раз плавно переведите селектор по всем положениям, предусмотренным мануалом, с паузой 2–3 секунды в каждом.
      11. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C поднимите автомобиль, аккуратно выверните контрольную пробку и оцените поток из переливного отверстия.
      12. Если жидкость почти не вытекает, дозаливайте G 052 182 A2 малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      13. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите все снятые кожухи и защиту, восстановите высоковольтный контур по процедуре производителя и выполните дорожный тест с контролем работы гибридной трансмиссии и температур.
      14. При сильно загрязнённой жидкости и наличии жалоб до сервиса (рывки, ошибки по мехатронике, перегревы) целесообразно планировать более частые замены и/или углублённую диагностику DQ400e, так как одна замена масла не всегда устраняет накопленные проблемы.
    mistakes:
      - Относиться к DQ400e как к «обычной DSG» и использовать неподходящие ATF вместо специфической DSG-жидкости G 052 182 A2.
      - Игнорировать процедуры по безопасности при работе с гибридной высоковольтной системой.
      - Ограничиваться сливом части жидкости без замены фильтра и оценки загрязнения масла.
      - Выставлять уровень без контроля температуры и без процедуры через переливное/контрольное отверстие.
      - Подбирать фильтр и уплотнения по абстрактному коду DQ400e/0DD, а не по VIN и каталогу, с риском установить неподходящие детали.
    nuances: "DQ400e/0DD — сложная гибридная DSG6 с тремя мокрыми сцеплениями и интегрированной электрической машиной, рассчитанная на крутящий момент до 400 Н·м и ресурс порядка 300 тыс. км. В отличие от классических DSG (DQ250), здесь есть дополнительное размыкающее сцепление между ДВС и электромотором, отдельный контур охлаждения и специфическая DSG-жидкость G 052 182 A2. Обслуживание осложняется наличием высоковольтной части и неудобным доступом к фильтру на некоторых моделях, поэтому точное следование мануалу 0DD и соблюдение безопасности критичны."
    description: "VAG DQ400e (0DD) — 6-ступенчатая гибридная DSG с мокрыми сцеплениями, разработанная для поперечных гибридных силовых установок (Golf/Passat GTE, Audi A3 e-tron, Skoda Superb/Octavia iV, Seat Leon/Tarraco eHybrid и др.). Коробка включает три мокрых сцепления (два основных и одно размыкающее между ДВС и электромотором), собственный контур DSG-жидкости объёмом ~7,3 л и рассчитана на мощные гибридные связки до 400 Н·м. Регламент замены масла и фильтра — каждые 50 тыс. км; при этом грамотный сервис требует соблюдения гибридных процедур, правильного выставления уровня по температуре и подбора расходников строго по VIN."
    weak_points: |
      1. Чувствительность к качеству и уровню DSG-жидкости.
      DQ400e работает в сложном гибридном режиме и сильно зависит от чистоты и корректного уровня G 052 182 A2; нарушения приводят к ускоренному износу сцеплений и мехатроники.
      
      2. Перегревы и высокие тепловые нагрузки.
      Гибридные циклы (частые старты/остановки ДВС, работа электромотора) создают высокую нагрузку на масло и систему охлаждения; при загрязнении теплообменников растёт риск перегрева.
      
      3. Сложность доступа и ремонта.
      Из-за гибридной компоновки доступ к фильтру и узлам коробки сложен; ремонт и даже сервис требуют опыта и строгого следования мануалам, что ограничивает круг сервисов.
      
      4. Дороговизна компонентов.
      Мехатроника, пакет сцеплений и гибридные компоненты для DQ400e дороги; ошибки при обслуживании (не то масло, неверный уровень, нарушения HV-безопасности) быстро приводят к дорогостоящим последствиям.
      
      5. Ограниченность информации и опыта.
      По сравнению с обычными DSG, по DQ400e меньше практических отчётов; мастеру важно опираться на официальную документацию и проверенные источники, а не переносить «общие» подходы к DSG на гибридную трансмиссию.
