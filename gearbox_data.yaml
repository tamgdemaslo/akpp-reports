      - Игнорировать регламент по замене масла (50 тыс. км) на высоконагруженных спортивных авто, дожидаясь выраженных симптомов.
      - Ограничиваться частичным сливом без снятия поддона, промывки магнитов и замены фильтра.
      - Выставлять уровень DSG-жидкости без контроля температуры и без процедуры через переливную/контрольную пробку.
      - Подбирать фильтр и уплотнения только по коду DL800/0BZ без учёта VIN и конкретной ревизии коробки.
    nuances: "DL800/0BZ — высоконагруженная 7-ступенчатая DCT для Audi R8/Huracán с единым масляным контуром, в котором масло одновременно смазывает шестерни, дифференциал, гидросистему и мокрые сцепления. Это даёт высокую удельную нагрузку на жидкость и делает критичными её качество, уровень и регулярность замены. По Otoba и профильным сервисам основные проблемы связаны с перегревами, течами по болтам и последствиями редких замен: ускоренный износ сцеплений и подшипников, шумы и вибрации при переключениях."
    description: "VAG DL800 / 0BZ — 7-ступенчатая роботизированная коробка с двумя мокрыми сцеплениями для суперкаров Audi R8 и Lamborghini Huracán. Она использует один общий контур DSG-жидкости G 052 529 A2 объёмом порядка 11,8 л для трансмиссии, дифференциала и привода сцеплений/гидроблока. Регламентом предусмотрена замена масла и фильтра каждые 50 тыс. км, причём для трековой и активной езды разумно делать это чаще. По конструкции и нагрузкам DL800 не прощает нарушений регламента: грамотный сервис с правильной жидкостью, уровнем и чисткой поддона критичен для сохранения ресурса коробки."
    weak_points: |
      1. Перегрев и старение масла.
      Из-за высокой удельной нагрузки и одного масляного контура DL800 очень чувствительна к перегревам и редким заменам: деградировавшая DSG-жидкость быстро приводит к износу сцеплений и гидроблока.
      
      2. Течи по болтам и уплотнениям.
      По Otoba описаны случаи потения и течей по болтам корпуса и поддона; их игнорирование ведёт к падению уровня и масляному голоданию.
      
      3. Износ сцеплений при активной езде.
      Трековая эксплуатация и частые старты/торможения нагружают мокрые сцепления; без сокращённого интервала замены масла ресурс сцеплений заметно падает.
      
      4. Ограниченный опыт и высокая стоимость ремонта.
      DL800 ставится на штучные модели (R8/Huracán); мало профильных мастерских, а сцепления, мехатроника и шестерни дороги, поэтому ошибки в обслуживании особенно критичны.
      
      5. Чувствительность к уровню и процедуре.
      Недолив или перелив DSG-жидкости ухудшают смазку и охлаждение; уровень нужно выставлять только по процедуре и температуре, а не «на глаз».
    faq:
      - {"question":"Какое масло использовать в DL800 / 0BZ?","answer":"По Otoba для DL800 применяется DSG-жидкость VW G 052 529 A2; другие ATF или универсальные жидкости для обычных АКПП использовать нельзя.","url":"https://otoba.ru/transmissii/vag/dl800.html"}
      - {"question":"Сколько масла готовить на замену в DL800?","answer":"Полная заправка коробки около 11,8 л; при стандартной замене со снятием поддона и фильтра обычно обновляют 9,5–10 л. Практически разумно иметь 10–12 л G 052 529 A2.","url":"https://otoba.ru/transmissii/vag/dl800.html"}
      - {"question":"Через сколько километров менять масло в DL800?","answer":"Рекомендация по Otoba — каждые 50 000 км, а при активной эксплуатации спортивных моделей — не реже чем каждые 30–40 тыс. км.","url":"https://otoba.ru/transmissii/vag/dl800.html"}
      - {"question":"Меняется ли фильтр при обычном ТО на DL800?","answer":"Да. Фильтр и уплотнения по контуру масла меняются по регламенту вместе с жидкостью; конкретные коды подбираются по VIN, так как зависят от ревизии коробки.","url":"https://spb.t-one.ru/services/repair_dsg_7_dl800/srv-oil_replacement"}
      - {"question":"При какой температуре выставлять уровень масла в DL800?","answer":"Как и для других мокрых DSG, уровень выставляется через контрольное/переливное отверстие при температуре DSG-жидкости порядка 35–45 °C на работающем двигателе и горизонтальном автомобиле, ориентируясь на тонкую струйку/частые капли.","url":"https://vagway.by/rkpp/7-st/dl800/"}
    procedure_id: "VAG_DL800."
