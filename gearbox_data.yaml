    procedure: |
      1. Подтвердите по VIN, что установлена именно DL800/0BZ (Audi R8/Huracán) и подготовьте DSG-жидкость G 052 529 A2 и расходники, подобранные по каталогу под конкретный автомобиль.
      2. Установите машину на подъёмник строго горизонтально. Снимите защиту и элементы выхлопа/подрамника, если они закрывают доступ к поддону и сливным/заливным пробкам (по мануалу Audi R8/Huracán).
      3. Подставьте ёмкость не менее 15 л и аккуратно выверните сливную/контрольную пробку, дайте стечь основной порции DSG-жидкости. При наличии переливной трубки аккуратно выкрутите её и дождитесь полного прекращения активного слива (ориентировочно 9,5–10 л при стандартной замене).
      4. Снимите поддон коробки (если предусмотрен), промойте поддон и магниты очистителем до чистой салфетки, оцените количество шлама и стружки как индикатор состояния коробки.
      5. Разберите узел фильтра по мануалу DL800: снимите крышку, аккуратно извлеките фильтр и уплотнительные кольца, убедитесь, что старые кольца не остались в посадке.
      6. Установите новый фильтр с новыми уплотнительными кольцами, соберите крышку/корпус с соблюдением моментов затяжки из официальной документации.
      7. Установите новый поддон/прокладку (или нанесите рекомендованный герметик, если используется вариант без прокладки), затяните болты крест-накрест с моментами из мануала.
      8. Установите переливную трубку (если предусмотрена) и новую шайбу на сливную/контрольную пробку, заверните пробку от руки, оставив возможность для последующей регулировки уровня.
      9. Через адаптер и насос залейте расчётный объём DSG-жидкости G 052 529 A2 (ориентировочно 9,5–10 л) через заливное/контрольное отверстие или штатную заливную точку, следуя мануалу DL800.
      10. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям, предусмотренным производителем, с паузой 2–3 секунды в каждом, затем верните селектор в «P».
      11. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C при работающем двигателе и горизонтальном положении автомобиля аккуратно открутите контрольную/переливную пробку и оцените поток из отверстия.
      12. Если масло почти не вытекает, дозаливайте G 052 529 A2 малыми порциями и повторяйте проверку до получения тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишняя жидкость стечёт до капель.
      13. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите на место все снятые элементы выхлопа/подрамника и защиту, затем выполните дорожный тест с контролем работы коробки и температур.
      14. При наличии жалоб до сервиса (удары, пробуксовки, ошибки по мехатронике) по результатам осмотра поддона и фильтра оцените необходимость дополнительных работ (адаптаций, ремонта сцеплений/мехатроники), поскольку одна замена масла может не устранить накопленные дефекты.
    mistakes:
