      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту и обеспечьте доступ к сливной/контрольной пробке и крышке фильтра (горизонтально расположенной в верхней части коробки).
      3. Подставьте ёмкость не менее 10–12 л и аккуратно открутите сливную/контрольную пробку DSG, слейте основную порцию масла. При необходимости открутите дополнительную пробку/вставку, связанную с мехатроникой, чтобы слить максимум жидкости.
      4. Снимите крышку фильтра DSG (она расположена горизонтально; при снятии готовьте ветошь, так как выльется часть масла). Аккуратно извлеките фильтр 0GC 325 183 A и уплотнения.
      5. Осмотрите состояние масла (цвет, запах) и наличие стружки/шлама в сливе и на магнитах (если есть) как индикатор состояния коробки.
      6. Установите новый фильтр и новые уплотнительные кольца, соберите крышку фильтра с соблюдением моментов затяжки из официального мануала.
      7. Установите новые шайбы/уплотнения на сливную/контрольную пробку, заверните пробку от руки для последующей регулировки уровня.
      8. Через сапун или штатное заливное/контрольное отверстие с помощью насоса/шприца залейте расчётный объём DSG-жидкости G 055 529 A2 (ориентировочно 7 л, учитывая слитое количество и указания техдокументации).
      9. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям (P–R–N–D/S) с паузой 2–3 секунды, затем верните селектор в «P».
      10. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C на работающем двигателе и горизонтальном автомобиле аккуратно открутите контрольную/переливную пробку и оцените поток масла.
      11. Если масло почти не вытекает, дозаливайте G 055 529 A2 малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      12. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем переключений и температур.
      13. При наличии жалоб до сервиса (дребезг, рывки, некорректные обороты переключений, ошибки по DSG) по результатам замены масла и состояния фильтра/магнитов оцените необходимость дальнейших работ (адаптаций, проверки сцеплений/мехатроники), так как одна замена масла может не устранить накопленные проблемы.
    mistakes:
      - Считать DQ381 необслуживаемой и не менять масло до появления выраженных симптомов.
      - Использовать ATF/масла без допуска G 055 529 A2, ориентируясь только на принадлежность к DSG.
      - Игнорировать замену фильтра и обслуживать только жидкость.
      - Выставлять уровень DSG-жидкости без контроля температуры и без процедуры через переливное отверстие.
      - Подбирать фильтр и уплотнения только по коду DQ381/0GC без учёта VIN, ревизии и кузова.
    nuances: "DQ381/0GC — развитие мокрой DSG DQ380 для поперечных моторов VW/Audi/Skoda/Seat, широко применяемое на Taos, Tiguan, Golf, Octavia и др. Коробка ориентирована на момент до ~420 Н·м и живёт около 300 тыс. км при соблюдении регламента обслуживания. Ключевой момент — один общий контур DSG-жидкости (масло омывает механику, сцепления и мехатронику), поэтому качество и уровень жидкости критичны; большинство проблем при редких заменах связано с перегревом, износом сцеплений и загрязнением гидроблока."
    description: "VAG DQ381 / 0GC — 7-ступенчатая мокрая DSG для поперечных двигателей до 2,0 л, пришедшая на смену части более ранних DSG (DQ250/DQ500) в компактных кроссоверах и хэтчбеках. Использует DSG-жидкость G 055 529 A2 объёмом порядка 7–7,5 л, с регламентной заменой масла и фильтра каждые 60 тыс. км. Для мастерской важно понимать, что, несмотря на относительную новизну и доработки по сравнению с предыдущими DSG, эта коробка столь же чувствительна к перегревам, грязному маслу и неправильному уровню."
    weak_points: |
      1. Перегрев и старение DSG-жидкости.
      Один масляный контур обслуживает механику, сцепления и мехатронику; при редких заменах и высоких нагрузках жидкость быстро стареет, что ведёт к износу сцеплений и гидроблока.
      
      2. Дребезг и вибрации при трогании.
      По отзывам владельцев DQ381 типичны вибрации и дребезг при старте, связанные с износом сцеплений и состоянием масла.
      
      3. Некорректные обороты переключений.
      Ошибка в адаптациях или проблемное масло вызывают ранние/поздние переключения и рывки.
      
      4. Засорение гидроблока.
      Грязная DSG-жидкость забивает каналы и соленоиды, что вызывает толчки и ошибки по давлению.
      
      5. Сложность подбора фильтра/уплотнений без VIN.
      Фильтры и уплотнения DQ381 отличаются от DQ380 и зависят от рынка/модели; универсальный «один номер на всё» часто приводит к неправильной посадке фильтра и утечкам.
    faq:
      - {"question":"Какое масло использовать в DSG DQ381 / 0GC?","answer":"По gearboxlist и русскоязычным источникам штатная жидкость для DQ381 — DSG G 055 529 A2; аналоги подбираются только по кроссам к этому допуску.","url":"https://maslogid.com/maslo-dlya-volkswagen-dsg-dq381-rekomendacii-i-obem/"}
      - {"question":"Сколько масла готовить на замену в DQ381?","answer":"Полная заправка по данным источников — 7,0–7,5 л; при типовой замене чаще всего заливают 7 л с контролем уровня по переливу.","url":"https://avtoexperts.ru/question/kakoe-i-skol-ko-masla-zalit-v-dsg-dq381/"}
      - {"question":"Через сколько километров менять масло в DQ381?","answer":"Рекомендованный регламент — каждые 60 000 км; при тяжёлой эксплуатации (пробки, жара, активная езда) многие сервисы советуют 40–50 тыс. км.","url":"https://www.spb.akppcenter.com/volkswagen/dq381"}
      - {"question":"Меняется ли фильтр при обычном ТО на DQ381?","answer":"Да. Фильтр 0GC 325 183 A и его уплотнения рекомендуется менять вместе с DSG-жидкостью каждые 60 тыс. км, подбирая конкретный номер по VIN.","url":"https://vrt-auto.ru/services/obsluzhivanie-kpp-dsg-direct-schalt-getriebe/zamena-masla-i-filtra-dsg-7-dq381/"}
      - {"question":"При какой температуре выставлять уровень масла в DQ381?","answer":"Как и для других мокрых DSG, уровень выставляют через контрольное/переливное отверстие при температуре DSG-жидкости около 35–45 °C на работающем двигателе и горизонтальном автомобиле, ориентируясь на струйку/частые капли.","url":"https://viktorsova.com/2021/07/zamina-masla-v-dsg-7-dq381/"}
