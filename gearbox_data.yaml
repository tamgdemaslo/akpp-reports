      4. Снимите защиту, очистите картер АКПП вокруг пробок от грязи.
      5. Открутите контрольную/сливную пробку и слейте жидкость в мерную тару; зафиксируйте точный объём и состояние масла.
      6. Если по VIN подтверждён съёмный нижний поддон и сервисный фильтр, отдельно выполняйте их замену по заводской схеме. Если такого подтверждения нет, фильтр в стандартное ТО не включайте.
      7. Установите пробки и уплотнения в соответствии с каталогом конкретной ревизии.
      8. Залейте свежую ATF с подтверждённой спецификацией ATF-GS в объёме, близком к слитому.
      9. Запустите двигатель, удерживая тормоз, последовательно переведите селектор по всем режимам с короткой выдержкой.
      10. Доведите температуру ATF до 50-60 °C и откройте контрольную пробку для финальной установки уровня.
      11. Доливайте до штатного уровня по контрольному отверстию и завершите сборку.
      12. После тест-драйва повторно проверьте герметичность, характер переключений и наличие кодов по TCM.
