    procedure: |
      1. Убедитесь по VIN и данным сканера, что установлена DSG7 DQ501 (0AK) с мокрыми сцеплениями. Подготовьте не менее 7 л G 055 529 A2 и комплект фильтра/уплотнений по каталогу под конкретный авто.
      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту, обеспечьте доступ к сливной/контрольной пробке и крышке фильтра (расположение и тип крепежа смотреть по мануалу 0AK).
      3. Подставьте ёмкость не менее 10–12 л и аккуратно открутите сливную/контрольную пробку DSG. Слейте основную порцию масла (ориентировочно до 6 л при частичной замене). При наличии внутренней вставки/трубки перелива выкрутите её и дождитесь прекращения активного слива.
      4. Снимите крышку фильтра гидроконтура (по конструкции близка к DQ381/DQ500: горизонтально или сверху в зоне АКБ). Аккуратно извлеките старый фильтр и уплотнения, не оставляя фрагментов резины и пластика.
      5. Оцените состояние масла (цвет, запах, наличие стружки и шлама), а также загрязнение фильтра и магнитов. При обильной стружке или запахе гари планируйте дальнейшую диагностику сцеплений и мехатроника.
      6. Установите новый фильтр и новые уплотнения в соответствии со схемой для 0AK. Затяните крышку фильтра с моментом по мануалу (ориентир 15–25 Н·м, без перетяга пластиковых корпусов).
      7. Установите новые шайбы/уплотнения на сливную/контрольную пробку, заверните пробку от руки, чтобы позже выставить уровень.
      8. Через штатное заливное/контрольное отверстие или сапун с помощью насоса/шприца залейте расчётный объём G 055 529 A2 (ориентировочно 6 л, ориентируясь на слитое количество и рекомендации производителя).
      9. Запустите двигатель, удерживая педаль тормоза, и плавно переведите селектор по всем положениям (P–R–N–D/S) с паузой 2–3 секунды, затем верните селектор в «P». Это прокачает гидроконтур и распределит жидкость по каналам.
      10. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C на работающем двигателе и горизонтальном автомобиле аккуратно открутите контрольную/переливную пробку и оцените поток масла.
      11. Если масло почти не вытекает, дозаливайте G 055 529 A2 малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при сильном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      12. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту.
      13. Выполните сброс адаптации по старению масла и при необходимости базовые установки / адаптацию сцеплений через ODIS/VCDS.
      14. Проведите дорожный тест с контролем переключений и температур; при появлении рывков и ошибок по давлению вернитесь к проверке уровня и диагностике мехатроника.
    mistakes:
      - Считать DQ501 необслуживаемой и не менять масло до появления выраженных симптомов.
      - Использовать ATF/универсальные DCT-масла без явного допуска G 055 529 A2 (0AK DSG).
      - Подбирать фильтр и уплотнения только по коду DQ501/0AK без учёта VIN и рынка автомобиля.
      - Выставлять уровень DSG-жидкости без контроля температуры и без процедуры через переливное отверстие.
      - Игнорировать сброс адаптаций по маслу и адаптацию сцеплений после обслуживания.
    nuances: "DQ501/0AK — новая усиленная мокрая DSG7, пришедшая на смену части DQ381 для тяжёлых кроссоверов китайского рынка (Talagon, Tavendor, Teramont X, Viloran). По otoba и данным завода в Тяньцзине коробка рассчитана на момент до 600 Н·м и ресурс порядка 300 тыс. км при своевременной замене масла каждые 60 тыс. км. Масло одно на механику, сцепления и мехатроник, поэтому к качеству и уровню жидкости коробка очень чувствительна. Ранние прошивки отмечались толчками и рывками, ситуация улучшалась обновлением ПО; поэтому после обслуживания имеет смысл проверять актуальность софта. По запчастям многие элементы близки к DQ381/DQ500, но для фильтра и уплотнений критичен подбор по VIN."
    description: "VAG DQ501 / 0AK — 7-ступенчатая мокрая DSG нового поколения, разработанная как усиленная версия DQ381 для тяжёлых передне- и полноприводных кроссоверов. Используется на Volkswagen Talagon, Tavendor, Teramont X, Viloran и других моделях китайского рынка. Коробка рассчитана на крутящий момент до 600 Н·м и живёт около 300 тыс. км при регламентной замене масла G 055 529 A2 каждые 60 тыс. км. Для мастерской важно понимать, что это один масляный контур для сцеплений, мехатроника и механической части: грязное или старое масло быстро приводит к толчкам, ускоренному износу пакета сцеплений и проблемам с гидроблоком."
    weak_points: |
      1. Ранние прошивки и толчки. В первые годы эксплуатации отмечались рывки и толчки при переключениях; в большинстве случаев проблему решали обновлением ПО коробки.
      2. Чувствительность к качеству масла. Один контур масла для сцеплений и мехатроника требует строгого соблюдения интервала и применения G 055 529 A2; редкие замены ускоряют износ сцеплений и загрязнение соленоидов.
      3. Износ мокрых сцеплений. На тяжёлых кроссоверах с высоким моментом пакет сцеплений обычно к 150–200 тыс. км требует вмешательства, особенно при езде в пробках и с прицепом.
      4. Двухмассовый маховик. По наблюдениям сервисов, на тех же пробегах, что и сцепления, нередко меняют двухмассовый маховик из-за шумов и вибраций.
      5. Ограниченная статистика по поломкам. Коробка относительно новая, детальная статистика ещё набирается, поэтому при нештатных симптомах важно опираться на свежие бюллетени и опыт профильных сервисов.
    faq:
      - {"question":"Какое масло и сколько лить в DQ501 / 0AK?","answer":"По otoba и каталогу масел используется DSG-жидкость VAG G 055 529 A2. Полный объём около 7,5 л, при частичной замене с фильтром обычно обновляют ~6 л с контролем уровня по переливу при 35–45 °C.","url":"https://otoba.ru/transmissii/vag/dq501.html"}
      - {"question":"Какой фильтр ставить в DQ501?","answer":"Точный артикул фильтра гидроконтура для DQ501/0AK в открытых источниках расходится; в каталогах встречаются кроссы с узлами DQ381/DQ500. Надёжный вариант — подбирать фильтр и уплотнения по VIN и каталогу VAG.","url":"https://transagregat.ru/maslo-transmissionnoe-vw-dsg-g055529a2-10l-18848.html"}
      - {"question":"Через сколько менять масло в DQ501?","answer":"Заводской регламент для DSG7 DQ501 — обслуживание каждые 60 тыс. км. В тяжёлых условиях (частые пробки, буксировка, жаркий климат) профильные сервисы рекомендуют интервал 40–50 тыс. км.","url":"https://otoba.ru/transmissii/vag/dq501.html"}
      - {"question":"Это та же коробка, что DQ381 или DQ500?","answer":"DQ501 (0AK) конструктивно близка к DQ381, но усилена под более тяжёлые кроссоверы и момент до 600 Н·м. Масло и общая логика обслуживания похожи на DQ381/DQ500, но детали фильтра и крепежа отличаются, поэтому их подбирают только по VIN.","url":"https://otoba.ru/transmissii/vag/dq501.html"}
      - {"question":"Какие типовые проблемы у DQ501 уже известны?","answer":"По данным otoba и профильных сервисов, на ранних авто встречались толчки и рывки, решавшиеся перепрошивкой; на пробегах 150–200 тыс. км ожидаемы работы по сцеплениям и двухмассовому маховику. Глобальных «болячек», как у старых сухих DSG, пока не выявлено, но статистика ещё набирается.","url":"https://otoba.ru/transmissii/vag/dq501.html"}
