        answer: "Потому что у коробки есть ранняя и поздняя ревизии. В открытых источниках поздняя прокладка проходит как 169 371 35 80, а ранняя до serial 305061 — как 169 371 04 80."
        url: "https://cobratransmission.com/722-8-Gasket-Pan"
      - question: "Что мастеру первым делом проверить, если после или до ТО вариатор шумит, буксует или даёт ошибки по скорости?"
        answer: "Сначала уровень и состояние масла, затем уже держать в голове подшипники и электронную часть VGS/датчиков. Для 722.8 такие симптомы часто выходят за рамки обычного масляного сервиса."
        url: "https://thevehiclecheck.co.uk/blogs/blogs-articles/mercedes-benz-722-8-tcu-fault"
