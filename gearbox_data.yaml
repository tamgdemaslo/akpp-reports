      - {"question":"Какой OEM фильтра для BMW A5S440Z?","answer":"Фильтр BMW 5HP24: 24 34 1 422 673.","url":"https://www.bimmerworld.com/Driveline-Shifter/Transmission-Service/Transmission-Filter-Kit-92043017.html"}
      - {"question":"Какой OEM прокладки поддона для BMW A5S440Z?","answer":"Прокладка поддона BMW 5HP24: 24 11 1 422 676.","url":"https://www.bimmerworld.com/Driveline-Shifter/Transmission-Service/Transmission-Filter-Kit-92043017.html"}
      - {"question":"Какие OEM часто применяются для VAG 01L?","answer":"Чаще всего: фильтр 01L 325 429 A/B, прокладка 01L 321 371, уплотнение фильтра 01L 325 443, ATF G 052 162 A2.","url":"https://wiki.ross-tech.com/wiki/index.php/5-Speed_Automatic_Transmission_(01L_/_5HP24)"}
      - {"question":"Почему важно проверять заливную пробку до слива?","answer":"Это защита от ситуации, когда масло уже слито, а заливка невозможна из-за закисшей пробки.","url":"https://rangeroverclub.com/showthread.php?t=736"}
