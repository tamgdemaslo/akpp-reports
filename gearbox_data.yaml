      - Игнорирование перегрева и состояния радиаторов/теплообменника.
      - Буксировка автомобиля с заглушенным мотором (риск задиров конусов).
    nuances: "VL300 (01J) чувствителен к чистоте масла и перегреву: грязная жидкость ускоряет износ цепи, фрикционов и соленоидов. Неочевидный сервисный момент — помимо масла вариатора по регламенту обновляют масло в переднем дифференциале. На ранних стадиях проблем характерны подергивания и гул подшипника ведомого конуса; затягивание с ремонтом повышает стоимость восстановления."
    description: "VAG VL300 (01J) — бесступенчатый вариатор Multitronic для переднеприводных моделей Audi и Seat с продольным расположением двигателя. Коробка рассчитана на момент до 310 Н·м (поздние ревизии до 330 Н·м). При правильном обслуживании ресурс может доходить до 250–300 тыс. км, но вариатор требует строгого соблюдения спецификации жидкости G 052 180 A2 и интервала обслуживания."
    weak_points: |
      1. Растяжение цепи, особенно при агрессивной езде (часто к 100 тыс. км).
      2. Износ фрикционов сцепления и загрязнение гидроблока продуктами износа.
      3. Перегрев и отказ TCM (блок внутри коробки чувствителен к горячему маслу).
      4. Износ подшипника ведомого конуса с характерным гулом.
      5. Слабые места: трубки охлаждения, датчик крутящего момента, дифференциал.
