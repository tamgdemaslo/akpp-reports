      - question: "Меняется ли фильтр на Mercedes AMG-SpeedShift-MCT-9 при обычном ТО?"
        answer: "Да, но не отдельно. По открытой сервисной логике MCT-9 идёт через pan assembly семейства 725, где фильтр интегрирован в поддон."
