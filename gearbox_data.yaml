gearboxes:
  ZF6HP19_21:
    manufacturer: ZF
    gearbox: ZF 6HP19 / 6HP21 (VAG 09L, BMW GA6HP19Z / GA6HP21Z, 6HP19A/21A AWD)
    summary: ZF6HP19/21 | 5,5 л | 10 / 8 / 35 Н·м | LG-6 | 30–35 °C
    oem_codes: "пластиковый поддон-фильтр (с прокладкой)  \n  BMW: 1071-298-033, 1071-298-038\
      \  \n  VAG/Audi: 1071-298-027, 1071-298-039  \nкартридж-фильтр (для стального\
      \ поддона ранних рев.) 0501-216-244  \nвтулка мехатроника 0501-216-272  \nболт\
      \ поддона М6x28 0736-003-201 (BMW 24 11 7 571 217)  \nсливная пробка 0501-216-320\
      \ | уплотнение 0501-210-038\n"
    fluid: ZF Lifeguard 6 (спецификация ZF TE-ML 11)
    fill_range: 30–35 °C (температура ATF при контроле уровня)
    drain_volume: 5,0–5,8 л (поддон снят, гидроблок на месте)
    dry_capacity: 9,0–9,5 л
    service_interval: каждые 60 000 км или 4 года (рекомендация ZF; заводское «Lifetime»
      не учитываем)
    tools:
    - Torx E10 / E12 для болтов поддона и кронштейнов
    - 17 мм внутр. шестигранник (заливная пробка)
    - динамометрический ключ 5–60 Н·м
    - сканер с показом температуры ATF (ISTA, VCDS, Launch …)
    - шприц/помпа ≥2 л для заливки
    - ёмкость ≥10 л для отработки
    parts_list:
    - поддон-фильтр в сборе
    - болты поддона × 13 шт (при замене)
    - шайба сливной пробки (медь/алуминий, одноразовая)
    - ATF ZF Lifeguard 6 5,5–6 л
    pan_bolts: 13 × М6 × 28, класс 8.8
    drain_torque: 35 Н·м (сливная пробка)
    fill_torque: 8 Н·м (заливная пробка), 10 Н·м (болты поддона)
    procedure: '1. Прогрейте АКПП до ≈40 °C в движении, затем охладите до 30 – 35
      °C.

      2. Поставьте машину горизонтально на подъёмник, селектор в «P», двигатель заглушен.

      3. Снимите защиту картера, поставьте ёмкость, открутите сливную пробку 17 мм
      – сольётся ≈3 л ATF.

      4. Отверните 13 болтов поддона (Torx E10), аккуратно снимите поддон, дайте стечь
      ещё ≈2 л.

      5. Вымойте магниты, очистите привалочную плоскость, снимите остатки герметика
      (если был).

      6. Установите новый поддон-фильтр; болты затягивайте крест-накрест 10 Н·м.

      7. Замените шайбу сливной пробки, закрутите её 35 Н·м.

      8. Через заливное отверстие залейте 5 л свежего LG-6.

      9. Запустите двигатель; при нажатой педали тормоза последовательно переведите
      селектор по всем диапазонам, задерживаясь 2–3 с.

      10. При температуре 30–35 °C доливайте ATF, пока из заливного отверстия не пойдёт
      ровная лёгкая струйка.

      11. Закрутите заливную пробку 8 Н·м, протрите корпус, установите защиту.

      12. Выполните тест-драйв 10 км, проверьте коробку на отсутствие подтёков.

      '
    mistakes:
    - Проверка уровня при >40 °C приводит к недоливу и вспениванию масла.
    - Использование Dexron VI вместо LG-6 вызывает залипание блокировок и рывки.
    - Повторное использование шайбы сливной пробки – частая причина масляных соплей.
    - Перетяжка болтов поддона свыше 10 Н·м коробит пластиковый фланец.
    nuances:
    - На полноприводных 6HP19A/21A к заливной пробке тесно — нужен изогнутый ключ.
    - Допустим только тёмный графитовый налёт на магнитах; стружка указывает на износ
      барабана «E».
    - Сброс адаптаций после обычной смены масла не требуется.
    - Аналоги масла (Ravenol 8HP, Motul Multi ATF VI, Febi 39071) допустимы, если
      указаны в актуальном листе TE-ML 11.
    price_block: "Москва, I квартал 2025 г.  \n• Работа «замена ATF с поддоном» —\
      \ 6 000–8 000 ₽  \n• Поддон-фильтр оригинал ZF — 13 000–16 000 ₽  \n• ZF Lifeguard\
      \ 6 (1 л) — 1 600–2 000 ₽  \n• Болты + шайба — 1 200 ₽\n"
    docs: "ZF S671 090 253 «6HP19/21 Repair Manual» rev 2019  \nBMW TIS RA 24 00 (040)\
      \ «Oil change GA6HP19Z» 12/2023  \nVAG SSP 325 «6-speed automatic transmission\
