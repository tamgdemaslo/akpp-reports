    description: "VAG AQ450 (09P) — 8-ступенчатый гидроавтомат Aisin для передне- и полноприводных моделей (Atlas/Teramont, Arteon, Tiguan и др.). Коробка рассчитана примерно до 450 Н·м и при правильном обслуживании имеет ресурс около 300 тыс. км. Для ресурса важны: жидкость G 055 540 A2, корректный контроль уровня при 35–45 °C, замена фильтра/прокладки поддона и контроль охлаждения."
    weak_points: |
      1. Износ фрикциона блокировки ГТФ на нагруженных авто -> пыль и вибрации.
