      - {"question":"Сколько масла выходит при частичной замене?","answer":"Обычно 2,5-3,5 л за один слив. Для ощутимого обновления делают 2-3 частичных цикла или аппаратную замену.","url":"https://www.toyotanation.com/threads/the-official-how-to-atf-drain-and-fill.323590/"}
