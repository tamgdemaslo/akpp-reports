      - {"question":"Сколько масла требуется на замену?","answer":"Полная емкость около 9,2 л, при стандартной замене обычно сливается порядка 5,5 л.","url":"https://otoba.ru/transmissii/vag/al951.html"}
      - {"question":"Нужно ли менять фильтр отдельно?","answer":"В AL951 фильтр интегрирован в поддон. Меняют поддон-фильтр в сборе.","url":"https://otoba.ru/transmissii/vag/al951.html"}
      - {"question":"Какой OEM поддона-фильтра встречается чаще?","answer":"Часто встречается 0BL 398 009. По комплектации и ревизии возможны отличия, поэтому сверка по VIN обязательна.","url":"https://spareto.com/oe/0bl398009"}
      - {"question":"Какие типовые слабые места у AL951?","answer":"Основные риски: износ блокировки ГДТ, загрязнение гидроблока, вибрации, износ подшипника насоса и течи по уплотнениям.","url":"https://otoba.ru/transmissii/vag/al951.html"}
