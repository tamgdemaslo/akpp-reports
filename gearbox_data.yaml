    procedure: |
      1. Подтвердите по VIN/шильду, что установлена AQ301 (09U), и подготовьте ATF Hyundai SP-IV.
      2. Прогрейте коробку поездкой и установите авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару: обычно около 4,0 л.
      4. При необходимости расширенного ТО снимите поддон, очистите магниты, установите новые уплотнения/фильтр по каталогу 09U.
      5. Установите сливную пробку с новым уплотнением и затяните моментом по мануалу ревизии.
      6. Через заливное отверстие залейте объем, равный слитому, затем выполните прокачку селектором по всем режимам с паузой 2–3 с.
      7. Контролируйте температуру ATF сканером. При 35–45 °C откройте контрольную пробку: тонкая струйка с переходом в капли означает правильный уровень.
      8. Если не течет — долейте малыми порциями; если течет сильно — дождитесь перехода в капли и закройте пробку.
      9. Сотрите ошибки, выполните тест-драйв 10–15 км и проверьте герметичность.
    mistakes:
