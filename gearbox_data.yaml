    description: |
      **VAG 01N** — это продольная 4-ступенчатая АКПП ранних Audi и Volkswagen, которую сервисы видят на старых Passat и Audi с продольной компоновкой.

      Для мастера по замене масла это коробка не про сложную электронику, а про правильную сервисную дисциплину: **нижний поддон, сменный фильтр, контроль уровня только при 35–45 °C и на работающем двигателе, плюс отдельное понимание, что у 01N главная передача обслуживается отдельно**.

      По практическим обсуждениям главные проблемы после сервиса у `01N` обычно рождаются не из «внезапной смерти коробки», а из ошибок процедуры: недолив, неверная температура, пропуск прохода селектора по диапазонам или путаница между ATF и маслом final drive.

      Для сайта и заказа безопаснее держаться подтверждённой базы: фильтр `01M 325 429`, ATF `G 052 162 A2`, а по прокладке поддона честно указывать два встречающихся OEM с примечанием по ревизии — `01N 321 370` и `01N 321 371`.
    weak_points: |
      **1. Ошибка по уровню после сборки.**
      Для `01N` это один из самых частых постсервисных рисков: коробка начинает пинаться, затягивать передачи или вести себя как недолитая, а причина оказывается в неправильной процедуре level check.

      **2. Путаница между ATF и маслом главной передачи.**
      У 01N это важный сервисный нюанс: final drive живёт отдельно, и мастеру нельзя автоматически считать, что обслуживание АКПП закрывает и этот контур.

      **3. Старые проблемы гидроблока, соленоидов и TCC часто уже были до ТО.**
      Для мастера это значит одно: поведение коробки нужно фиксировать до работ, иначе клиент легко привяжет старую неисправность к свежей замене масла.

      **4. Путаница с прокладкой поддона.**
      В открытых кроссах по `01N` встречаются минимум две близкие прокладки, поэтому без VIN и сверки формы легко приехать к неподходящему комплекту.
