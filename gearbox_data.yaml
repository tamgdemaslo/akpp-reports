      Ниже — безопасная сервисная схема именно для Mercedes 722.6. Для этой коробки мастер должен разделять обычный pan-drop сервис и полный обмен жидкости: это не одно и то же.
      
      1. До начала работ определите цель: обычный pan-drop сервис с фильтром или более полный обмен жидкости через магистраль охлаждения.
