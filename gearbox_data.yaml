    parts_list:
      - CVTF G052516A2 7 л
      - фильтр картридж 0AW 301 516 H
      - болты WHT 003 157 × 3
      - O-Ring N90666003 × 2
      - сливная пробка WHT 005 623 A
    drain_torque: 30 Н·м (наружная пробка)
    fill_torque: |
      2 Н·м  — контрольный стакан-трубка  
      10 Н·м — болты фильтра
    procedure: |
      1. Прогреть вариатор до 30–40 °C поездкой 10 мин; авто горизонтально, ручник, селектор «P», снять защиту.
      2. Слив: выкрутить наружную пробку (сольётся ≈0,5 л), затем вывернуть стакан-уровнемер 5 мм — выйдут ещё 5,5–6 л.
      3. Замена картриджа: снять левый подкрылок; отщёлкнуть две масляные трубки, снять три болта фильтра, демонтировать фильтр.  
        • Смазать новым маслом фетровую вставку, установить фильтр 0AW 301 516 H с новыми кольцами, болты 10 Н·м.  
        • Быстросъёмы защёлкнуть до характерного «щёлк».
      4. Вкрутить стакан-трубку 2 Н·м, установить новую сливную пробку с кольцом 30 Н·м.
      5. Через адаптер M22 × 1,5 залить ровно слитый объём CVTF (≈ 6,5 л).
      6. Запустить ДВС; прижатый тормоз, селектор P-R-N-D-S-D-N-R-P с паузой 3 с — выгнать воздух.
      7. При 35–45 °C открутить наружную пробку: правильный уровень — тонкая струйка → капли.  
        Недолив → +0,2 л и повтор шага; перелив — дать стечь лишнему.
      8. Затянуть стакан 2 Н·м, пробку 30 Н·м; очистить поддон, вернуть защиту.
      9. Тест-драйв 15 км без кик-дауна; CVT-TEMP ≤ 90 °C, рывков и течей нет.
    mistakes:
      - Перелив жидкостью выше нормы — вспенивание, обрыв давления, износ цепи и конусов.
      - Использование «универсальных» CVTF без допуска G052516A2.
      - Старые болты WHT003157 без фиксатора — не держат момент, появляется течь.
      - Нарушен диапазон проверки (>50 °C) — получите недолив ≈ 0,4 л.
    nuances:
      - На автомобилях с V6 (3.0 TFSI / 3.2 FSI / 3.0 TDI) к внешнему фильтру не подлезть из-за выпускного коллектора и подпора подрамника; без демонтажа подрамника фильтр НЕ меняется. Для таких машин выполняют только слив-залив CVTF, замену фильтра откладывают до крупных работ по подвеске.
      - Внутренний фильтр 0AW 301 519 C расположен внутри корпуса и меняется лишь при капитальном ремонте.
      - Для переднего дифференциала использовать масло G055190A2 75W-90 GL-4, 1,1 л, уровень — 20 мм ниже края заливного отверстия.
