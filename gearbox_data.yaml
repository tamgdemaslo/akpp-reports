    procedure: |
      1. Подтвердите по VIN, что у автомобиля действительно АКПП AL1000/0C8, и подготовьте ATF с допуском G 055 540 A2, фильтр 0C8 325 435, прокладку поддона 0C8 321 371 и уплотнительное кольцо сливной пробки 0C8 321 181.
      2. Выполните лёгкий прогрев автомобиля с плавной ездой, затем установите машину на строго горизонтальную площадку (подъёмник/яма), переведите селектор в «P» и дайте коробке немного остыть до безопасной температуры для работы под днищем.
      3. Снимите нижнюю защиту двигателя/трансмиссии, обеспечьте доступ к поддону АКПП и сливной/контрольной пробке 0C8.
      4. Подставьте достаточно вместительную ёмкость (до 10–12 л) и аккуратно выверните сливную пробку (обычно под TORX), дайте стечь первой порции масла.
      5. Если конструктивно предусмотрена переливная трубка внутри сливного отверстия (по конкретной ревизии), аккуратно выкрутите её и дождитесь основного слива из картера.
      6. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон, не проливая остатки ATF, и перенесите его на верстак.
      7. Снимите масляный фильтр АКПП 0C8 325 435, оцените наличие стружки и шлама в районе его посадки и на магнитах поддона – это важный диагностический этап для AL1000.
      8. Тщательно промойте поддон и магниты очистителем тормозов, удалите весь шлам и металлическую пыль, проверьте, нет ли трещин и деформаций поддона; при сомнительном состоянии поддон лучше заменить.
      9. Установите новый фильтр 0C8 325 435, убедившись в корректной посадке уплотнительной части и отсутствии старых колец в гнезде.
      10. Установите новую прокладку поддона 0C8 321 371 на очищенный поддон, совместите все втулки и отверстия.
      11. Смонтируйте поддон на коробку, затягивая болты в несколько приёмов крест‑накрест с использованием динамометрического ключа по значениям из ремонтного мануала 0C8 (конкретные моменты зависят от типа болта и указываются в документации).
      12. Установите новую уплотнительную шайбу 0C8 321 181 на сливную/контрольную пробку, заверните пробку от руки, но окончательную протяжку пока не выполняйте, если конструкция предполагает залив через это же отверстие.
      13. Подключите заправочный насос или шприц с подходящим адаптером к заливному/контрольному отверстию и залейте в коробку первую порцию ATF G 055 540 A2 объёмом порядка 5,5–6 л (в зависимости от версии и фактического слива).
      14. Закрутите пробку с новой шайбой и проведите первичный пуск: запустите двигатель, удерживая педаль тормоза, и плавно переведите селектор по всем положениям P–R–N–D/S с паузой несколько секунд в каждом, затем верните в «P».
      15. С помощью диагностического сканера контролируйте температуру ATF в АКПП; при достижении диапазона 35–45 °C снова поднимите автомобиль, открутите контрольную пробку и оцените поток масла из переливной трубки (если она есть) или просто из отверстия.
      16. При недостаточном уровне (масло не вытекает) через адаптер дозаливайте ATF небольшими порциями и повторяйте проверку: корректный уровень считается достигнутым, когда при 35–45 °C из отверстия идёт стабильная струйка, переходящая в частые капли.
      17. После того как излишек масла стечёт до частых капель, окончательно затяните пробку с новой шайбой по моменту из мануала, установите на место защиту и выполните дорожный тест с контролем переключений и температуры.
      18. Для машин с большим пробегом и сильно уставшей жидкости часто применяют ступенчатую замену: через 2–4 тыс. км повторяют частичный слив/долив для более мягкого обновления всего объёма ATF.
    mistakes:
      - Считать AL1000 необслуживаемой и ездить на первом заводском масле до появления жёстких толчков и ошибок по гидроблоку.
      - Лить универсальное ATF или масла без явного допуска к G 055 540 A2/спецификациям TR-80SD/TR-81SD/TR-82SD.
      - Игнорировать чистоту поддона и магнитов, просто сливая и заливая масло без оценки количества стружки.
      - Выставлять уровень «на глаз» без контроля температуры ATF и без соблюдения процедуры через контрольное отверстие.
      - Перетягивать или срывать болты поддона и пробки, работая без динамометрического ключа и без опоры на мануал 0C8.
      - Игнорировать перегревы (засорённые радиаторы, неработающий доп.подогреватель/охладитель), списывая все толчки только на масло.
    nuances: |
      AL1000/0C8 – это не классический старый «пятиступенчатый автомат», а тяжёлый 8‑ступенчатый Aisin, рассчитанный на большой крутящий момент и работу с тяжёлыми кроссоверами. По конструкции он близок к семейству TR‑80SD/TR‑81SD/TR‑82SD, поэтому для него критичны чистота масла и работа системы охлаждения.
      Полный объём сильно зависит от версии (младшая/средняя/старшая) и сочетания с редуктором, поэтому в заказ‑наряде и на сайте правильнее указывать диапазон по данным Otoba и профильных сервисов, а не одно число «с точностью до грамма».
      Фильтр у 0C8 отдельный, металлический/пластиковый (0C8 325 435), поддон стальной с отдельной прокладкой 0C8 321 371 – это удобно для сервиса, но типичные ошибки всё равно связаны с тем, что фильтр не меняют и поддон не моют, а ограничиваются частичным сливом.
      Для машин с большим пробегом без историй по заменам масла AL1000 лучше обслуживать щадяще: ступенчатая частичная замена даёт меньше шансов спровоцировать быстрый выход из строя уже подуставшего гидроблока.
    description: |
      AL1000 (VW 0C8) – это 8‑ступенчатый полно-приводный гидроавтомат Aisin, который VAG использует на Touareg 7P, Audi Q7 4L и Porsche Cayenne 92A. По сути это семейство TR‑80SD/TR‑81SD/TR‑82SD с адаптацией под требования VAG: высокие допуски по крутящему моменту (до 850 Н·м на старшей версии), плотная ступенчатая шкала передач и работа в связке с тяжёлым полным приводом.
      По открытым источникам и практическим отчётам сервисов младшая версия AL1000 имеет полную ёмкость порядка 10,7 л, средняя – около 10,8 л, а старшая, под мощные 4.8 TFSI и 4.2 TDI, – до ~11,8 л. Во всех случаях фигурирует один и тот же базовый допуск ATF – G 055 540 A2, а рекомендуемый интервал замены по VAGWay/Otoba – 60 000 км.
      Реальные проблемы AL1000 чаще всего связаны не с «слабым железом», а с перегревами и грязным маслом: тяжёлые машины, прицепы, пробки и редкие замены быстро старят ATF, и дальше страдает гидроблок, соленоиды и фрикционы. Поэтому для сайта и карты коробки важно подчёркивать необходимость регулярного сервиса, чистоту поддона и корректный контроль уровня.
      При аккуратной эксплуатации и своевременном обслуживании ресурс AL1000 по профильным оценкам достигает 300–350 тыс. км, что для современного восьмиступенчатого автомата с таким моментом считается очень достойным результатом.
    weak_points: |
      1. Быстрое старение и загрязнение масла при тяжёлых режимах.
      AL1000 стоит на тяжёлых кроссоверах, часто таскает прицепы и работает в пробках. При редкой замене ATF G 055 540 A2 масло быстро окисляется и насыщается продуктами износа, что напрямую бьёт по гидроблоку и фрикционам.
      
      2. Засорение соленоидов и гидроблока.
      Как и другие Aisin семейства TR‑80, эта коробка чувствительна к чистоте масла: мелкая стружка и шлам забивают соленоиды, из-за чего появляются толчки, задержки переключений, рывки при трогании и ошибки по давлению.
      
      3. Перегревы и загрязнение системы охлаждения.
      AL1000 не любит перегревов: забитый радиатор, неисправный доп.подогреватель/теплообменник или езда с постоянным буксиром приводят к росту температуры ATF и ускоренному износу. При ремонте таких коробок регулярно находят потемневшее масло и потёкшие уплотнения.
      
      4. Удары и рывки, лечащиеся обновлением ПО.
      По ряду практических отчётов (VAG‑Coder и др.) часть проблем с резкими ударами/пинками на переключениях решается обновлением устаревших версий прошивки блока управления АКПП. Без обновления коробка часто работает заметно грубее, особенно на ранних годах.
      
      5. Чувствительность к неправильному обслуживанию.
      Типичные ошибки – «слил что вышло, залил сколько было», без снятия поддона, чистки магнитов и замены фильтра. При таком подходе грязь остаётся внутри, а новая жидкость лишь поднимает её в оборот, ускоряя отказ гидроблока.
    faq:
      - {"question":"Какое масло указывать для АКПП AL1000 / 0C8?","answer":"Для сайта и заказа безопасно жёстко указывать оригинальный допуск VAG G 055 540 A2. Аналоги и масла Aisin/Toyota WS стоит подбирать по кроссам и каталогу, а не по названию коробки вслепую.","url":"https://otoba.ru/transmissii/vag/al1000.html"}
      - {"question":"Сколько масла нужно готовить на замену в AL1000?","answer":"Полная ёмкость в зависимости от версии составляет порядка 10,7–11,8 л, но при стандартной частичной замене со снятием поддона и фильтра обычно уходит около 5,5–6 л. Поэтому для обслуживания разумно иметь 8–10 л ATF G 055 540 A2 с запасом.","url":"https://otoba.ru/transmissii/vag/al1000.html"}
      - {"question":"Через сколько менять масло в АКПП AL1000?","answer":"По профильным источникам и практическим сервисам – каждые 60 000 км, а при тяжёлых режимах (прицепы, частые пробки, активная езда) лучше сокращать интервал до 40–50 тыс. км.","url":"https://vagway.by/akpp/8st/al1000/"}
      - {"question":"Нужно ли обязательно менять фильтр при замене масла?","answer":"Да, на AL1000 фильтр 0C8 325 435 – отдельный сервисный элемент, и при нормальном ТО со снятием поддона его рекомендуется менять вместе с прокладкой 0C8 321 371 и шайбой сливной пробки 0C8 321 181.","url":"https://akpphelp.ru/blog/obsluzhivanie-i-remont/zamena-atf-masla-v-akpp/zamena-masla-v-akpp-0c8-tr-80sdsn-video/"}
      - {"question":"Как правильно выставлять уровень ATF в AL1000?","answer":"Уровень контролируют через сливное/контрольное отверстие в поддоне: после заливки и прогонки по режимам коробка должна быть на горизонтальной площадке, двигатель работать на холостом ходу, температура ATF по сканеру – 35–45 °C. При открытой контрольной пробке лишнее масло вытекает до момента, когда поток переходит в частые капли – это и есть рабочий уровень.","url":"https://akpphelp.ru/blog/obsluzhivanie-i-remont/zamena-atf-masla-v-akpp/zamena-masla-v-akpp-0c8-tr-80sdsn-video/"}
      - {"question":"Какой реальный ресурс AL1000 при нормальном обслуживании?","answer":"По Otoba и профильным сервисам при регулярной замене масла и отсутствии жёстких перегревов AL1000 обычно ходит порядка 300–350 тыс. км до серьёзного ремонта.","url":"https://otoba.ru/transmissii/vag/al1000.html"}
