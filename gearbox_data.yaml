    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 8G-DCT / 724.1. Для этой коробки особенно опасно работать по памяти от 724.0.

      1. До заказа расходников обязательно проверьте VIN, datacard и точную версию коробки: обычная 724.1 и performance 724.115 отличаются по интервалам и могут путать сервисные данные.
      2. До начала работ уточните в WIS/XENTRY, какая именно жидкость и какая процедура уровня применима к данной машине.
      3. Слейте жидкость, точно зафиксируйте объём и работайте только в чистой зоне: коробка новая и чувствительная к загрязнению.
      4. У 724.1 сервисный набор включает несколько фильтрующих элементов, поэтому обслуживание нельзя сводить к замене одной «главной» вставки.
      5. Меняйте все фильтры и seals, которые предусмотрены оригинальным service kit для вашей ревизии.
      6. Не переносите на 8G-DCT логику контроля уровня от 7G-DCT: на части новых процедур используется ультразвуковой A1207D LevelGauge с XENTRY.
      7. После заливки выполните сервисную процедуру по XENTRY, затем выведите уровень в норму строго по заводскому алгоритму.
      8. После тест-драйва повторно проверьте отсутствие ошибок, перегрева, рывков и жалоб на включение передач.
