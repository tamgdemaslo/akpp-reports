      пробку 35 Н·м.

      5. Головкой 10 мм открутите 11 болтов, снимите поддон. Осмотрите магниты – толстый
      «ватный» слой металла указывает на износ шестерён, крупная сталь – на подшипники.

      6. Снимите пластиковый фильтр (3 болта), убедитесь, что старое уплотнительное
      кольцо вышло вместе с фильтром.

      7. Очистите поддон, при желании добавьте два дополнительных магнитных диска.

      8. Смажьте новое уплотнительное кольцо ATF, установите фильтр; затяжка 9–10
      Н·м.

      9. Новая прокладка → поддон; болты крест-накрест 10 Н·м.

      10. Через заливное отверстие шприцем залейте 5 л свежего WS.

      11. Запустите двигатель, удерживая тормоз, последовательно R → N → D → S → P
      (по 2 с).

      12. При 40 °C выверните сливную пробку: тонкая струйка – уровень ок, нет струи
      – долейте, мощная – дождитесь капель. Заверните пробку 35 Н·м.

      13. Тест-драйв 15 км с контролем температуры (<100 °C), после остывания убедитесь
      в отсутствии подтёков.

      '
    mistakes:
    - Проверка уровня при >45 °C – недолив; <38 °C – перелив.
    - Повторное использование прокладки поддона или шайбы – частые масляные сопли.
    - Применение ATF Dexron вместо WS вызывает пробуксовки и перегрев фрикционов.
