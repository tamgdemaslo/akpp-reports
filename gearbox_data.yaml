      Пробки / уплотнения:
        • точные OEM по заливной/контрольной и возможной сливной пробке без VIN и ревизии поддона в открытых каталогах надёжно не подтверждаются
        • чтобы не занести ошибочный код, в карточке они не фиксируются как точные OEM
    fluid: Motorcraft Mercon ULV (WSS-M2C949-A)
    fill_range: 96–101 °C (206–215 °F), двигатель работает, селектор «P», уровень проверяется по штатному индикатору
