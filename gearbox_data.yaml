      - мерная тара на 6–7 л
    parts_list:
      - ATF VW G 052 162 A2 8–9 л
      - фильтр 01L 325 429 A (или 01L 325 429 / 01L 325 429 B по VIN)
      - уплотнение фильтра 01L 325 443
      - прокладка поддона 01L 321 371
      - уплотнение заливной пробки 01V 321 379
    pan_bolts: T27, 9–12 Н·м (7–9 ft·lb) крест-накрест; два болта над катализатором — укорочённый бит
    drain_torque: по фактической ревизии
    fill_torque: заливная пробка — по ревизии; критична правильная процедура уровня
    procedure: |
      1. Подтвердите 01L (ZF 5HP24), выставьте автомобиль горизонтально.
      2. Обязательно проверьте, что заливная пробка (17 mm Allen) откручивается до слива.
      3. Убедитесь, что два болта поддона над катализатором доступны (укорочённый T27 или T25).
      4. Слейте ATF, снимите поддон; фильтр крепится двумя болтами к корпусу.
      5. Снимите старый фильтр с O-ring 01L 325 443, установите новый с новым уплотнением.
      6. Очистите поддон и магниты, оцените шлам.
      7. Установите прокладку 01L 321 371, затяните болты 9–12 Н·м крест-накрест.
      8. Заливка: АКПП при комнатной температуре (остыть за ночь). Заливайте через stand pipe до перелива.
      9. Запустите двигатель, пройдите селектором все диапазоны по 30 с, при 30–45 °C доливайте до перелива.
      10. Перед выключением установите заливную пробку с новым 01V 321 379.
    mistakes:
      - Заливать Dexron/Mercon или универсальную ATF вместо G 052 162 A2.
      - Сливать ATF, не проверив заранее заливную пробку.
      - Начинать заливку на прогретой коробке вместо ambient.
      - Проверять уровень вне 30–45 °C или на заглушённом двигателе.
      - Забыть новое уплотнение 01L 325 443 на фильтре.
    nuances:
      - У 01L нижний поддон, фильтр меняется при обычном ТО.
      - Уровень через stand pipe при 30–45 °C на работающем двигателе.
      - Два болта поддона закрыты катализатором — нужен укорочённый T27/T25.
      - «Lifetime» по Audi — миф; 25–40 тыс. км критично для ресурса.
    description: |
      **VAG 01L** — 5-ступенчатая АКПП ZF 5HP24 для продольных Audi A6, A8, S6, S8, RS6 quattro (1997–2004).

      Для мастера: **нижний поддон, фильтр сервисный, заливка жёстко привязана к температуре и stand pipe**. Audi декларирует «lifetime», но практика audipages и форумов однозначна: регулярная замена критична — забитый фильтр ведёт к cavitation помпы и свисту на холодном пуске.

      Особенности: заливная пробка 17 mm Allen, два болта над катализатором (укорочённый T27), заливка с холодной коробки, уровень 30–45 °C.
    weak_points: |
      **1. Cavitation помпы и свист на холодном пуске.**
      Забитый фильтр и деградировавшая ATF лишают помпу подачи. Замена только жидкости без фильтра недостаточна.

      **2. Миф о «lifetime» жидкости.**
      Практика: 25–40 тыс. км — разумный интервал. Игнорирование ведёт к засорению фильтра и кавитации.

      **3. Ошибка процедуры заливки.**
      Заливка с комнатной температуры, уровень при 30–45 °C на работающем двигателе. Нарушение даёт недолив/перелив.

      **4. Заливная пробка недоступна после слива.**
      До слива обязательно проверить, что заливная пробка откручивается.
    faq:
      - question: "Меняется ли фильтр при обычном ТО на 01L?"
        answer: "Да. У 01L нижний поддон, фильтр меняется. Основной OEM — 01L 325 429 A; варианты 01L 325 429 и 01L 325 429 B по серии/VIN."
        url: "https://audi-d2.com/docs/technical_maintenance/automatic_transmission/oil_and_filter_replacement"
      - question: "Какую ATF безопасно указывать?"
        answer: "Только VW G 052 162 A2. Audi не допускает универсальную ATF."
        url: "http://audipages.com/Tech_Articles/auto_transmission/autotranservicing.html"
      - question: "Сколько ATF готовить?"
        answer: "При сливе обычно 5,5–6,5 л. Иметь 8–9 л для полной заливки и level check."
        url: "https://audi-d2.com/docs/technical_maintenance/automatic_transmission/oil_and_filter_replacement"
      - question: "Почему заливку начинать с холодной коробки?"
        answer: "Уровень проверяется при 30–45 °C при работающем двигателе. Если стартовать с прогретой — невозможно корректно выставить уровень."
        url: "http://audipages.com/Tech_Articles/auto_transmission/autotranservicing.html"
      - question: "Свист на холодном пуске остаётся после сервиса?"
        answer: "Перепроверить уровень и процедуру. Если фильтр и жидкость заменены корректно — возможен износ помпы; одна замена масла не всегда устраняет."
        url: "https://www.audizine.com/forum/showthread.php/693879-Possible-transmission-pump-malfunction"
