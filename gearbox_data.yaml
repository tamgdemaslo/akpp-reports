      - {"question":"Сколько масла готовить на замену в AL750?","answer":"По gearboxlist полная ёмкость базовой модификации ~9,6 л, усиленной ~12,0 л. При стандартной частичной замене со снятием поддона и фильтра обычно сливается 5,5–6,0 л, поэтому разумно иметь 8–10 л ATF G 055 025 A2 с запасом.","url":"https://gearboxlist.com/volkswagen/al750/"}
      - {"question":"Через сколько менять масло в АКПП AL750?","answer":"Рекомендуемый интервал по открытым источникам — каждые 60 000 км. При тяжёлой эксплуатации (прицеп, бездорожье, агрессивная езда) лучше сокращать до 40–50 тыс. км.","url":"https://gearboxlist.com/volkswagen/al750/"}
      - {"question":"Меняется ли фильтр при обычном ТО на AL750?","answer":"Да. AL750 имеет нижний поддон и сервисный фильтр; при нормальном ТО со снятием поддона фильтр меняют обязательно. Конкретный OEM фильтра подбирается по VIN.","url":"https://gearboxlist.com/volkswagen/al750/"}
      - {"question":"При какой температуре выставлять уровень ATF в AL750?","answer":"Как и для других современных автоматов VAG, уровень выставляется через контрольное отверстие при температуре ATF порядка 35–45 °C на работающем двигателе и горизонтальном автомобиле, с ориентиром на тонкую струйку/частые капли.","url":"https://gearboxlist.com/volkswagen/al750/"}
