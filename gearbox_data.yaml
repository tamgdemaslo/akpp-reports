    procedure: |
      1. Подтвердите по VIN, что это именно AQ160 (Aisin TF-60SN) — обычно Polo Sedan, Jetta, часть Skoda с моторами до 1,6 л, и подготовьте ATF G 052 025 A2 и расходники по каталогу.
      2. Небольшой поездкой прогрейте коробку, затем установите автомобиль на подъёмник/яму строго горизонтально, переведите селектор в «P» и дайте коробке немного остыть до безопасной температуры.
      3. Снимите нижнюю защиту, обеспечьте доступ к поддону и сливной/контрольной пробке. До слива убедитесь, что заливка/контроль уровня доступны и пробка не «прикипела».
      4. Подставьте ёмкость не менее 8–10 л и аккуратно выверните наружную сливную/контрольную пробку. Дождитесь выхода основной струи масла.
      5. Если конструкция предусматривает внутреннюю переливную трубку, аккуратно выкрутите её и дайте стечь оставшемуся маслу из картера (в сумме при частичной замене обычно выходит около 5 л).
      6. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон и перенесите его на верстак, не проливая остатки масла.
      7. Снимите масляный фильтр АКПП, убедитесь, что старое уплотнение фильтра не осталось в посадочном гнезде. Оцените количество стружки и шлама на магнитах и в районе фильтра.
      8. Тщательно промойте поддон и магниты очистителем, удалите весь шлам и металлическую пыль, проверьте поддон на деформации и коррозию; при сомнительном состоянии поддон лучше заменить.
      9. Установите новый фильтр с новым уплотнением, затем установите новую прокладку поддона (или нанесите рекомендованный герметик, если используется вариант без прокладки).
      10. Соберите поддон, затягивая болты крест-накрест в несколько приёмов с моментами из ремонтного мануала для конкретной ревизии TF-60SN.
      11. Установите переливную трубку (если предусмотрена) и новую шайбу/уплотнение на сливную/контрольную пробку, заверните пробку от руки, оставив возможность для регулировки уровня.
      12. Через адаптер и насос залейте первую порцию ATF G 052 025 A2 объёмом порядка 5 л (ориентируясь на фактический слив и состояние коробки).
      13. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям P–R–N–D с паузой 2–3 секунды в каждом, затем верните в «P».
      14. С помощью сканера доведите температуру ATF до 35–45 °C. На работающем двигателе и при горизонтальном положении авто аккуратно выверните контрольную пробку и оцените поток из переливной трубки/отверстия.
      15. Если масла почти нет, дозаливайте ATF малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до капель.
      16. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем переключений и температур.
      17. На сильно загрязнённых коробках имеет смысл применять ступенчатую схему (повторный частичный слив/долив через 2–4 тыс. км) для мягкого обновления всего объёма ATF.
    mistakes:
      - Считать AQ160 «необслуживаемой» и не менять масло до появления жёстких толчков и ошибок по гидроблоку.
      - Заливать универсальное ATF или жидкости без явного допуска к G 052 025 A2, ориентируясь только на принадлежность к Aisin.
      - Ограничиваться сливом через пробку без снятия поддона, замены фильтра и чистки магнитов.
      - Выставлять уровень ATF без контроля температуры и процедуры через переливную трубку/контрольное отверстие.
      - Подбирать фильтр и прокладку только по коду AQ160/TF-60SN, а не по VIN и фактически установленной версии (09G/09K/09M).
    nuances: "AQ160 — облегчённая версия Aisin TF-60SN для моторов до 1,6 л (Polo, Jetta, Skoda), с полной ёмкостью около 7 л и штатным ATF G 052 025 A2. По конструкции это классический 6-ступенчатый гидроавтомат с нижним поддоном и сервисным фильтром. Судя по Otoba и профильным статьям, ресурс коробки при нормальном обслуживании оценивается примерно в 250 тыс. км, а основные проблемы связаны с перегревами, редкими заменами масла и засорением гидроблока. Дополнительная сложность — множество близких модификаций TF-60SN (09G/09K/09M, AQ250 и др.), поэтому расходники корректно подбирать только по VIN и конкретной версии."
    description: "VAG AQ160 — 6-ступенчатая поперечная АКПП Aisin TF-60SN, рассчитанная на двигатели до 1,6 л и момент до ~160 Н·м. Устанавливается на Polo Sedan, Jetta, ряд моделей Skoda и другие компактные автомобили VAG. Коробка имеет нижний поддон и сервисный фильтр, полная ёмкость около 7 л, штатная жидкость — ATF G 052 025 A2, интервал обслуживания ~60 тыс. км. Для сервиса важно не путать AQ160 с более «тяжёлыми» вариантами TF-60SN (AQ250, AQ260, AQ450) и подбирать фильтр/прокладку и прочие расходники строго по VIN. Типичные жалобы при редких заменах масла — толчки, задержки переключений и ошибки по гидроблоку из-за загрязнения соленоидов и каналов."
    weak_points: |
      1. Перегрев и старение ATF.
      В городском цикле и пробках ATF G 052 025 A2 в AQ160 быстро стареет, если его не менять по регламенту; это ведёт к износу фрикционов и соленоидов.
      
      2. Засорение гидроблока и соленоидов.
      Как и другие TF-60SN, AQ160 чувствительна к чистоте масла: шлам и мелкая стружка забивают гидроблок, вызывая толчки и задержки при переключениях.
      
      3. Износ втулок и масляного насоса.
      При эксплуатации на старом масле и перегревах страдают втулки и насос, что со временем приводит к падению давления и ошибкам по коробке.
      
      4. Чувствительность к уровню.
      Неправильный уровень ATF (особенно недолив) даёт пинки, пробуксовки и перегрев; перелив — вспенивание и нестабильную работу.
      
      5. Сложность подбора расходников по абстрактному коду.
      Семейство TF-60SN включает множество модификаций (09G/09K/09M, AQ250 и др.), поэтому фильтр, прокладку и крепёж для AQ160 нужно подбирать по VIN, а не просто по названию коробки.
