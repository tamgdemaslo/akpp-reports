      - сканер VCDS / OBD-II для считывания ATF-T
    parts_list:
      - ATF JWS-3309 5 л
      - прокладка поддона 09G 321 370
      - шайба 09D 321 181 B
      - фильтр приёмный (по форме заборника) + 2 винта Torx, если предусмотрены
      - при необходимости: пробка WHT 000 310 A
    pan_bolts: 22 × M6, класс 8.8
    drain_torque: 27 Н·м (наружная сливная пробка)
    fill_torque: 9 Н·м (болты поддона), 16 Н·м (внутр. стэндпайп после регулировки)
    procedure: |
      1. Прогрейте АКПП лёгкой поездкой до 35–40 °C (смотрите VCDS), поставьте авто горизонтально, селектор «P», ДВС заглушен.
      2. Снимите пластиковую защиту (Torx T25). Подставьте ёмкость ≥7 л.
      3. Выкрутите наружную пробку 5 мм — сольётся 0,3–0,5 л ATF.
      4. Тем же ключом выверните стэндпайп («чек») — вытечет ещё 3,5–4,5 л.
      5. Отверните 8 болтов поддона 10 мм, снимите поддон; промойте его и оба магнита до чистой салфетки.
      6. Снимите фильтр. Подберите новый по форме заборника (круглый / овальный / пластиковый с длинным или коротким заборником), установите, проследив за посадкой уплотнителя.
      7. Поставьте новую прокладку 09G 321 370 насухо, затяните болты крест-накрест 9 Н·м.
      8. Закрутите стэндпайп от руки + ¼ оборота, наружную пробку с новой шайбой — 27 Н·м.
      9. Через адаптер М10x1 залейте ровно слитый объём ATF (4–5 л).
      10. Запустите двигатель; удерживая тормоз, переключите P → R → N → D → S → D → N → R → P (пауза 3–4 с).
      11. При 35–45 °C снова открутите наружную пробку: излишки польются тонкой струйкой. Когда поток перейдёт в частые капли — уровень верный. Немедленно затяните пробку 27 Н·м.
      12. Очистите картер, установите защиту. Сделайте тест-драйв 10–15 км; ATF-T ≤ 90 °C, без рывков и ошибок блока «09».
    mistakes:
      - Перелив ATF — вспенивание, падение давления, сжигаются пакеты.
      - Заправка Dexron VI вместо JWS-3309 вызывает жёсткие переключения и перегрев.
      - Перетяжка болтов поддона >10 Н·м деформирует фланец и ведёт к течам.
      - Ошибка с фильтром: круглый/овальный заборник невзаимозаменяемы.
    nuances:
      - С 2014 г. корпус фильтра пластиковый, фетровый элемент, два варианта глубины: 32 мм (deep) и 25 мм (shallow).
      - На 09M с объёмами >2,5 л штатно стоит внешний радиатор; полный объём ATF больше на 0,5–0,7 л.
      - При проверке уровня двигатель должен работать, иначе получите недолив 0,6–0,8 л.
      - Герметик на резиновую прокладку не наносится.
    price_block: |
      Москва, I кв. 2025 г.  
