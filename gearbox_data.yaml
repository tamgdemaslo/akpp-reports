    procedure: |
      1. Подтвердите 01V (ZF 5HP19), выставьте автомобиль строго горизонтально.
      2. Прогрейте АКПП до рабочей температуры, подготовьте мерную тару и VAG 1924/насос.
      3. Слейте ATF через сливную пробку (момент затяжки около 40 Н·м), замените уплотнение 01V 321 377.
      4. Снимите поддон (T27), затем фильтр (болты T30). У 01V нижний поддон — фильтр меняется при ТО.
      5. Убедитесь, что уплотнение 01V 325 443 вышло вместе со старым фильтром. Установите новый фильтр с новым O-ring.
      6. Очистите поддон и магниты, оцените количество шлама и металлической пыли.
      7. Установите прокладку поддона 01V 321 371, соберите поддон. Момент болтов 9–12 Н·м крест-накрест.
      8. Заливка: через deflector cap — шланг вводится в отверстие крышки заливной трубки; не смещать крышку. Заливайте до перелива.
      9. Запустите двигатель, пройдите селектором все диапазоны, следите за температурой ATF по VCDS (блок 004).
      10. При 35–45 °C проверьте уровень через inspection plug; при необходимости долейте до стабильного подтекания струйкой.
      11. Установите inspection plug с новым уплотнением 01V 321 379. При отдельном сервисе final drive используйте масло 75W90 G 052 145 A2 (не ATF).
    mistakes:
      - Заливать Dexron, Mercon или универсальную ATF вместо G 052 162 A2.
      - Проверять уровень на заглушённом двигателе или вне диапазона 35–45 °C.
      - Забыть новое уплотнение 01V 325 443 на фильтре.
      - Спутать final drive и ATF-контур: у 01V главная передача обслуживается отдельно маслом 75W90.
      - Ожидать, что одна замена масла устранит старые проблемы соленоидов, valve body или протечки гидротрансформатора.
    nuances: "У 01V нижний поддон, фильтр меняется при обычном ТО. Заливка через deflector cap — шланг вводится в отверстие крышки заливной трубки, крышку не смещать. Уровень выставляется только при 35–45 °C на работающем двигателе, по VCDS (блок 004). У 01V, как и у 01N, отдельная главная передача с маслом 75W90 G 052 145 A2 — не путать с ATF."
    description: "VAG 01V — это 5-ступенчатая АКПП ZF 5HP19 (5HP19FL/FLA) для поперечной компоновки: Volkswagen Passat, Audi A4, A6, A8, Allroad, S4 (примерно 1996–2006 гг.). Для мастера по замене масла важно: нижний поддон, фильтр сервисный и меняется при ТО; уровень ATF выставляется только при 35–45 °C на работающем двигателе через inspection plug. Заливка идёт через deflector cap в крышке заливной трубки. У 01V, как и у 01N, главная передача имеет отдельный контур с маслом 75W90 G 052 145 A2, не ATF. По форумам Passatworld, VWVortex и профильным статьям типичные споры после сервиса связаны с уровнем, посадкой фильтра и ожиданиями, что замена масла решит старые проблемы соленоидов или изношенного valve body."
    weak_points: |
      1. Соленоиды и valve body.
      На форумах регулярно встречаются неисправности соленоидов (N88–N90, N216–N218), типичные коды P2716, P1814/P1815. Перед дорогостоящим ремонтом проверяют разъём 16-pin между valve body и жгутом на коррозию, а также блок TCM под ковриком на влагу.
      
      2. Протечка гидротрансформатора.
      При утечке масла между мотором и коробкой часто виноваты износ сальника вала ГТД и втулки насоса; простая замена масла это не устраняет.
      
      3. Ошибки по уровню после сервиса.
      Коробка чувствительна к процедуре проверки уровня: 35–45 °C, работающий двигатель, автомобиль строго горизонтален. Недолив даёт пинки и пробуксовку, перелив — вспенивание и перегрев.
      
      4. Путаница между final drive и ATF.
      У 01V final drive — отдельная зона с маслом 75W90; доливать туда ATF нельзя.
      
      5. Игнорирование интервала замены.
      Несмотря на заявления о «lifetime», практика форумов и ZF показывает, что замена каждые 30–40 тыс. км (или чаще в тяжёлом режиме) существенно продлевает ресурс.
