      8. Через заливное отверстие залейте 5 л свежего LG-6.

      9. Запустите двигатель; при нажатой педали тормоза последовательно переведите
      селектор по всем диапазонам, задерживаясь 2–3 с.

      10. При температуре 30–35 °C доливайте ATF, пока из заливного отверстия не пойдёт
      ровная лёгкая струйка.

      11. Закрутите заливную пробку 8 Н·м, протрите корпус, установите защиту.

      12. Выполните тест-драйв 10 км, проверьте коробку на отсутствие подтёков.

