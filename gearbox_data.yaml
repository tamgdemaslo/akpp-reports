    procedure: |
      1. Подтвердите модификацию: BMW A5S440Z или VAG 01L/5HP24A.
      2. Перед сливом обязательно проверьте, что заливная пробка откручивается.
      3. Слейте ATF в мерную тару, снимите поддон, очистите поддон и магниты.
      4. Снимите фильтр, проверьте удаление старого уплотнения.
      5. Установите новый фильтр и нужное уплотнение по ветке (BMW/VAG).
      6. Поставьте новую прокладку поддона, затяните болты крест-накрест ~10 Н·м.
      7. Установите сливную пробку с новым уплотнением.
      8. Заполните коробку стартовым объемом ATF, запустите двигатель, пройдите селектором все режимы.
      9. Доливайте ATF и выставляйте уровень только в температурном окне 30-45°C на работающем двигателе.
      10. Закройте пробки, выполните тест-драйв, перепроверьте уровень и отсутствие течей.
    mistakes:
      - Смешивать OEM от BMW 5HP24 и VAG 01L без проверки VIN.
      - Лить ATF без класса LT 71141/G 052 162 A2.
      - Проверять уровень вне температурного окна.
      - Сливать масло, не убедившись, что заливная пробка откручивается.
      - Не менять уплотнение фильтра при установке нового фильтра.
      - Перетягивать болты поддона и деформировать фланец.
    nuances: |
      Для 5HP24 критичны чистота ATF и точный уровень; большинство жалоб после сервиса связано именно с уровнем.
      У VAG 01L часто встречается практический нюанс с труднодоступными болтами поддона у катализатора и контролем уровня через stand pipe.
      По OEM у 5HP24 есть разделение между BMW и VAG, поэтому в карточке оставлены обе ветки с краткими пояснениями по применяемости.
    description: |
      ZF 5HP24 - тяжелая 5-ступенчатая АКПП для мощных V8/W12 автомобилей. Встречается как BMW A5S440Z (E38/E39/E53) и как VAG 01L/5HP24A (A6/A8/Phaeton).
      
      Коробка ресурсная при корректном обслуживании, но чувствительна к перегреву и старому маслу: загрязнение быстро влияет на гидроблок, ГТД и качество переключений.
      
      Ключевая задача при ТО - точный подбор OEM под конкретную ветку и строгое выставление уровня ATF по температуре.
    weak_points: |
      1) Износ гидроблока/соленоидов на грязной ATF.
      2) Износ блокировки ГТД и рост продуктов износа в масле.
      3) Ошибки по уровню после неверной температурной процедуры.
      4) Возрастные течи по поддону и уплотнениям.
      5) На мощных авто - повышенная нагрузка на барабаны/пакеты при агрессивной езде.
    faq:
