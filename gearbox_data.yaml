    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.4. Для большинства применений коробка обслуживается через нижний поддон и трубку щупа, а финальный контроль уровня выполняется только на горячую.
      
      1. До начала работ убедитесь, что трубка щупа доступна и позволяет без проблем залить ATF обратно.
      2. Поставьте автомобиль в горизонталь и проверните двигатель, чтобы вывести сливную пробку гидротрансформатора.
      3. Слейте ATF из гидротрансформатора и поддона, обязательно зафиксировав суммарный объём.
      4. Снимите нижний малый 6-болтовый поддон: у 722.4 фильтр сервисный, поэтому при обычном ТО он меняется.
      5. Очистите поддон, магнит и зону привалочной плоскости, оцените количество шлама и металлической пыли.
      6. Снимите фильтр, убедитесь, что старое уплотнение не осталось в посадке, и установите новый фильтр без перекоса.
      7. Установите новую прокладку именно от 722.4 и затяните болты поддона малым моментом без перетяжки.
      8. Залейте объём, близкий к фактически слитому, затем пройдите селектором все диапазоны.
      9. Доведите коробку до полностью горячего состояния и выставьте уровень по щупу без спешки.
      10. После тест-драйва повторно проверьте герметичность поддона и характер включения задней, а также переключений 1-2 и 2-3.
    mistakes:
      - "Ставить прокладку от 722.3 на 722.4 только потому, что фильтр у них общий."
      - "Перетянуть болты малого поддона и потом искать причину течи в сальниках или корпусе."
      - "Не слить гидротрансформатор и потом обещать клиенту полноценное обновление ATF."
      - "Игнорировать старые жалобы на жёсткие переключения и reverse-delay до обслуживания."
      - "Пытаться оценивать уровень на недогретой коробке."
    nuances: |
      У Mercedes 722.4 нижний поддон, значит фильтр при стандартном ТО меняется.
      Это более компактная коробка, чем 722.3, с малым 6-болтовым поддоном, и именно поэтому по ней особенно легко перепутать прокладку при заказе универсального kit.
      Для качественного сервиса желательно сливать и поддон, и гидротрансформатор, а не ограничиваться только быстрым сливом из поддона.
      По форумам 722.4 нередко имеет жёстковатые переключения уже по своей старой гидромеханической логике, особенно на холодную, поэтому мастеру важно отделять нормальную конструктивную жёсткость от симптомов низкого уровня, вакуумных проблем и внутреннего износа.
    description: |
      **Mercedes 722.4** — компактная 4-ступенчатая гидромеханическая АКПП, которую чаще всего встречают на более «лёгких» Mercedes семейства W201/W124.
      
      Для мастера по замене масла это коробка не про редкие расходники, а про аккуратную сервисную идентификацию: поддон у неё нижний и маленький, фильтр меняется на обычном ТО, а главная ловушка — перепутать прокладку поддона с близкой по семейству `722.3`.
      
      По самой логике обслуживания `722.4` довольно понятна: слив из гидротрансформатора, снятие поддона, замена фильтра, новая прокладка, горячая проверка уровня. Но именно на этой простоте сервисы и ошибаются, когда спешат, не фиксируют объём и потом получают спорные жалобы на жёсткие переключения.
      
      Для сайта и практики такую коробку лучше описывать честно: фильтр здесь сервисный и меняется, а качество результата после ТО в первую очередь зависит от правильного набора деталей, отсутствия перетяжки поддона и точной проверки уровня на горячую.
    weak_points: |
      **1. Жёсткие переключения 1-2 и 2-3 не всегда «последствие замены масла».**
      По форумам по 722.4 владельцы часто приходят с уже существующей жёсткостью переключений. Для мастера это значит, что поведение коробки нужно фиксировать до ТО, иначе старую проблему потом легко свяжут с сервисом.
      
      **2. Reverse-delay и проблемы с задней передачей нельзя обещать «вылечить» одной заменой ATF.**
      В обсуждениях по 722.4 встречаются случаи, где за задержкой задней уже стоят внутренние проблемы B3/гидравлики. Для сервиса это важная граница ожиданий клиента.
      
      **3. Слишком жёсткая работа может идти не только от коробки, но и от вакуумной/регулировочной части.**
      На профильных форумах по 722.4 регулярно обсуждают modulator, Bowden и базовые регулировки. Поэтому если после замены масла коробка продолжает бить передачи, мастеру важно не зацикливаться только на ATF.
      
      **4. Ошибка с прокладкой и течь после сборки — типичный сервисный риск.**
      Фильтр у `722.3` и `722.4` часто продают рядом, а вот прокладки разные. Это один из самых практичных рисков именно для сервиса по замене масла.
    faq:
      - question: "Меняется ли фильтр на Mercedes 722.4 при обычном ТО?"
        answer: "Да. У 722.4 нижний поддон, поэтому фильтр сервисный и меняется при стандартном обслуживании."
        url: "https://www.benzworld.org/threads/best-trans-pan-gasket-and-filter-where-to-buy.1748609/?sortby=oldest&u=392686"
      - question: "Фильтр у 722.3 и 722.4 один и тот же?"
        answer: "Чаще всего да, по открытым источникам стабильно повторяется OEM фильтра 126 277 02 95. Но прокладка поддона у 722.4 другая, и именно здесь сервисы чаще ошибаются."
        url: "https://www.transmissionpartsdistributors.com/722-3-722-4-transmission-filter-fits-mercedes-benz-81-95-126-277-0295/"
      - question: "Нужно ли сливать гидротрансформатор на 722.4?"
        answer: "Если задача — сделать нормальное ТО, а не просто освежить часть жидкости, то да. Иначе обновится только часть ATF из поддона."
        url: "https://www.benzworld.org/threads/transmission-service-fluid-capacity-w124.1402066/"
      - question: "Что проверять первым делом, если после сервиса коробка жёстко переключает?"
        answer: "Сначала уровень ATF на горячую, затем правильность комплекта фильтра/прокладки и отсутствие течи. Если с этим всё в порядке, уже смотреть вакуумный модуль, Bowden и старые внутренние проблемы коробки."
        url: "https://www.benzworld.org/threads/722-4-slightly-hard-shift-in-1st-and-2nd.3120270/"
