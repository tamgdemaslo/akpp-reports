    procedure: |
      1. Подтвердите точную ветку 5HP19 по VIN/коду коробки: BMW A5S325Z или VAG 01V/01L. От этого зависят OEM фильтра и прокладки.
      2. Прогрейте коробку, поставьте автомобиль строго горизонтально.
      3. Слейте ATF через сливную пробку в мерную тару, зафиксируйте объем слива.
      4. Снимите поддон, очистите поддон и магниты, оцените количество продуктов износа.
      5. Снимите фильтр, убедитесь, что старое уплотнение полностью извлечено.
      6. Установите новый фильтр и новые уплотнения (особенно на VAG 01V/01L: 01V 325 443).
      7. Установите новую прокладку поддона: BMW 24 10 1 423 380 или VAG 01V 321 371.
      8. Соберите поддон, затяните болты крест-накрест небольшим моментом (обычно около 10 Н·м).
      9. Залейте стартовый объем свежей ATF (обычно 5-6 л), запустите двигатель и пройдите селектором все режимы.
      10. Выставьте уровень при контролируемой температуре ATF (обычно 35-45°C) на работающем двигателе.
      11. При необходимости долейте до правильного уровня, установите пробки с новыми уплотнениями.
      12. Сделайте тест-драйв, затем перепроверьте уровень и отсутствие течей.
    mistakes:
      - Путать расходники BMW A5S325Z и VAG 01V/01L.
      - Заливать универсальную ATF без класса LT 71141 / G 052 162 A2.
      - Выставлять уровень без контроля температуры ATF.
      - Перетягивать болты поддона и деформировать кромку.
      - Не менять уплотнение фильтра на VAG-ветке.
      - Игнорировать состояние магнитов и шлама при вскрытии поддона.
    nuances: |
      5HP19 - это семейство с разными исполнениями. Главная сервисная ошибка - применять один и тот же набор OEM ко всем версиям без проверки VIN.
      Для VAG 01V/01L в практике часто фигурирует контроль уровня при 35-45°C и отдельное внимание к уплотнениям 01V 321 377/379.
      Для BMW A5S325Z удобно опираться на OEM-комплект 24 15 2 333 915, где уже согласованы фильтр, прокладка, пробки и жидкость.
      После замены ATF типичные жалобы почти всегда связаны с уровнем, а не с самим новым маслом.
    description: |
      ZF 5HP19 - массовая 5-ступенчатая АКПП конца 90-х и начала 2000-х. Встречается в разных версиях: BMW A5S325Z, VAG 01V/01L (5HP19FL/FLA).
      
      По механике коробка достаточно живучая, но критична к чистоте ATF и корректному уровню. При плановом сервисе обычно снимают поддон, меняют фильтр/прокладку, очищают магниты и выставляют уровень по температуре.
      
      Для практики важно учитывать, что OEM-номера отличаются между ветками BMW и VAG. Поэтому в карточке приведены оба набора с короткими пометками по применению.
    weak_points: |
      1) Износ гидроблока и соленоидов при старой/грязной ATF.
      2) Проблемы блокировки ГТД и загрязнение масла продуктами износа.
      3) Ошибки по уровню после неправильной термопроцедуры.
      4) Возрастные течи по прокладке поддона и уплотнениям пробок.
      5) Неверный подбор фильтра/прокладки из-за смешения модификаций 5HP19.
