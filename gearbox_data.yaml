    procedure: |
      1. Подтвердите, что перед вами именно Mercedes 725.0 / 9G-Tronic, подготовьте 236.17 и поставьте автомобиль строго в горизонталь.
      2. Снимите защиты и теплоэкран, слейте масло через пробку поддона.
      3. Спецключом 725 589 00 09 00 или эквивалентом переведите контрольный стакан/регулировочную трубку из положения №1 в положение №4, чтобы открыть максимальный слив из поддона.
      4. Снимите поддон-фильтр, очистите магниты и оцените объём шлама. Для 725.0 это важный диагностический этап: коробка очень чувствительна к грязной ATF.
      5. Если делаете расширенный слив и на конкретной машине есть пробка ГТД, проверните коленвал до появления пробки в смотровом окне и слейте масло из гидротрансформатора. Не обещайте этот шаг вслепую без фактической проверки на автомобиле.
      6. Установите новый поддон-фильтр 725 270 37 07. При необходимости сразу обновите переливную трубку 725 271 21 01 и направляющую трубку 725 271 61 00.
      7. Поставьте 10 новых болтов 002 990 95 03 и тяните поддон крест-накрест. В открытых сервисных инструкциях по 725.0 стабильно встречается схема 4 Н·м + доворот 90 градусов.
      8. Перед первичной заливкой верните регулировочную трубку в положение №1 и подключите заливочный адаптер 725 589 00 90 00.
      9. После обычного снятия поддона удобно начинать примерно с 6 литров; если реально слит и гидротрансформатор, готовьте до 9-10 литров и доливайте по температуре.
      10. Запустите двигатель, удерживая тормоз, и спокойно пройдите селектором все диапазоны с короткой задержкой.
      11. Для финальной коррекции уровня переведите стакан в положение №3 и при 35-45 °C, на работающем двигателе, дождитесь перехода струи в частые капли.
      12. Закройте систему, выполните тест-драйв и повторно проверьте герметичность, температуру и качество переключений.
    mistakes:
      - "Лить универсальную ATF или мешать 236.17 с неподтверждёнными жидкостями."
      - "Менять только масло, но оставлять старый поддон-фильтр на коробке с интегрированным фильтром."
      - "Пытаться выставить уровень без контроля температуры и без работы с положениями стакана."
      - "Считать, что на любой 725.0 обязательно есть одинаково обслуживаемая пробка ГТД."
      - "Игнорировать магниты и состояние слитой ATF, а затем списывать все жалобы только на свежую замену масла."
    nuances: |
      У 725.0 нет привычного щупа: уровень задаётся через регулируемую переливную систему, и именно ошибка по процедуре чаще всего даёт спорные симптомы сразу после сервиса.
      В практических сервисных отчётах по 725.0 для финальной коррекции уровня чаще встречается положение стакана №3 и окно 35-45 °C. В отдельных англоязычных инструкциях встречаются и другие контрольные режимы через диагностику, поэтому для сложных или спорных VIN безопаснее доверять актуальному Xentry.
      Поддон-фильтр у этой коробки сервисный и дорогой, но экономить на нём обычно выходит дороже: мехатроник 725.0 очень чувствителен к грязной жидкости и продуктам износа.
      По открытым каталогам хорошо подтверждаются OEM поддона, болтов, пробки поддона и сервисных трубок, а вот единый безопасный номер расходников для пробки ГТД без VIN фиксируется хуже, поэтому по ней лучше делать подтверждение по месту.
    description: |
      **Mercedes 725.0 / 9G-Tronic** - это 9-ступенчатый продольный гидроавтомат семейства NAG3, который с 2014 года ставится почти на весь современный ряд Mercedes с задним и полным приводом. Для сервиса важнее всего не маркетинговое название, а сама логика коробки: интегрированный фильтр в пластиковом поддоне, регулируемый контрольный стакан вместо привычного щупа и высокая чувствительность мехатроника к чистоте ATF.

      По устройству коробка современная и непростая: четыре планетарных ряда, несколько пакетов сцеплений, электронно-гидравлическое управление и отдельные нюансы по сливу/уровню, которых мастер после 722.6 или 722.9 может не ожидать. Именно поэтому по `725.0` нельзя работать по шаблону "слил сколько вышло, столько же залил".

      Для сайта и заказ-наряда safest-база такая: ATF только с допуском **MB 236.17**, поддон-фильтр **725 270 37 07**, болты поддона **002 990 95 03**, пробка поддона **725 271 18 01**. Дополнительно в практике сервиса часто меняют переливную трубку **725 271 21 01** и направляющую трубку **725 271 61 00**.

      Отдельно важный нюанс этой коробки - возможность более полного слива через гидротрансформатор на части машин. В ряде практических отчётов по 725.0 этот слив реально выполняют через пробку ГТД после проворота коленвала, но обещать его как абсолютно универсальную операцию без осмотра конкретной машины не стоит.
    weak_points: |
      **1. Чувствительность к грязной ATF и низкому уровню.** Для `725.0` это базовая проблема: продукты износа быстро бьют по мехатронику, соленоидам и гидроплите, а коробка начинает пинаться, тянуть переключения или уходить в аварийный режим.

      **2. Давление и электроника мехатроника.** По профильным материалам и сервисной практике у коробки встречаются проблемы по датчику давления, плате управления и связанным ошибкам по давлению/обучению передач. Симптомы - сброс в нейтраль, аварийный режим, задержка включения D/R, плохое включение задней передачи.

      **3. Пинки ранних лет и капризная адаптация.** На ранних ревизиях 725.0 регулярно описываются рывки и жёсткие переключения; в части случаев помогает обновление ПО, адаптация или сервис по маслу, но универсального "одного лекарства" нет.

      **4. Насосы, втулки и гидротрансформатор страдают, если тянуть с обслуживанием.** Когда коробка долго ездит на грязной ATF, дальше уже страдают не только каналы мехатроника, но и насосы, фрикционы ГТД, втулки и уплотнения. Поэтому для этой АКПП профилактика действительно дешевле ремонта.
    faq:
      - question: "Какое масло безопасно указывать для Mercedes 725.0?"
        answer: "Если нужен один понятный и безопасный ориентир для сайта и заказа, указывайте только ATF с допуском MB 236.17. По подтверждаемым OEM-номерам в открытых каталогах стабильно встречаются 002 989 06 03 13 и более ранний/альтернативный 001 989 92 03 11."
        url: "https://www.fcpeuro.com/products/mercedes-automatic-transmission-fluid-genuine-mercedes-002989060313"
      - question: "Фильтр у 725.0 меняется отдельно или только с поддоном?"
        answer: "Для обычного сервиса фильтр идёт вместе с пластиковым поддоном. Базовый актуальный OEM-комплект - 725 270 37 07; в кроссах он заменяет несколько ранних ревизий."
        url: "https://www.europaparts.com/at-oil-pan-filter-kit-7252703707.html"
      - question: "Какой комплект кроме поддона обычно нужен на нормальное ТО?"
        answer: "Практически полезно сразу иметь 10 новых болтов 002 990 95 03, пробку поддона 725 271 18 01, а также часто обновляемые сервисные трубки 725 271 21 01 и 725 271 61 00."
        url: "https://www.fcpeuro.com/products/mercedes-auto-trans-pan-overflow-pipe-genuine-mercedes-7252712101"
      - question: "Можно ли на 725.0 слить масло ещё и из гидротрансформатора?"
        answer: "Да, в практических отчётах по 725.0 такой слив встречается: коленвал проворачивают до появления пробки в смотровом окне и сливают ГТД. Но не стоит обещать это как одинаковую операцию для любой машины без фактической проверки конкретного автомобиля."
        url: "https://www.motulteam.ru/mercedes-benz-gls-9g-tronic-7250"
      - question: "Как правильно выставлять уровень после замены масла?"
        answer: "Для сервисной процедуры по 725.0 обычно используют регулировочную трубку: положение №1 для первичной заправки, положение №4 для усиленного слива из поддона и положение №3 для финальной коррекции уровня при 35-45 °C на работающем двигателе."
        url: "https://www.motulteam.ru/mercedes-benz-g-class-w463-9g-tronic-7250"
      - question: "Сколько масла готовить на обслуживание?"
        answer: "После обычного снятия поддона удобно иметь около 6 литров, а если реально сливается и гидротрансформатор - готовьте 9-10 литров. Полный объём коробки в открытых источниках чаще всего указан как 9,9 литра."
        url: "https://otoba.ru/transmissii/mercedes/9g-tronic-725-0.html"
    procedure_id: "MERCEDES_725.0"
