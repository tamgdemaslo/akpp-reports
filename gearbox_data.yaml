    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.5. Коробка редкая, поэтому перед работой особенно важно подтвердить ревизию и не ориентироваться на универсальные карты от 722.6.
      
      1. До начала работ проверьте доступ к контрольной трубке щупа и убедитесь, что сможете корректно выставить уровень по горячему.
      2. Слейте масло из поддона и обязательно замерьте фактический объём.
      3. Если на вашей ревизии присутствует сливная пробка гидротрансформатора, проверните двигатель и слейте ATF также из гидротрансформатора.
      4. Снимите нижний поддон: у 722.5 фильтр сервисный, поэтому на обычном ТО он меняется.
      5. Очистите поддон и магнит, оцените количество шлама и наличие металлической пыли.
      6. Снимите фильтр, убедитесь, что старое уплотнение не осталось в посадке, и установите новый фильтр без перекоса.
      7. Установите новую прокладку поддона и затяните болты малым моментом без перетяжки.
      8. Залейте объём, близкий к фактически слитому, затем пройдите селектором все диапазоны.
      9. Доведите АКПП до полностью горячего состояния и точно выставьте уровень по щупу.
      10. После тест-драйва повторно проверьте герметичность поддона и оцените характер переключений 1-2, 2-3 и включения 5-й/овердрайва.
