    summary: DQ200 | 1,7–1,9 л gear-oil + 1,0 л hydraulics | 30 / 16 Н·м | G060726A2 + G004000M2 | фикс. объём
    oem_codes: |
      gear-oil  (механическая часть)    G 060 726 A2  
        старые коды  G 052 512 A2 / G 052 171 A2
      hydraulic oil (мехатроника)       G 004 000 M2  (зелёная CHF-жидкость)
      пробка gear-oil   WHT 005 623 A   (М14×1,5, шестигран 10 мм, с алюмин. кольцом)  
      пробка hydraulics N 909 654 01    (М12×1,5, шестигран 8 мм / Torx T45, с Al-кольцом)
      фильтр коробки    — нет съёмного; сетка в мехатронике меняется только при её ремонте
    fluid:
      - Gear-oil – GL-4 75W, допуск VW G 060 726 A2
      - Hydraulic – CHF-жидкость, допуск VW G 004 000 M2
    fill_range: уровень задаётся точным литражом; контроля по температуре нет
    drain_volume: |
      0AM  (2008–2013)   – 1,70 л gear-oil + ≈1,0 л hydraulics  
      0BM  (2014+)       – 1,90 л gear-oil + ≈1,0 л hydraulics
    dry_capacity: 2,8 – 3,0 л (в обеих полостях суммарно)
    service_interval: 60 000 км / 4 года (40 000 км – тяжёлый цикл)
    tools:
      - подъёмник / ровная яма
      - шестигран 10 мм (М14 gear-oil)
      - шестигран 8 мм или Torx T45 (М12 hydraulics – смотреть ревизию)
      - шприц-насос ≥2 л и шланг Ø10 мм (заливка через сапун-бризер)
      - динамометрический ключ 2 – 50 Н·м
      - мерная канистра 2 л + пробирка 100 мл для точного объёма
    parts_list:
      - G060726A2 2 л   (1,7 / 1,9 л + запас)
      - G004000M2 1,0 л
      - пробка WHT005623A
      - пробка N90965401
    drain_torque: |
      30 Н·м  – М14 gear-oil  
      16 Н·м  – М12 hydraulics
    fill_torque: 3 Н·м (колпачок сапуна-бризера)
    procedure: |
      1. Прогрейте DSG обычной ездой до 30–40 °C (VCDS → 02 → Group 19). Авто горизонтально, селектор «P», ручник, снять защиту мотора.
      
      2. Слив gear-oil (механика):  
        • Подставить тару ≥ 3 л, выкрутить М14 × 1,5 (10 мм шестигран). Сольётся 1,7 – 1,9 л.  
        • Очистить магнит, заменить шайбу, временно наживить новую пробку.
      
      3. Слив hydraulics (мехатроника):  
        • Рядом, в нижней части алюмин. корпуса мехатроники, открутить М12 × 1,5 (8 мм HEX / T45). Выйдет 0,8 – 1,0 л зелёной CHF.  
        • Очистить резьбу, установить новую пробку с шайбой 16 Н·м.
      
      4. Заливка gear-oil:  
        • Сверху за АКБ снять колпачок сапуна-бризера Ø10 мм. Шприцем залить ровно 1,70 л (0AM) либо 1,90 л (0BM) G060726A2.  
        • Установить колпачок, затянуть «от руки + ¼» (≈ 3 Н·м).
      
      5. Заливка hydraulics:  
        Вариант А – тем же сапуном: добавить 1,0 л G004000M2.  
        Вариант Б – снизу в отверстие М12 до момента, когда жидкость начнёт выходить обратной струйкой, затем сразу закрутить пробку.
      
      6. Прокачка: запустить двигатель, удерживая тормоз, переключить P → R → N → D → S → D → N → R → P, задерживаясь по 3 с. Проверить отсутствие течей.
      
      7. Адаптация: VCDS → 02 – Basic Settings → Block 61 и 63, выполнить «Clutch & Gear Learn».
      
      8. Контрольный тест: 10 км спокойного хода; температура DSG-oil ≤ 90 °C, ошибок в блоке «02» нет, картер сухой.
    mistakes:
      - Перелив > 0,2 л вызывает вспенивание, ошибки «P17BF Давление в линии».
      - Смешивание старого и нового масла при доливке «на глаз»; сливайте полностью и заливайте паспортный объём.
      - Забыли заменить алюминиевые шайбы – появится «потение» за 2–3 тыс. км.
    nuances:
      - Фильтр механической части отсутствует; внутренняя сетка в мехатронике обслуживается только при её разборке.  
      - Gear-oil и гидрожидкость – две РАЗНЫЕ полости, у каждой своя спецификация и пробка.  
      - На ранних 0AM иногда стоит пластиковый сапун без колпачка; замените его на актуальный номер 0BH 301 491 для более плотного уплотнения.  
      - После серьёзных течей всегда меняйте оба объёма, даже если по регламенту «зелёнка» считается lifetime.
