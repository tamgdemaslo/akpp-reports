         • Запустите двигатель; при нажатом тормозе последовательно пройдите селектором все диапазоны с паузой 2–3 с.  
         • Прогрейте коробку до рабочей температуры ATF (70–90 °C).

      6. Контроль уровня:
         • На прогретой АКПП, при работающем двигателе и селекторе в P/N проверьте уровень по щупу.  
         • При недоливе доливайте небольшими порциями; при переливе откачайте излишек через щуп.  

      7. Завершение:
         • Очистите корпус от следов масла, установите защиту, проведите тест‑драйв.  
         • При необходимости повторите контроль уровня и убедитесь в отсутствии подтёков.
    mistakes:
      - Использование ATF без уточнения допусков по VIN.
      - Игнорирование прогрева и контроля температуры при проверке уровня.
      - Перетяжка болтов поддона и сливной пробки.
      - Повторное использование одноразовых уплотнений.
