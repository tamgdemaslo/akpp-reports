    pan_bolts: нет съёмного нижнего поддона (только боковой картер, не демонтируем)
    drain_torque: 49 Н·м (ист. A) / 51 Н·м (ист. B)
    fill_torque: 29 Н·м (ист. A) / 35 Н·м (ист. B)
    procedure: '1. Прогрейте трансмиссию до ~40 °С, поставьте авто на ровную площадку,
      стояночный тормоз затянуть.

      2. Снимите защиту двигателя-кпп. Убедитесь, что заливная пробка HEX 10 мм откручивается.

      3. Подставьте ёмкость и открутите сливную пробку 24 мм; дайте ATF стечь 10 мин.

      4. Выверните внутр. переливную втулку – сольётся ещё ~0,3 л.

      5. Очистите магнит сливной пробки; установите новую шайбу 90430-18008.

      6. Вверните втулку обратно, затем сливную пробку, затяните 49–51 Н·м.

      7. Через заливное отверстие с новой шайбой 90430-10008 закачайте 3,2–3,9 л свежего
      ATF WS.

      8. Запустите двигатель, удерживая тормоз; попеременно переведите селектор во
      все положения с паузой 3 с, вернитесь в «P».

      9. При 38–42 °С открутите сливную пробку; когда из отверстия вытечет тонкая
      струйка и перейдёт в капли, немедленно заверните втулку и пробку 29–35 Н·м.

      10. Сотрите следы ATF, установите защиту двигателя, сбросьте счётчик обслуживания
      (если ведётся).

      11. Выполните тест-драйв 10 км, проверьте отсутствие течей.

      '
    mistakes:
    - Слив ATF без предварительного ослабления заливной пробки.
    - Заливка «на глаз» без контроля температуры через Techstream.
    - Повторное использование алюминиевых шайб – приводит к подтёкам.
    - Применение иных жидкостей (T-IV, «универсальное ATF») вместо WS.
    - Перетяжка сливной пробки → срез резьбы в корпусе.
    nuances:
    - Фильтр встроенный и несъёмный; при частичной замене он не обслуживается.
    - Боковой картер (side pan) содержит гидроблок; его не снимают для плановой замены
      ATF.
    - Снятие переливной втулки критично для корректного уровня.
    - При полном приводе (U880F) объём слива увеличивается ≈ +0,4 л.
    - Без Techstream можно ориентироваться на мигание «AT OIL TEMP» (см. T-SB-0006-19).
