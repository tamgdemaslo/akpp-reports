    procedure: |
      1. Прогрейте коробку короткой поездкой, затем установите автомобиль строго горизонтально и снимите защиту.  
      2. На штатной Ford-версии отдельной сливной пробки обычно нет, поэтому слив выполняйте через аккуратное снятие нижнего поддона.  
      3. Ослабьте болты поддона, оставив несколько болтов с одной стороны наживлёнными, чтобы направить поток ATF в ёмкость.  
      4. После основного слива полностью снимите поддон, зафиксируйте объём слитой жидкости и очистите магниты.  
      5. Снимите старый фильтр и установите новый XS4Z-7A098-AC; если используется маздовский каталог, его эквивалент — FN01-21-500.  
      6. Установите прокладку поддона по VIN/ревизии, верните поддон на место и затяните болты крест-накрест 10–11 Н·м.  
      7. Через трубку щупа залейте объём, близкий к слитому, затем запустите двигатель и, удерживая тормоз, последовательно переведите селектор по всем диапазонам с паузой 2–3 секунды.  
      8. Доведите ATF до полностью прогретого состояния, ориентируясь на рабочую температуру; коробка должна быть на холостом ходу, селектор в «P».  
      9. Проверьте уровень по штатному щупу, доливая жидкость малыми порциями до нормальной зоны hot.  
      10. Очистите корпус от следов масла, выполните тест-драйв и повторно проверьте уровень и отсутствие подтёков.
    mistakes:
      - Использование Mazda M-V/M5 вместо Ford-спецификации или смешивание ATF без подтверждения по мануалу.
      - Попытка обслужить фильтр без снятия нижнего поддона.
      - Перетяжка болтов поддона выше 11 Н·м → деформация фланца и течи.
      - Проверка уровня на непрогретой коробке или на наклонённом автомобиле.
      - Агрессивная аппаратная промывка сильно изношенной коробки за один цикл.
    nuances:
      - У 4F27E нижний поддон, поэтому фильтр сервисный и при обычном ТО меняется вместе со снятием поддона.
      - Штатный Ford-поддон чаще всего без сливной пробки; наличие пробки обычно означает Mazda-поддон или нештатный aftermarket pan.
      - Для Ford сегодня безопаснее ориентироваться на актуальный Ford ATF chart с Mercon LV, но в ранних мануалах и на старых канистрах встречается Mercon V.
