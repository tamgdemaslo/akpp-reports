    procedure: |
      1. Подтвердите, что перед вами 01L (ZF 5HP24), выставьте автомобиль строго горизонтально.
      2. До слива обязательно проверьте, что заливная пробка (17 mm Allen) откручивается.
      3. Убедитесь, что два болта поддона над катализатором доступны (укорочённый T27 или T25) — иначе придётся снимать выхлоп.
      4. Слейте ATF через сливную пробку, затем снимите поддон. Фильтр крепится двумя болтами к корпусу АКПП.
      5. Снимите старый фильтр, убедитесь, что уплотнение 01L 325 443 вышло. Установите новый фильтр с новым O-ring 01L 325 443.
      6. Очистите поддон и магниты, оцените шлам и металлическую пыль.
      7. Установите прокладку 01L 321 371, соберите поддон. Момент болтов 9–12 Н·м, крест-накрест.
      8. Заливка: коробка должна быть при комнатной температуре (остыть). Заливайте через stand pipe до перелива.
      9. Запустите двигатель, пройдите селектором все диапазоны по ~30 с, доливайте при 30–45 °C до перелива.
      10. Перед выключением двигателя установите заливную пробку с новым 01V 321 379 и затяните.
    mistakes:
      - Заливать Dexron, Mercon или любую ATF вместо G 052 162 A2.
      - Сливать ATF, не проверив заранее, что заливная пробка откручивается.
      - Начинать заливку на прогретой коробке вместо холодной (ambient).
      - Проверять уровень вне 30–45 °C или на заглушённом двигателе.
      - Забыть новое уплотнение 01L 325 443 на фильтре.
      - Обещать, что замена масла устранит cavitation/свист помпы при уже забитом фильтре и изношенной гидросистеме.
    nuances: "У 01L нижний поддон, фильтр меняется при обычном ТО. Уровень выставляется через stand pipe в поддоне; процедура жёстко привязана к температуре 30–45 °C и работающему двигателю. Два болта поддона закрыты катализатором: нужен укорочённый T27 или T25. Audi декларирует ATF «lifetime», но практика — замена каждые 25–40 тыс. км/миль, иначе забитый фильтр и деградация жидкости ведут к кавитации помпы и свисту на холодном пуске."
    description: "VAG 01L — 5-ступенчатая АКПП ZF 5HP24 для продольных полноприводных Audi (A6, A8, S6, S8, RS6 quattro 1997–2004) и Volkswagen Phaeton W12. Нижний поддон, сервисный фильтр при ТО, процедура заливки привязана к температуре и stand pipe. Audi называет жидкость «пожизненной», но регулярная замена критична: забитый фильтр и старая ATF ведут к кавитации помпы, свисту на холодном пуске и риску дорогого ремонта. Заливная пробка 17 mm Allen, два болта поддона над катализатором (укорочённый T27), заливка с холодной коробки, уровень 30–45 °C при работающем двигателе."
    weak_points: |
      1. Кавитация помпы и свист на холодном пуске.
      Забитый фильтр и деградировавшая ATF ухудшают подачу гидропомпы, особенно на холодную — характерный свист при пуске. Замена только жидкости без фильтра недостаточна; при уже имеющемся свисте проверять фильтр и магниты.
      
      2. Миф о «lifetime» жидкости.
      Audi не назначает интервал замены официально, но 25–40 тыс. км — разумный практический интервал. Игнорирование ведёт к засорению фильтра и риску кавитации.
      
      3. Ошибка процедуры заливки.
      Заливка должна начинаться с коробки при комнатной температуре. Уровень проверяется при 30–45 °C на работающем двигателе через stand pipe. Нарушение даёт недолив/перелив и жалобы после ТО.
      
      4. Гидротрансформатор и пакет A.
      На мощных моторах ГТД и входной барабан (пакет A) — слабые места; при агрессивной езде возможен износ фрикционов и стопорного кольца барабана. Масляный насос на больших пробегах изнашивается.
      
      5. Заливная пробка недоступна после слива.
      Критично до слива убедиться, что заливная пробка (17 mm Allen) откручивается — иначе слить можно, залить нет.
    faq:
      - {"question":"Меняется ли фильтр при обычном ТО на 01L?","answer":"Да. У 01L нижний поддон, фильтр сервисный и меняется при нормальном ТО. Основной OEM — 01L 325 429 A; для ранних A8 1997 DPZ — 01L 325 429; для A6/A8 2000–2004 — часто 01L 325 429 B. Сверять по VIN.","url":"https://audi-d2.com/docs/technical_maintenance/automatic_transmission/oil_and_filter_replacement"}
      - {"question":"Какую ATF безопасно указывать для 01L?","answer":"Только VW G 052 162 A2. Audi не допускает универсальную ATF для 01L.","url":"http://audipages.com/Tech_Articles/auto_transmission/autotranservicing.html"}
      - {"question":"Сколько ATF готовить на сервис?","answer":"При сливе с поддоном обычно выходит 5,5–6,5 л. Иметь 8–9 л для заливки и долива при проверке уровня.","url":"https://audi-d2.com/docs/technical_maintenance/automatic_transmission/oil_and_filter_replacement"}
      - {"question":"Почему заливку нужно начинать с холодной коробки?","answer":"Процедура предполагает достижение 30–45 °C при работающем двигателе во время финальной проверки уровня. Если стартовать с прогретой коробки, корректно выставить уровень невозможно.","url":"http://audipages.com/Tech_Articles/auto_transmission/autotranservicing.html"}
      - {"question":"Что делать, если после сервиса свист на холодном пуске остаётся?","answer":"Перепроверить уровень и процедуру. Если фильтр и жидкость заменены корректно, а свист сохраняется — вероятен износ помпы или гидросистемы; одна замена масла не всегда это устраняет.","url":"https://wiki.ross-tech.com/wiki/index.php/5-Speed_Automatic_Transmission_(01L_/_5HP24)"}
