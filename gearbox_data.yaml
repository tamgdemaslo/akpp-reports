      Недолив/перелив быстро отражается на переключениях.

      4. Подтеки поддона/пробок.
      Обычно из-за старых шайб и прокладки.

      5. Термо-нагрузка в 4WD.
      При буксировке и бездорожье масло стареет быстрее.
