    procedure: |
      1. Подтвердите, что коробка именно ZF 5HP30/A5S560Z.
      2. Выставьте автомобиль строго горизонтально и прогрейте АКПП до рабочей температуры.
      3. До слива проверьте, что обе пробки поддона откручиваются (M24 и M30 по ревизии).
      4. Слейте масло, снимите поддон, очистите поддон и магниты.
      5. Снимите фильтр и старый O-ring, установите новый фильтр 24 34 1 422 419 с новым 24 34 1 422 152.
      6. Установите новую прокладку 24 11 1 421 140, соберите поддон.
      7. Затяните болты поддона моментом 10 Н·м (по мануалу ZF).
      8. Пробка M24x1.5 затягивается 50 Н·м, пробка M30x1.5 - 100 Н·м (по мануалу ZF).
      9. Залейте стартовый объем свежей ATF, запустите двигатель и пройдите селектором все диапазоны.
      10. Выставьте уровень по температурной процедуре производителя автомобиля (обычно окно 30-50°C), затем выполните тест-драйв и повторную проверку.
    mistakes:
      - Путать моменты затяжки пробок M24 и M30.
      - Лить универсальную ATF без класса LT 71141.
      - Не менять O-ring фильтра при замене фильтра.
      - Проверять уровень без контроля температуры ATF.
      - Перетягивать болты поддона выше 10 Н·м.
      - Ограничиваться только доливом без снятия поддона и очистки магнитов.
    nuances: |
      У 5HP30 важный нетипичный момент - два разных резьбовых узла пробок поддона (M24x1.5 и M30x1.5) с сильно разными моментами затяжки.
      Большинство проблем после сервиса связано с неверным уровнем или ошибкой по моментам затяжки, а не с самим фактом замены ATF.
      Для коробок с большим пробегом полезно фиксировать объем слива и состояние магнитов: это дает ранние признаки износа ГТД/гидросистемы.
    description: |
      ZF 5HP30 (BMW A5S560Z) - тяжелая 5-ступенчатая АКПП для мощных заднеприводных автомобилей с высоким крутящим моментом. Коробка считается прочной, но чувствительна к чистоте ATF и правильной процедуре обслуживания.
      
      В практическом сервисе ключевые пункты: замена фильтра и прокладки поддона, обязательная очистка магнитов, а затем точная выставка уровня по температуре.
      
      При обслуживании этой модели особенно важно не перепутать пробки и моменты затяжки: по заводскому мануалу M24 и M30 тянутся по-разному.
    weak_points: |
      1) Износ фрикциона блокировки ГТД и загрязнение ATF.
      2) Рост вибраций и износ ступичных/опорных элементов на больших пробегах.
      3) Износ барабана A+C (Forward/Reverse) при тяжелой эксплуатации.
      4) Возрастная деградация соленоидов и гидроплиты после загрязнения масла.
      5) Ошибки после ТО из-за неверного уровня или неправильных моментов по пробкам.
