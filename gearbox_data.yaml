    procedure: |
      1. Убедитесь, что на машине именно ZF 4HP18 (Audi 100/A6 C4/A8 D2 с кодами 01F/01K) и подготовьте ATF по допускам ZF (Total Fluide AT42/LT71141), новый фильтр и прокладку поддона под конкретный VIN.
      2. Лёгкой поездкой прогрейте коробку до рабочей температуры, затем установите автомобиль на строго горизонтальную площадку, переведите селектор в «P» и дайте узлу чуть остыть, чтобы масло не было обжигающе горячим.
      3. Снимите нижнюю защиту, очистите область поддона от грязи, подготовьте ёмкость для слива объёмом не менее 10 л.
      4. Аккуратно открутите сливную/контрольную пробку поддона и слейте первую порцию ATF; ориентировочно уйдёт около 1–2 л.
      5. После первичного слива снимите болты поддона, придерживая его, и аккуратно опустите, не проливая остатки жидкости. Оставшееся масло (до ~3–4 л суммарно) стечёт в ёмкость.
      6. Снимите старый фильтр, оцените наличие стружки и шлама на магните и в поддоне, очистите поддон и магниты очистителем тормозов до чистого металла.
      7. Установите новый масляный фильтр 4HP18, убедившись, что уплотнительное кольцо встало ровно и старое кольцо не осталось в посадочном гнезде.
      8. Установите новую прокладку поддона на очищенный поддон, совместите все отверстия и аккуратно смонтируйте поддон на коробку; болты затяните крест‑накрест с моментом из ремонтного мануала (без «перетяга»).
      9. Установите сливную/контрольную пробку с новой шайбой (если предусмотрена) и слегка подтяните – окончательная протяжка будет после выставления уровня.
      10. Через заливное/контрольное отверстие поддона либо через штатный заливной штуцер подайте в коробку первую порцию ATF (ориентировочно 3,5–4,5 л, чуть больше объёма слива).
      11. Запустите двигатель, удерживая тормоз, и последовательно переведите селектор по всем положениям P–R–N–D с паузой по 2–3 секунды в каждом, затем оставьте селектор в «N» (многие профильные инструкции для 4HP18 рекомендуют контроль уровня именно на нейтрали).
      12. С помощью сканера или внешнего термометра контролируйте температуру ATF; при диапазоне 35–40 °C открутите контрольную пробку и проверьте, идёт ли из отверстия струйка масла.
      13. Если масло не вытекает, дозаливайте небольшими порциями через заливное отверстие и повторяйте проверку: правильным считается уровень, при котором при 35–40 °C из отверстия идёт стабильный поток, переходящий в частые капли при закрытии пробки.
      14. После выставления уровня окончательно затяните пробку по моменту из мануала, установите на место все защиты и выполните тест‑драйв с плавными разгоном и торможением, проверяя отсутствие пинков и посторонних шумов.
      15. При сильно уставшем масле и большом пробеге целесообразно через 2–3 тысячи километров повторить частичную замену для более мягкого обновления оставшегося объёма ATF.
    mistakes:
      - Считать 4HP18 необслуживаемой и ездить на заводском ATF до первых серьёзных пинков и пробуксовок.
      - Лить любой Dexron III без оглядки на допуски ZF и историю обслуживания коробки, особенно если раньше использовался Dexron II или ATF уровня LT71141.
      - Ограничиваться только сливом через пробку без снятия поддона, чистки магнитов и замены фильтра.
      - Выставлять уровень на произвольной температуре и положении селектора, не соблюдая окно ~35–40 °C и работу на нейтрали/паркинге по мануалу.
      - Перетягивать болты поддона и пробки без динамометрического ключа, повреждая резьбу в корпусе.
      - Игнорировать наличие стружки и шлама в поддоне, продолжая эксплуатацию без дальнейшей диагностики и ремонта.
    nuances: |
      4HP18 – классический «старой школы» ZF: простая по электронике, но чувствительная к чистоте масла и правильному уровню. При частых заменах ATF и аккуратной езде коробка реально ходит до 300–400 тыс. км, однако рано или поздно всё равно требует переборки с заменой фрикционов, ленты и втулок.
      Коробка существует в нескольких вариантах (4HP18Q, 4HP18FL, 4HP18FLE, 4HP18FLA), поэтому по Audi встречаются разные каталожные номера фильтров и прокладок; безопаснее сразу привязывать комплект к VIN, а не к абстрактному «018».
      По маслу важен не только бренд, но и соблюдение спецификаций ZF (TE-ML 11A/11B, LT71141/AT42). Слишком «современные» низковязкие ATF для 6–8‑ступенчатых автоматов сюда не подходят.
      Часть жёстких переключений на уставших коробках связана не только с железом, но и с настройками троса/гидравлики и состоянием клапанной плиты; при ТО полезно оценить не только масло, но и общее поведение автомата под нагрузкой.
    description: |
      VAG 018 в привязке к старшим Audi – это семейство 4‑ступенчатых гидроавтоматов ZF 4HP18 (в вариантах 4HP18FLE/4HP18FLA), которые под внутренними кодами 01F/01K ставились на Audi 100 C4, A6 C4 и A8 D2. Это классическая конструкция с гидротрансформатором, планетарными рядами и гидравлическим управлением, рассчитанная на моторы до ~3.0 л и момент до 280–350 Н·м.
      По данным Otoba и профильных сервисов полный объём масла в системе около 8–8,3 л, но за стандартную частичную замену при снятии поддона и фильтра удаётся обновить порядка 4 л. Производитель формально допускал большой ресурс и мягкий подход к замене ATF, но практика показала, что реальный комфорт и ресурс достигаются при регулярном сервисе каждые 60–70 тыс. км.
      Основные проблемы этой коробки связаны с естественным старением: износ фрикционов, ленты, втулок насоса и турбинного вала, разрушение демпферной пружины поршня ленты. Однако при своевременных заменах масла и корректной работе с уровнем 4HP18 остаётся надёжным и предсказуемым автоматом, который хорошо знаком профильным мастерским.
    weak_points: |
      1. Естественный износ фрикционов, ленты и втулок.
      Даже при хорошем уходе 4HP18 к большим пробегам требует переборки: страдают фрикционы, тормозная лента, втулки насоса и турбинного вала, возможны трещины поршней и проблемы с промежуточным валом.
      
      2. Демпферная пружина поршня тормозной ленты.
      В профильных описаниях как типичная болячка фигурирует разрушение пружины поршня ленты: это даёт толчки, пробуксовки и в итоге ведёт к серьёзному ремонту.
      
      3. Чувствительность к грязному или неправильному маслу.
      Если лить случайный Dexron без оглядки на допуски ZF и не менять его десятками тысяч километров, гидроблок и фрикционы быстро отвечают рывками, пинками и перегревами.
      
      4. Возраст и усталость клапанной плиты.
      С течением времени пружины и элементы клапанной плиты слабеют, что проявляется жёсткими переключениями (особенно 4–3 и 3–2) и общей «задумчивостью» автомата.
      
      5. Типичные возрастные течи и износ уплотнений.
      Со временем дубеют уплотнения и сальники, появляются течи, особенно если коробка долго работала на перегретом или старом ATF.
    faq:
      - {"question":"Какое масло безопасно указывать для ZF 4HP18 на Audi?","answer":"Для карты коробки лучше ориентироваться на ATF уровня Total Fluide AT42 или Esso/Mobil LT71141 с допусками ZF TE-ML 11A/11B, а не на абстрактный «любой Dexron». Конкретный артикул VAG масла стоит подбирать по VIN.","url":"https://otoba.ru/transmissii/zf/4hp18.html"}
      - {"question":"Сколько масла нужно на обслуживание АКПП 4HP18?","answer":"Полная ёмкость системы около 8–8,3 л, но при обычной частичной замене со снятием поддона и фильтра реально сливается примерно 3,5–4,5 л. Поэтому на сервис лучше иметь 6–8 л ATF, чтобы хватило на заливку и возможную корректировку уровня.","url":"https://akpp.guru/modeli/4hp18"}
      - {"question":"Через какой пробег менять масло в 4HP18?","answer":"Практический ориентир – каждые 60–70 тыс. км или 4–5 лет. При тяжёлой городской эксплуатации и буксировке прицепа интервал разумно сокращать.","url":"https://wikers.ru/akpp/zf/4hp18.html"}
      - {"question":"Нужно ли менять фильтр при замене масла?","answer":"Да, при нормальном ТО 4HP18 имеет смысл всегда совмещать замену ATF со снятием поддона, чисткой магнитов и заменой фильтра – это ключ к ресурсу гидроблока и фрикционов.","url":"https://akpp.guru/modeli/4hp18"}
      - {"question":"Как выставить правильный уровень масла в 4HP18?","answer":"Типовая схема: залить до начала вытекания из контрольного отверстия, прогреть коробку до 35–40 °C, на работающем двигателе и селекторе в «N» ещё раз открыть контрольную пробку и при необходимости дозалить до устойчивой струйки, переходящей в частые капли.","url":"https://www.audi-club.ru/threads/pravilnyj-uroven-masla-v-korobke-4hp18.270285/"}
