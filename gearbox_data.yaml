      - {"question":"Сколько масла выходит при частичной замене?","answer":"Обычно 4,0–5,0 л, полный объем коробки около 7,5 л.","url":"https://otoba.ru/transmissii/vag/01j.html"}
      - {"question":"Нужно ли менять фильтр при обслуживании?","answer":"Да, по регламенту вместе с маслом обновляют и масляный фильтр вариатора (часто используется 01J 301 517 D, сверка по VIN обязательна).","url":"https://otoba.ru/transmissii/vag/01j.html"}
      - {"question":"Почему вариатор начинает пинаться после 100 тыс. км?","answer":"Частые причины: вытяжка цепи, загрязнение гидроблока продуктами износа фрикционов и перегрев масла.","url":"https://otoba.ru/transmissii/vag/01j.html"}
      - {"question":"Можно ли буксировать авто с заглушенным мотором?","answer":"Нет, для Multitronic это риск задиров конусов и ускоренного износа коробки.","url":"https://otoba.ru/transmissii/vag/01j.html"}
