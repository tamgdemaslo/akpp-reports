      - {"question":"Какой класс ATF нужен для 6HP32?","answer":"Жидкость класса ZF Lifeguard 6 (TE-ML 11).","url":"https://akppcenter.com/zf/6hp32"}
      - {"question":"Сколько масла готовить на сервис?","answer":"Обычно 7-9 л, так как при одном сервисном цикле обновляется около 6-6.5 л.","url":"https://akppcenter.com/zf/6hp32"}
