    procedure: '1. Прогрейте коробку, контролируя ATF до ~40 °С, установите авто на
      горизонтальную площадку, стояночный тормоз затянуть.

      2. Снимите защиту картера. Перед сливом убедитесь, что заливная пробка (HEX
      10 мм) откручивается.

      3. Подставьте ёмкость и открутите сливную пробку 24 мм; дайте ATF полностью
      стечь (≈10 мин).

      4. Выверните переливную трубку-втулку из сливного отверстия – сольётся ещё 0,3–0,5
      л.

      5. Снимите 18 болтов поддона, аккуратно отделите поддон, очистите его и магниты.

      6. Демонтируйте фильтр; установите новый, затянув его болты 8 Н·м.

      7. Установите новую прокладку, поддон – затяжка болтов крест-накрест 8 Н·м.

      8. Вверните переливную трубку и сливную пробку с новой шайбой, затяните 39–43
      Н·м.

      9. Через заливное отверстие закачайте 3,5–4,0 л свежего ATF WS.

      10. Запустите двигатель, последовательно переведите рычаг во все положения с
      паузой 3 с, вернитесь в «P».

      11. Мониторя температуру (43–46 °С), открутите сливную пробку, дайте излишку
      ATF вытечь тонкой струёй, затем заверните переливную трубку и пробку 29–35 Н·м.

      12. Очистите поверхность, проверьте на течи, установите защиту картера, выполните
      тест-драйв 10 км и повторную проверку на подтёки.

      '
    mistakes:
    - Слив масла без предварительного ослабления заливной пробки.
    - Заправка ATF «на глаз» без контроля температуры Techstream.
    - Повторное использование алюминиевых шайб — течи через 500–1000 км.
    - Перетяжка болтов поддона, ведёт к короблению фланца.
    - Применение ATF T-IV или универсальных жидкостей вместо WS.
    nuances:
    - На U760E 2015+ встречаются два варианта фильтра разной высоты – проверять по
      VIN.
    - Объём слива у полноприводных U660F/U760F иной (до 4,5 л).
    - Переливная трубка задаёт уровень; снятие трубки увеличит объём слива.
    - Без Techstream можно использовать «AT OIL TEMP» мигание по T-SB-0132-12.
    - Менять фильтр каждые 2 смены ATF, а после 200 000 км – при каждой.
    price_block: 'ATF WS 4 л канистра          5 500–6 500 ₽ (нужно ≈1 канистра)

