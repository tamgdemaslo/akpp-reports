    nuances: |
      Mercedes 8G-DCT / 724.1 — коробка, по которой в открытых источниках мало действительно надёжных данных, и поэтому сервис без VIN здесь особенно рискован.
      По оригинальным kit-описаниям у неё несколько сервисных фильтров и seals, значит это не коробка с «необслуживаемым фильтром до снятия КПП».
      Главное отличие от 7G-DCT для мастера по маслу — ещё более жёсткая привязка к конкретной процедуре XENTRY/WIS и новой логике проверки уровня.
      Именно поэтому по 724.1 правильный сервис — это не «слить и залить», а VIN-specific работа с комплектом фильтров, корректной жидкостью и точным измерением уровня.
    description: |
      **Mercedes 8G-DCT / 724.1** — это уже следующее поколение поперечных преселективных коробок Mercedes, и по сервисной логике она заметно капризнее и менее «интуитивна», чем `7G-DCT`.

      Для мастера по замене масла здесь главный риск в том, что открытые источники часто смешивают обычную `724.1`, performance-версию `724.115`, разные интервалы и даже разные указания по жидкости. Поэтому эту коробку нельзя обслуживать по памяти или по одной красивой интернет-карточке без проверки по `VIN/datacard`.

      Хорошая новость в том, что фильтры у `8G-DCT` сервисные: оригинальные наборы для `724.1` включают сразу несколько фильтрующих элементов и уплотнения. Плохая — контроль уровня и сама процедура уже заметно сложнее, а на части ревизий мастеру нужен `A1207D LevelGauge` и `XENTRY`, а не старый подход «по щупу и температуре как на 724.0».

      На практике `8G-DCT` стоит воспринимать как коробку, где аккуратность сервиса важна не меньше самой жидкости: правильный комплект фильтров, правильный допуск, точная процедура уровня и честное объяснение клиенту, что software/adaptation или исполнительные проблемы не всегда лечатся одной заменой масла.
    weak_points: |
      **1. Самая опасная ошибка по 724.1 — обслужить не ту ревизию не тем комплектом.**
      По форумам и открытым kit-описаниям легко перепутать обычную `724.1` и performance `724.115`, а вместе с этим — интервал, объём и сервисную логику. Для мастера это главный организационный риск ещё до начала работ.

      **2. Неправильный уровень и неправильная процедура проверки здесь критичны.**
      На части обсуждений по 8G-DCT прямо указывается, что для новых машин нужен `A1207D` и `XENTRY`, а не старая схема от предыдущих DCT. Это ключевой риск возврата после ТО.

      **3. Фильтров несколько, и неполный сервис легко выглядит как «масло поменяли, а стало хуже».**
      Если заменить только один элемент и оставить остальное старым, мастер получает полумеру вместо полноценного ТО. Для 724.1 это особенно опасно, потому что открытые наборы и каталоги описывают комплект по-разному.

      **4. Жалобы по software, adaptation и работе в трафике нельзя автоматически списывать на старое масло.**
      По немногочисленным форумным отзывам коробка ещё молодая, но уже видны кейсы, где жалобы лежат на стыке software, адаптаций и эксплуатационного режима. Для сервиса это значит: фиксировать исходные симптомы до работ и не обещать лишнего.
    faq:
      - question: "Меняются ли фильтры на Mercedes 8G-DCT при обычном ТО?"
        answer: "Да. По оригинальным service kit для 724.1 коробка обслуживается набором из нескольких фильтрующих элементов и seals, то есть это не история про один скрытый фильтр, который меняется только при снятии КПП."
        url: "https://mercedesgenuineparts.co.uk/products/genuine-mercedes-benz-724-1-automatic-gearbox-service-kit"
      - question: "Какие OEM фильтров по 8G-DCT подтверждаются лучше всего?"
        answer: "По открытым OEM-источникам наиболее уверенно подтверждаются 247 370 16 05, 247 370 82 01 и 247 370 17 05. Но поскольку 724.1 использует несколько фильтрующих элементов, заказывать их безопаснее как VIN-specific service kit."
        url: "https://www.autohausaz.com/pn/MB-2473701605"
      - question: "Почему по жидкости и интервалу по 8G-DCT столько расхождений?"
        answer: "Потому что в открытых обсуждениях смешиваются обычная 724.1, performance 724.115 и разные рынки. Для мастера безопасная позиция одна: проверять допуск жидкости и интервал по VIN/datacard, а не по усреднённому совету с форума."
        url: "https://www.aclassclub.co.uk/threads/8g-dct-724-1-info.23685/"
      - question: "Что важнее всего для мастера после замены масла на 8G-DCT?"
        answer: "Не только объём, а правильная заводская процедура контроля уровня. По новым обсуждениям часть 724.1 уже требует A1207D LevelGauge и XENTRY, и именно здесь чаще всего закладывается риск спорного результата после сервиса."
        url: "https://acs-international.com/instruments/software-and-applications/application/a1207d-levelgauge/"
