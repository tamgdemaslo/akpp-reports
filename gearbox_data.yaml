      5. Зафиксируйте объём слитого ATF (≈ 3,5–4,0 л). Установите новое кольцо и затяните пробку ≈ 38 Н·м.  
      6. Через щуп-трубку воронкой или насосом залейте слитый объём + 0,2–0,3 л.  
      7. Запустите двигатель, удерживая тормоз; проведите селектор: P→R→N→D→2→L→D→N→R→P (2 с в каждой).  
      8. Доведите TFT до 70–80 °C. На ХХ выньте, протрите и снова вставьте щуп:  
        • Уровень между метками HOT L–F — норма.  
        • Ниже L — доливайте по 0,1 л до уровня.  
        • Выше F — откачайте лишнее шприцем через щуп.  
      9. Вставьте щуп и затяните Torx T40 8–10 Н·м.  
      10. Обезжирьте картер, установите защиту и опустите авто.  
      11. Тест-драйв: 10 км при 60–80 км/ч до TFT ≈ 85 °C; проверьте отсутствие подтёков и стабильность уровня.
    mistakes:
      - Проверка уровня < 70 °C → недолив (открыта термотрубка)  
      - Проверка уровня > 80 °C → перелив (тепловое расширение)  
      - Недолив/перелив → вспенивание, падение давления, проскальзывание фрикционов  
      - Перетяжка пробок > 45 Н·м → повреждение резьбы
    nuances:
      - Фильтр встроен и меняется только при капитальном ремонте гидроблока  
      - Щуп-пробка задаёт высоту контрольного уровня  
      - Процедура подходит для всех FWD-версий A4AF3
