    procedure: |
      1. Прогрейте коробку поездкой до 35–45 °C (VCDS → MVB 19). Поставьте авто горизонтально, селектор «P», ручник; снимите защиту мотора.
      2. Слив: подставить ёмкость ≥ 8 л, выкрутить сливную пробку HEX 10 мм — сольётся ≈0,6 л. Тем же ключом 8 мм вывернуть трубку-«сноркель» — выйдут ещё ≈ 5 л. Дождаться «капель», очистить магнит, подготовить новую шайбу.
      3. Фильтр: сверху под АКБ открутить крышку 32 мм, вынуть старый узел; установить новый 0BH 325 183 B, предварительно смазав O-Ring, затянуть 20 Н·м.
      4. Сборка снизу: вкрутить «сноркель» 3 Н·м; вместо пробки — заливной адаптер M24 × 1,5.
      5. Заливка: через адаптер подать ровно слитый объём (обычно 5,6 ± 0,2 л) DSG-жидкости. Давление ≤ 0,5 бар.
      6. Прокачка: ДВС запущен, тормоз нажат; селектор P → R → N → D → S → D → N → R → P, задерживаясь по 3 с.
      7. Проверка уровня: при 35–45 °C открыть адаптер. Излишек должен течь струйкой и перейти в капли. Как пошли капли — уровень OK. Закрутить «сноркель» 3 Н·м, новую пробку с кольцом 45 Н·м.
      8. Адаптация сцеплений: VCDS → Basic Settings → группа 61 (Clutch / Gear Learn).
      9. Тест-драйв 15 км без кик-дауна; ATF < 100 °C, переключения плавные, ошибок в блоке 0BH/0BT/0DL нет.
    mistakes:
      - Перелив > 0,2 л → вспенивание, DTC P17BF / P17D8.
      - Использование ATF или «универсальных DCT» без допуска G 055 529 A2.
      - Перетяжка пластиковой крышки фильтра > 25 Н·м — срыв резьбы в корпусе.
      - Проверка уровня вне 35–45 °C — неверный результат.
      - Не выполнить адаптацию сцеплений после замены — коробка дёргает.
    nuances: "Узел фильтра поставляется в сборе (корпус + картридж); только вставку не меняют. Масло G 055 529 A2 совместимо с G 052 182 A2, но смешивать жидкости разных производителей нежелательно. После замены всегда стирайте адаптации сцеплений. Поддон не снимается при ТО — фильтр сверху под АКБ. Варианты: 0BH (PQ35), 0DL (MQB), 0BT (Transporter)."
    description: "DQ500 (0BH / 0DL / 0BT) — 7-ступенчатая преселективная DSG с двумя мокрыми сцеплениями, до 500–600 Н·м. Применения: VW Tiguan, Passat B8, Arteon, Transporter T5/T6, Teramont; Audi Q3, RS Q3, RS3, TT RS; Skoda Kodiaq; Seat Alhambra и др. Поддон при замене масла не снимается: слив через сливную пробку и вывернутый «сноркель». Фильтр при ТО меняется — расположен сверху под АКБ (крышка 32 мм). Уровень строго при 35–45 °C, обязательная адаптация сцеплений после замены."
    weak_points: |
      1. Загрязнение соленоидов мехатроника — продукты износа сцеплений; толчки при переключениях. Регулярная замена масла и фильтра снижает риск.
      2. Перегрев платы мехатроника — забитый теплообменник, агрессивная езда; плата не ремонтируется, только замена узла.
      3. Датчики давления — на 100–150 тыс. км нередко отказ одного датчика; пропадают чётные или нечётные передачи.
      4. Дифференциал и шлицы — при тюнинге и жёсткой эксплуатации возможен срез шлицев; на Transporter T5 частая проблема.
      5. Износ сцепления — вибрации при старте, пробуксовка; нечётные 1/3/5/7 страдают первыми.
    faq:
      - {"question":"Меняется ли фильтр при обычном ТО на DQ500?","answer":"Да. Фильтр сверху под АКБ (крышка 32 мм), не в поддоне. Меняют узел 0BH 325 183 B в сборе с O-Ring. Поддон не снимается.","url":"https://otoba.ru/transmissii/vag/dq500.html"}
