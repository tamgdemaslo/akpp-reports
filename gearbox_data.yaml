    procedure: |
      1. Подтвердите по VIN/шильду, что установлена VL381 (0AW), и подготовьте G 052 516 A2 и фильтр 0AW301516H.
      2. Прогрейте вариатор поездкой, установите авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару (обычно около 6,3 л).
      4. Снимите поддон, очистите магниты, замените фильтр вариатора и уплотнения по каталогу.
      5. Установите поддон, затяните крепеж крест-накрест по моментам мануала ревизии.
      6. Через сервисное отверстие залейте объем, равный слитому.
      7. Запустите двигатель, удерживая тормоз, плавно переведите селектор по всем положениям.
      8. Контролируйте температуру CVT сканером. При 35–45 °C выполните контроль уровня: правильный уровень — тонкая струйка и переход в капли.
      9. Если не течет — долейте малыми порциями; при переливе дождитесь перехода в капли и закройте пробку.
      10. Выполните тест-драйв 10–15 км, проверьте отсутствие течей. Дополнительно обновите масло переднего дифференциала по регламенту.
    mistakes:
      - Использование жидкости не по спецификации G 052 516 A2.
      - Проверка уровня без контроля температуры CVT.
      - Редкая замена масла и фильтра при городской эксплуатации.
      - Игнорирование перегрева и состояния радиаторов/теплообменника.
      - Буксировка автомобиля с заглушенным мотором (риск задиров конусов).
    nuances: "VL381 (0AW) стал надежнее 0AN, но сохраняет чувствительность к перегреву и грязному маслу. Типичный неочевидный момент: кроме CVT-жидкости по регламенту обновляют масло переднего дифференциала. Для мастерской критично контролировать температуру и уровень строго по процедуре — ошибки в уровне быстро вызывают толчки и ускоренный износ гидроблока."
    description: "VAG VL381 (0AW) — эволюция Multitronic для переднеприводных Audi с продольным мотором, рассчитанная до 400 Н·м. По сравнению с ранними Multitronic коробка доработана, но требует дисциплины обслуживания: только G 052 516 A2, регулярная замена фильтра и контроль перегрева. При аккуратной эксплуатации и своевременном сервисе ресурс достигает 250–300 тыс. км."
    weak_points: |
      1. Гул ведомого конуса из-за износа подшипника (троллейбусный звук).
      2. Износ цепи при частых резких разгонах.
