    parts_list:
    - Mercon ULV 5–6 л для сервиса поддона и фильтра
    - фильтр АКПП MB3Z-7G186-A / FT-231
    - прокладка поддона HL3Z-7A191-B
    - очиститель поддона и магнитов
    pan_bolts: штатный поддон снимается для слива ATF; момент болтов поддона в этой карточке не фиксируется
    drain_torque: отдельная сливная пробка в штатной процедуре обычно не используется, слив через снятие поддона
    fill_torque: 47 Н·м (заливная пробка)
    procedure: |
      1. Установите автомобиль строго горизонтально и снимите защиту.
      2. Для штатной сервисной процедуры снимите нижний поддон АКПП и слейте масло; отдельно снимать фильтр только ради слива не требуется, но при сервисе поддона фильтр сервисный и обычно меняется.
      3. Очистите поддон и магниты, установите новый фильтр и прокладку, затем соберите узел.
      4. Снимите заливную пробку и извлеките щуп-индикатор уровня.
      5. Через сервисное отверстие залейте 4,8 л свежего Mercon ULV как первичную заправку.
      6. Запустите двигатель и последовательно переведите селектор через все режимы, удерживая примерно по 5 секунд в каждом положении, затем верните в «P».
      7. На холодной коробке доведите уровень хотя бы до рабочей зоны нижней части щупа, чтобы безопасно выполнить прогрев.
      8. Выполните тест-драйв и доведите температуру TFT до 96–101 °C, чтобы удалить воздух из гидросистемы и охладителя.
      9. На работающем двигателе в положении «P» снова проверьте уровень по щупу; нормальный горячий уровень — в зоне между отметками 3 и 4.5.
      10. При недоливе добавляйте Mercon ULV малыми порциями, при переливе удаляйте излишек отсосом. Коробка чувствительна к переполнению.
      11. Установите щуп, заверните заливную пробку 47 Н·м, очистите корпус и проверьте коробку на подтёки после короткой поездки.
    mistakes:
    - Использование любого ATF кроме Mercon ULV приводит к неправильной работе и ускоренному износу.
    - Попытка выставить окончательный уровень на холодной коробке даёт ошибочный результат.
    - Перелив для 10R60 так же опасен, как и недолив; коробка очень чувствительна к избытку масла.
    - Отсутствие контроля TFT при проверке уровня делает процедуру неточной.
    - Грубая промывка очень грязной коробки за один раз повышает риск забить гидроблок продуктами износа.
    nuances:
    - В штатной конфигурации слив выполняется через снятие поддона, а не через отдельную сливную пробку.
    - Уровень задаётся по щупу-индикатору, а не по переливной трубке.
    - Поддон нижний, поэтому фильтр сервисный и доступен при обычном обслуживании со снятием поддона.
    - После сервиса важно полностью прогреть коробку, иначе воздушные карманы в контуре охлаждения дадут ложный уровень.
    price_block: |
