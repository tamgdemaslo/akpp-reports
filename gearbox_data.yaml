    procedure: |
      1. По VIN определите тип жидкости: T-IV или WS, и конкретный номер фильтра.
      2. Прогрейте коробку, установите автомобиль строго горизонтально.
      3. Слейте ATF, зафиксируйте объем.
      4. Снимите поддон, очистите магниты и внутреннюю поверхность.
      5. Замените фильтр-стрейнер и прокладку поддона.
      6. Соберите поддон с правильной схемой затяжки.
      7. Залейте стартовый объем свежего ATF, равный слитому.
      8. На работающем двигателе переведите селектор через все режимы.
      9. Проверьте уровень: ранние версии обычно по щупу; поздние — по контрольной/переливной процедуре по мануалу.
      10. Выполните тест-драйв и финальную проверку герметичности/уровня.
      11. Нестандартный нюанс: на отдельных версиях возможен дополнительный слив из ГТД, но только если это предусмотрено мануалом конкретного VIN.
    mistakes:
