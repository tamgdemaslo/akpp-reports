    fluid: ATF JWS-3309 (Volvo 1161540 / Toyota Type T-IV)
    fill_range: 50–60 °C (уровень проверяют по щупу, двигатель работает, селектор «P»)
    drain_volume: 3,5–4,0 л (обычная сервисная замена через сливную пробку)
