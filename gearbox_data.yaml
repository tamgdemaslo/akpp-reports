      9. Повторно проверьте уровень и герметичность, отдельно осмотрите втулку разъема мехатроника.
    mistakes:
      - Использовать ATF не класса Lifeguard 6.
      - Устанавливать неподходящую ревизию поддона-фильтра.
      - Не менять шайбы/уплотнения пробок.
      - Проверять уровень без контроля температуры.
      - Перетягивать пластиковый поддон.
      - Игнорировать течи по втулке мехатроника.
    nuances: |
      6HP32 встречается в разных тяжелых платформах, поэтому OEM расходников часто кроссируются с 6HP26/28.
      Без VIN безопаснее фиксировать класс жидкости и проверенные базовые номера комплектов, а точные детали поддона/пробок подтверждать по ревизии.
      Основные проблемы после ТО обычно связаны с уровнем ATF и утечками, а не с самой заменой масла.
    description: |
      ZF 6HP32 - усиленная 6-ступенчатая коробка семейства 6HP для высокомоментных применений. По сервисной логике близка к 6HP26/6HP28: пластиковый поддон с интегрированным фильтром, ATF класса LG6, проверка уровня по температуре.
      
      Для надежной работы важны регулярные замены ATF и контроль герметичности мехатроника. При пропуске обслуживания ускоренно изнашиваются гидравлика и фрикционные узлы.
      
      В карточке оставлены краткие OEM-примечания по вариативным позициям, где без VIN фиксировать один номер рискованно.
    weak_points: |
      1) Утечки по втулке разъема мехатроника.
      2) Загрязнение гидроблока/соленоидов при старой ATF.
      3) Перегрев и ускоренный износ блокировки ГТД.
      4) Ошибки по уровню после неправильной температурной процедуры.
      5) Риск повреждения поддона при перетяжке крепежа.
    faq:
