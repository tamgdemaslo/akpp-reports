      3. Снимите нижнюю защиту и тщательно очистите зону поддона и колокола от грязи, чтобы при откручивании пробок и поддона ничего не сыпалось внутрь.
      4. Подставьте мерную ёмкость и открутите сливную пробку поддона (обычно 5‑мм Inbus/10‑мм шестигранник). Ожидаемый первичный слив из поддона – около 2–3 л.
      5. Через резиновую заглушку в кожухе колокола найдите смотровое окно к гидротрансформатору, проверните коленвал за болт шкива до совмещения отверстия и открутите сливную пробку ГТД (также 5‑мм Inbus с новой алюминиевой шайбой). С ГТД обычно уходит ещё около 4–5 л.
      6. После прекращения основного слива последовательно выверните болты поддона, аккуратно снимите его, сохраняя оставшуюся жидкость в ёмкости, и перенесите поддон на верстак.
      7. Разберите поддон: снимите старую прокладку, тщательно промойте поддон и магниты очистителем тормозов до чистого металла, оцените количество и фракцию стружки – это важная диагностика для 722.5.
      8. Снимите старый фильтр (страйнер) 129 277 01 95, аккуратно проверив, чтобы резиновое уплотнение не осталось в посадочном гнезде корпуса. Сравните новый фильтр с демонтированным по форме и высоте.
      9. Установите новый фильтр, запрессовав его в посадочное гнездо до упора, и смонтируйте новую прокладку поддона 126 271 10 80 на очищенный поддон.
      10. Установите поддон на место, затяните болты крест‑накрест небольшим моментом (ориентировочно около 14 Н·м по аналогии с 722.3/722.4), не перетягивая, чтобы не деформировать отбортовку.
      11. Установите сливные пробки поддона и ГТД с новыми шайбами (типовые номера N 007 603 01 01 12 и N 007 603 01 01 00) и затяните с тем же аккуратным моментом порядка 14 Н·м.
      12. Через трубку щупа залейте первую порцию свежей ATF – немного больше суммарного объёма слива (обычно удобно начать с 5–6 л ATF уровня ATF IID с допуском 236.6/236.7).
      13. Запустите двигатель, удерживая тормоз, и медленно пройдите селектором все положения P–R–N–D–3–2–1 с паузой 2–3 секунды в каждом, после чего верните селектор в «P».
      14. На работающем двигателе и при температуре ATF около 30–50 °C проверьте уровень щупом 722.5: вытащите, протрите, снова полностью вставьте до упора, подождите пару секунд и считайте уровень по зоне «30/50 °C». При необходимости долейте небольшими порциями.
      15. Выполните короткий тест‑драйв с плавным разгоном и лёгкими торможениями, дайте коробке чётко отработать все передачи, включая 5‑ю (овердрайв включается при спокойном разгоне после ~60–70 км/ч).
      16. По возвращении ещё раз проверьте уровень ATF на горячую (зона «80 °C» на щупе, при рабочей температуре и селекторе в «P») и убедитесь в отсутствии подтёков по поддону, сливным пробкам и стыкам радиатора АКПП.
    mistakes:
      - Лить универсальный Dexron III/VI без подтверждённых допусков MB 236.6/236.7 для старых 4/5‑ступенчатых коробок – на практике такие жидкости часто дают ухудшение переключений и ускоренный износ тормозных лент.
      - Игнорировать слив из гидротрансформатора и рассчитывать на «полную замену» только через поддон: в 722.5 примерно половина объёма живёт именно в ГТД.
      - Перетягивать болты поддона и сливные пробки, деформируя поддон и вызывая хронические потения по прокладке.
      - Не менять фильтр и прокладку поддона, ограничиваясь только доливкой или частичным сливом.
      - Проверять уровень ATF на холодную, без соблюдения температуры и процедуры по щупу, а затем «лечить» коробку произвольными переливами/недоливами.
      - Игнорировать жалобы по 5‑й передаче (не включается, пропадает, пинается) при явных проблемах с уровнем/качеством масла и вакуумным управлением, откладывая сервис до полного отказа.
    nuances: |
      722.5 конструктивно – это 4‑ступенчатая 722.3 с добавленным электронно управляемым овердрайв‑модулем сзади, поэтому по механике и обслуживанию поддона она во многом ведёт себя как 722.3/722.4. При этом 5‑я передача и связанный с ней гидроблок/электроника заметно чувствительнее к уровню и качеству ATF.
      Нормальный сервис 722.5 почти всегда делают со сливом из гидротрансформатора: так удаётся обновить около 6,2 л из ~8,5 л общего объёма вместо 2–3 л только из поддона. Для этого важна живая сливная пробка ГТД и аккуратная работа через смотровое окно.
      По маслу коробка исторически проектировалась под ATF IID; в современных реалиях практично искать жидкости с допусками MB 236.6/236.7 и явной совместимостью с 722.3/722.4/722.5, а не абстрактный «Dexron III/VI». Отдельно стоит избегать маловязких жидкостей уровня 236.10/236.14, рассчитанных на 722.6+ с иными фрикционными требованиями.
      Вакуумный модуль и регулировка тросика (Steuerdruckzug) остаются важной частью настроек: при уставшем модуляторе или неверно настроенном тросе коробка может либо рано/мягко переключаться с пробуксовками, либо жёстко и с запоздаными переключениями. В практических отчётах по 722.5 эти два элемента фигурируют среди первых проверок при жалобах на поведение коробки.
      Отдельно у 722.5 известен слабый пакет заднего хода и чувствительность к низкому уровню масла: при систематическом недоливе быстро страдают втулка насоса и пакеты сцеплений, а проблемы по 5‑й и R нередко идут в паре.
    description: |
      Mercedes 722.5 (W5A030) – это переходное звено между классическими полностью гидравлическими 4‑ступенчатыми коробками 722.3/722.4 и более поздним 5G‑Tronic 722.6. По сути, это хорошо знакомая 4‑ступка с добавленным сзади электронно управляемым овердрайв‑модулем: первые четыре передачи управляются гидравликой и вакуумом, а включение 5‑й контролируется отдельным блоком и электромагнитным клапаном.
      
      В реальных машинах 722.5 встречается на поздних W124, W140, W210 и R129 с рядными «шестёрками» M104 и некоторыми V‑моделями. Типовые объёмы по открытым гайдам: полный объём около 8,5 л, при нормальном сервисе со сливом поддона и гидротрансформатора в ёмкость уходит примерно 5,8–6,2 л.
      
      Сервисно 722.5 по ощущениям очень близка к 722.3/722.4: тот же съёмный поддон, сменный фильтр, пробка гидротрансформатора и проверка уровня по щупу. При этом добавляется чувствительность к уровню и качеству ATF из‑за электронной 5‑й передачи и общем возраст коробок: любое сочетание старого масла, перегревов и низкого уровня быстро выбивает насос, пакеты и овердрайв‑часть.
      
      Для сайта важно честно отразить, что эта коробка больше не «безобслуживаемая»: регулярная замена ATF и фильтра раз в 50–60 тыс. км, аккуратная проверка уровня и контроль вакуумного управления – основной способ не довести 722.5 до типичного набора проблем по 5‑й и заднему ходу.
    weak_points: |
      1. 5‑я передача и овердрайв‑модуль.
      Пятая передача управляется отдельным электромагнитным клапаном и блоком, и именно она чаще всего становится источником жалоб: то не включается, то пропадает под нагрузкой, то работает только «когда захочет». На форумах и в техобзорах фиксируются как электрические/гидравлические проблемы по клапану, так и последствия езды с низким уровнем ATF.
      
      2. Пакет заднего хода.
      Для 722.5 отдельно отмечают склонность пакета R к разрушению: ломаются или вылетают пружины под прижимной пластиной, страдают стопорные кольца. Симптомы – трудный или пропадающий задний ход, а при тяжёлых повреждениях – шум и быстрый отказ при попытке включить R.
      
      3. Насос и втулки при низком уровне масла.
      Как и 722.3/722.4, коробка плохо переносит езду с хроническим недоливом: в зоне риска – втулка насоса, подшипники и пакеты, особенно овердрайв‑часть. Многие случаи потери 5‑й и одновременных проблем по R начинаются именно с долгой езды с подсевшим уровнем и редкими сервисами.
      
      4. Вакуумный модулятор и регулировка Steuerdruckzug.
      Уставший вакуумный модуль и неправильно отрегулированный трос управления давлением дают типичный набор «то пинается, то затягивает, то рано переключает». Это не поломка, а возрастное слабое место: модулятор со временем теряет герметичность, а трос часто подтягивают/ослабляют без понимания последствий.
      
      5. Общая возрастная нагрузка.
      Большинство 722.5 в эксплуатации уже давно перешагнули 200–250 тыс. км; при таком пробеге неизбежны износ лент B1/B2, старение фрикционов и электроники. Без аккуратного обслуживания коробка склонна к набору смешанных симптомов (пинки, пропадающие передачи, течи), из‑за чего многие сервисы склонны предлагать сразу замену/переборку.
    faq:
      - {"question":"Какое масло безопасно указывать для 722.5?","answer":"Исторически 722.5 проектировалась под ATF IID; в современных условиях безопасно ориентироваться на жидкости с допусками MB 236.6/236.7, которые в немецких гайдах прямо рекомендуются для 722.3/722.4/722.5. Универсальный Dexron III/VI без явной совместимости с этими допусками лучше не использовать.","url":"https://www.rodionenkin.de/de/pages/mb-reparaturanleitungen/oelwechsel-automatikgetriebe-722.5-5-gang.php"}
      - {"question":"Сколько масла готовить на ТО 722.5?","answer":"Полный объём системы около 8,5 л, но при нормальном обслуживании со сливом поддона и гидротрансформатора на практике сливается и заливается примерно 5,8–6,2 л. Поэтому для сервиса удобно иметь 7–8 л подходящей ATF, чтобы хватило на заливку и корректировку уровня.","url":"https://gearboxlist.com/mercedes/722-5/"}
      - {"question":"Есть ли у 722.5 сливная пробка на гидротрансформаторе?","answer":"Да, в профильных отчётах по W124/W140/R129 с 722.5 описывается штатная пробка ГТД под 5‑мм шестигранник, доступная через смотровое окно в кожухе колокола. Через неё обычно сливают около 4–5 л ATF, что вместе со сливом поддона даёт порядка 6,2 л.","url":"https://www.r129-forum.de/archive/index.php?thread-10355.html="}
      - {"question":"Через какой пробег менять масло и фильтр в 722.5?","answer":"Типичные рекомендации – каждые 50 000–60 000 км или 3–4 года. В немецких гайдах часто фигурирует интервал 60 000 км, но при тяжёлой эксплуатации (город, прицеп, внедорожье) разумно сокращать его до 40 000 км.","url":"https://mbmanuals.com/transmissions/mb7225trans.htm"}
      - {"question":"Почему у 722.5 часто проблемы с 5‑й передачей?","answer":"5‑я передача в 722.5 – это электронно управляемый овердрайв‑модуль, чувствительный к уровню и качеству масла, состоянию насоса и электромагнитного клапана. На форумах нередко фиксируют случаи, когда при низком уровне или сильно старой ATF сначала появляются периодические пропадания 5‑й, а затем коробка окончательно теряет овердрайв и/или задний ход.","url":"https://forums.mbclub.co.uk/threads/the-legendary-722-5-gearbox-on-a-w124.87161/"}
      - {"question":"Чем 722.5 отличается от 722.3/722.4 при обслуживании?","answer":"По поддону, фильтру, сливу из ГТД и проверке уровня 722.5 ведёт себя почти как 722.3/722.4: тот же съёмный поддон, фильтр и щуп. Отличия начинаются на стороне электроники и 5‑й передачи: добавляется блок управления, электромагнитный клапан овердрайва и повышенная чувствительность к уровню и качеству ATF.","url":"https://gearboxlist.com/mercedes/722-5/"}
