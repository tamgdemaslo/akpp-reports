      oem_bolt_2: ""
      oem_bolt_2_price: 0
      oem_bolt_2_info: ""
    procedure: |
      1. До заказа расходников уточните VIN и сервисную карту. Для 725.0 это критично: поддон и допуск ATF нельзя выбирать только по названию коробки.
      2. Прогрейте коробку короткой поездкой, поставьте автомобиль ровно и снимите защиту, если она мешает доступу.
      3. Зафиксируйте наличие подтёков до начала работ. Если коробка уже мокрая, после обслуживания будет трудно понять, где новая течь, а где старая.
      4. Слейте масло из поддона в мерную тару и запомните фактический объём. Для этой коробки это лучший ориентир на первичную заливку.
      5. Снимите поддон. Основные фильтры здесь встроены, поэтому обычное ТО подразумевает замену поддона целиком, а не промывку старого узла.
      6. Осмотрите магниты и содержимое поддона. Крупная стружка, крошка или явный перегрев масла — повод не ограничиваться одной заменой жидкости.
      7. Очистите прилегающие поверхности, установите новый поддон и соберите узел по заводской схеме.
      8. Если по сервисной карте вашей машины предусмотрен фильтр давления на переднем интегральном кронштейне, замените его в это же обслуживание.
      9. Первичную заливку делайте через адаптер 725 589 00 90 00 и трубку 725 589 00 09 00 либо совместимый инструмент. Залейте объём, близкий к слитому.
      10. Запустите двигатель, удерживая тормоз, и спокойно проведите селектор по всем положениям, чтобы заполнить гидросистему.
      11. Контролируйте температуру масла диагностикой. В зоне проверки уровня, которую нужно сверять по WIS/Xentry, откройте контроль и выставьте уровень по заводской процедуре, а не «на глаз».
      12. После сборки выполните короткую поездку, повторно проверьте герметичность и убедитесь, что коробка включает передачи без задержки и без новых грубых толчков.
    mistakes:
      - "Заказывать расходники без VIN и сервисной карты, как будто у всех 725.0 один и тот же поддон и один и тот же набор фильтров."
      - "Механически переносить на 725.0 чужую схему обслуживания от других АКПП и других коробок вообще."
      - "Выбирать ATF по принципу «любая жидкость для 9G‑Tronic» и не проверять, что именно указано для конкретной машины."
      - "Выставлять уровень без диагностики температуры и без штатной процедуры контроля."
      - "Считать, что обычное ТО на этой коробке закрывается только маслом, без замены поддона со встроенными фильтрами."
      - "После правильной замены масла игнорировать оставшиеся толчки и задержки вместо проверки ошибок и актуальности программного обеспечения."
    nuances: |
      Для обычного ТО на 725.0 меняют именно поддон в сборе: оба основных фильтра встроены в него постоянно. Отдельно в сервисных материалах Mercedes для части машин указан фильтр давления на переднем интегральном кронштейне, который меняют по сервисной карте. Поэтому на эту коробку нельзя переносить схему обслуживания «по привычке» от других АКПП и нельзя заказывать расходники только по названию 9G‑Tronic без VIN.
    weak_points: |
      Практически коробка чувствительна к точному уровню и чистоте ATF: после неверной заправки быстро появляются грубые переключения, толчки и задержка включения. На части ранних машин отдельно встречаются жалобы на качество переключений, где сначала проверяют ошибки и актуальность программного обеспечения, а не пытаются лечить всё одной заменой масла.
    faq:
      - question: "Меняется ли фильтр на Mercedes 725.0 отдельно?"
        answer: "При обычном ТО нет. Основные фильтры у 725.0 встроены в поддон, поэтому меняют поддон в сборе."
      - question: "Какой допуск ATF нужен для 725.0?"
        answer: "Универсально по названию коробки это лучше не фиксировать. В ранних материалах встречается MB 236.16, в более поздней сервисной практике чаще фигурирует MB 236.17. Итоговый допуск нужно сверять по VIN и сервисной карте."
      - question: "Нужно ли кроме поддона проверять ещё один фильтр?"
        answer: "Да, на части машин в сервисной карте отдельно указан фильтр давления на переднем интегральном кронштейне. Поэтому перед заказом расходников нужно смотреть именно карту обслуживания конкретного автомобиля."
      - question: "Что обязательно сделать после замены масла?"
        answer: "Обязательно точно выставить уровень по температуре через диагностику, затем сделать короткую поездку и проверить, нет ли новых подтёков, задержки включения и грубых толчков."
