    procedure: |
      1. Убедитесь, что перед вами именно DQ250 (DSG6, индексы 02E/0D9) и подготовьте масло с допуском G 052 182 A2, фильтр 02E 305 051 C, кольца N 910 845 01 и N 043 809 2.
      2. Прогрейте коробку лёгкой поездкой, затем установите автомобиль строго горизонтально на подъёмник/эстакаду, переведите селектор в «P» и дайте маслу немного остыть до безопасной температуры для работы.
      3. Снимите нижние защиты, при необходимости частично опустите подрамник/защиту, обеспечьте свободный доступ к сливной/контрольной пробке DSG.
      4. Подставьте ёмкость и выверните наружную сливную/контрольную пробку с шайбой N 043 809 2 – сольётся первая порция масла (обычно порядка 2 л).
      5. Внутренним шестигранником на 8 мм выверните пластиковую переливную трубку внутри отверстия – откроется основной слив из картера, дождитесь окончания стекания (в сумме после двух шагов ориентировочно выходит около 5–5,5 л).
      6. Параллельно сверху снимите АКБ с площадкой и корпус воздушного фильтра, чтобы открыть доступ к корпусу фильтра DSG.
      7. Подложите ветошь вокруг корпуса фильтра, немного приотпустите его, дайте маслу из стакана стечь назад в коробку, затем полностью снимите крышку и старый картридж фильтра.
      8. Очистите посадочные поверхности, замените картридж фильтра на новый 02E 305 051 C, смажьте новое уплотнительное кольцо N 910 845 01 трансмиссионным маслом и заверните корпус фильтра с моментом около 20 Н·м.
      9. Вкрутите обратно переливную трубку внутри картера (ориентировочный момент около 3 Н·м, без фанатизма) и подготовьте заправочный адаптер (VAS 6262A или аналог) либо шприц с трубкой для заливки масла снизу.
      10. Через отверстие контрольной пробки/заливной горловины подайте в коробку примерно 5,5 л свежего масла DSG, следя за чистотой адаптера и исключая подсос воздуха или грязи.
      11. Заверните сливную/контрольную пробку с новой шайбой N 043 809 2 и моментом порядка 45 Н·м, при этом внешняя резьбовая пробка должна быть чистой, без повреждений.
      12. Запустите двигатель, удерживая тормоз, и последовательно переведите селектор во все положения P–R–N–D/S с паузой 3–5 секунд в каждом, затем верните в «P».
      13. С помощью диагностического сканера контролируйте температуру масла DSG; при достижении 35–45 °C снова поднимите автомобиль, открутите контрольную пробку и наблюдайте за струёй из переливной трубки при работающем двигателе.
      14. Если масло не течёт, дозалейте через адаптер по 0,5–1 л и повторяйте проверку; правильный уровень считается достигнутым, когда при 35–45 °C из переливной трубки идёт стабильная струйка, которая переходит в частые капли.
      15. Когда излишек масла стечёт до частых капель, заверните пробку с новой шайбой, заглушите двигатель, соберите все снятые элементы сверху (АКБ, корпус фильтра, воздуховод), установите защиты и при необходимости выполните адаптацию DSG/обнуление счётчика износа сцепления по фирменной процедуре.
      16. После сервисного выезда выполните контроль на отсутствие подтёков по пробке, корпусу фильтра, стыкам радиатора DSG и угловому редуктору; при полном приводе отдельно обслужите раздатку/угловой редуктор по спецификации G 052 145 S2.
    mistakes:
      - Использовать универсальное ATF или случайное «масло для автомата» вместо специализированного DSG‑масла с допуском G 052 182 A2.
      - Не менять фильтр 02E 305 051 C и кольцо N 910 845 01 вместе с маслом, оставляя забитый фильтр на новой жидкости.
      - Игнорировать контроль температуры и выставлять уровень «на глаз» без сканера и окна 35–45 °C.
      - Закручивать переливную трубку и пробку без динамометрического ключа, срывая резьбу или оставляя потёки.
      - Не учитывать отдельный контур масла в угловом редукторе/раздатке при 4Motion, обслуживая только саму DSG.
      - Продолжать ездить с толчками, ошибками по давлению и пробуксовками, ограничиваясь только заменой масла без диагностики мехатроника и сцеплений.
    nuances: |
      DQ250 – мокрая DSG, в которой одно и то же масло обслуживает шестерни, пакет сцеплений и мехатроник, поэтому загрязнение продуктами износа напрямую бьёт по соленоидам и каналам. Для этой коробки критичны две вещи: регулярная замена жидкости и аккуратная выставка уровня через переливную трубку при 35–45 °C на работающем двигателе.
      У DQ250 нет классического щупа: уровень проверяется только через контрольное отверстие с внутренней переливной трубкой, поэтому любая ошибка по температуре или геометрии площадки даёт заметные последствия (выбивание передач, перегрев сцеплений, вспенивание масла).
      Отдельно нужно помнить про раздельное масло в угловом редукторе/раздатке на полноприводных версиях (0D9) – оно имеет свой допуск (G 052 145 S2 и аналоги по ETKA) и отдельный интервал обслуживания, но по факту страдает от той же тяжёлой эксплуатации.
      Фильтр DSG по заводской методике меняют не при каждом сливе, а по состоянию и интервалу, однако для практического сервиса и одного понятного комплекта на сайт проще закладывать его замену на каждые 60 тыс. км: это даёт более предсказуемый результат для мехатроника.
    description: |
      DQ250 (VW DSG‑6 02E/0D9) – первая массовая 6‑ступенчатая роботизированная коробка VAG с двумя мокрыми сцеплениями, рассчитанная на поперечное расположение двигателя и крутящий момент до 350–400 Н·м. Она ставилась практически на весь популярный ряд VAG: Golf/Passat/Jetta/Tiguan/Touran, Audi A3/Q3/TT, Skoda Octavia/Superb/Kodiaq/Karoq, Seat Leon/Altea и др.
      По конструкции это преселективный робот: два входных вала, два пакета мокрых сцеплений, электро‑гидравлический мехатроник и набор планетарных/цилиндрических передач. Быстрые и плавные переключения при экономичном расходе топлива сделали DQ250 очень распространённой коробкой, а её ремонт давно освоен огромным количеством профильных сервисов.
      Для обслуживания на практике важны несколько опорных цифр: объём масла в контуре DSG около 7,2 л, частичная замена при снятии фильтра и сливе через переливную трубку даёт примерно 5–5,5 л, регламентный интервал – 60 тыс. км, но для тяжёлой эксплуатации лучше сокращать до 40–50 тыс. км. Масло – только со спецдопуском DSG (G 052 182 A2 / ближайшие официальные замены по ETKA), уровень строго через переливную трубку при 35–45 °C.
      Отдельный нюанс DQ250 – общий контур смазки для сцеплений, механической части и мехатроника. Это удобно по конструкции, но делает коробку очень чувствительной к грязной жидкости и неправильному маслу: продукты износа сцепления и дифференциала быстро доходят до тонких каналов гидроблока и соленоидов. Поэтому регулярный сервис и корректная процедура выставления уровня здесь реальная профилактика дорогого ремонта, а не формальность.
    weak_points: |
      1. Загрязнение мехатроника и соленоидов продуктами износа.
      Тонкие каналы гидроблока и соленоиды у DQ250 страдают от грязной жидкости: стружка из дифференциала и фрикционный порошок из сцеплений циркулируют по общему контуру, вызывая ошибки по давлению, толчки, уход в аварийный режим и отказ включения передач.
      
      2. Дифференциал и смазка при тяжёлых режимах.
      При агрессивной эксплуатации, частых пробуксовках и особенно на чип‑тюнинге дифференциал и его сателлиты могут перегреваться и разрушаться, давая много крупной стружки. Эта стружка затем попадает в мехатроник и подшипники валов, усугубляя износ всей коробки.
      
      3. Износ пакета сцеплений и перегрев.
      Для мокрых сцеплений критичны городские пробки, старт с пробуксовкой и езда на повышенных температурах масла. Со временем появляются пробуксовки, толчки при трогании и рывки на переключениях; при запущенном состоянии одного ТО уже недостаточно – нужен ремонт сцеплений и часто доработка ПО.
      
      4. Двухмассовый маховик.
      На части комплектаций ранних лет слабым местом был двухмассовый маховик: он начинал греметь и передавать вибрации на трансмиссию, что ускоряло износ муфты и вызывало субъективные «толчки DSG».
      
      5. Датчики скорости и положения вилок.
      Задающие диски датчиков на валах со временем собирают намагниченную стружку, датчики «слепнут», появляются ошибки по скоростям валов и некорректное включение передач. Аналогичная проблема возможна по датчикам положения вилок включения.
      
      6. Чувствительность к неправильному маслу и уровню.
      Использование неподходящих жидкостей или ошибочная выставка уровня (без температуры/горизонта) быстро проявляются в виде вспенивания, перегрева, пинков и ускоренного износа мехатроника и сцеплений. Для DQ250 это один из ключевых практических факторов риска.
    faq:
      - {"question":"Какое масло безопасно указывать для DSG DQ250?","answer":"Один понятный и безопасный ориентир – оригинальное масло VAG с допуском G 052 182 A2, либо бренды с явным указанием соответствия этому допуску. В ряде кросс‑листов встречается также G 052 529 A2 как совместимое, но для конкретного авто и свежих рекламаций лучше перепроверять по ETKA и техническим бюллетеням.","url":"https://otoba.ru/transmissii/vag/dq250.html"}
      - {"question":"Какой объём масла готовить на обслуживание DQ250?","answer":"При стандартной сервисной процедуре со сливом через переливную трубку и заменой фильтра обычно уходит около 5–5,5 л. Полный объём контура DSG – порядка 7,2 л, а при полноприводных версиях дополнительно около 0,9 л масла в угловом редукторе/раздатке.","url":"https://vwts.ru/articles/trans/zamena-masla-korobka-peredach-0d9-dq250-dsg6.html"}
      - {"question":"Нужно ли менять фильтр DSG при каждой замене масла?","answer":"По заводской инструкции фильтр рекомендуется менять при достижении сервисного интервала, при попадании ОЖ в масло, наличии заметной стружки или повреждении сцепления. На практике для понятного комплекта и ресурса мехатроника фильтр 02E 305 051 C и кольцо N 910 845 01 обычно меняют вместе с маслом каждые 60 тыс. км.","url":"https://vwts.ru/articles/trans/zamena-masla-korobka-peredach-0d9-dq250-dsg6.html"}
      - {"question":"Как правильно выставлять уровень масла в DQ250?","answer":"Уровень задаётся переливной трубкой внутри сливного отверстия: коробка должна быть на горизонтальной площадке, двигатель работать на холостом ходу, селектор после прогонки по режимам стоит в «P», а температура масла по сканеру – 35–45 °C. При снятой контрольной пробке из переливной трубки должен идти небольшой поток, переходящий в частые капли – это и есть правильный уровень.","url":"https://vwts.ru/articles/trans/zamena-masla-korobka-peredach-0d9-dq250-dsg6.html"}
      - {"question":"Какой реальный ресурс DQ250 при нормальном обслуживании?","answer":"Производитель заявляет ресурс порядка 220 тыс. км, но при регулярной замене масла, бережной эксплуатации и своевременном ремонте сцеплений/мехатроника коробки DQ250 нередко ходят 250–300 тыс. км и более.","url":"https://otoba.ru/transmissii/vag/dq250.html"}
      - {"question":"Какие типичные симптомы проблем с DQ250?","answer":"Частые жалобы – рывки и толчки при трогании и переключениях, ошибки по давлению в гидросистеме, уход в аварийный режим, пропадание задней передачи, вибрации от маховика и гул/шум со стороны дифференциала. При таких симптомах одной заменой масла ограничиваться не стоит, нужна профильная диагностика по DSG.","url":"https://www.motulteam.ru/zamena-masla-v-dsg-dq250"}
