    parts_list:
    - ATF JWS-3309 4–5 л на одну частичную замену, 8–12 л на серию слив-залив
    - шайба или уплотнение сливной пробки
    - очиститель для зоны сливной пробки и щупа
    pan_bolts: боковая крышка/поддон в обычной сервисной замене не снимаются
    drain_torque: 35 Н·м (сливная пробка)
    fill_torque: не применяется (основная заливка через щуп/заливную трубку)
    procedure: |
      1. Совершите поездку 15–20 минут, чтобы прогреть коробку, затем выставьте автомобиль строго горизонтально.
      2. Удерживая тормоз, последовательно переведите селектор через все диапазоны и верните в «P».
      3. Заглушите двигатель, снимите защиту и слейте ATF через сливную пробку; обычно выходит 3,5–4,0 л.
      4. Установите новую шайбу или уплотнение сливной пробки и затяните пробку моментом 35 Н·м.
      5. Через трубку щупа залейте столько же свежего JWS-3309, сколько было слито.
      6. Запустите двигатель и снова пройдите селектором по всем положениям с задержкой 2–3 секунды.
      7. На холостом ходу доведите температуру ATF до 50–60 °C и проверьте уровень по щупу.
      8. Доливайте жидкость малыми порциями до уровня HOT; перелив для AW55 так же вреден, как и недолив.
      9. Выполните тест-драйв, затем ещё раз проверьте отсутствие течей по сливной пробке.
      10. Если масло было очень тёмным, сделайте 2–3 частичные замены с интервалом 200–500 км вместо агрессивной аппаратной промывки.
    mistakes:
    - Проверка уровня на холодной коробке или при заглушенном двигателе даёт неверный результат.
    - Использование Dexron III/VI вместо JWS-3309 меняет фрикционные свойства и провоцирует пинки.
    - Аппаратная промывка сильно изношенной коробки без оценки состояния гидроблока часто ускоряет отказ.
    - Повторное использование старого уплотнения сливной пробки приводит к течам.
    - Недолив после одной частичной замены вызывает проскальзывания и перегрев пакетов.
    nuances:
    - AW55 чаще всего обслуживается по щупу, а не по переливной трубке, поэтому температура и горизонтальность особенно важны.
    - Боковая крышка и внутренний фильтр не относятся к обычной сервисной замене масла; туда лезут уже при ремонте или глубокой разборке.
    - За один слив обновляется только часть объёма; для заметного освежения ATF обычно делают серию частичных замен.
    - AW55-51SN является доработанной версией семейства, но базовая процедура обслуживания и допуск масла одинаковые.
    - Коробка чувствительна к перегреву и загрязнению гидроблока; свежее масло и чистый радиатор сильно продлевают ресурс.
    price_block: |
