      6. Если конструкция конкретной версии подразумевает внешний магистральный фильтр 0B5 325 330A, замените его согласно инструкции, подставив ёмкость под возможный дополнительный слив.
      7. Установите новый поддон/прокладку (0B5 321 371E либо аналог по VIN), затяните болты крест-накрест с моментами из мануала 0B5.
      8. Аналогично слейте масло из механического контура G 052 532 A2 через его сливную/контрольную пробку; при необходимости снимите переливную вставку и дождитесь полного слива.
      9. При наличии отдельной заливной пробки для механической части подготовьте её и замените уплотнение.
      10. Установите новые шайбы/уплотнения на сливные/контрольные пробки обоих контуров, заверните пробки от руки, оставив возможность для регулировки уровня.
      11. Через адаптер и насос залейте расчётный объём DSG-жидкости G 052 529 A2 в соответствующий контур (ориентируясь на слитые ~6–7 л и техдокументацию), затем залейте расчётный объём G 052 532 A2 в механический контур (~4–5 л).
      12. Запустите двигатель, удерживая тормоз, и несколько раз плавно переведите селектор по всем положениям (P–R–N–D/S) с паузой 2–3 секунды, затем верните в «P».
      13. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C проверьте уровень в DSG-контуре, аккуратно открутив контрольную/переливную пробку и оценив поток.
      14. Если в DSG-контуре масло почти не вытекает, дозаливайте G 052 529 A2 малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      15. Для механического контура ориентируйтесь на указания мануала: уровень, как правило, контролируется по нижней кромке заливного отверстия при рабочей температуре; при необходимости скорректируйте объём G 052 532 A2.
      16. После выставления уровней окончательно затяните все пробки с новыми шайбами по моментам из мануала, установите защиту и выполните дорожный тест с контролем работы коробки и температур.
      17. При наличии до сервиса жалоб на рывки, пробуксовки и ошибки по мехатронике проанализируйте степень загрязнения масла и количество стружки: в ряде случаев одной заменой масел уже не обойтись и требуется адаптация/ремонт.
    mistakes:
