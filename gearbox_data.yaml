      **VAG SQ100 (0CT)** — 5-ступ. робот ASG на базе MQ100. VW Up!, Skoda Citigo, Seat Mii (2012–2020). Нижнего поддона нет, фильтр при ТО не меняется. MTF G 052 171 A2 / G 052 527 A2, 1,1–1,2 л. Заливная — 12-spline 8 mm.
    weak_points: |
      **1. Ранний износ сцепления** — до 50 000 км. **2. Рывки, медленные переключения** — особенность ASG. **3. Редкая коробка** — мало сервисов, ограниченные запчасти. **4. Не то масло** — GL4 75W-90 даёт жёсткие переключения.
    faq:
      - question: "Меняется ли фильтр при ТО?"
        answer: "Нет. Нижнего поддона нет, сервисного фильтра при замене масла нет."
        url: "https://www.upownersclub.co.uk/threads/gearbox-oil-change-guide-with-part-numbers-sticky.7165/"
      - question: "Какое масло — G 052 171 или G 052 527?"
        answer: "G 052 171 A2 — ранние до 09/2013. G 052 527 A2 — новые. Оба очень жидкие. GL4 75W-90 не подходит."
        url: "https://www.upownersclub.co.uk/threads/gearbox-oil-change-guide-with-part-numbers-sticky.7165/"
      - question: "Ключ для заливной — Torx?"
        answer: "Нет, 12-spline 8 mm. Torx повредит головку."
        url: "https://www.upownersclub.co.uk/threads/gearbox-oil-change-guide-with-part-numbers-sticky.7165/"
