    procedure: |
      Важно: для FA840 подтверждены спецификация ATF-GS, сухой объём 6,5 л, нижний поддон FA840A1502044 и контроль уровня при 50-60 °C.
      При этом каталог показывает несколько пробок и уплотнений, а отдельный фильтр не выделяет, поэтому перед заказом расходников обязательно сверяйте VIN и схему конкретной машины.
      
      1. До начала работ подтвердите, что на автомобиле стоит именно FA840 / 840AHA, а не 7DCT или другая коробка той же модели.
      2. По VIN уточните ревизию узла, состав поддона и набор пробок/уплотнений.
      3. Прогрейте трансмиссию, установите автомобиль строго горизонтально и очистите область поддона и пробок.
      4. Сначала убедитесь, что заливная точка откручивается; в каталоге как минимум подтверждена маслозаливная пробка FA840A1502710.
      5. Открутите контрольную/сливную пробку и контрольный стакан, слейте жидкость в мерную тару и зафиксируйте её объём и состояние.
      6. Если по VIN подтверждено, что обслуживание выполняется через нижний поддон в сборе, снимайте поддон и меняйте обслуживаемый узел согласно заводской схеме. Если отдельный фильтр не выделен, не подбирайте его "по аналогии".
      7. Очистите магниты и плоскости прилегания, оцените количество продуктов износа.
      8. Установите поддон/уплотнения/пробки по каталогу конкретной ревизии.
      9. Залейте свежую ATF-GS в объёме, близком к слитому; при аппаратной замене расход рабочей жидкости обычно выше сухого объёма.
      10. Запустите двигатель, последовательно переведите селектор по всем режимам и выполните циркуляцию жидкости.
      11. При температуре 50-60 °C скорректируйте уровень через контрольную пробку.
      12. После тест-драйва повторно проверьте герметичность, работу коробки на понижениях и наличие кодов по TCM.
    mistakes:
      - "Подбор фильтра или поддона по аналогии с Aisin/ZF без подтверждения по VIN."
      - "Заливка жидкости без прямого подтверждения спецификации ATF-GS."
      - "Игнорирование того, что в каталоге у FA840 несколько пробок и несколько O-ring."
      - "Проверка уровня вне диапазона 50-60 °C."
      - "Не зафиксировать жалобы клиента на пинки до обслуживания и потом спорить о причине после замены масла."
    nuances: |
      По открытым каталогам у FA840 подтверждён нижний поддон FA840A1502044, однако отдельный OEM фильтра публично не найден.
      Для мастера это означает, что фильтр нельзя автоматически заказывать как отдельный расходник, пока его не подтвердят VIN и схема узла.
      На родственных моделях с FA840 встречаются жалобы на толчки и рывки при замедлении, но часть этих симптомов снимается или уменьшается после обновления ПО двигателя/TCM.
      Поэтому до замены масла полезно фиксировать исходное поведение коробки и отдельно предупреждать клиента, если работа коробки похожа на калибровочную, а не на чисто гидромеханическую проблему.
      При тёмной жидкости и большом количестве продуктов износа имеет смысл рассматривать более полную замену масла, а не только быстрый слив-залив.
    description: |
      **Fuzhen FA840 / Chery 840AHA** — более "старшая" 8-ступенчатая гидромеханическая АКПП семейства Fuzhen, работающая с 2.0T моторами и встречающаяся на Chery Tiggo 9, Exeed TXL, Jetour T1/T2 и ряде родственных моделей.
      
      Для мастера по замене масла это уже более интересная коробка, чем FA830, потому что по ней есть не только базовые характеристики, но и подтверждённые каталожные позиции по поддону и части пробок. При этом путаница всё ещё остаётся: каталог показывает несколько пробок и O-ring, а отдельный фильтр не выделяет.
      
      Практически это означает следующее: коробку можно уверенно обслуживать по маслу, температуре контроля уровня и нижнему поддону, но заказывать "полный комплект фильтр + прокладка + пробка" без VIN пока опасно. Здесь важнее точная идентификация ревизии, чем красивая универсальная корзина запчастей.
      
      Отдельное внимание стоит уделять жалобам на переключения при замедлении. По отзывам часть машин действительно получает пинки на понижениях, но есть и обратные отзывы, где коробка работает без рывков. Для сервиса это хороший маркер: не каждую претензию после замены масла надо сразу трактовать как механическую проблему коробки.
    weak_points: |
      **1. Толчки на понижениях и неравномерность переключений.**
      По отзывам владельцев Tiggo 9 и родственных моделей встречаются рывки при снижении скорости и переходе на пониженные передачи. На практике мастеру важно зафиксировать это до обслуживания, потому что часть кейсов уходит в плоскость прошивок, а не гидравлики.
      
      **2. Ускоренный износ фрикциона ГТФ при тяжёлой эксплуатации.**
      Коробка работает с 2.0T и высоким моментом, поэтому при растянутых интервалах замены масла риск загрязнения гидроблока продуктами износа выше. При сливе важно смотреть не только на цвет ATF, но и на количество мусора на магнитах и в поддоне.
      
      **3. Слабая прозрачность по расходникам.**
      Каталог уже даёт OEM поддона и части пробок, но по фильтру и части уплотнений однозначности нет. Это слабое место не самой механики, а именно сервисной подготовки: без VIN легко ошибиться с заказом.
      
      **4. Риск неполной замены жидкости.**
      Если коробка уже загрязнена, быстрый слив-залив может не решить вопрос по качеству ATF. Для тяжёлых условий и тёмного масла стоит заранее обсуждать с клиентом аппаратную замену или более глубокий сервис.
    faq:
      - question: "Какое масло лить в FA840?"
        answer: "Нужно ATF с подтверждённой спецификацией ATF-GS. В сервисных материалах по этой коробке встречается Motul ATF6 как рабочий вариант, но ключевым остаётся именно соответствие ATF-GS."
        url: "https://otoba.ru/transmissii/fuzhen/fa840.html"
      - question: "Есть ли по FA840 точный OEM поддона?"
        answer: "Да. В каталоге Tiggo 9 с FA840 подтверждён нижний поддон АКПП FA840A1502044."
        url: "https://xn--80aagvgd7a1ae.xn--p1acf/catalog/zapcasti-chery/719824bb8ad24581a312599f42019166/c191bd760d4771fbcbd4334b1eec94ab/4bdc63c802238abbee992af1eb222cd0/FA840A1502044"
      - question: "Почему нельзя просто заказать фильтр по аналогии?"
        answer: "Потому что открытый каталог по FA840 не показывает отдельный OEM фильтра, а только нижний поддон и набор пробок/O-ring. Без VIN есть риск заказать не тот комплект или пропустить интегрированное решение."
        url: "https://xn--80aagvgd7a1ae.xn--p1acf/catalog/zapcasti-chery/719824bb8ad24581a312599f42019166/c191bd760d4771fbcbd4334b1eec94ab/4bdc63c802238abbee992af1eb222cd0/121000063AA"
      - question: "Что делать, если клиент жалуется на пинки после или до замены масла?"
        answer: "Сначала зафиксировать, были ли жалобы до обслуживания. По форумам и отзывам для FA840 встречаются пинки на понижениях, а часть владельцев отмечает улучшение после обновления ПО двигателя и коробки. То есть сначала диагностика и история симптомов, потом выводы."
        url: "https://forumchery.ru/topic/6136-cheri-tigo-9-pinki-pri-pereklyucheniyah-akpp/"
    procedure_id: "FUZHEN_FA840"
