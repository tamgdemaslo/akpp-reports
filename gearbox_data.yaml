    procedure: |
      1. Убедитесь, что коробка — 722.7 (W5A180): 5‑ступенчатая электронная АКПП A‑Class W168 или Vaneo W414.
      2. Прогрейте коробку короткой поездкой, установите авто строго горизонтально (подъёмник/яма), «P», ручник.
      3. Снимите защиту, очистите зону поддона от грязи.
      4. Подставьте ёмкость, открутите сливную пробку поддона, слейте ATF (~3,5–4 л).
      5. Выверните болты поддона (крест‑накрест), снимите поддон, не допуская попадания грязи в коробку.
      6. Снимите старый гидрофильтр 168 377 03 95, осмотрите магниты и поддон на стружку и шлам.
      7. Промойте поддон и магниты до чистого металла (очиститель тормозов, безворсовые тряпки).
      8. Установите новый фильтр и новую прокладку поддона, смонтируйте поддон, затяжка болтов крест‑накрест ~8 Н·м.
      9. Установите сливную пробку с новой шайбой (при наличии), момент ~20 Н·м.
      10. Через трубку сервисного щупа залейте свежую ATF MB 236.10 (~4 л).
      11. Запустите двигатель, пройдите селектором P–R–N–D с паузой 2–3 с в каждом положении, оставьте «P».
      12. При температуре ATF 40–50 °C проверьте уровень сервисным щупом (зелёный); при необходимости доливайте малыми порциями до меток min/max.
      13. Тест‑драйв, затем повторная проверка уровня и отсутствия подтёков.
    mistakes:
      - Заливать ATF с допуском 236.12/236.14 или Dexron — для 722.7 допускается только 236.10.
      - Добавлять присадки в ATF — по инструкции Mercedes запрещено.
      - Проверять уровень «на холодную» или без учёта температуры — уровень только при 40–50 °C по зелёному щупу.
      - Не менять фильтр при замене масла.
      - Работать грязным инструментом — при заливке любая грязь попадает в гидросистему и соленоиды.
      - Игнорировать «F» (limp) и рывки — часто связаны с уровнем/качеством ATF или отказом блока управления (FTC/TCU); замена масла и фильтра — первая мера.
    nuances: |
      722.7 — поперечная 5‑ступенчатая коробка с электронным управлением (блок FTC/TCU Siemens), внутренним электро‑гидравлическим модулем и без встроенного щупа в комплектации автомобиля. Сервисный зелёный щуп приобретается отдельно и необходим для корректной проверки уровня.
      Допуск масла строго 236.10; более поздние допуски (236.12/236.14) для 722.7 в официальных источниках не указываются. Сливной пробки на гидротрансформаторе у 722.7 в описаниях не фигурирует — замена только из поддона с заменой фильтра.
      Типичные жалобы: индикация «F», блокировка передач, рывки при остановке, вибрация при включении D/R. Часто причина — низкий или старый уровень ATF либо отказ блока управления (FTC); замена жидкости и фильтра нередко восстанавливает нормальную работу.
    description: |
      Mercedes 722.7 (обозначение FAG, индекс W5A180) — 5‑ступенчатая электронная АКПП поперечной компоновки, разработанная для компактных моделей: A‑Class (W168) и Vaneo (W414), двигатели до ~2,0 л. Выпуск примерно 1997–2006 гг.
      
      По конструкции это электронно‑гидравлический автомат с блоком управления (TCU/FTC Siemens), без встроенного щупа в машине — уровень проверяется только сервисным зелёным щупом при 40–50 °C. Полная ёмкость около 7,5 л, при обычной замене с поддоном и фильтром сливается и заливается порядка 4 л. Допуск ATF строго MB 236.10.
      
      Ресурс при своевременной замене масла и фильтра и исправной электронике оценивается высоко; слабое место — старение и отказы блока управления (FTC), а также последствия езды со старым или неправильным маслом.
    weak_points: |
      1. Блок управления трансмиссией (FTC/TCU) Siemens.
      Плата и компоненты стареют, появляются сбои: индикация «F», неправильный выбор передач, блокировка передач. Решение — ремонт/замена FTC (в т.ч. сторонние сервисы с гарантией).
      
      2. Уровень и качество ATF.
      Низкий, старый или не тот допуск (не 236.10) приводят к рывкам, вибрациям при D/R и уходу в аварийный режим. Регулярная замена масла и фильтра — базовая профилактика.
      
      3. Рывки при остановке и вибрация при включении D/R.
      Часто связаны с уровнем ATF или состоянием FTC; после замены жидкости и проверки уровня многие симптомы исчезают.
      
      4. Загрязнение гидросистемы.
      Редкая замена ATF и фильтра ведёт к износу и залипанию соленоидов; обязательна замена фильтра при каждом ТО и чистота при заливке.
    faq:
      - {"question":"Какое масло лить в 722.7?","answer":"Только ATF с одобрением MB 236.10. Оригинал A 001 989 21 03; допускаются Ravenol ATF 6 M Fluid, Liqui Moly Top Tec ATF 1200. 236.12/236.14 и Dexron не использовать.","url":"https://diy.rodionenkin.de/mb-reparaturanleitungen/olwechsel-automatikgetriebe-722-7-a-klasse-w168/"}
      - {"question":"Сколько масла нужно на замену в 722.7?","answer":"При замене с поддоном и фильтром — около 4 л. Полная ёмкость коробки ~7,5 л.","url":"https://diy.rodionenkin.de/mb-reparaturanleitungen/olwechsel-automatikgetriebe-722-7-a-klasse-w168/"}
      - {"question":"Как проверить уровень ATF на 722.7?","answer":"В машине щупа нет. Нужен сервисный щуп для 722.7 (зелёный). Уровень проверять на работающем двигателе, селектор P, температура ATF 40–50 °C, по меткам min/max на щупе.","url":"https://diy.rodionenkin.de/mb-reparaturanleitungen/olwechsel-automatikgetriebe-722-7-a-klasse-w168/"}
      - {"question":"Какой фильтр и прокладка на 722.7?","answer":"Фильтр — 168 377 03 95. Прокладка поддона часто идёт в комплекте с фильтром (FEBI и др.); отдельный OEM надёжно уточнять по VIN.","url":"https://diy.rodionenkin.de/mb-reparaturanleitungen/olwechsel-automatikgetriebe-722-7-a-klasse-w168/"}
      - {"question":"На панели «F» и коробка не переключается — что делать?","answer":"«F» — аварийный режим. Частые причины — низкий/старый уровень ATF или отказ блока FTC. Сначала проверьте уровень и при необходимости замените масло и фильтр; если не помогло — диагностика и ремонт/замена блока управления.","url":"https://www.aclassclub.co.uk/threads/w168-transmission.10432/"}
      - {"question":"Через сколько км менять масло в 722.7?","answer":"Официально Mercedes говорит о «пожизненной» заправке, но по практике и рекомендациям мастеров — каждые 60 000 км; при городской езде или тяжёлых условиях — чаще.","url":"https://diy.rodionenkin.de/mb-reparaturanleitungen/olwechsel-automatikgetriebe-722-7-a-klasse-w168/"}
    procedure_id: "MERCEDES_722.7"
