    procedure: |
      1. Подтвердите по VIN/шильду, что установлена AQ450 (09P), и подготовьте ATF G 055 540 A2, фильтр 09P325429 и прокладку 09P321370.
      2. Прогрейте коробку поездкой и установите авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару: обычно около 3,5 л.
      4. Снимите поддон, очистите магниты от шлама, замените фильтр и прокладку поддона.
      5. Установите поддон с новой прокладкой, затяните крепеж крест-накрест по моменту из мануала ревизии.
      6. Через заливное отверстие залейте объем, равный слитому, затем запустите двигатель и прокачайте селектор по всем режимам.
      7. Сканером контролируйте температуру ATF. При 35–45 °C откройте контрольную пробку: правильный уровень — тонкая струйка, переходящая в капли.
      8. Если не течет — долейте малыми порциями; если течет сильно — дождитесь перехода в капли и закройте пробку.
      9. При сильном загрязнении масла выполните повторный частичный цикл через 300–1000 км.
      10. Выполните тест-драйв 10–15 км и повторно проверьте герметичность поддона и корректность переключений.
    mistakes:
