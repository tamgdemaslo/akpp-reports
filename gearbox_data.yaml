  AW55:
    manufacturer: Aisin Warner
    gearbox: 5-AT AW55-50SN / AW55-51SN (AF33 / RE5F22A, Volvo / Saab / Opel / Nissan / Renault)
    summary: AW55-50SN/51SN | 3,5–4,0 л | сливная пробка 35 Н·м | ATF JWS-3309 | сервисная замена по щупу при 50–60 °C
    oem_codes: |
      ATF:
        Volvo 1161540 / 1161640 (JWS-3309)
        Toyota Type T-IV / Mobil ATF 3309 / Aisin AFW+
      фильтр внутренний:
        внутренний, при обычной сервисной замене не меняется; подбирается только при ремонте/разборке
