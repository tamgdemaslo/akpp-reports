    procedure: |
      1. Подтвердите по VIN, что установлена DSG DQ380/0DE, и подготовьте достаточный объём G 055 529 A2 и расходники по каталогу для конкретного автомобиля.
      2. Установите автомобиль на подъёмник/яму строго горизонтально. Снимите защиту, обеспечьте доступ к сливной/контрольной пробке и зоне фильтра.
      3. Подставьте ёмкость не менее 10–12 л и аккуратно открутите сливную/контрольную пробку DSG, слейте основную порцию масла. При наличии отдельной пробки/переливной трубки для мехатроники открутите и её, дождитесь полного прекращения активного слива (ориентировочно 5,5–6 л при частичной замене).
      4. Снимите крышку фильтра (по конструкции DQ380 место и крепёж могут отличаться по моделям), аккуратно извлеките фильтр и уплотнительные кольца; подготовьте ветошь, так как при снятии фильтра из корпуса выливается часть масла.
      5. Осмотрите слитую жидкость, состояние поддона/крышки и магнитов (если есть) на наличие шлама и стружки — это важный индикатор состояния коробки.
      6. Установите новый фильтр и новые уплотнительные кольца, соберите крышку фильтра с соблюдением моментов затяжки из официальной документации.
      7. Установите переливную трубку (если предусмотрена) и новую шайбу на сливную/контрольную пробку, заверните пробку от руки для последующей регулировки уровня.
      8. Через адаптер и насос залейте расчётный объём G 055 529 A2 (ориентировочно 5,5–6 л, ориентируясь на фактический слив и техдокументацию).
      9. Запустите двигатель, удерживая педаль тормоза, и несколько раз плавно переведите селектор по всем положениям (P–R–N–D/S) с паузой 2–3 секунды, затем верните селектор в «P».
      10. С помощью диагностического сканера контролируйте температуру DSG-жидкости; при достижении 35–45 °C при работающем двигателе и горизонтальном положении авто аккуратно открутите контрольную/переливную пробку и оцените поток.
      11. Если масло почти не вытекает, дозаливайте G 055 529 A2 малыми порциями и повторяйте проверку до появления тонкой струйки, переходящей в частые капли при 35–45 °C; при избыточном потоке дождитесь, пока лишнее масло стечёт до уровня капель.
      12. После выставления уровня окончательно затяните пробку с новой шайбой по моменту из мануала, установите защиту и выполните дорожный тест с контролем работы коробки и температур.
      13. При наличии жалоб до сервиса (шумы, вибрации, рывки, неверные обороты переключений) по результатам осмотра и заменённой жидкости оцените необходимость дополнительных работ (адаптаций, проверки сцеплений/мехатроники), так как одна замена масла может не устранить накопленные дефекты.
    mistakes:
      - Считать DQ380 необслуживаемой и не менять масло до появления ярко выраженных симптомов (рык, вибрации, ошибки по DSG).
      - Использовать ATF/масла без допуска G 055 529 A2, ориентируясь только на принадлежность к DSG.
      - Игнорировать слив из обеих точек (корпус + мехатроника), ограничиваясь лишь одной пробкой.
      - Выставлять уровень без контроля температуры и без процедуры через переливное отверстие.
      - Подбирать фильтр и уплотнения только по коду DQ380, не сверяя по VIN и ревизии (DQ380 vs DQ381/0GC и пр.).
    nuances: "DQ380 — мокрая DSG7 для поперечных моторов и переднего привода, созданная как «облегчённый» вариант DQ500 для рынка с более компактными моделями и моторами до ~420 Н·м. Коробка использует один общий контур DSG-жидкости, в котором масло одновременно смазывает механику, подшипники, сцепления и питает мехатронику, поэтому качество жидкости и регулярность её замены критичны. По TVS Engineering и Otoba, типичные жалобы при редком обслуживании — дребезг, вибрации, проскальзывания сцеплений и некорректные обороты переключений."
    description: "VAG DQ380 / 0DE — 7-ступенчатая мокрая DSG для поперечных двигателей, применяемая на современных моделях VW/Skoda/Audi (Golf, Tiguan, Passat, Superb, A3 и др.) в основном на китайском и ряде других рынков. Коробка использует DSG-жидкость класса G 055 529 A2 с общей заправкой порядка 7–7,2 л и регламентным обслуживанием каждые 60 тыс. км. Для мастерской важно помнить, что DQ380 имеет общую компоновку с DQ381/DQ500, но отличается деталями фильтра, поддона и объёмами, которые нужно сверять по VIN и техдокументации."
    weak_points: |
      1. Перегрев и старение масла.
      Одна масляная ванна обслуживает механику, сцепления и мехатронику, поэтому высокие температуры и редкие замены ведут к ускоренному старению жидкости и износу узлов.
      
      2. Дребезг и вибрации.
      По описаниям проблем DQ380/381, типичные жалобы — дребезг и вибрации при трогании и переключениях из-за износа сцеплений и загрязнения масла.
      
      3. Проскальзывания сцеплений.
      При активной езде и редком обслуживании мокрые сцепления начинают проскальзывать; на этой стадии одной заменой масла уже не всегда удаётся исправить ситуацию.
      
      4. Засорение мехатроники.
      Грязная DSG-жидкость забивает гидравлические каналы и соленоиды, вызывая рывки и ошибки по давлению.
      
      5. Сложность подбора расходников.
      Родство с DQ381 и различия по рынкам означают, что фильтры и прокладки нужно выбирать по VIN и ETKA; попытка использовать «универсальный» комплект по коду DQ380 может привести к неправильной посадке фильтра или протечкам.
