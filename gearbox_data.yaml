    description: "VAG AL952 (0D6) — 8-ступенчатый гидроавтомат для мощных модификаций Audi, Bentley, Porsche, Lamborghini и Volkswagen, разновидность ZF 8HP95A. Коробка рассчитана на момент до 950 Н·м и при нормальном обслуживании имеет ресурс около 300 тыс. км. Для ресурса критичны регулярная замена ATF G 060 162 A2, корректная выставка уровня по температуре и замена поддона с интегрированным фильтром."
    weak_points: |
      1. Износ фрикциона блокировки ГДТ при активной езде -> вибрации и пыль в масле.
      2. Продукты износа ГДТ забивают соленоиды гидроблока -> толчки и задержки переключений.
      3. От вибраций ускоряется износ подшипника маслонасоса.
      4. На пробегах встречаются течи по пластиковому поддону и патрубкам охлаждения.
      5. Ресурс сильно зависит от теплового режима и реального интервала обслуживания.
