      - {"question":"Почему вариатор начинает пинаться и гудеть?","answer":"Частые причины: вытяжка цепи, загрязнение гидроблока, износ подшипника ведомого конуса и перегрев масла.","url":"https://otoba.ru/transmissii/vag/0an.html"}
