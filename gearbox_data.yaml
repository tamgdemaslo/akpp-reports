      4. Подтеки по поддону и пробкам.
      Часто вызваны повторным использованием старых шайб и прокладки.

      5. Ошибки после неправильного выбора ATF.
      Применение не-WS жидкостей ухудшает работу соленоидов и фрикционных пакетов.
