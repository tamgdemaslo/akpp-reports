    nuances: |
      У Mercedes 722.7 нижний поддон, значит фильтр при стандартном ТО меняется.
      Это поперечная коробка для W168/Vaneo, и по логике сервиса она сильно отличается от более привычных заднеприводных Mercedes АКПП.
      По заводским материалам после обычного oil change в коробку сначала подают около 4,0 л ATF, а потом доводят уровень после прогрева; поэтому «залить столько же, сколько слилось» здесь особенно опасно без контрольной процедуры.
      По техническим и профильным источникам коробка чувствительна к загрязнению масла, а часть тяжёлых жалоб уходит не в механику поддона, а в электронную плату/FTC и гидроблок.
    description: |
      **Mercedes 722.7 / W5A180** — редкая поперечная 5-ступенчатая АКПП для `A-Class` и `Vaneo`, и для сервиса по замене масла это одна из тех коробок, где нельзя работать «по памяти от других Mercedes».
      
      Хорошая новость: у неё нижний поддон и сервисный фильтр, то есть фильтр на обычном ТО меняется. Но дальше начинаются нюансы: коробка стоит поперечно, имеет свою процедуру контроля уровня, а по жалобам часто смешивает гидравлические проблемы, загрязнённое масло и электронные сбои блока управления/платы.
      
      Для мастера по замене масла здесь главное не завышать ожидания клиента. Свежая жидкость и новый фильтр коробке нужны, но если машина уже ловит `F`, уходит в нейтраль или нелогично переключает передачи, одной заменой масла это часто не лечится.
      
      Практически `722.7` стоит воспринимать как редкую и чувствительную к дисциплине обслуживания коробку: точный объём, правильный допуск ATF, обязательная замена фильтра, чистый поддон и аккуратная проверка симптомов до и после сервиса.
    weak_points: |
      **1. Электронная плата/FTC и гидроблок часто маскируются под «просто пора поменять масло».**
      По профильным источникам 722.7 умеет уходить в `F`, случайно вставать в neutral и нелогично переключать передачи из-за проблем электронной платы и клапанной части. Для мастера это значит: такие жалобы нужно фиксировать до ТО, а не обещать, что всё уйдёт после свежего ATF.
      
      **2. K1 drum считается одной из известных тяжёлых точек отказа.**
      В технических разборках и профильных обсуждениях именно повреждение K1 drum всплывает как одна из типовых серьёзных поломок. Если коробка уже имеет грубые ошибки по внутреннему повреждению, обычный сервис по маслу тут только часть картины.
      
      **3. Загрязнённый ATF быстро усугубляет работу редкой коробки.**
      Для 722.7 масло важно не только как смазка, но и как рабочая среда для чувствительной гидроэлектронной части. При тёмном масле и грязном поддоне мастеру важно заранее обсуждать с клиентом, что эффект от сервиса может быть ограничен.
      
      **4. Уровень ATF здесь критичен.**
      Из-за специфической процедуры контроля любая спешка даёт неправильный уровень, а дальше коробка начинает вести себя так, будто проблема глубже. Это один из главных практических рисков именно для сервиса по маслу.
    faq:
      - question: "Меняется ли фильтр на Mercedes 722.7 при обычном ТО?"
        answer: "Да. У 722.7 нижний поддон, поэтому фильтр сервисный и при нормальном обслуживании меняется."
        url: "https://nemigaparts.com/cat_spares/epc/mercedes/3/ga/722701/23t/27/115/"
