    procedure: |
      1. Подтвердите, что это SQ100 (0CT / ASG): обычно VW Up, Skoda Citigo, Seat Mii. Машина должна стоять строго горизонтально.
      2. При необходимости снимите защиту картера. Подставьте ёмкость под сливную пробку коробки.
      3. Открутите сливную пробку 17 mm и слейте масло (~1 л). После слива очистите пробку и установите с новым уплотнением, затянув около 30 Н·м.
      4. Снимите корпус воздушного фильтра, чтобы открыть доступ к верхней части КПП.
      5. Найдите сверху на коробке пластиковую заглушку заливной пробки, зафиксированную винтом под ключ 12-spline 8 mm (это не Torx). Аккуратно открутите винт и выньте заглушку с O-ring.
      6. Через открытое заливное отверстие залейте 1,1–1,2 л MTF G 052 171 A2 или G 052 527 A2, используя воронку и шланг. Руководство указывает 1 л, но форумная практика для SQ100 — ближе к 1,1–1,2 л.
      7. Установите заглушку с уплотнением обратно, затяните винт 12-spline 8 mm, соберите корпус воздушного фильтра.
      8. Совершите короткую поездку, проверьте отсутствие подтёков и посторонних шумов; при следующем визите убедитесь, что клиент не замечает ухудшения переключений.
    mistakes:
      - Заливать обычное GL4 75W-90 вместо MTF G 052 171 A2 / G 052 527 A2 — ухудшается качество переключений, особенно на холодную.
      - Использовать Torx вместо 12-spline 8 mm для заливной пробки и срывать грани.
      - Заливать строго 1 л без учёта практики; реальный комфортный объём чаще 1,1–1,2 л.
      - Ожидать, что замена масла устранит рывки и задержки, связанные со сцеплением или логикой ASG.
      - Пытаться искать и менять «фильтр АКПП» — у SQ100 нет поддона и сервисного фильтра как у классического автомата.
    nuances: "SQ100 — роботизированная КПП на базе механической MQ100 (0CF): одно сцепление, электромеханические актуаторы, механика как у МКПП. Нет гидротрансформатора и сервисного поддона; обслуживание по маслу сводится к сливу и заливу через пробки. Масло очень малой вязкости (похоже на ATF), поэтому обычные МКПП-олива 75W-90 делают ходы жёсткими и переключения грубыми. Известные слабые места — не само масло, а ресурс сцепления и комфорт работы актуаторов в пробке."
    description: "VAG SQ100 (0CT) — 5-ступенчатая роботизированная коробка ASG на базе механики MQ100 (0CF), ставится на VW Up!, Skoda Citigo, Seat Mii с моторами до 1,0 л. Конструкция ближе к МКПП с автоматическим управлением сцеплением и выбором передач, а не к классической гидроавтоматической АКПП. Для мастера по обслуживанию важно: нижнего поддона и фильтра нет, обслуживание по маслу — только слив и залив через пробки; требуется очень жидкая MTF спецификации G 052 171 A2 / G 052 527 A2 и специальный ключ 12-spline 8 mm для верхней заливной пробки. Типичные жалобы на рывки и «раздумья» коробки часто связаны с логикой ASG и состоянием сцепления, а не с маслом."
    weak_points: |
      1. Ресурс сцепления.
      По обзорам SQ100 (0CT) и отзывам владельцев VW Up!/Citigo/Mii, сцепление нередко требует замены уже к 40–60 тыс. км при городской эксплуатации с пробками и подъёмами. Замена масла на ресурс сцепления влияет слабо.
      
      2. Рывки и медленные переключения.
      ASG с одним сцеплением конструктивно выдаёт паузы и подёргивания при смене передач. В пробках и на подъёмах это ощущается сильнее. Если после корректной замены масла поведение не меняется, причина, как правило, в логике трансмиссии и износе сцепления.
      
      3. Ограниченная ремонтопригодность и редкость.
      SQ100 встречается только на малолитражках VAG и сравнительно редок; профильных сервисов и донорских агрегатов немного, что усложняет серьёзный ремонт.
      
      4. Чувствительность к неправильному маслу.
      Использование стандартного GL4 75W-90 вместо штатной MTF приводит к грубым переключениям, особенно на холодную, и жалобам клиентов.
      
      5. Небольшой объём масла.
      Объём всего ~1,2 л: даже небольшие утечки или недолив быстро приводят к ухудшению работы и риску ускоренного износа.
