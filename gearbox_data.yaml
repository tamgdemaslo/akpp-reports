    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.8 / Autotronic. Это вариатор, и обслуживать его как обычную АКПП Mercedes нельзя.

      1. До заказа расходников уточните ревизию коробки, потому что у прокладки поддона есть ранний и поздний OEM.
      2. Установите автомобиль строго горизонтально и слейте CVT fluid, точно измерив объём.
      3. Снимите нижний поддон: у 722.8 фильтр сервисный, поэтому при обычном ТО он меняется.
      4. Очистите поддон и магниты, внимательно оцените количество шлама и металлической пыли.
      5. Установите новый фильтр, новую прокладку по ревизии и новую шайбу сливной пробки.
      6. Залейте объём, близкий к фактически слитому, затем прогрейте вариатор и пройдите все режимы.
      7. Финальный уровень по 722.8 проверяйте только на 80 °C и только корректным щупом.
      8. Если цель — расширенный сервис с более глубоким сливом, схему нужно сверять с WIS именно для данной машины; для обычного ТО ориентир по сервисному объёму обычно около 4 л.
      9. После тест-драйва повторно проверьте уровень, герметичность и поведение коробки на трогании и при замедлении.
