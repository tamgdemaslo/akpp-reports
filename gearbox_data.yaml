    procedure: |
      1. Подтвердите по VIN, что установлена именно АКПП 01M, и подготовьте ATF G 052 162 A2 (или эквивалент по TL 52162), 75W90 GL4 для редуктора, фильтр 01M 325 429, прокладку 096 321 370 и, при необходимости, пробку N 904 142 03 и трубку 096 321 363.
      2. Выполните лёгкий прогрев автомобиля, затем установите его на строго горизонтальную площадку (подъёмник/эстакада), переведите селектор в «P» и дайте коробке немного остыть до безопасной для работы температуры.
      3. Снимите нижнюю защиту, очистите зону поддона и сливной/контрольной пробки от грязи, подготовьте ёмкость не менее 10 л.
      4. Аккуратно выверните сливную/контрольную пробку поддона (болт N 904 142 03) и слейте первую порцию ATF; при наличии внутренней переливной трубки 096 321 363 после первичного слива выкрутите трубку и дождитесь основного слива.
      5. После прекращения активного слива снимите болты поддона, аккуратно опустите его, не проливая остатки жидкости, и перенесите поддон на верстак для мойки.
      6. Снимите старый фильтр 01M 325 429, оцените количество стружки и шлама на магните и в поддоне – это важный диагностический шаг для 01M.
      7. Тщательно промойте поддон и магниты очистителем тормозов до чистого металла, убедитесь в отсутствии трещин и деформаций поддона 01M 321 359.
      8. Установите новый фильтр 01M 325 429, проверив, что уплотнительное кольцо встало ровно и старое кольцо не осталось в посадочном гнезде корпуса.
      9. Установите новую прокладку поддона 096 321 370 на очищенный поддон, совместите все отверстия и смонтируйте поддон на коробку, затягивая болты крест‑накрест по моментам из ремонтного мануала (без перетяга).
      10. Вкрутите обратно переливную трубку 096 321 363 (если она демонтировалась) и подготовьте сливную/контрольную пробку с интегрированным уплотнением N 904 142 03; пробку пока затягивайте только от руки или с небольшим моментом.
      11. Подключите насос/шприц с ATF G 052 162 A2 к контрольному отверстию и залейте первую порцию масла (чуть больше объёма слива – ориентировочно 3,5–4,0 л).
      12. Заверните пробку, запустите двигатель, удерживая педаль тормоза, и последовательно переведите селектор во все положения P–R–N–D с паузой 2–3 секунды в каждом, затем оставьте селектор в положении «N» или «P» согласно используемому мануалу.
      13. С помощью диагностического сканера либо внешнего термометра контролируйте температуру ATF; при достижении 35–45 °C снова поднимите автомобиль, аккуратно открутите контрольную пробку и оцените поток масла.
      14. При правильном уровне при 35–45 °C из отверстия должна идти стабильная струйка, переходящая в частые капли; если масло не вытекает – дозаливайте ATF небольшими порциями через адаптер и повторяйте проверку.
      15. После того как излишек масла стечёт до частых капель, окончательно затяните пробку по моменту из ремонтного мануала, установите на место защиту и убедитесь в отсутствии подтёков после короткой поездки.
      16. Отдельно обслужите редуктор: через его пробки слейте старое масло 75W90 GL4, заправьте около 1 л свежего масла до контрольного уровня и установите пробки с нужными моментами затяжки.
    mistakes:
      - Игнорировать второй контур масла 75W90 GL4 в редукторе и обслуживать только ATF, оставляя редуктор без внимания.
      - Лить любой «красный Dexron» вместо ATF с допуском G 052 162 A2/TL 52162, особенно на живую коробку.
      - Ограничиваться только сливом через пробку без снятия поддона, чистки магнитов и замены фильтра 01M 325 429.
      - Выставлять уровень ATF без контроля температуры и работы переливной трубки, «на глаз» или по объёму.
      - Игнорировать загрязнённую проводку и разъёмы соленоидов, списывая все толчки исключительно на масло.
      - Давать коробке перегреваться (забитые радиаторы, тяжёлая езда без доп.охлаждения), что ведёт к оплавлению резиновых поршней и ускоренному износу.
    nuances: |
      Главный практический нюанс 01M – это два разных масла в одном узле: ATF G 052 162 A2 в самой АКПП и 75W90 GL4 в редукторе. Для карты коробки важно явно проговаривать оба объёма и оба допуски, чтобы сервис не «забывал» про редуктор.
      Уровень ATF контролируется через переливную трубку внутри поддона (096 321 363) и сливную/контрольную пробку без щупа: любая ошибка по температуре, горизонту или положению селектора быстро даёт либо недолив (масляное голодание), либо перелив (вспенивание)
      Электрика и соленоиды у 01M чувствительны к грязному маслу и возрасту проводки: окисления, переломы проводов и забитые соленоиды – типичная причина пинков и аварийного режима. При большом пробеге замена масла без проверки гидроблока и проводки может дать лишь временное улучшение.
      По открытым источникам ресурс 01M сильно зависит от условий: при регулярном сервисе и адекватных нагрузках коробка ходит 200–250 тыс. км, но перегревы и редкая замена ATF быстро сокращают этот ресурс.
    description: |
      VAG 01M – массовый 4‑ступенчатый переднеприводный автомат, который с середины 90‑х ставился почти на весь компактный ряд VAG: Golf/Jetta/Passat, New Beetle, Octavia, Leon, Toledo, Audi A3 и др. Конструктивно это классический гидроавтомат с гидротрансформатором, планетарными рядами и гидроэлектронным управлением, рассчитанный на моторы до ~2.0 л и момент до 200 Н·м.
      По данным Otoba и профильных сервисов коробка использует два типа масла: ATF G 052 162 A2 в самой АКПП (сухой объём около 5,3 л, частичный слив ~4 л) и отдельное трансмиссионное масло 75W90 GL4 в редукторе (примерно 1 л). Производитель формально объявлял её «малосервисной», но практика показала, что реальный ресурс и комфорт достигаются при регулярной замене ATF с фильтром каждые 60 тыс. км и контроле редуктора.
      Основные жалобы по 01M на больших пробегах традиционны: пинки при переключениях, задержки включения, ошибки по соленоидам и датчикам оборотов, течи и последствия перегрева. При этом железо коробки в целом неплохо живёт при чистом масле и корректной работе по температуре и уровню, а грамотный сервис даёт ей шанс отходить свои 200+ тыс. км без тяжёлых ремонтов.
    weak_points: |
      1. Проводка и соленоиды.
      Часто страдают жгут и разъёмы соленоидов: окисление контактов, переломы проводов и загрязнение самих соленоидов продуктами износа приводят к толчкам, аварийному режиму и ошибкам по давлению/переключениям.
      
      2. Чувствительность к перегреву.
      При тяжёлой езде и забитом теплообменнике 01M быстро перегревается: страдают резиновые поршни, сальники и фрикционы, что приводит к пробуксовкам и дорогостоящей переборке.
      
      3. Два контура масла.
      Отдельный редуктор с 75W90 GL4 часто игнорируется при ТО, что ведёт к шумам и износу механической части, даже если ATF меняли вовремя.
      
      4. Возрастные проблемы гидроблока.
      С годами клапанная плита и соленоиды теряют эластичность и чистоту каналов, из‑за чего коробка становится «задумчивой», появляются жёсткие переключения и ударные включения.
      
      5. Классические течи.
      Уставшие уплотнения, сальники и прокладка поддона 096 321 370 начинают подтекать, и при отсутствии контроля уровня это превращается в масляное голодание и ускоренный износ.
    faq:
      - {"question":"Какое масло заливать в АКПП 01M?","answer":"В гидравлическую часть 01M заливают только ATF с допуском VW G 052 162 A2 (или строго совместимые аналоги по TL 52162/LT71141). Отдельно редуктор обслуживается маслом 75W90 GL4 – это другой контур и другая жидкость.","url":"https://akppcenter.com/volkswagen/01m"}
      - {"question":"Сколько масла нужно на обслуживание 01M?","answer":"Сухой объём ATF около 5,3 л, но при частичной замене со снятием поддона и фильтра обычно удаётся слить 3,5–4,0 л. Для комфортного запаса на сервис разумно иметь 6–7 л ATF G 052 162 A2 плюс около 1 л 75W90 GL4 для редуктора.","url":"https://gearboxlist.com/volkswagen/01m/"}
      - {"question":"Через какой пробег менять масло и фильтр в 01M?","answer":"Практический и рекомендуемый интервал – каждые 60 000 км или 3–4 года. При тяжёлой городской эксплуатации и буксировке прицепа интервал лучше сокращать.","url":"https://otoba.ru/transmissii/vag/01m.html"}
      - {"question":"Нужно ли обслуживать редуктор отдельно от АКПП?","answer":"Да, в 01M редуктор имеет свой объём и свою жидкость (75W90 GL4). Игнорирование редуктора при ТО – частая ошибка, которая приводит к шумам и износу механики даже при свежем ATF.","url":"https://akppcenter.com/volkswagen/01m"}
      - {"question":"Как правильно выставить уровень ATF в 01M?","answer":"Уровень задаётся через переливную трубку: на прогретой до 35–45 °C коробке, при работающем двигателе и селекторе по инструкции (обычно «N» или «P»), через контрольное отверстие выводят лишний ATF до устойчивой струйки, переходящей в частые капли.","url":"https://vwts.ru/forum/topic/250919/"}
