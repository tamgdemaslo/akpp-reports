  VAG_AL1000.:
    manufacturer: VAG
    gearbox: VAG AL1000 (Aisin TR-80SD / 0C8)
    summary: AL1000 | 8-ступ. | 5,5–6,0 л | 16 / 8 Н·м | G 055 540 A2 | 35–45 °C
    oem_codes: |
      ATF VAG G 055 540 A2  
      фильтр маслоприёмника 0C8 325 435  
      уплотнение фильтра 0C8 325 443  
      прокладка поддона 0C8 321 371  
      сливная пробка WHT 005 510  
      уплотнение сливной пробки 0C8 321 181  
      крепёж поддона по VIN/старому комплекту; в профильных сервисных обсуждениях часто встречается WHT 005 511 × 11, но без VIN лучше не заказывать вслепую
    fluid: ATF спецификации VAG G 055 540 A2 / JWS 3324 (Toyota WS)
    fill_range: 35–45 °C (уровень выставляется на работающем двигателе через переливную трубку)
    drain_volume: 5,5–6,0 л (поддон снят, фильтр заменён; на сервис готовить 8–9 л)
    dry_capacity: 10,5–12,0 л
    service_interval: 60 000 км или 4 года (50 000 км — тяжёлый режим, буксировка, город, чип)
    tools:
      - подъёмник / ровная площадка, автомобиль строго горизонтально
      - головка 10 мм (болты поддона)
      - Torx E8 (болт фильтра)
      - шестигранник 5 мм (внутренняя переливная трубка)
      - шестигранник 17 мм или квадрат 8 мм (наружная пробка, зависит от ревизии)
      - адаптер ATF105 / штуцер под заливку в отверстие пробки
      - динамометрический ключ 2–60 Н·м
      - сканер VCDS / OBD11 или точный ИК-термометр
      - мерная тара и помпа/опрессовщик для ATF
    parts_list:
      - ATF G 055 540 A2 8–9 л
      - фильтр 0C8 325 435
      - уплотнение фильтра 0C8 325 443
      - прокладка поддона 0C8 321 371
      - сливная пробка WHT 005 510 при износе старой
      - уплотнение сливной пробки 0C8 321 181
    pan_bolts: крепёж поддона сверять по VIN и старому комплекту; по сервисным кросс-ссылкам чаще встречается комплект из 11 болтов
    drain_torque: 16 Н·м (наружная пробка)
    fill_torque: |
      8 Н·м  — болты поддона  
      10 Н·м — болт фильтра  
      1–2 Н·м — переливная трубка
    procedure: |
      1. Подтвердите по маркировке, что перед вами именно 0C8 / AL1000. Машина должна стоять строго горизонтально.
      2. Снимите защиту. Сначала сорвите наружную пробку, чтобы не остаться с пустой АКПП и закрытым заливным доступом.
      3. Слейте ATF через наружную пробку, затем выкрутите внутреннюю переливную трубку — основная масса жидкости выйдет после этого.
      4. Снимите поддон, тщательно очистите поддон и магниты. Для AL1000 это обычное сервисное ТО с заменой фильтра, потому что поддон нижний.
      5. Снимите фильтр, убедитесь, что старое уплотнение вышло вместе с ним. Установите новый фильтр 0C8 325 435 с новым кольцом 0C8 325 443.
      6. Уложите новую прокладку 0C8 321 371 насухо, соберите поддон. Герметик на прокладку не наносится.
      7. Вкрутите переливную трубку, через адаптер залейте стартовый объём ATF. Затем запустите двигатель и пройдите селектором все диапазоны с короткой задержкой.
      8. При 35–45 °C на работающем двигателе откройте наружную пробку и доведите уровень до тонкой струйки/частых капель. Если ATF ушла выше 45 °C, дайте коробке остыть и перепроверьте уровень.
      9. Затяните пробку с новым уплотнением, выполните тест-драйв и повторно проверьте герметичность поддона и пробки.
    mistakes:
      - Использование универсальной ATF без прямого соответствия VAG G 055 540 A2 / JWS 3324.
      - Неправильная посадка уплотнения фильтра 0C8 325 443 — после ТО это одна из типовых причин шедера и проскальзывания.
      - Выставление уровня не в окне 35–45 °C или на неровно стоящем автомобиле.
      - Повторное использование уплотнения сливной пробки 0C8 321 181.
      - Перенос кросс-номеров расходников без сверки по VIN и фактически снятому комплекту.
    nuances:
      - У AL1000 нижний поддон, поэтому фильтр при обычном ТО меняется.
      - По официальным VAG-позициям фильтр и его O-ring идут раздельно: 0C8 325 435 и 0C8 325 443.
      - Для мастерской разумно фиксировать все имеющиеся до ТО жалобы на шедер/толчки: на форумах по 0C8 именно неверный уровень после сервиса чаще всего становится причиной претензий «после замены масла коробка поехала хуже».
      - В профильных обсуждениях часто используют Toyota/Lexus кроссы на фильтр и прокладку, но если нужен один безопасный комплект без оговорок, берите VAG OEM выше.
    price_block: |
      Москва, I кв. 2025 г.  
      • Работа «поддон + фильтр AL1000 / 0C8» — 8 000 – 10 000 ₽  
      • Фильтр 0C8 325 435 — 5 000 – 6 500 ₽  
      • O-ring фильтра 0C8 325 443 — 1 500 – 2 500 ₽  
      • Прокладка поддона 0C8 321 371 — 2 000 – 2 600 ₽  
      • Уплотнение пробки 0C8 321 181 — 1 000 – 1 500 ₽  
      • ATF G 055 540 A2 (1 л) — 2 000 – 2 400 ₽
    docs: |
      VW / Audi Parts: G055540A2, 0C8325435, 0C8325443, 0C8321371, WHT005510, 0C8321181  
      Total Technik: «How to Change Gearbox (Transmission) Fluid - 0C8 - Q7, Cayenne, Touareg, Panamera 2011-2015»  
      ClubTouareg: threads on 0C8 service parts and post-service shudder  
      ETKA / PET cross-check 03/2025
    description: |
      **VAG AL1000** — это продольная 8-ступенчатая АКПП Aisin семейства **0C8 / TR-80SD**, которую ставили на Touareg, Q7, Cayenne и часть Panamera.

      Для сервиса по замене масла главное здесь не маркетинговое имя, а сервисная логика: **нижний поддон, сервисный фильтр меняется при обычном ТО, уровень выставляется только по температуре и по переливной трубке**.

      По обсуждениям мастеров и владельцев у этой коробки очень много «послесервисных» претензий рождается не из-за самой коробки, а из-за процедуры: не тот уровень, не то масло, плохо посаженное кольцо фильтра, повторно использованное уплотнение пробки. Поэтому для мастерской AL1000 — это коробка, где дисциплина процедуры важнее, чем скорость замены.

      Ещё один практический момент: по 0C8 давно известны Toyota/Lexus кроссы на часть расходников. Это полезно как резервная информация, но для одной чистой карточки на сайт и заказа безопаснее опираться на подтверждённые VAG OEM: фильтр `0C8 325 435`, его кольцо `0C8 325 443`, прокладка поддона `0C8 321 371`, пробка `WHT 005 510` и уплотнение пробки `0C8 321 181`.
    weak_points: |
      **1. Ошибка по ATF.**
      Для AL1000 мастеру нельзя относиться к жидкости как к «любой синтетике для автомата». На профильных обсуждениях именно не тот класс ATF регулярно называют одной из причин жалоб на шедер и некорректные переключения после сервиса.

      **2. Неверный уровень после сборки.**
      На форумах Touareg/Q7 это одна из самых частых постсервисных проблем: коробка после ТО начинает дрожать, подбуксовывать или пинаться, а потом выясняется, что уровень выставили не в том температурном окне.

      **3. Неправильная посадка кольца фильтра.**
      Если старое кольцо осталось в посадке или новое `0C8 325 443` встало криво, коробка может сразу после сервиса дать симптомы «как будто умерла».

      **4. Путаница с кросс-номерами расходников.**
      Кроссы Toyota/Lexus по фильтру и кольцу обсуждаются часто, но мастеру нельзя превращать их в «универсальный комплект без проверки». Для сайта и заказ-наряда безопаснее держать базой VAG OEM.
    faq:
      - question: "Меняется ли фильтр при обычном ТО на AL1000?"
        answer: "Да. У AL1000 нижний поддон, поэтому фильтр меняется при стандартном сервисе. Базовый VAG OEM набор: фильтр 0C8 325 435, его кольцо 0C8 325 443 и прокладка поддона 0C8 321 371."
        url: "https://parts.vw.com/p/Volkswagen__/Transmission-Oil-Filter/48007747/0C8325435.html"
      - question: "Какую ATF безопасно указывать в заказ-наряде?"
        answer: "Если нужна одна безопасная VAG-позиция без споров, указывайте G 055 540 A2. По семейству это жидкость класса JWS 3324 / Toyota WS, но универсальные ATF без прямого подтверждения по этой коробке лучше не обещать."
        url: "https://parts.vw.com/p/Volkswagen__/ATF-Oil/53596084/G055540A2.html"
      - question: "При какой температуре выставлять уровень?"
        answer: "При 35–45 °C на работающем двигателе и строго горизонтальном автомобиле. Если температура ушла выше 45 °C, дайте коробке остыть и повторите финальную проверку."
        url: "https://www.clubtouareg.com/threads/transmission-shudder-after-service.289137/"
      - question: "Что первым делом проверять, если после сервиса появился шедер или пробуксовка?"
        answer: "Сначала проверяйте уровень ATF и посадку кольца фильтра 0C8 325 443. В профильных обсуждениях именно эти две ошибки называют самыми частыми причинами проблем сразу после замены масла."
        url: "https://www.clubtouareg.com/threads/transmission-shudder-after-service.289137/"
      - question: "Можно ли брать Toyota/Lexus кросс-детали вместо VAG OEM?"
        answer: "Как запасной вариант на профильных форумах действительно обсуждают Toyota/Lexus кроссы прежде всего по фильтру и его кольцу. Но для одной чистой сайт-карточки и заказа безопаснее держать базой подтверждённые VAG OEM: 0C8 325 435 и 0C8 325 443."
        url: "https://www.clubtouareg.com/threads/how-to-get-cheaper-genuine-0c8-aisin-8-speed-service-parts-for-7p-touareg-cayenne-q7-also-pan-o-rama.305809/"
