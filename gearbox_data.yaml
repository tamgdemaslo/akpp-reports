      - внутренняя пробка уровня квадрат на 8
    drain_torque: 34 – 43 Н·м (среднее ≈ 38 Н·м)
    level_torque: до упора
    vent_torque: 39 – 43 Н·м (верхний вент-болт, если снимали)
    procedure: |
      1. Прогрейте трансмиссию: 5–7 км в спокойном режиме до TFT ≈ 45 °C.  
      2. Поднимите авто строго горизонтально, снимите защиту при работающем двигателе, затем заглушите.  
      3. Легко сорвите квадратом на 8 (пробка уровня); прикипевшую — устраните заранее.  
      4. Подставьте мерный таз, выкрутите сливную пробку, дождитесь тонкой струйки (~4,5 л).  
      5. Затяните пробку 34–43 Н·м.  
      6. Предварительно залейте объём слитого + 0,2–0,3 л через верхний вент или сбоку насосом.  
      7. Запустите двигатель, держите тормоз; переведите селектор P→R→N→D→M→D→N→R→P, задержка 2 с в каждом положении.  
      8. Дождитесь TFT 50–60 °C. На ХХ выкрутите пластиковую пробку уровня:  
        - Идеал — стабильные капли.  
        - Нет капель — доливайте по 0,2 л до струйки → капель.  
        - Сильная струя — дождитесь капель.  
      9. Затяните пробку уровня до упора. Протрите и обезжирьте картер, установите защиту.  
      10. Тест-драйв: 10 км с ускорениями 60–80 км/ч до TFT ≈ 80 °C; проверьте сухость и уровень при 50 °C.
    mistakes:
      - Проверка уровня < 50 °C → недолив (термотрубка открыта)  
      - Проверка уровня > 60 °C → перелив (тепловое расширение)  
      - Недолив/перелив → вспенивание, падение давления, износ фрикционов  
      - Перетяжка пробок > 43 Н·м → повреждение посадочных мест
    nuances:
