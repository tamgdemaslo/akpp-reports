      На части 722.5 сливная пробка гидротрансформатора встречается, на части поздних ревизий её уже может не быть, поэтому сервисный объём зависит от исполнения.
      По форумам коробка не славится большим запасом прочности, а типичные жалобы связаны с потерей 5-й передачи, reverse и жёсткими переключениями; поэтому до замены масла желательно отдельно фиксировать работу овердрайва и задней передачи.
    description: |
      **Mercedes 722.5** — редкая 5-ступенчатая АКПП переходного периода, которую проще всего запомнить как «старую гидромеханическую Mercedes-коробку с пятой передачей», а не как раннюю версию `722.6`.
      
      Для мастера по замене масла здесь главный риск не в самой процедуре, а в путанице. По логике обслуживания коробка ещё очень похожа на `722.3`: нижний поддон, сервисный фильтр, проверка уровня по горячему и зависимость качества переключений от вакуума и регулировок. Но из-за редкости коробки по ней легче ошибиться и с ATF, и с ожиданиями клиента.
      
      Хорошая новость: фильтр здесь меняется на обычном ТО. Плохая — `722.5` имеет не лучшую репутацию по ресурсу, и часть машин приходит уже с жалобами на пропажу 5-й передачи, reverse или жёсткие переключения, которые не исчезнут одной только свежей жидкостью.
      
      Поэтому для сайта и сервиса эту коробку разумно подавать как редкую и требовательную к диагностической дисциплине: сначала зафиксировать, как она переключает до обслуживания, затем сделать аккуратный сервис без перетяжки поддона и только после этого обсуждать, что изменилось, а что было внутренней проблемой ещё до ТО.
    weak_points: |
      **1. Потеря 5-й передачи и проблемы с reverse у 722.5 — известные жалобы, а не редкая экзотика.**
      На профильных форумах по 722.5 регулярно всплывают жалобы на потерю овердрайва и задней передачи. Для мастера это значит, что работу 5-й и reverse нужно фиксировать до замены масла, чтобы не обещать клиенту невозможное.
      
      **2. Жёсткие переключения часто связаны с вакуумным модулем и вакуумной частью, а не только с ATF.**
      По обсуждениям 722.508 и родственных версий эта коробка не адаптивная, поэтому «reset коробки» тут не поможет. После проверки уровня ATF надо смотреть modulator, вакуумную линию и регулировки.
      
      **3. Частичный слив легко выдаёт спорный результат.**
      Если коробка без слива гидротрансформатора или мастер этим не воспользовался, обновится не весь объём ATF. Для редкой 722.5 это важно проговаривать заранее, чтобы клиент понимал реальный объём работ.
      
      **4. Коробка чувствительна к затянутым интервалам обслуживания.**
      По форумам многие серьёзные проблемы у 722.5 проявляются на машинах, где масло долго считали «пожизненным». Для сервиса это повод особенно внимательно смотреть на цвет ATF, запах и количество грязи в поддоне.
