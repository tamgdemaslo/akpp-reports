      6. Прокачка: запустить двигатель; прижатый тормоз, селектор P → R → N → D → S → D → N → R → P с паузой 3 с — разогнать гидравлику, вывести воздух.
      7. Проверка уровня: при 35–45 °C открутить адаптер — лишнее должно литься струйкой и перейти в капли. Когда поток стал каплями, уровень верен.  
