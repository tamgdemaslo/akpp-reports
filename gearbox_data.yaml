    procedure: |
      1. Подтвердите по VIN/шильду, что установлена VL300 (01J), и подготовьте G 052 180 A2 и фильтр 01J301517D.
      2. Прогрейте вариатор поездкой, установите авто строго горизонтально.
      3. Открутите сливную пробку и слейте масло в мерную тару (обычно 4,0–5,0 л).
      4. Снимите поддон, очистите магниты, замените фильтр вариатора и уплотнения по каталогу.
      5. Установите поддон, затяните крепеж крест-накрест по моментам мануала ревизии.
      6. Через сервисное отверстие залейте объем, равный слитому.
      7. Запустите двигатель, удерживая тормоз, плавно переведите селектор по всем положениям с короткими паузами.
      8. Контролируйте температуру CVT сканером. При 35–45 °C выполните контроль уровня по сервисной пробке: правильный уровень — тонкая струйка и переход в капли.
      9. Если не течет — долейте малыми порциями; если перелив — дождитесь перехода в капли и закройте пробку.
      10. Выполните тест-драйв 10–15 км, проверьте отсутствие течей и плавность работы вариатора.
