  FW6A_EL:
    manufacturer: Ford/Mazda
    gearbox: FW6A-EL, GW6A-EL
    applications: Mazda 3/6, CX-3, CX-30, CX-5, CX-50, CX-9 (2012→)
    summary: Частичная замена ATF | сухой объём 7,9 л | слив-залив ≈ 3,3 л | ATF-FZ | 45 – 55 °C
    oem_codes: |
      Жидкость:
        • Mazda 0000-FZ-113E-01  
        • Mazda Europe AJ00-FZ-113E  
      Пробка слива:
