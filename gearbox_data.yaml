    procedure: |
      1. Убедитесь по VIN, что на автомобиле установлена именно АКПП 01P/098/AG4 (типично – VW T4/Eurovan, Sharan/Alhambra, Ford Galaxy), и подготовьте ATF G 052 162 A2, 75W90 GL4, фильтр 01M 325 429, прокладку поддона из семейства AG4 и пробку N 904 142 03.
      2. Лёгкой поездкой прогрейте коробку, затем установите автомобиль на строго горизонтальную площадку, переведите селектор в «P» и дайте агрегату немного остыть до безопасной температуры для работы под машиной.
      3. Снимите нижние защиты, обеспечьте доступ к поддону АКПП и сливной/контрольной пробке, тщательно очистите область от грязи.
      4. Подставьте ёмкость не менее 12 л и аккуратно выверните сливную/контрольную пробку N 904 142 03; слейте первую порцию ATF. Если конструктивно применена внутренняя переливная трубка, после первичного слива аккуратно демонтируйте её и дождитесь основного слива масла из поддона.
      5. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон и перенесите его на верстак, не проливая остатки масла.
      6. Снимите внутренний фильтр 01M 325 429, оцените состояние ATF, количество стружки и шлама на магнитах и в поддоне – это ключевая диагностика состояния 01P.
      7. Тщательно промойте поддон и магниты очистителем тормозов, удалив весь шлам, убедитесь в отсутствии трещин и деформаций поддона.
      8. Установите новый фильтр 01M 325 429, проверив, что уплотнительное кольцо встало на место и старое кольцо не осталось в корпусе.
      9. Установите новую прокладку поддона, совместите отверстия, аккуратно смонтируйте поддон на коробку и затяните болты крест‑накрест с использованием динамометрического ключа по моментам из ремонтного мануала 01P/098.
      10. Вкрутите обратно переливную трубку уровня (если она демонтировалась) и подготовьте сливную/контрольную пробку N 904 142 03 с интегрированным уплотнением; пробку пока затяните лишь от руки.
      11. Через контрольное/заливное отверстие с помощью насоса/шприца залейте первую порцию ATF G 052 162 A2 (ориентировочно 3,5–4,0 л, чуть больше объёма слива).
      12. Заверните пробку, запустите двигатель, удерживая тормоз, и последовательно переведите селектор во все положения P–R–N–D с паузой 2–3 секунды, затем оставьте в положении «N» или «P» согласно мануалу.
      13. С помощью диагностического сканера или внешнего термометра контролируйте температуру ATF; при достижении 35–45 °C снова поднимите автомобиль, аккуратно открутите контрольную пробку и оцените поток масла из переливного узла.
      14. При достаточном уровне при 35–45 °C из отверстия идёт стабильная струйка, переходящая в частые капли; если масла нет – дозаливайте ATF небольшими порциями через адаптер и повторяйте проверку до достижения этого режима.
      15. После того как излишек масла стечёт до частых капель, окончательно затяните пробку с нужным моментом, установите защиты и выполните тест‑драйв с контролем переключений, отсутствия пробуксовок и подтёков.
      16. Отдельно обслужите редуктор/дифференциал: через его пробки слейте старое масло 75W90 GL4, залейте свежую жидкость до контрольного уровня и затяните пробки по регламенту, проверив герметичность после поездки.
    mistakes:
      - Обслуживать только ATF и игнорировать отдельный контур масла 75W90 GL4 в редукторе/дифференциале.
      - Лить случайный Dexron или универсальные ATF без допуска к G 052 162 A2/LT71141, особенно на рабочую коробку без серьёзных дефектов.
      - Ограничиваться сливом через пробку без снятия поддона, чистки магнитов и замены фильтра 01M 325 429.
      - Выставлять уровень ATF «по объёму» или на неправильной температуре, не используя переливную систему и контроль 35–45 °C.
      - Игнорировать перегревы на загруженных минивэнах (города, прицепы, горы), что ведёт к оплавлению зелёных пластиковых подшипников и резиновых поршней.
      - Продолжать ездить при явных симптомах пробуксовок 3–4, рывков и ошибок по гидроблоку, ограничиваясь только доливом масла.
    nuances: |
      01P – «микроавтобусная» версия семейства AG4: по конструкции очень близка к 01M/01N, но рассчитана на более тяжёлые кузова и повышенный крутящий момент. Из‑за массы машин и режимов эксплуатации (загрузка, прицепы, трассы) для неё особенно критичны чистое масло и охлаждение.
      Как и другие AG4, коробка имеет два типа масла: ATF G 052 162 A2 для гидросистемы и 75W90 GL4 для редуктора. На практике редуктор часто забывают обслужить, а затем списывают шумы и износ на «плохой автомат».
      Типичные серьёзные поломки 01P приходятся на большие пробеги и перегретые экземпляры: выгорание пакета 3–4, разрушение пластиковых подшипников и сепараторов обгонных муфт, проблемы с соленоидами и гидроблоком из‑за грязного ATF.
      Для сайта важно подчеркнуть: при регулярном ТО каждые ~60 тыс. км и контроле температур эта коробка способна отъездить около 200–300 тыс. км даже на тяжёлых минивэнах.
    description: |
      VAG 01P (098/AG4) – это четырёхступенчатый гидроавтомат, разработанный на базе семейства 01M/01N для переднеприводных минивэнов и микроавтобусов: Volkswagen T4/Eurovan, Sharan, Seat Alhambra, Ford Galaxy и др. Коробка рассчитана на бензиновые и дизельные двигатели объёмом до ~2,8 л и моментом порядка 250 Н·м.
      По данным GearboxList и профильных сервисов сухой объём ATF находится в пределах 5,3–5,6 л (частичный слив ~4 л), а в дифференциал/редуктор заливают около 1 л 75W90 GL4. Как и у других AG4, выставление уровня ATF выполняется через переливную трубку при 35–45 °C, без щупа.
      Реальные проблемы 01P чаще всего связаны с тяжёлыми условиями эксплуатации: перегревы, езда с прицепом, постоянно нагруженный салон. В таких режимах грязное или старое масло быстро добивает пластиковые подшипники, обгонные муфты, резиновые поршни и гидроблок. При этом при регулярных заменах ATF, контроле редуктора и температур коробка сохраняет репутацию надёжной и ремонтопригодной.
    weak_points: |
      1. Пластиковые подшипники и элементы.
      Характерная проблема AG4 на тяжёлых машинах – зелёные пластиковые подшипники скольжения и элементы сепараторов, которые со временем оплавляются и становятся хрупкими, особенно при перегревах.
      
      2. Пакет 3–4 передачи и барабаны.
      На перегретых или долго не обслуживаемых коробках часты выгорание фрикционов 3–4 и повреждения барабанов – проявляется пробуксовками, пропаданием 3–4 передач и необходимостью переборки.
      
      3. Гидроблок и соленоиды.
      Грязный ATF забивает каналы и соленоиды гидроблока, вызывает масляное голодание и падение давления; страдают клапаны блокировки ГТД и EPC, появляются пинки, задержки и аварийный режим.
      
      4. Перегрев.
      Тяжёлый кузов и возможный прицеп делают 01P чувствительной к температуре: забитый радиатор/теплообменник и старое масло быстро приводят к оплавлению резиновых поршней и ускоренному износу всей гидросистемы.
      
      5. Два контура масла.
      Отдельный редуктор с 75W90 GL4 часто остаётся без обслуживания, что ведёт к шумам, износу шестерён и дополнительным нагрузкам на коробку.
