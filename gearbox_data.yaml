      1. Подтвердите по VIN/наклейке, что установлена AL552 (0D5), и подготовьте ATF G 060 162 A2, поддон-фильтр и крепеж по каталогу.
      2. Прогрейте коробку короткой поездкой, затем установите авто строго горизонтально на подъемнике.
      3. При заглушенном двигателе открутите сливную пробку поддона и слейте масло в тару не менее 12 л. Зафиксируйте объем слива.
      4. Демонтируйте поддон с интегрированным фильтром, очистите прилегающую плоскость корпуса и магниты от шлама.
      5. Установите новый поддон-фильтр с новым крепежом. Болты тяните крест-накрест моментом около 10 Н·м (уточнить по мануалу ревизии).
      6. Через заливную/контрольную пробку подайте свежую ATF до появления вытекающей струйки.
      7. Запустите двигатель, удерживая тормоз, переведите селектор по всем положениям P-R-N-D и обратно с паузами 2–3 секунды.
      8. Контролируйте температуру ATF сканером. В диапазоне 30–50 °C откройте контрольное отверстие: при правильном уровне идет тонкая струйка, затем капли.
      9. Если не течет — долейте. Если течет сильно — дождитесь перехода в капли. После этого затяните пробки штатным моментом.
      10. Сотрите ошибки, выполните тест-драйв 10–15 км и повторно проверьте герметичность поддона и патрубков охлаждения.
    mistakes:
      - Заливка ATF без допуска G 060 162 A2 / Lifeguard 8.
      - Проверка уровня без контроля температуры ATF.
      - Повторное использование старых болтов поддона.
      - Перетяжка пластикового поддона и деформация фланца.
      - Игнорирование шлама на магнитах и продуктов износа ГДТ.
    nuances: "AL552 (0D5) конструктивно относится к семейству ZF 8HP65A. Главный сервисный нюанс: фильтр интегрирован в поддон, отдельно штатно не меняется. На больших пробегах типичная цепочка: износ блокировки ГДТ -> загрязнение гидроблока -> толчки, поэтому чистота масла и интервал замены критичны. Для 0D5 встречаются ревизии поддона-фильтра (0D5 398 009 / 0D5 398 009 C), поэтому подбор строго по VIN обязателен."
    description: "VAG AL552 (0D5) — 8-ступенчатый гидроавтомат для полноприводных моделей Audi, Porsche и Volkswagen, разновидность ZF 8HP65A. Коробка рассчитана на высокий момент до 700 Н·м и при нормальном обслуживании имеет ресурс около 300 тыс. км. Для ресурса критичны регулярная замена ATF G 060 162 A2, корректная выставка уровня по температуре и замена поддона с интегрированным фильтром."
    weak_points: |
      1. При редкой замене масла гидроблок забивается продуктами износа фрикционов -> толчки и рывки.
      2. Износ фрикциона блокировки ГДТ вызывает вибрации и ускоряет загрязнение масла.
      3. Сильные вибрации от ГДТ могут разбивать подшипник маслонасоса.
      4. Течи по поддону и патрубкам охлаждения встречаются на пробегах.
      5. Ресурс сильно зависит от температуры ATF и реального интервала обслуживания.
    faq:
      - {"question":"Какое масло лить в AL552 (0D5)?","answer":"Штатное масло — VAG G 060 162 A2. Эквивалент — ZF Lifeguard Fluid 8 (S671 090 312).","url":"https://otoba.ru/transmissii/vag/al552.html"}
      - {"question":"Сколько масла требуется на замену?","answer":"Полная емкость около 9,2 л, при стандартной замене обычно сливается порядка 5,5 л.","url":"https://otoba.ru/transmissii/vag/al552.html"}
      - {"question":"Нужно ли менять фильтр отдельно?","answer":"В AL552 фильтр интегрирован в поддон. Меняют поддон-фильтр в сборе.","url":"https://otoba.ru/transmissii/vag/al552.html"}
      - {"question":"Какой OEM поддона-фильтра чаще встречается?","answer":"Часто встречается 0D5 398 009 C. Также есть ревизии 0D5 398 009 без суффикса, поэтому проверка по VIN обязательна.","url":"https://parts.audiusa.com/p/Audi__/OIL-SUMP/119639988/0D5398009C.html"}
      - {"question":"Какие типовые слабые места у AL552?","answer":"Основные риски: износ блокировки ГДТ, загрязнение гидроблока, вибрации, течи поддона и патрубков охлаждения.","url":"https://otoba.ru/transmissii/vag/al552.html"}
    procedure_id: "VAG_AL552"
