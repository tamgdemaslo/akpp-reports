    nuances: "AQ301 (09U) — новая 8-ступенчатая коробка Hyundai Transys для VAG, статистика по ресурсу еще формируется. Из практики владельцев отмечаются задумчивость и лёгкие толчки на первых передачах, а также шум на 8-й в период обкатки. Неочевидный момент: обычный слив обновляет только часть масла, поэтому для более полного обновления делают повторный частичный цикл после короткого пробега."
    description: "VAG AQ301 (09U) — современный 8-ступенчатый гидроавтомат для переднеприводных моделей с двигателем 1.5 TSI. Коробка выпускается с 2023 года и отличается от AQ300 тем, что разработана Hyundai Transys, а не Aisin. Для стабильной работы критичны правильная жидкость SP-IV, аккуратный контроль уровня и регулярное обслуживание без затягивания интервалов."
    weak_points: |
      1. Коробка новая, статистика отказов ограничена.
      2. На ранней эксплуатации встречаются толчки/задумчивость на первых передачах.
