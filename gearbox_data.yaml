      - Заказывать фильтр/прокладку без VIN-проверки.
      - Проверять уровень на неподходящей температуре.
      - Повторно использовать старые шайбы пробок.
      - Не чистить магниты поддона.
    nuances: "U150E переходная платформа: по годам и калибровкам встречаются обе спецификации ATF (T-IV и WS), поэтому универсального ответа без VIN нет. Точно так же различается метод контроля уровня: щуп на ранних версиях и более закрытая процедура на части поздних. Для корректного сервиса нужно сначала идентифицировать ревизию коробки и только затем подбирать OEM."
    description: "TOYOTA U150E - 5-ступенчатая гидромеханическая АКПП Aisin для переднеприводных Toyota/Lexus. Коробка широко применялась в связке с V6 и близка к U151E/U151F. Главная особенность обслуживания - обязательный VIN-подбор жидкости и фильтра из-за перехода между T-IV и WS в рамках семейства."
    weak_points: |
      1. Чувствительность к неправильной ATF.
      Ошибка между T-IV и WS ухудшает работу фрикционов и соленоидов.

      2. Загрязнение гидроблока.
      При редком сервисе появляются задержки и толчки.

      3. Износ блокировки ГТД.
      Чаще проявляется на старой перегретой жидкости.

      4. Подтеки поддона и пробок.
      Обычно связаны со старыми прокладками и шайбами.

      5. Ошибки уровня.
      Недолив/перелив быстро влияют на качество переключений.
