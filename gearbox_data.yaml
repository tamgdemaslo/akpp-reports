    procedure: |
      1. Подтвердите 01V (ZF 5HP19), выставьте автомобиль горизонтально.
      2. Прогрейте АКПП, слейте ATF через сливную пробку, замените seal 01V 321 377.
      3. Снимите поддон (T27), фильтр (T30). Установите новый фильтр с O-ring 01V 325 443.
      4. Очистите поддон и магниты, установите прокладку 01V 321 371, затяните болты 9–12 Н·м.
