      2. Прогрейте коробку в движении, затем установите автомобиль на ровную площадку, зафиксируйте на стояночном тормозе. Снимите защиту. Убедитесь, что заливочная/контрольная пробка откручивается, и только после этого приступайте к сливу.
      3. Слейте масло через сливную пробку. В ряде сервисных инструкций предусмотрен специальный инструмент для перевода поддона по фиксированным положениям, чтобы слить максимум старой жидкости — ориентируйтесь на процедуру именно под свою модель.
      4. Снимите поддон в сборе. У 725.0 фильтры встроены в поддон, поэтому при нормальном ТО всегда меняется весь поддон. Будьте готовы к тому, что часть масла останется в поддоне — снимайте его аккуратно, фиксируйте общий объём слива.
      5. Осмотрите старый поддон и магниты, оцените количество продуктов износа. Это поможет честно объяснить владельцу текущее состояние коробки, как это часто делают в профильных сервисах и отчётах на форумах.
      6. Переносите элементы (датчик уровня, пластиковую вставку, если конструкция это предполагает) только если новая деталь не идёт полностью в сборе и вы уверены в исправности старых элементов. Без EPC и заводового мануала лучше не экспериментировать.
      7. Установите новый поддон с интегрированными фильтрами, новую сливную пробку/заглушку. Болты затягивайте крест‑накрест с контролем момента по заводской карте (не «от руки до упора» — у тонкого фланца это частый источник течей).
      8. Залейте объём, близкий к фактически слитому (обычно 5,5–6,5 л), затем запускайте двигатель, поочерёдно прокручивайте селектор по всем режимам с короткой паузой и возвращайтесь в «P».
      9. Доведите температуру масла до диапазона, указного в заводской процедуре; в практических отчётах по 9G‑Tronic часто фигурирует зона около 35–40 °С. При контроле уровня ориентируйтесь не на универсальные советы, а на конкретную инструкцию по WIS/Xentry под ваш автомобиль.
      10. После выставления уровня ещё раз пройдите все диапазоны, выполните короткий тест‑драйв, вернитесь на подъёмник и проверьте отсутствие пот汗ков по стыку поддона и пробке.
      11. Если по сервисной карте конкретной машины предусмотрен дополнительный фильтр давления на переднем интегральном кронштейне (pressure oil filter на front integral carrier), планируйте его замену отдельно — «масло + поддон» не всегда закрывают весь перечень фильтрующих элементов для 725.0.
    mistakes:
      - "Пытаться сделать «частичное ТО» без замены поддона с интегрированными фильтрами."
      - "Перепутать ревизии pan assembly и заказать поддон только по общему названию 9G-Tronic."
