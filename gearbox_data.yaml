    procedure: |
      1. Убедитесь, что перед вами именно 722.6 (5G‑Tronic / NAG1): электронно управляемая 5‑ступенчатая коробка с отдельным блоком управления и считыванием температуры/скоростей по плате проводки.
      2. Прогрейте автомобиль до рабочей температуры коробки лёгкой поездкой, затем установите его на строго горизонтальную площадку (подъёмник/эстакада/яма), включите «P» и затяните стояночный тормоз.
      3. Снимите защиту, тщательно очистите зону поддона и, при необходимости, колокол от грязи, чтобы при демонтаже ничего не осыпалось внутрь.
      4. Подставьте мерную ёмкость и открутите сливную пробку поддона (шестигранник 5 мм). Дайте стечь первой порции масла (обычно 3–4 л).
      5. Если на вашей модификации есть сливная пробка гидротрансформатора (на части ранних 722.6), через смотровое окно в кожухе колокола проверните коленвал до совмещения отверстия, открутите пробку ГТД (5‑мм шестигранник) и слейте дополнительную порцию ATF. Начиная примерно с 1999 года, пробку ГТД постепенно перестали ставить – в этом случае переходите к шагу со сливом через магистраль, если нужно больше, чем один поддон.
      6. После прекращения слива аккуратно выверните болты поддона (обычно 6 шт. TORX T30), снимите поддон и перенесите его на верстак, стараясь не пролить остатки масла.
      7. Снимите старый фильтр 140 277 00 95, оцените количество и тип стружки/шлама на магнитах и в поддоне – это важный диагностический шаг для 722.6.
      8. Тщательно промойте поддон и магниты очистителем тормозов до чистого металла, при необходимости замените повреждённый/отсутствующий магнит.
      9. Установите новый фильтр (по VIN – 140 277 00/01/02 95), убедившись, что уплотнение встало в посадочное гнездо и старое кольцо не осталось в корпусе.
      10. Поставьте новую прокладку поддона 140 271 00 80, совместите все отверстия и смонтируйте поддон на коробку. Затягивайте болты крест‑накрест с моментом порядка 8 Н·м, без перетяжки.
      11. Установите сливную пробку поддона (и пробку ГТД, если она есть) с новыми шайбами, затяните ориентировочно 18–20 Н·м.
      12. Через трубку щупа залейте первую порцию свежей ATF MB 236.14 (или 236.10/236.12) – обычно 4–5 л, если слит только поддон, и 6–7 л, если дополнительно слит ГТД или сделан слив через магистраль.
      13. Запустите двигатель, удерживая тормоз, и плавно пройдите селектором все положения (P–R–N–D и ручные диапазоны), задерживаясь по 2–3 секунды в каждом, затем оставьте селектор в «P».
      14. На работающем двигателе, при температуре ATF около 40–50 °C, вставьте сервисный щуп до упора, подождите пару секунд, выньте и проверьте уровень по шкале «40/50 °C». При необходимости доливайте маленькими порциями, добиваясь уровня между метками min/max.
      15. Выполните тест‑драйв с плавным разгоном, дайте коробке отработать все передачи и блокировку ГТД, следите за отсутствием пинков, задержек и посторонних звуков.
      16. После поездки ещё раз проверьте уровень ATF (ориентируясь уже на горячую шкалу «80 °C» на щупе, при рабочей температуре масла и селекторе в «P») и убедитесь в отсутствии подтёков по поддону, пробкам, разъёму платы (коннектору) и стыкам радиатора АКПП.
    mistakes:
      - Заливать универсальный Dexron III/VI или «ATF для всего» без допуска MB 236.10/236.12/236.14 – 722.6 требовательна к правильной фрикционной характеристике жидкости.
      - Игнорировать состояние и течи разъёма платы (коннектора) 203 540 02 53 – масло по жгуту уходит в блок, появляются странные электрические симптомы и аварийный режим.
      - Не менять фильтр при замене масла, ограничиваясь только сливом из поддона.
      - Пренебрегать температурой и процедурой при проверке уровня, выставляя его «на холодную» по объёму.
      - Запускать езду с хроническим недоливом/переливом, вызывая проблемы по насосу, блокировке ГТД и соленоидам.
      - Использовать агрессивную аппаратную промывку на очень грязной/старой коробке без понимания рисков для фрикционов и гидроблока.
    nuances: |
      722.6 стала первой массовой полностью электронно управляемой 5‑ступенчатой коробкой Mercedes с блокировкой гидротрансформатора и адаптацией под стиль езды. Это уже не «гидравлическая классика» 722.3/722.4/722.5 – поведение сильно зависит от состояния электрики, платы проводки и софта.
      По жидкости заводской допуск эволюционировал от 236.10 к 236.12 и 236.14; при этом в профильных обсуждениях подчёркивается полная совместимость всех трёх допусков и практическая ориентация на 236.14 как удобный единый вариант для 722.6/722.9. Главное – не путать эти жидкости с более старыми ATF IID/Dexron, рассчитанными на коробки с тормозными лентами.
      Ряд ранних 722.6 имеют сливную пробку ГТД, что позволяет при обслуживании слить больше половины объёма без магистральной промывки. Начиная примерно с конца 90‑х, пробку убрали – тогда глубокое обновление делают либо через трубку охлаждения, либо повторными частичными заменами.
      Типовой «электронный набор» проблем 722.6 включает плату проводки/датчики скорости, уплотнение разъёма, соленоиды и адаптацию. При этом по механике коробка при нормальном масле и адекватном тепловом режиме ходит очень приличные пробеги.
    description: |
      Mercedes 722.6 (5G‑Tronic / NAG1) – одна из самых массовых и удачных автоматических коробок компании, пришедшая на смену семейству 722.3/722.4/722.5 в середине 90‑х. Это пятиступенчатый продольный автомат с блокировкой гидротрансформатора, полностью электронным управлением и адаптацией под стиль езды.
      
      Коробка выпускалась в нескольких вариантах (W5A330/W5A400/W5A580) под разные уровни момента: от рядных «шестёрок» до V12 и AMG. В зависимости от модификации полный объём ATF составляет 8,7–9,3 л, при обычном сервисе со снятием поддона и, при наличии, сливом из ГТД на практике сливают 6–7 л.
      
      По конструкции 722.6 уходит от тормозных лент к многодисковым пакетам сцеплений и управляемой блокировке ГТД. Это даёт лучшую экономичность и динамику, но делает коробку чувствительной к правильной жидкости (допуски 236.10/236.12/236.14) и чистоте масла. При своевременной замене ATF и фильтра, живом разъёме платы и аккуратном тепловом режиме коробка спокойно ходит 250+ тыс. км.
      
      Для сервиса важно видеть в 722.6 именно электронно‑гидравлическую систему: кроме классического поддона и фильтра, здесь всегда в зоне внимания плата проводки, соленоиды, разъём и адаптации – без этого даже свежая жидкость не решит проблемы с пинками и аварийным режимом.
    weak_points: |
      1. Плата проводки (conductor plate) и датчики скорости.
      В ранних 722.6 на плате сидят датчики входной/выходной скорости и логика старт‑блокировки; со временем они начинают давать нестабильные показания, что выражается в пинках, аварийном режиме и ошибках по скоростям. Замена платы – одна из самых типовых операций.
      
      2. Уплотнение разъёма (коннектор) 203 540 02 53.
      Через этот адаптер масло нередко уходит по жгуту к блоку управления, вызывая «электрические» глюки. В профильных гайдах его прямо называют расходником, который имеет смысл менять при каждом серьёзном обслуживании коробки.
      
      3. Соленоиды и загрязнение гидроблока.
      При редкой замене ATF и перегревах продукты износа забивают фильтр и каналы, начинают залипать соленоиды. Это даёт жёсткие переключения, задержки, рывки при включении D/R и уход коробки в аварийный режим.
      
      4. Гидротрансформатор и блокировка.
      На пробегах 200+ тыс. км при езде на старом масле нередки проблемы с блокировкой ГТД: вибрации на определённых скоростях, ошибки по проскальзыванию, загрязнение масла фрикционной пылью.
      
      5. Ранние конструктивные слабости.
      В технических обзорах и опыте ремонтов фигурируют слабые места ранних ревизий – разрушение фривила/корпуса K1, слабая втулка между валами K1–K2 и др. Большая часть этих проблем уже проявилась на старых коробках; при качественной переборке и нормальной эксплуатации они хорошо лечатся.
    faq:
      - {"question":"Какое масло безопасно указывать для 722.6?","answer":"Для 722.6 официально подходят допуски MB 236.10, 236.12 и 236.14; по актуальным рекомендациям Mercedes и профильным гайдам чаще всего используют именно 236.14 как обратно совместимую с 236.10/236.12.","url":"https://willandservicecentre.co.uk/722695-oil-change/"}
      - {"question":"Сколько масла готовить на сервис 722.6?","answer":"При обычной замене со снятием поддона сливается около 3–4 л, при одновременном сливе из гидротрансформатора или обновлении через магистраль нужно ориентироваться примерно на 6–7 л. Полный сухой объём в зависимости от модификации 8,7–9,3 л.","url":"https://www.peachparts.com/Wikka/Trans7226Fluid"}
      - {"question":"Есть ли у 722.6 сливная пробка на гидротрансформаторе?","answer":"На части ранних 722.6 пробка ГТД есть, и через неё можно слить дополнительную порцию масла. Начиная примерно с 1999 года, пробку постепенно убрали, и на большинстве поздних коробок полного слива добиваются либо через магистраль, либо повторными частичными заменами.","url":"https://www.benzworld.org/threads/722-6-torque-converter-drain-plug-which-models-have-it.3134076/"}
      - {"question":"Через какой пробег менять масло и фильтр в 722.6?","answer":"Практика и профильные «сервис‑библии» советуют обновлять ATF и фильтр каждые 60 000–70 000 км, а для тяжёлых условий, мощных моторов и AMG – около 40 000–50 000 км, несмотря на старые заявления о «масле на весь срок службы».","url":"https://www.motor-talk.de/forum/kleine-servicebibel-fuer-das-mercedes-722-6-5-gang-automatikgetriebe-t7083278.html"}
      - {"question":"Почему 722.6 часто уходит в аварийный режим (limp mode)?","answer":"Типичные причины – сбои по датчикам скорости на плате, проблемы с соленоидами, утечки через коннектор и следы ATF в блоке управления. Первой линией защиты обычно служат замена платы/коннектора, свежая ATF правильного допуска и проверка проводки.","url":"https://www.benzworld.org/threads/722-6-limp-home-conductor-plate-solenoids-and-236-14-fluid.2542129/"}
      - {"question":"Нужно ли делать аппаратную замену масла в 722.6?","answer":"При сильно загрязнённой коробке мягче и безопаснее начинать с обычного сервиса (поддон, фильтр, частичная замена) и только затем, при необходимости, делать аккуратную промывку через магистраль. Жёсткие «аппаратки» на уставших коробках нередко добивают фрикционы.","url":"https://www.benzworld.org/threads/mercedes-benz-722-6-transmission-faq.1463460/"}
