    nuances: |
      Коробка очень новая, поэтому по FA830 пока мало открытых сервисных данных и почти нет подтверждённых OEM по расходникам.
      Для мастера по замене масла ключевой риск — перепутать FA830 с 7DCT на внешне близких комплектациях Jetour и Soueast.
      По отзывам владельцев и форумам встречаются жалобы на толчки/пинки, особенно при замедлении; это нужно фиксировать до обслуживания, так как часть жалоб похожа на калибровку TCM, а не на механическую неисправность.
      При грязном масле или большом количестве продуктов износа лучше сразу оценивать необходимость более полной замены жидкости и дополнительной диагностики гидроблока.
      До появления нормальной дилерской каталогизации OEM поддон, фильтр и уплотнения безопаснее запрашивать только по VIN.
    description: |
      **Fuzhen FA830 / Chery 830AHA** — новая 8-ступенчатая гидромеханическая АКПП концерна Chery, которая с 2024 года встречается на ряде моделей Jetour и Soueast.
      
      Для мастера по замене масла здесь главное не путать сам факт наличия "8AT" с одинаковой сервисной картой на все машины семейства: в соседних комплектациях тех же моделей может стоять **7DCT**, а процедура, масло и риски у неё другие.
      
      По открытым источникам надёжно подтверждаются спецификация **ATF-GS**, сухой объём около **6,0 л** и контроль уровня при **50-60 °C**. Всё остальное по этой коробке пока приходится сверять осторожно: OEM расходников публично почти нет, а полноценная сервисная документация в открытом доступе не встречается.
      
      На практике такую коробку лучше воспринимать как "новую и ещё не обросшую рембазой": перед работой проверять VIN, тип трансмиссии, наличие обновлений по TCM и сразу документировать поведение коробки до замены масла.
    weak_points: |
      **1. Жалобы на толчки при замедлении.**
      По отзывам владельцев родственных моделей с этой 8AT встречаются пинки и неидеальные переключения, особенно на понижениях. Для сервиса это важно потому, что клиент может связать проблему именно с заменой масла, хотя часть симптомов похожа на калибровку/прошивку, а не на дефект после ТО.
      
      **2. Быстрое загрязнение жидкости продуктами износа.**
      Коробка работает с турбомоторами, поэтому при затянутом интервале замены масла важно внимательно смотреть на цвет, запах и количество грязи на магните/пробке. Если масло уже тёмное и с выраженным мусором, риск по гидроблоку выше обычного.
      
      **3. Слабая доступность расходников и OEM.**
      Самая практическая проблема для мастера сейчас — не столько ремонт, сколько подбор деталей. Без VIN легко ошибиться с поддоном, уплотнениями и фильтром, поэтому не стоит заранее обещать клиенту замену фильтра и "полный комплект" без дилерской схемы.
      
      **4. Риск неполного сервиса.**
      Если ограничиться только быстрым сливом без фиксации объёма, температуры и состояния жидкости, можно получить спорный результат по уровню и не заметить ранние признаки загрязнения.
    faq:
      - question: "Какое масло лить в FA830?"
        answer: "Только ATF с подтверждённой спецификацией ATF-GS. Подменять её обычным Dexron VI или Mercon без прямого подтверждения нельзя."
        url: "https://otoba.ru/transmissii/fuzhen/fa830.html"
      - question: "Нужно ли менять фильтр при каждом ТО?"
        answer: "По FA830 открытые источники пока не подтверждают OEM фильтра и его сервисируемость. До проверки по VIN нельзя обещать замену фильтра как обязательную операцию стандартного ТО."
        url: "https://www.motulteam.ru/jetour-t2-fuzhen-fa840"
      - question: "Почему клиент жалуется на пинки после или до замены масла?"
        answer: "Для родственных моделей с Fuzhen 8AT уже встречаются жалобы на толчки при понижениях. Поэтому поведение коробки нужно фиксировать до сервиса и объяснять клиенту, что часть симптомов может быть связана с калибровкой/прошивкой TCM."
        url: "https://www.drive2.ru/l/699153056897448817/"
      - question: "Достаточно ли обычного слива-залива?"
        answer: "Для свежей жидкости и небольшого пробега часто да, но при заметном загрязнении ATF одного слива может быть мало. Решение о более полной замене лучше принимать по состоянию масла, количеству мусора и жалобам на работу коробки."
        url: ""
