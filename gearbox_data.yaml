    nuances: "A750H конструктивно близка A750F, поэтому многие расходники совпадают, но по рынкам и годам возможны отличия по пробкам, шайбам и мелким уплотнениям. Ключевая особенность сервиса - выставление уровня через перелив при контролируемой температуре ATF. При большом загрязнении лучше выполнять несколько частичных замен или аппаратную замену после базового сервиса поддона."
    description: "TOYOTA A750H - 5-ступенчатая гидромеханическая АКПП семейства Aisin TB-50 для внедорожных и полноприводных платформ. Коробка рассчитана на высокий крутящий момент и типичную тяжелую эксплуатацию SUV. В обслуживании критичны правильная жидкость ATF WS, чистка поддона/магнитов, замена фильтра-стрейнера и точная установка уровня по температуре."
    weak_points: |
