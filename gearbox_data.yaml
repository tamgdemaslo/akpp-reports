    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.3 как семейства. У большинства применений коробка обслуживается через нижний поддон и трубку щупа, но финальный контроль уровня лучше всё равно сверять с мануалом конкретного автомобиля.
      
      1. До начала работ убедитесь, что можете нормально залить ATF обратно: на большинстве 722.3 это трубка щупа, но доступ и обвязка автомобиля надо проверить заранее.
      2. Поставьте автомобиль в горизонталь и сначала найдите сливную пробку гидротрансформатора, провернув двигатель за шкив.
      3. Слейте ATF из гидротрансформатора и поддона в отдельные или хотя бы промеряемые ёмкости; суммарный объём зафиксируйте.
      4. Снимите нижний поддон: у 722.3 фильтр сервисный, поэтому на обычном ТО он меняется.
      5. Очистите поддон и магнит, внимательно оцените количество шлама и наличие металлической пыли.
      6. Снимите фильтр, проверьте, что старые O-ring не остались в посадке, и установите новый фильтр без перекоса.
      7. Установите новую прокладку поддона и затяните болты поддона малым моментом без перетяжки.
      8. Поставьте новые шайбы на сливные пробки поддона и гидротрансформатора.
      9. Залейте объём, близкий к фактически слитому, затем пройдите селектором все диапазоны с небольшой выдержкой.
      10. Доведите коробку до полностью горячего состояния и выставьте уровень по щупу/по OEM-процедуре без спешки; для 722.3 именно неверный уровень чаще всего создаёт спорные жалобы после ТО.
      11. После тест-драйва повторно проверьте герметичность поддона, обеих сливных пробок и поведение задней передачи.
    mistakes:
      - "Сделать только слив поддона и забыть про слив из гидротрансформатора, а потом считать сервис «полной» заменой."
      - "Поставить универсальный aftermarket kit без проверки, что прокладка именно от 722.3, а не от 722.4."
      - "Перетянуть болты поддона и потом бороться с течью, думая на фильтр или корпус."
      - "Не проверить, что старые O-ring фильтра вышли вместе со старой деталью."
      - "Отдать автомобиль без финальной проверки уровня на полностью прогретой АКПП."
    nuances: |
      У Mercedes 722.3 нижний поддон, значит фильтр при стандартном ТО меняется.
      Коробка старая и механически достаточно понятная, но она очень чувствительна к уровню ATF и качеству гидравлической сборки после сервиса.
      Для нормального обслуживания желательно сливать не только поддон, но и гидротрансформатор — именно это отличает полноценное ТО от упрощённого refresh.
      По прокладке и aftermarket-комплектам есть практический риск перепутать 722.3 и 722.4, поэтому при заказе без VIN лучше отдельно сверять форму прокладки и OEM.
    description: |
      **Mercedes 722.3** — классическая 4-ступенчатая гидромеханическая АКПП старых Mercedes, которую сервисы до сих пор регулярно видят на W124, W126, R107 и других моделях эпохи.
      
      Для мастера по замене масла это не коробка про сложную электронику, а коробка про дисциплину сервиса: нижний поддон, сменный фильтр, слив из гидротрансформатора, проверка уровня только на горячую и очень аккуратная работа с мелочами вроде прокладки и O-ring.
      
      Хорошая новость в том, что у `722.3` фильтр меняется на обычном ТО, потому что поддон нижний. Плохая — на рынке много наборов, где легко получить не ту прокладку или смешать расходники `722.3` и `722.4`, а потом искать проблему не там.
      
      На практике эту коробку лучше воспринимать как старую, но благодарную к правильному обслуживанию: если фиксировать исходные жалобы, сливать и поддон, и гидротрансформатор, не перетягивать поддон и внимательно выставлять уровень, она обслуживается предсказуемо и без лишних клиентских конфликтов.
    weak_points: |
      **1. Очень чувствительна к уровню ATF.**
      По профильным форумам жалобы после сервиса чаще всего начинаются не с "коробка умерла", а с недолива, перелива или проверки уровня на недогретой коробке. Для мастера это главный пункт самоконтроля.
      
      **2. Болты поддона легко перетянуть.**
      На 722.3 это частая чисто сервисная проблема: прокладку продавливают, поддон ведёт, потом появляется течь и лишняя повторная работа. Поэтому малый момент затяжки тут критичен.
      
      **3. Задержка включения задней и жёсткие переключения часто уже были до замены масла.**
      На форумах по 722.3 регулярно всплывают reverse-delay, жёсткая 2-3 и вопросы по Bowden/vacuum modulator. Для сервиса это значит одно: поведение коробки нужно фиксировать до ТО, чтобы не приписывать старую проблему свежей замене масла.
      
      **4. Ошибка с комплектом фильтра и прокладки встречается чаще, чем кажется.**
      По обсуждениям владельцев сам фильтр обычно находится без проблем, а вот с прокладкой комплекты путают 722.3 и 722.4. Для мастера это практический риск оставить машину на подъёмнике с разобранной коробкой и неподходящими деталями.
    faq:
      - question: "Меняется ли фильтр на Mercedes 722.3 при обычном ТО?"
        answer: "Да. У 722.3 нижний поддон, поэтому фильтр сервисный и при нормальном обслуживании меняется вместе с прокладкой поддона."
        url: "https://www.500eboard.co/forums/threads/how-to-change-mercedes-benz-722-3-transmission-fluid-and-filter.635"
      - question: "Нужно ли сливать масло из гидротрансформатора или достаточно одного поддона?"
        answer: "Если цель — полноценное ТО, лучше сливать и поддон, и гидротрансформатор. Именно поэтому у 722.3 типичный сервисный объём заметно больше, чем просто объём поддона."
        url: "https://www.benzworld.org/threads/transmission-fluid-change-722-3.3048432/"
      - question: "Какой OEM фильтра самый безопасный для заказа?"
        answer: "Базовый и чаще всего подтверждаемый OEM фильтра для 722.3 — 126 277 02 95. Но с aftermarket kit нужно быть осторожнее: по форумам проблема чаще не в самом фильтре, а в неверной прокладке поддона."
        url: "https://www.peachparts.com/shopforum/diesel-discussion/385145-mann-transmission-filter-722-3-a.html"
      - question: "Что мастеру первым делом проверить, если после ТО клиент жалуется на reverse-delay или жёсткое переключение?"
        answer: "Сначала уровень ATF на полностью прогретой коробке, затем правильность установки фильтра и O-ring. Только после этого уже стоит уходить в регулировки Bowden/vacuum modulator или внутреннюю механику."
        url: "https://www.benzworld.org/threads/722-3-shifting-problems.1634481/"
    procedure_id: "MERCEDES_722.3"
