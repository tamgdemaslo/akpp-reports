    procedure: |
      Ниже — безопасная сервисная схема именно для Mercedes 722.7 / W5A180. Коробка редкая и поперечная, поэтому её не стоит обслуживать по привычке как 722.6.
      
      1. До начала работ убедитесь, что автомобиль стоит строго горизонтально и у вас есть корректный инструмент для контроля уровня.
      2. Слейте ATF, обязательно замерьте фактический объём и снимите поддон.
      3. У 722.7 фильтр сервисный, поэтому при обычном ТО он меняется вместе с прокладкой поддона.
      4. Очистите поддон и магнит, оцените количество шлама и наличие металлической пыли.
      5. Установите новый фильтр, новую прокладку и новую шайбу сливной пробки.
      6. После замены масла начальный залив по сервисным материалам обычно составляет около 4,0 л до запуска двигателя, затем уровень доводится после прогрева.
      7. Запустите двигатель, дайте коробке поработать в P, затем прогрейте АКПП и пройдите селектором все диапазоны.
      8. Через 2 минуты после прогрева проверьте уровень с двигателем на холостом ходу в P или N и доведите его до нормы по сервисной линейке.
      9. После тест-драйва повторно проверьте герметичность поддона и поведение коробки под нагрузкой.
    mistakes:
      - "Обслуживать 722.7 по картам от 722.6 или 722.9."
      - "Не менять фильтр, хотя у коробки нижний поддон и фильтр сервисный."
      - "Не измерять слитый объём и пытаться выставить уровень «на глаз»."
