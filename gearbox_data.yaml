      - {"question":"При какой температуре выставлять уровень?","answer":"При 35–45 °C на работающем двигателе (VCDS → MVB 19). Из заливного отверстия — струйка, затем капли. При другой температуре результат неверный.","url":"https://otoba.ru/transmissii/vag/dq500.html"}
      - {"question":"Почему после замены масла коробка дёргает?","answer":"Выполнить адаптацию сцеплений (VCDS → Basic Settings → группа 61). Без неё коробка не подстраивается под новую вязкость.","url":"https://only-vag.ru/poleznye-stati/korobka-peredach-dq500-nadezhnost-problemy-i-remont"}
