      - {"question":"Почему у 5HP30 важно различать две пробки поддона?","answer":"В мануале указаны разные резьбы и моменты: M24x1.5 - 50 Н·м, M30x1.5 - 100 Н·м.","url":"https://akpphelp.ru/images/contents/files/5hp30_repair_manual.pdf"}
      - {"question":"Сколько ATF обычно обновляется за один сервис?","answer":"Обычно 6-7 л при снятии поддона и фильтра; полный объем системы около 13.5 л.","url":"https://otoba.ru/transmissii/zf/5hp30.html"}
