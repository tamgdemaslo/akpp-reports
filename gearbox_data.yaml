    nuances: "AQ250 — «средняя» по моменту версия Aisin TF-60SN (09G) из семьи AQ-6, рассчитанная на двигатели до 2,5 л и момент до 250 Н·м. Конструктивно это классический 6-ступенчатый гидроавтомат с нижним поддоном и сервисным фильтром, полной ёмкостью около 7 л и штатным ATF G 052 025 A2. По gearboxlist и профильным статьям основной ресурс коробки при нормальном обслуживании — около 250 тыс. км. Ключевые риски — перегревы, редкие замены масла, засорение гидроблока и износ блокировки гидротрансформатора. Дополнительная сложность в том, что TF-60SN имеет множество модификаций (09G/09K/09M, AQ160, AQ260 и др.), поэтому расходники и моменты затяжки нужно смотреть по VIN и мануалу, а не по общему названию коробки."
    description: "VAG AQ250 — 6-ступенчатая поперечная АКПП Aisin TF-60SN (индекс 09G), которая с 2003 года ставится на широкий ряд моделей VAG: Passat, Tiguan, Octavia, Rapid, Q3 и другие автомобили с моторами до ~2,5 л. Коробка имеет нижний поддон и сервисный фильтр, полную ёмкость масла около 7 л, штатную жидкость ATF G 052 025 A2 и регламентный интервал замены ~60 тыс. км. Для мастера важно понимать, что AQ250 — это не «вечная» коробка: реальный ресурс сильно зависит от своевременных замен масла, чистоты поддона и правильного выставления уровня по температуре."
    weak_points: |
      1. Перегрев и старение масла.
      В городском режиме и при редких заменах ATF G 052 025 A2 быстро деградирует, что ускоряет износ фрикционов и соленоидов.
      
      2. Засорение гидроблока.
      TF-60SN чувствителен к шламу и мелкой стружке в масле: забиваются каналы и соленоиды, появляются толчки и задержки при переключениях.
      
      3. Износ блокировки гидротрансформатора.
      По обзорам AQ250 блокировка ГТД часто начинает пробуксовывать уже к 150 тыс. км при эксплуатации на старом масле; одна только замена масла в запущенной стадии проблему не устраняет.
      
      4. Проблемы с дифференциалом и втулками.
      На больших пробегах описываются случаи разрушения спутников дифференциала и износа втулок насоса при перегревах и грязном масле.
      
      5. Чувствительность к уровню и подбору расходников.
      Неправильный уровень (особенно недолив) быстро даёт пинки и перегрев, а подбор фильтра/прокладки «на глаз» без VIN часто приводит к установке неподходящего фильтра с другим заборником.
