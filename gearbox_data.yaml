      - мерная тара для точной фиксации объёма слитой ATF
    parts_list:
      - ATF VW G 052 162 A2 4–5 л
      - фильтр 01M 325 429
      - уплотнение фильтра 01M 325 443
      - прокладка поддона 098 321 370 или 096 321 370 по ревизии/комплекту
      - новое уплотнение level plug — сверять по VIN или старому образцу
    pan_bolts: болты поддона тянуть крест-накрест, 12 Н·м; не перетягивать
    drain_torque: 15 Н·м (level plug / inspection plug)
    fill_torque: |
      12 Н·м — болты поддона  
      заливка через трубку; отдельный «момент заливной пробки» зависит от типа верхней крышки/колпачка
    procedure: |
      1. Подтвердите, что перед вами именно 01M / AG4. Машина должна стоять строго горизонтально.
      2. Прогрейте АКПП до рабочего состояния, снимите защиту и подготовьте мерную тару.
      3. Снимите level plug и переливную трубку, слейте ATF, после чего временно верните трубку на место, чтобы не мешала дальнейшей работе.
      4. Снимите нижний поддон: у 01M это нормальное сервисное ТО с заменой фильтра, потому что поддон нижний.
      5. Очистите поддон и магниты, оцените количество шлама и металлической пыли до сборки.
      6. Снимите старый фильтр и обязательно проверьте, что старое уплотнение 01M 325 443 вышло вместе с ним, а не осталось в корпусе.
      7. Установите новый фильтр 01M 325 429 с новым уплотнением 01M 325 443 и поставьте новую прокладку поддона.
      8. Затяните болты поддона крест-накрест моментом 12 Н·м без перетяжки.
      9. Выполните первичную заливку через заливную трубку, затем запустите двигатель, удерживая тормоз, и один раз спокойно пройдите селектором все диапазоны.
      10. При 35–45 °C и на работающем двигателе откройте level plug: если ATF не выходит или выходит только следами, доливайте до появления ровной струйки, затем дождитесь перехода в частые капли.
      11. Закройте plug с новым уплотнением, выполните тест-драйв и повторно проверьте герметичность и качество включений.
    mistakes:
      - Заливать Dexron, Mercon или универсальную ATF вместо VW G 052 162 A2.
      - Проверять уровень на заглушённом моторе или вне окна 35–45 °C.
      - Остановиться на первых 3 л и не перепроверить уровень после запуска двигателя и прохода селектора.
      - Оставить старое уплотнение 01M 325 443 в корпусе и запрессовать новый фильтр поверх него.
      - Обещать клиенту, что одна замена масла вылечит старые проблемы valve body, соленоидов или TCC.
    nuances:
      - У 01M нижний поддон, поэтому фильтр при обычном ТО меняется.
      - У коробки нет привычного щупа: уровень выставляется через level plug на работающем двигателе, поэтому именно ошибка процедуры чаще всего даёт спорные жалобы после сервиса.
      - По прокладке поддона в открытых источниках встречаются 098 321 370 и 096 321 370; если нет VIN, безопаснее сверять старую прокладку по форме.
      - По старым 01M нужно обязательно фиксировать исходные жалобы на затяжное включение, удары и пробуксовку: у этих коробок нередки старые проблемы valve body и соленоидов, которые легко ошибочно привязать к свежему ТО.
    description: |
      **VAG 01M / AG4** — это старая поперечная 4-ступенчатая АКПП Volkswagen, знакомая по Golf, Jetta, Bora, New Beetle и ряду родственных моделей конца 1990-х и начала 2000-х.

      Для мастера по замене масла главное здесь не возраст коробки, а сервисная логика: **нижний поддон, фильтр сервисный и меняется на обычном ТО, а уровень нельзя оценивать «на глаз» или по объёму слитого масла**. У `01M` нет обычного щупа, и финальная проверка уровня делается через level plug на работающем двигателе.

      Именно поэтому `01M` очень чувствительна к дисциплине процедуры. По форумам VW и TDIClub после сервиса чаще всего всплывают не «внезапно умершие коробки», а недолив, проверка уровня на холодной АКПП, старое кольцо фильтра в корпусе или неправильное ожидание, что 3 литра после слива и есть готовый итог.

      Для сайта и заказа безопаснее держаться подтверждённого OEM-набора: фильтр `01M 325 429`, уплотнение фильтра `01M 325 443`, прокладка поддона `098 321 370` с примечанием, что в сервис-китах по семейству часто встречается и `096 321 370`.
    weak_points: |
      **1. Ошибка по уровню после сборки.**
      На форумах по `01M` это одна из самых частых причин жалоб сразу после ТО: коробка пинается, тянет передачи или кажется недолитой, а потом выясняется, что уровень проверяли не на работающем двигателе или не в нужном температурном окне.

      **2. Неправильная посадка фильтра и его уплотнения.**
      Если старое кольцо `01M 325 443` осталось в корпусе, новый фильтр может встать неправильно и коробка после сервиса даст симптомы, похожие на масляное голодание.

      **3. Старые проблемы valve body и соленоидов часто уже были до замены масла.**
      Для мастера это критично: `01M` известна по жалобам на гидроблок, соленоиды и TCC, поэтому исходное поведение коробки нужно фиксировать до работ, а не обещать клиенту, что одно ТО решит всё.

      **4. Путаница с прокладкой поддона.**
      В кроссах и сервис-китах встречаются разные номера прокладки по семейству `095/096/01M`; если заказать первый попавшийся набор без сверки, легко получить неподходящую прокладку уже на подъёмнике.
    faq:
      - question: "Меняется ли фильтр при обычном ТО на 01M?"
        answer: "Да. У 01M нижний поддон, поэтому фильтр сервисный и при нормальном обслуживании меняется. Базовый OEM фильтра — 01M 325 429, уплотнение фильтра — 01M 325 443."
        url: "https://parts.vw.com/p/Volkswagen__Golf-GL-Hatchback/Transmission-Oil-Filter/48011203/01M325429.html"
      - question: "Какую ATF безопасно указывать в заказ-наряде?"
        answer: "Если нужна одна безопасная OEM-позиция без споров, указывайте только VW G 052 162 A2. Dexron, Mercon и любые «универсальные ATF» для этой коробки обещать нельзя."
        url: "https://parts.vw.com/p/Volkswagen__/ATF-OIL/53596013/G052162A2.html"
      - question: "При какой температуре и как правильно выставлять уровень?"
        answer: "Уровень для 01M проверяют при 35–45 °C, на строго горизонтальном автомобиле и на работающем двигателе. Если открыть level plug и жидкость не идёт, коробку нужно доливать до появления струйки, затем дождаться частых капель."
        url: "https://www.vwvortex.com/threads/checking-changing-transmission-fluid-in-a-01m-101n-101v-tranny-and-final-drive.2989712/"
      - question: "Что первым делом проверять, если после сервиса появились пинки или пробуксовка?"
        answer: "Сначала перепроверяйте уровень по правильной процедуре, затем посадку фильтра и уплотнения 01M 325 443. По практическим обсуждениям именно эти ошибки нужно исключать раньше, чем списывать всё на гидроблок или соленоиды."
        url: "https://faculty.ccp.edu/faculty/dreed/Campingart/jettatech/atf01m.htm"
      - question: "Одна замена масла может вылечить типичные проблемы 01M?"
        answer: "Не всегда. Для 01M типичны старые проблемы valve body, соленоидов и TCC, поэтому мастеру важно заранее зафиксировать исходные жалобы и не продавать обычное ТО как гарантированный ремонт переключений."
        url: "https://www.vwvortex.com/threads/01m-valve-body.4384641/"
    image: ""
