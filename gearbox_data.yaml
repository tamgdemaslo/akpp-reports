      - Перетяжка пластиковой крышки > 25 Н·м — срыв резьбы в алюминиевом корпусе.
    nuances:
      - «Сноркель» (трубка уровня/перелива) бывает разных длин и ревизий. На практике встречаются 02E 321 363 B и 02E 321 363 C — подбирать по VIN/по длине, чтобы уровень выставлялся корректно.  
