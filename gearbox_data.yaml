      - "Не учитывать вторую сервисную точку по pressure oil filter, если она есть в service sheet конкретной машины."
    nuances: |
      У Mercedes 725.0 нижний поддон есть, но фильтры в нём «зашиты» с завода — это единый узел. Отсюда главное практическое правило: по нормальному регламенту меняют не отдельный фильтр, а полный поддон в сборе.
      В учебных материалах Mercedes описаны два встроенных фильтра в поддоне, а в ряде сервисных листов отдельно фигурирует ещё и дополнительный фильтр давления на переднем интегральном кронштейне. Поэтому нельзя считать, что по всем 725.0 набор расходников одинаковый — нужно смотреть именно свою сервисную карту.
      В опыте профильных сервисов и по отзывам владельцев на тематических площадках основные споры после ТО по 9G‑Tronic связаны не с самим фактом замены масла, а с уровнем, адаптациями и уже существующими проблемами по гидроблоку и мехатронику. Если до обслуживания были задержки включения задней передачи, пинки или «рваные» переключения, важно честно зафиксировать это заранее и не обещать, что одна замена масла решит любой симптом.
    description: |
      **Mercedes 725.0 / 9G‑Tronic** — современная девятиступенчатая АКПП Mercedes, которую удобнее всего воспринимать не как «поддон плюс отдельный фильтр», а как узел «поддон‑фильтр в сборе». Для мастера это сильно упрощает логику: нормальное плановое обслуживание — это новый поддон с интегрированными фильтрами, свежая жидкость по допуску MB 236.17 и аккуратная работа по заводской процедуре контроля уровня.
      
      Здесь нижний поддон есть, но фильтрующий элемент с завода объединён с ним. Отдельные сервисные листы дополняют эту схему ещё и фильтром давления на переднем интегральном кронштейне — поэтому универсального «одного комплекта на все 725.0» не существует, подбор всегда делают под конкретный VIN.
      
      Основная сложность этой коробки не в том, чтобы «слить‑залить», а в дисциплине: точная температура, правильный допуск масла и честная оценка исходного состояния. По живым отзывам владельцев и профильных сервисов значительная часть жалоб (задержка включения задней, рывки, спорное поведение на переходах) уходит в область адаптаций, программного обеспечения и состояния гидроблока/мехатроника, а не только в старое масло.
      
      Поэтому в реальной практике `725.0` лучше воспринимать как коробку, где важна аккуратность и работа «по книжке»: правильный поддон, правильная жидкость, отработанная процедура уровня и понимание, есть ли у конкретной машины дополнительные фильтрующие элементы помимо поддона.
    weak_points: |
      **1. Очень чувствительна к уровню масла и соблюдению процедуры.**
      По практическим отчётам и обсуждениям 9G‑Tronic не менее капризна к уровню, чем 722.9: небольшой перелив или недолив легко даёт жалобы на работу коробки и поводы для возврата автомобиля после ТО.
      
      **2. Задержка включения задней и жёсткие переключения часто были ещё до замены.**
      По «живым» кейсам на форумах и в блогах жалобы на задержку включения R, рывки и странное поведение после обслуживания нередко упираются в адаптации, программное обеспечение и состояние гидроблока/мехатроника. Эти вещи нужно фиксировать до начала работ и честно проговаривать с владельцем.
      
      **3. Попытка «поменять только масло, фильтр потом» не работает по конструкции.**
      Фильтры интегрированы в поддон, поэтому обслуживание без замены поддона даёт половинчатый результат и оставляет изношенный фильтрующий элемент внутри коробки.
      
      **4. Дополнительный фильтр давления есть не на всех машинах, но его нельзя игнорировать.**
      В части сервисных листов отдельно указан фильтр давления на переднем интегральном кронштейне. Это важный нюанс: замена поддона решает базовую часть обслуживания, но не всегда полностью закрывает все фильтры в конкретной версии 725.0.
    faq:
