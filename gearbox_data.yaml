      oem_bolt_2_info: "Втулка/уплотнение электрического разъема мехатроника. Вынесено в доп. сервисную позицию."
    procedure: |
      1. Подтвердите модификацию 6HP26 (RWD/AWD, BMW/VAG/JLR).
      2. До слива убедитесь, что заливная пробка откручивается.
      3. Слейте ATF, снимите поддон-фильтр, очистите магниты.
      4. Установите новый поддон-фильтр и новые болты/уплотнения по комплекту.
      5. Затяните болты поддона крест-накрест 10 Н·м.
      6. Установите сливную пробку с новой шайбой.
      7. Заправьте стартовый объем ATF, запустите двигатель, пройдите селектором все положения.
      8. Выставьте уровень по температуре (обычно 30-45°C) на работающем двигателе.
      9. Закройте пробки, сделайте тест-драйв, перепроверьте уровень и течи.
      10. Отдельно осмотрите втулку разъема мехатроника на запотевание.
    mistakes:
      - Использовать ATF не класса Lifeguard 6.
      - Ставить поддон-фильтр не той ревизии.
      - Пропускать замену втулки разъема при видимых подтёках.
      - Проверять уровень вне температурного окна.
      - Перетягивать пластиковый поддон.
      - Повторно использовать старые шайбы пробок.
    nuances: |
      6HP26 использует интегрированный поддон-фильтр: отдельной прокладки обычно нет.
      Для разных брендов OEM-коды разные, поэтому в карточке оставлены основные проверяемые номера BMW и распространенные кроссы ZF/VAG.
      На практике после ТО критичны правильный уровень и герметичность мехатроника.
    description: |
      ZF 6HP26 - один из ключевых 6-ступенчатых автоматов ZF для мощных моторов. Ставился на BMW, Audi, Land Rover, Jaguar и другие платформы.
      
      Сервисный профиль типичный для серии 6HP: замена поддона с интегрированным фильтром, ATF класса LG6 и установка уровня строго по температуре.
      
      При регулярном обслуживании коробка ходит долго, а большинство проблем после сервиса связано с уровнем, подтёками и состоянием мехатроника.
    weak_points: |
      1) Утечки по втулке разъема мехатроника.
      2) Износ соленоидов/гидроблока на загрязненной ATF.
      3) Перегрев и износ блокировки ГТД.
      4) Деформация поддона при неправильной затяжке.
      5) Ошибки по уровню после некорректной процедуры.
