      - {"question":"Нужно ли менять фильтр отдельно?","answer":"В AL450 фильтр интегрирован в поддон. Меняют поддон-фильтр в сборе.","url":"https://otoba.ru/transmissii/vag/al450.html"}
      - {"question":"Почему после замены появляются пинки?","answer":"Частые причины: неверный уровень по температуре, загрязнение гидроблока от износа ГДТ, старая адаптация/ошибки в мехатронике.","url":"https://otoba.ru/transmissii/vag/al450.html"}
