    drain_volume: 5,5 – 6,0 л (слив + фильтр, «сноркель» вывернут)
    dry_capacity: 7,3 – 7,6 л
    service_interval: 60 000 км или 4 года (40 000 км — тяжёлые условия)
    tools:
      - подъёмник / ровная яма
      - шестигранник 10 мм (сливная пробка М14)
      - шестигранник 8 мм (внутр. трубка-«сноркель»)
      - торц. ключ 32 мм (крышка фильтра)
      - адаптер M24 × 1,5 → шланг Ø10 мм
      - компрессор ≤0,5 бар или ручная помпа ≥2 л
      - динамометрический ключ 3 – 60 Н·м
      - сканер VCDS / OBD11 (ATF-T, адаптации)
      - тара ≥ 8 л для отработки
    parts_list:
      - DSG-жидкость G055529A2 6 л
      - фильтр 0BH325183B (+ O-Ring)
      - сливная пробка + кольцо WHT005623F / N0138323
    drain_torque: 45 Н·м  (сливная пробка М14)
    fill_torque: |
      20 Н·м — крышка фильтра  
      3 Н·м  — внутр. «сноркель»  
    procedure: |
      1. Прогрейте коробку поездкой до 35–45 °C (VCDS → MVB 19). Поставьте авто горизонтально, селектор «P», ручник; снимите защиту мотора.
      2. Слив:  
        • Подставить ёмкость ≥ 8 л, выкрутить сливную пробку HEX 10 мм — сольётся ≈0,6 л.  
        • Тем же ключом 8 мм вывернуть трубку-«сноркель» — выйдут ещё ≈ 5 л.  
        • Дождаться «капель», очистить магнит, подготовить новую шайбу.
      3. Фильтр: сверху под АКБ открутить крышку 32 мм, вынуть старый узел; установить новый 0BH325183B, предварительно смазав O-Ring, затянуть 20 Н·м.
      4. Сборка снизу: вкрутить «сноркель» 3 Н·м; вместо пробки — заливной адаптер M24 × 1,5.
      5. Заливка: через адаптер подать ровно слитый объём (обычно 5,6 ± 0,2 л) DSG-жидкости. Давление ≤ 0,5 бар.
      6. Прокачка: ДВС запущен, тормоз нажат; селектор P → R → N → D → S → D → N → R → P, задерживаясь по 3 с.
      7. Проверка уровня: при 35–45 °C открыть адаптер. Излишек должен течь струйкой и перейти в капли. Как пошли капли — уровень OK.  
        • Закрутить «сноркель» 3 Н·м, новую пробку с кольцом 45 Н·м.
      8. Адаптация сцеплений: VCDS → Basic Settings → группа 61 (Clutch / Gear Learn).
      9. Тест-драйв 15 км без кик-дауна; ATF < 100 °C, переключения плавные, ошибок в блоке 0BH/0BT нет.
    mistakes:
      - Перелив > 0,2 л → вспенивание, DTC P17BF / P17D8.  
      - Использование ATF или «универсальных DCT» без допуска G055529A2.  
      - Перетяжка пластиковой крышки фильтра > 25 Н·м — срыв резьбы в корпусе.
    nuances:
      - Узел фильтра поставляется в сборе (корпус + картридж); пытаться заменить только вставку нельзя.  
      - Масло G055529A2 совместимо с прежним G052182A2, но смешивать жидкости разных производителей нежелательно.  
      - После замены всегда стирайте адаптации сцеплений — коробка быстрее «подстроится» к новым параметрам вязкости.
    description: |
      **DSG-7 DQ500 (0BH / 0BT)** — 7-ступенчатая преселективная коробка с двумя мокрыми сцеплениями, до 500–600 Н·м. Применения: VW Tiguan, Passat B8, Arteon, Transporter T5/T6, Teramont; Audi Q3, RS Q3, RS3, TT RS; Skoda Kodiaq; Seat Alhambra и др.
      Поддон не снимается при замене масла: слив через сливную пробку и вывернутый «сноркель». **Фильтр при ТО меняется** — он расположен сверху под АКБ (крышка 32 мм), не в поддоне. Для мастера важно: уровень строго при 35–45 °C, обязательная адаптация сцеплений после замены, только жидкость с допуском G 055 529 A2 (или G 052 182 A2 для ранних ревизий).
    weak_points: |
      **1. Загрязнение соленоидов мехатроника.** Продукты износа сцеплений быстро засоряют соленоиды — толчки при переключениях. Регулярная замена масла и фильтра снижает риск (otoba, only-vag, akpp.guru).
      **2. Плата управления мехатроника.** Перегрев коробки (забитый теплообменник, агрессивная езда) ведёт к отказу платы; она не ремонтируется, только замена узла (otoba).
      **3. Датчики давления.** На пробегах 100–150 тыс. км нередко выходит из строя один из датчиков — пропадают чётные или нечётные передачи (otoba, only-vag).
      **4. Дифференциал и шлицы.** При жёсткой эксплуатации и чип-тюнинге возможны срез шлицев дифференциала, на Transporter T5 — частая проблема (otoba).
      **5. Сцепление.** Износ дисков при агрессивной езде — вибрации при старте, пробуксовка; нечётные 1/3/5/7 страдают первыми (only-vag, akpp.guru).
    faq:
      - question: "Меняется ли фильтр при обычном ТО на DQ500?"
        answer: "Да. Фильтр расположен сверху под АКБ (крышка 32 мм), не в поддоне. При замене масла меняют узел 0BH 325 183 B в сборе с O-Ring. Поддон не снимается."
        url: "https://otoba.ru/transmissii/vag/dq500.html"
      - question: "G 055 529 A2 или G 052 182 A2 — какое масло лить?"
        answer: "Рекомендуется G 055 529 A2 для 0BH/0BT. G 052 182 A2 допущен для ранних ревизий и совместим, но смешивать масла разных производителей нежелательно. Аналоги — только с допуском «Meets VW G 055 529 A2»."
        url: "https://realvagservice.ru/blog/146-zamena-masla-v-dsg7-0bt-0bh-dq500.html"
      - question: "При какой температуре выставлять уровень?"
        answer: "При 35–45 °C на работающем двигателе (VCDS → MVB 19). Из заливного отверстия должна пойти струйка, затем переход в капли — тогда уровень верный. При другой температуре результат неверный."
        url: "https://otoba.ru/transmissii/vag/dq500.html"
      - question: "Почему после замены масла коробка дёргает?"
        answer: "Обязательно выполнить адаптацию сцеплений (VCDS → Basic Settings → группа 61). Без неё коробка не подстраивается под новую вязкость. Если адаптация уже делалась — проверьте уровень и отсутствие перелива."
        url: "https://only-vag.ru/poleznye-stati/korobka-peredach-dq500-nadezhnost-problemy-i-remont"
      - question: "Пропали чётные или нечётные передачи — что проверять?"
        answer: "Частая причина — отказ датчика давления в мехатронике (пробег 100–150 тыс. км). Требуется диагностика и при необходимости замена мехатроника или датчиков (otoba, only-vag)."
        url: "https://akpp.guru/modeli/dq500"
    price_block: |
      Москва, I кв. 2025 г.  
      • Работа «масло + фильтр DSG-7 DQ500» — 6 500–8 500 ₽  
      • DSG-жидкость G055529A2 (1 л) — 1 400–1 700 ₽  
      • Фильтр-крышка 0BH325183B — 3 500–4 000 ₽  
      • Пробка + кольцо — 400 ₽
    docs: |
