    procedure: |
      1. Убедитесь по VIN, что на автомобиле установлена именно АКПП 01N/097/AG4, и подготовьте ATF G 052 162 A2, 75W90 GL4 для дифференциала, фильтр 01M 325 429, прокладку поддона 01N 321 370 и при необходимости пробку N 904 142 03.
      2. Лёгкой поездкой прогрейте коробку до рабочей температуры, затем установите автомобиль на строго горизонтальную площадку, переведите селектор в «P» и дайте узлу немного остыть до безопасной температуры.
      3. Снимите нижнюю защиту, очистите область поддона от грязи, подготовьте ёмкость не менее 10–12 л для слива.
      4. Аккуратно выверните сливную/контрольную пробку (N 904 142 03) и слейте первую порцию ATF; при наличии внутренней переливной трубки после первичного слива аккуратно её выкрутите и дождитесь основного слива.
      5. После прекращения активного слива снимите болты поддона, аккуратно опустите поддон и перенесите его на верстак, стараясь не пролить остатки масла.
      6. Снимите старый фильтр 01M 325 429, оцените количество стружки и шлама на магнитах и в поддоне – это важная диагностика состояния 01N.
      7. Промойте поддон и магниты очистителем тормозов до чистого металла, проверьте отсутствие трещин и деформаций поддона.
      8. Установите новый фильтр 01M 325 429, убедившись, что уплотнительное кольцо корректно село в посадочное место и старое кольцо не осталось в корпусе.
      9. Установите новую прокладку поддона 01N 321 370 на очищенный поддон, совместите все отверстия и смонтируйте поддон на коробку; болты затяните крест‑накрест с использованием динамометрического ключа по моментам из ремонтного мануала.
      10. Вкрутите обратно переливную трубку (если она демонтировалась) и подготовьте сливную/контрольную пробку с интегрированным уплотнением N 904 142 03; пробку пока только подтяните от руки.
      11. Через контрольное/заливное отверстие поддона с помощью насоса/шприца залейте первую порцию ATF G 052 162 A2 – чуть больше фактически слитого объёма (обычно 3,5–4,0 л).
      12. Заверните пробку и запустите двигатель, удерживая педаль тормоза. Плавно переведите селектор по всем положениям P–R–N–D с паузой 2–3 секунды в каждом, затем оставьте в положении «N» или «P» в соответствии с мануалом.
      13. С помощью диагностического сканера или внешнего термометра контролируйте температуру ATF; при достижении 35–45 °C снова поднимите автомобиль и аккуратно открутите контрольную пробку.
      14. При правильном уровне при 35–45 °C из отверстия должна идти стабильная струйка ATF, переходящая в частые капли; если масло не вытекает – дозаливайте ATF небольшими порциями и повторяйте проверку.
      15. После того как излишек масла стечёт до частых капель, окончательно затяните пробку по моменту из ремонтного мануала, установите защиту и выполните тест‑драйв с контролем переключений и отсутствия подтёков.
      16. Отдельно обслужите дифференциал/редуктор: слейте старое масло 75W90 GL4 через соответствующую пробку, залейте свежее до контрольного уровня и затяните пробки по регламенту.
    mistakes:
      - Обслуживать только ATF и игнорировать отдельный объём 75W90 GL4 в дифференциале.
      - Лить универсальный Dexron без допусков к G 052 162 A2/LT71141, особенно на живую коробку с нормальным гидроблоком.
      - Ограничиваться сливом через пробку без снятия поддона, чистки магнитов и замены фильтра 01M 325 429.
      - Выставлять уровень ATF без контроля температуры и работы переливной трубки (по объёму «сколько слили – столько залили»).
      - Игнорировать симптомы перегрева и загрязнения (пинки, задержки, тёмное масло) до момента фактического отказа.
      - Продолжать эксплуатацию при явных проблемах с блокировкой ГТД и EPC‑соленоидом, ограничиваясь лишь доливом масла.
    nuances: |
      01N – продольный AG4 для Audi/Passat, по конструкции близкий к 01M, но с продольной компоновкой и более высоким допуском по моменту. Как и 01M, коробка имеет отдельное масло в дифференциале, что легко упустить при ТО, если смотреть только на ATF.
      Типичный ресурс 01N при регулярной замене масла и нормальных температурах – около 200 тыс. км и выше, но перегревы и грязное масло быстро добивают клапан блокировки ГТД, EPC‑соленоид и барабаны. По трансмиссионным центрам эта коробка считается одной из самых ремонтопригодных и хорошо изученных.
      Из‑за возраста и нескольких волн модернизации (91–95, 96–98, 99–04) по железу есть отличия, поэтому по запчастям (особенно барабаны и гидроблок) важно смотреть VIN и год выпуска, а не заказывать вслепую только по коду 01N.
      При сильном загрязнении масла и наличии стружки одной заменой ATF проблему не решить: масло нужно менять ступенчато, а гидроблок и фрикционы – диагностировать и, при необходимости, ремонтировать.
    description: |
      VAG 01N (097/AG4) – это четырёхступенчатый продольно‑ориентированный автомат, которым Audi/VW в 90‑х заменили ранние трёхступенчатые коробки 090. Он ставился на Audi 80/100/A4/A6 и Volkswagen Passat с продольно расположенными моторами до 2,6–2,8 л, сочетая относительно простую механику с электронной гидравликой.
      По данным Otoba, TransAKPP и профильных гайдов полный объём ATF в 01N около 5,7 л, плюс около 1 л 75W90 GL4 в дифференциале. Масло и фильтр рекомендуется менять примерно каждые 70 тыс. км, а при тяжёлой эксплуатации – чаще. Конструктивно 01N близок к 01M/01P: поддон с прокладкой, внутренний фильтр, переливная система уровня вместо щупа и чувствительный к чистоте масла гидроблок.
      На практике 01N считается надёжной и ремонтопригодной коробкой: основные проблемы приходятся на возраст, перегревы, загрязнённое масло и типичные для AG4 вещи – соленоиды, гидротрансформатор, барабан 3–4 и пластиковые элементы. При корректном подборе масла, регулярном ТО и аккуратной эксплуатации коробка уверенно отхаживает свои 200+ тыс. км.
    weak_points: |
      1. Блокировка гидротрансформатора и клапан/соленоид.
      При старом или перегретом масле страдают клапан блокировки ГТД и связанный соленоид: появляются вибрации, толчки на малых скоростях, ошибки по блокировке и перегреву.
      
      2. EPC‑соленоид и гидроблок.
      Как и у других AG4, основной узел проблем – гидроблок: загрязнённый ATF и износ приводят к сбоям в работе EPC‑соленоида, что выражается в жёстких переключениях, задержках и аварийном режиме.
      
      3. Пластиковые элементы и обгонные муфты.
      Пластиковые втулки и элементы сепараторов с возрастом и от перегрева разрушаются, что вызывает механические шумы, проскальзывания и требует вскрытия коробки.
      
      4. Барабаны и фрикционы.
      Из‑за недостаточного давления или перегрева возможен продавливание и износ барабана 3–4, выгорание фрикционов Forward/Reverse, что приводит к пропаданию отдельных передач.
      
      5. Чувствительность к уровню и температуре.
      Неправильно выставленный уровень ATF, езда с подтёками или перегрев легкостью выводят коробку из строя – сначала появляются пинки и задержки, затем выгорают фрикционы и страдают втулки.
