checkpoint_path: "ai_outputs/checkpoints/ford_checkpoint.jsonl"
aggregated_jsonl_path: "ai_outputs/ford_aggregated.jsonl"

log_level: "INFO"
language: "ru"
manufacturer_filter: "Ford"

